<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121212">

<title>จำนวนจริง — รวมสื่อการสอน by P'Earth</title>
<!-- หน้านี้สร้างจาก tools/build_index.py — แก้ธีม/เลย์เอาต์ที่สคริปต์ แล้วรันใหม่ (แก้ TOPICS ในไฟล์นี้ได้ตามปกติ) -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap');

:root {
  --bg: #121212;
  --surface: #181818;
  --raise: #1f1f1f;
  --hover: #282828;
  --text: #ffffff;
  --muted: #b3b3b3;
  --dim: #7c7c7c;
  --accent: #68EF3F;
  --toast: #539df5;
  --shadow: 0 8px 24px rgba(0,0,0,.5);
  --tb-h: 68px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); color-scheme: dark; }
body {
  font-family: 'Anuphan', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 6px; }

.shell { display: flex; align-items: flex-start; gap: 8px; padding: 8px; min-height: 100vh; }

/* ── แถบคลังสื่อด้านซ้าย ── */
.lib {
  flex: 0 0 300px;
  position: sticky; top: 8px;
  height: calc(100vh - 16px);
  overflow-y: auto;
  background: var(--surface);
  border-radius: 8px;
  padding: 12px 8px;
  display: flex; flex-direction: column; gap: 2px;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 6px 12px 14px; font-weight: 700; font-size: 1.3rem; line-height: 1.15; }
.brand-mark { width: 38px; height: 38px; flex: 0 0 38px; }
.brand small { display: block; font-size: .78rem; font-weight: 500; color: var(--muted); }
.lib-home, .lib-head { display: flex; align-items: center; gap: 16px; padding: 10px 12px; font-weight: 700; font-size: 1rem; color: var(--muted); }
.lib-home:hover, .lib-home.active { color: #fff; }
.lib-home svg, .lib-head svg { width: 24px; height: 24px; flex: 0 0 24px; }
.lib-head { margin-top: 4px; }
.lib-list { display: flex; flex-direction: column; gap: 2px; }
.lib-item { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; padding: 8px; border-radius: 6px; transition: background .15s; }
.lib-item:hover { background: var(--raise); }
.lib-item.active { background: #232323; }
.lib-cover svg { display: block; width: 48px; height: 48px; border-radius: 4px; }
.lib-text { min-width: 0; }
.lib-title { display: block; font-weight: 600; font-size: 1rem; }
.lib-item.active .lib-title { color: var(--accent); }
.lib-sub { display: block; font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── พื้นที่หลัก ── */
.main { flex: 1; min-width: 0; min-height: calc(100vh - 16px); background: var(--surface); border-radius: 8px; overflow: clip; }

.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 24px; transition: background .25s; }
.topbar.solid { background: color-mix(in srgb, var(--page) 45%, #0b0b0b); }
.crumb { min-width: 0; }
.back { display: inline-flex; align-items: center; gap: 10px; max-width: 100%; font-weight: 700; font-size: .95rem; }
.back svg { width: 34px; height: 34px; flex: 0 0 34px; padding: 7px; border-radius: 50%; background: rgba(0,0,0,.6); }
.back:hover svg { background: rgba(0,0,0,.9); }
.back span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search {
  flex: 0 1 360px; margin-left: auto;
  display: flex; align-items: center; gap: 10px;
  height: 46px; padding: 0 18px;
  background: #242424; border-radius: 500px;
  box-shadow: inset 0 0 0 1px transparent;
  transition: background .15s, box-shadow .15s;
  cursor: text;
}
.search:hover { background: #2a2a2a; box-shadow: inset 0 0 0 1px #4d4d4d; }
.search:focus-within { box-shadow: inset 0 0 0 2px #fff; }
.search svg { width: 20px; height: 20px; flex: 0 0 20px; color: var(--muted); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: #fff; font: inherit; font-size: 1rem; }
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { filter: invert(1); }
.lang-toggle { flex: 0 0 auto; background: transparent; color: #fff; border: 1px solid var(--dim); border-radius: 9999px; padding: 6px 16px; font: inherit; font-weight: 700; font-size: .88rem; cursor: pointer; transition: transform .1s, border-color .1s; }
.lang-toggle:hover { border-color: #fff; transform: scale(1.04); }

/* ── หัวหน้า (ปก + ชื่อ) ── */
.hero {
  display: flex; align-items: flex-end; gap: 28px;
  margin-top: calc(-1 * var(--tb-h));
  padding: calc(var(--tb-h) + 28px) 24px 28px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--page) 82%, #000) 0%, color-mix(in srgb, var(--page) 45%, #181818) 100%);
}
.hero-cover { flex: 0 0 auto; width: clamp(160px, 19vw, 232px); aspect-ratio: 1; border-radius: 6px; overflow: hidden; box-shadow: var(--shadow); }
.hero-cover svg { display: block; width: 100%; height: 100%; }
.hero-text { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.kind { font-size: .95rem; font-weight: 600; }
.hero h1 { font-size: clamp(2.6rem, 6.5vw, 5.4rem); font-weight: 700; line-height: 1.22; letter-spacing: -.02em; }
.hero h1.long { font-size: clamp(1.9rem, 4vw, 3.3rem); }
.hero .sub { max-width: 64ch; font-size: 1.02rem; color: rgba(255,255,255,.82); }
.meta-line { font-size: .95rem; color: rgba(255,255,255,.82); }
.meta-line b { color: #fff; }
.hero-home { padding-top: calc(var(--tb-h) + 56px); }
.hero-home .kind { font-size: 1.1rem; font-weight: 700; }

.content { padding: 28px 24px 56px; background: linear-gradient(180deg, color-mix(in srgb, var(--page) 20%, #181818) 0, #181818 280px); }
.section-title { font-size: 1.55rem; font-weight: 700; margin-bottom: 14px; }

/* ── การ์ดแบบอัลบั้ม ── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.card-wrap { position: relative; display: flex; }
.card { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 8px; transition: background .2s; }
.card:hover { background: var(--hover); }
.cover { position: relative; margin-bottom: 6px; border-radius: 6px; box-shadow: var(--shadow); }
.cover svg { display: block; width: 100%; height: auto; border-radius: 6px; }
.play {
  position: absolute; right: 8px; bottom: 8px;
  width: 50px; height: 50px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent); box-shadow: 0 8px 8px rgba(0,0,0,.3);
  opacity: 0; transform: translateY(8px);
  transition: opacity .2s, transform .2s;
}
.play svg { width: 20px; height: 20px; margin-left: 3px; fill: #000; }
.card:hover .play, .card:focus-visible .play { opacity: 1; transform: none; }
.card .title { font-weight: 700; font-size: 1.04rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .desc { font-size: .92rem; line-height: 1.55; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { margin-top: auto; padding-top: 2px; font-size: .8rem; font-weight: 600; color: var(--muted); }

.copy-link {
  position: absolute; top: 20px; right: 20px;
  width: 36px; height: 36px; border: 0; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(0,0,0,.72); color: #fff;
  cursor: pointer; opacity: 0;
  transition: opacity .2s, transform .12s, background .12s;
}
.copy-link svg { width: 18px; height: 18px; }
.card-wrap:hover .copy-link, .copy-link:focus-visible { opacity: 1; }
.copy-link:hover { background: #000; transform: scale(1.08); }
.copy-link.done { opacity: 1; background: var(--accent); color: #000; }
.copy-link.missing { opacity: 1; background: #f3727f; color: #000; }
@media (hover: none) { .copy-link { opacity: 1; } }

.card.soon { opacity: .5; cursor: default; }
.card.soon:hover { background: transparent; }
.badge-soon { align-self: flex-start; font-size: .75rem; font-weight: 700; color: var(--muted); background: #2a2a2a; border-radius: 9999px; padding: 3px 12px; }
.empty-note { color: var(--muted); padding: 24px 0; font-size: 1rem; }

/* ── การ์ดแนวนอน (หน้าแรก แบบทางลัดในหน้า Home) ── */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.tiles .card { position: relative; flex-direction: row; align-items: stretch; gap: 0; padding: 0; min-height: 104px; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,.08); }
.tiles .card:hover { background: rgba(255,255,255,.17); }
.tiles .cover { position: static; flex: 0 0 104px; margin: 0; border-radius: 0; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.tiles .cover svg { height: 100%; border-radius: 0; }
.tiles .t-body { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 12px 64px 12px 16px; }
.tiles .title { font-size: 1.25rem; }
.tiles .desc { -webkit-line-clamp: 2; font-size: .88rem; }
.tiles .play { right: 12px; bottom: 12px; width: 44px; height: 44px; }
.tiles .play svg { width: 18px; height: 18px; }
.tiles .card-wrap .copy-link { top: 8px; right: 12px; width: 32px; height: 32px; }

.toast {
  position: fixed; left: 50%; bottom: 32px; z-index: 20;
  transform: translate(-50%, 16px);
  background: var(--toast); color: #000;
  font-weight: 600; font-size: .95rem;
  padding: 10px 18px; border-radius: 8px;
  box-shadow: var(--shadow);
  opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ── จอแคบ: แถบคลังกลายเป็นชิปเลื่อนแนวนอนด้านบน ── */
@media (max-width: 820px) {
  .shell { flex-direction: column; align-items: stretch; gap: 0; padding: 0; }
  .lib {
    position: static; flex: none; height: auto; width: 100%;
    flex-direction: row; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 0; background: var(--bg);
    overflow-x: auto; scrollbar-width: none;
  }
  .lib::-webkit-scrollbar { display: none; }
  .brand { padding: 0 6px 0 0; font-size: 1.05rem; }
  .brand-mark { width: 30px; height: 30px; flex-basis: 30px; }
  .brand small, .lib-head, .lib-cover, .lib-sub, .lib-home svg { display: none; }
  .lib-list { flex-direction: row; gap: 8px; }
  .lib-home, .lib-item { display: block; flex: 0 0 auto; padding: 6px 14px; border-radius: 9999px; background: #2a2a2a; color: #fff; font-size: .9rem; font-weight: 600; white-space: nowrap; }
  .lib-title { font-size: .9rem; }
  .lib-home.active, .lib-item.active { background: var(--accent); color: #000; }
  .lib-item.active .lib-title { color: #000; }
  .main { border-radius: 0; min-height: auto; }
  .topbar { flex-wrap: wrap; padding: 10px 16px; }
  .search { order: 3; flex: 1 0 100%; margin-left: 0; height: 42px; }
  .lang-toggle { margin-left: auto; }
  .hero { flex-direction: column; align-items: flex-start; gap: 18px; padding: calc(var(--tb-h) + 16px) 16px 22px; }
  .hero-cover { width: min(58vw, 220px); align-self: center; }
  .hero h1 { font-size: clamp(2.1rem, 10vw, 3rem); }
  .hero h1.long { font-size: clamp(1.6rem, 7vw, 2.2rem); }
  .content { padding: 18px 16px 40px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .card { padding: 8px; }
  .copy-link { top: 14px; right: 14px; }
  .tiles { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
// ── ปุ่มสลับภาษาไทย/อังกฤษ (โค้ดชุดนี้ฝังซ้ำในทุกหน้าของเว็บ) ──
const PAGE_TITLE = { th: "จำนวนจริง — รวมสื่อการสอน by P'Earth", en: "Real Numbers — Teaching Materials by P'Earth" };

let langMemory = 'th';
function getLang() {
  try { return localStorage.getItem('siteLang') || 'th'; }
  catch (e) { return langMemory; }
}
function applyLang(lang) {
  document.documentElement.lang = lang;
  document.title = PAGE_TITLE[lang];
  document.querySelectorAll('[data-th]').forEach(el => {
    // ค่าใน data-th / data-en ถือเป็น HTML (ดู docs/adr/0002)
    el.innerHTML = (lang === 'en' && el.dataset.en) ? el.dataset.en : el.dataset.th;
  });
  const btn = document.getElementById('langToggle');
  if (btn) btn.textContent = lang === 'en' ? 'ไทย' : 'EN';
  if (typeof onLangChange === 'function') onLangChange(lang);
}
function toggleLang() {
  const next = getLang() === 'en' ? 'th' : 'en';
  langMemory = next;
  try { localStorage.setItem('siteLang', next); } catch (e) {}
  applyLang(next);
}

const HERE = "m4/real-numbers/";  // path ของหน้านี้เทียบกับ root เว็บ (ใช้หาปกการ์ด)
const UNIT = { th: "รายการ", en: "items" };

// ปกการ์ด: วาดใน tools/covers.py แล้วรัน tools/build_index.py — ถ้ายังไม่วาด หน้าเว็บสร้างปกสีจากชื่อให้เอง
const TOPICS = [
  { file: "inequality-sign-chart.html", title_th: "ทำไมต้อง + − + (อสมการพหุนาม)", title_en: "Why It's + − + (Polynomial Inequalities)", desc_th: "ลองแทนค่าเพื่อดูว่าทำไมต้องสลับเครื่องหมาย พร้อมเครื่องมือสร้างแผนภาพเครื่องหมายเอง", desc_en: "Try substituting to see why signs flip, plus a builder tool that draws your own sign chart", icon: "🔀", tags_th: ["จำนวนจริง", "อสมการ"], tags_en: ["Real Numbers", "Inequalities"] },

function plain(s) { return String(s || "").replace(/<[^>]*>/g, ""); }
function autoCover(title) {
  let h = 0;
  for (const ch of title) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">'
    + '<rect width="120" height="120" fill="hsl(' + h + ' 55% 36%)"/>'
    + '<circle cx="104" cy="108" r="46" fill="#000" fill-opacity=".14"/>'
    + '<text x="16" y="100" font-size="56" font-weight="700" fill="#fff" font-family="Anuphan, system-ui, sans-serif">'
    + plain(title).slice(0, 2).replace(/[&<>]/g, "") + '</text></svg>';
}
function coverFor(t) {
  return COVERS[(HERE + t.file).replace(/index\.html$/, "")] || autoCover(t.title_th);
}

function renderTopics() {
  const en = getLang() === 'en';
  const grid = document.getElementById("topicGrid");
  const tiles = grid.classList.contains("tiles");
  const q = QUERY.trim().toLowerCase();
  const list = TOPICS.filter(t => !q || [t.title_th, t.title_en, t.desc_th, t.desc_en, ...(t.tags_th || []), ...(t.tags_en || [])]
    .some(s => plain(s).toLowerCase().includes(q)));
  const note = document.getElementById("emptyNote");
  note.style.display = list.length ? "none" : "block";
  note.textContent = TOPICS.length === 0 ? (en ? "No materials yet" : "ยังไม่มีสื่อ")
    : (en ? `Nothing matches “${QUERY.trim()}”` : `ไม่พบ “${QUERY.trim()}” ในหน้านี้`);
  grid.innerHTML = list.map(t => {
    const title = en ? t.title_en : t.title_th;
    const desc = en ? t.desc_en : t.desc_th;
    const meta = ((en ? t.tags_en : t.tags_th) || []).join(" • ");
    const label = en ? 'Copy link' : 'คัดลอกลิงก์';
    if (t.comingSoon) {
      return `
      <div class="card-wrap"><div class="card soon">
        <div class="cover">${coverFor(t)}</div>
        <div class="title">${title}</div>
        <div class="desc">${desc}</div>
        <span class="badge-soon">${en ? 'Coming soon' : 'เร็วๆ นี้'}</span>
      </div></div>`;
    }
    const body = tiles
      ? `<div class="cover">${coverFor(t)}</div><div class="t-body"><div class="title">${title}</div><div class="desc">${desc}</div></div><span class="play" aria-hidden="true">${PLAY_SVG}</span>`
      : `<div class="cover">${coverFor(t)}<span class="play" aria-hidden="true">${PLAY_SVG}</span></div><div class="title">${title}</div><div class="desc">${desc}</div><div class="meta">${meta}</div>`;
    return `
      <div class="card-wrap">
      <a class="card" href="./${t.file}" title="${plain(desc).replace(/"/g, '&quot;')}">${body}</a>
      </div>`;
  }).join("");
}

function greeting(en) {
  const h = new Date().getHours();
  if (h < 12) return en ? 'Good morning' : 'สวัสดีตอนเช้า';
  if (h < 17) return en ? 'Good afternoon' : 'สวัสดีตอนบ่าย';
  return en ? 'Good evening' : 'สวัสดีตอนเย็น';
}
function onLangChange(lang) {
  const en = lang === 'en';
  renderTopics();
  const q = document.getElementById('q');
  q.placeholder = en ? 'Search this page' : 'ค้นหาในหน้านี้';
  q.setAttribute('aria-label', q.placeholder);
  const g = document.getElementById('greet');
  if (g) g.textContent = greeting(en);
  const c = document.getElementById('count');
  if (c) c.textContent = TOPICS.filter(t => !t.comingSoon).length + ' ' + UNIT[lang];
}

document.getElementById('q').addEventListener('input', e => { QUERY = e.target.value; renderTopics(); });

// แถบบนทึบขึ้นเมื่อเลื่อนลง + ความสูงแถบบนให้หัวหน้าซ้อนใต้ได้พอดี
const topbar = document.getElementById('topbar');
function syncTopbar() {
  document.documentElement.style.setProperty('--tb-h', topbar.offsetHeight + 'px');
  topbar.classList.toggle('solid', window.scrollY > 120);
}
window.addEventListener('scroll', syncTopbar, { passive: true });
window.addEventListener('resize', syncTopbar);
syncTopbar();

// จอแคบ: เลื่อนชิปของชั้นปัจจุบันให้อยู่ในจอ (แถบคลังเลื่อนแนวนอน)
const lib = document.querySelector('.lib'), activeChip = document.querySelector('.lib-item.active');
if (lib && activeChip && lib.scrollWidth > lib.clientWidth) {
  lib.scrollLeft = activeChip.offsetLeft - (lib.clientWidth - activeChip.offsetWidth) / 2;
}

renderTopics();
applyLang(getLang());
