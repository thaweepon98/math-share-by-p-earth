<!DOCTYPE html>
<html lang="th">
<head>
<script id="theme-boot">(function(){var t='light';try{t=localStorage.getItem('siteTheme')||'light'}catch(e){}document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สื่อการสอน : เวกเตอร์แบบรูปภาพ ม.5</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap');

  :root {
    --primary: #1C3B22; --secondary: #FF8A3D; --accent: #68EF3F; --accent-2: #3FA82E; --warning: #FFB347;
    --bg: #F3F7EC; --card: #FFFFFF; --text: #2D3748; --muted: #718096; --border: #E2E8F0;
    --shadow: 0 4px 24px rgba(28,59,34,0.10); --radius: 16px;
    --pos: #047857; --pos-bg: #ECFDF5; --neg: #BE185D; --neg-bg: #FFF4EC;
    --cu: #2563EB; --cv: #DC2626; --cw: #7C3AED; --cr: #111827; --ci: #059669; --cj: #EA580C; --ck: #0891B2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Anuphan', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: linear-gradient(135deg, #1C3B22 0%, #2E5936 100%); color: white; padding: 28px 40px 20px; text-align: center; position: relative; overflow: hidden; }
  header::before { content: ''; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; background: rgba(255,255,255,0.07); border-radius: 50%; }
  header h1 { font-size: 2rem; font-weight: 800; letter-spacing: .5px; }
  header p { font-size: 1rem; opacity: .85; margin-top: 4px; }
  .back-link { position: absolute; top: 14px; left: 20px; color: white; text-decoration: none; font-size: .85rem; font-weight: 600; opacity: .9; z-index: 2; }
  .back-link:hover { opacity: 1; text-decoration: underline; }
  .lang-toggle { position: absolute; top: 14px; right: 20px; background: rgba(255,255,255,.15); color: white; border: 1.5px solid rgba(255,255,255,.5); border-radius: 20px; padding: 5px 14px; font-family: 'Anuphan', sans-serif; font-size: .8rem; font-weight: 700; cursor: pointer; z-index: 2; }
  .lang-toggle:hover { background: rgba(255,255,255,.28); }

  nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 20px 24px 0; background: white; border-bottom: 3px solid var(--border); }
  .tab-btn { padding: 10px 18px; border: none; background: transparent; border-radius: 10px 10px 0 0; font-family: 'Anuphan', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .25s; border-bottom: 3px solid transparent; margin-bottom: -3px; }
  .tab-btn:hover { color: var(--primary); background: #E3F3D8; }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: #E3F3D8; }

  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 60px; }
  .tab-panel { display: none; animation: fadeIn .35s ease; }
  .tab-panel.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 32px; margin-bottom: 24px; }
  .card-title { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .card-title .icon { font-size: 1.5rem; }
  .intro { font-size: 1.02rem; line-height: 1.8; margin-bottom: 14px; }
  .box-info { background: #EEF7E6; border-left: 4px solid var(--primary); border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .box-warn { background: #FFF7ED; border-left: 4px solid var(--warning); border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .box-ok   { background: #ECFDF5; border-left: 4px solid var(--accent);  border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .formula { background: linear-gradient(135deg,#1C3B22,#2E5936); color: white; border-radius: 12px; padding: 14px 24px; text-align: center; font-size: 1.3rem; font-weight: 700; margin: 14px 0; letter-spacing: .5px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px 6px; line-height: 1.9; }
  .link-tag { display: inline-block; background: #E3F3D8; color: var(--primary); border-radius: 999px; padding: 2px 12px; font-size: .78rem; font-weight: 700; margin: 2px 4px 2px 0; }
  .note { color: var(--muted); font-size: .9rem; }

  .btn { padding: 10px 24px; background: var(--primary); color: white; border: none; border-radius: 30px; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s, opacity .2s; }
  .btn:hover:not(:disabled) { background: #2E5936; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: white; color: var(--primary); border: 2px solid var(--primary); }
  .btn.ghost:hover:not(:disabled) { background: #E3F3D8; }
  .btn.small { padding: 6px 16px; font-size: .9rem; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chip { padding: 8px 16px; border: 2px solid var(--border); border-radius: 30px; background: #fff; font-family: 'Anuphan', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; color: var(--text); display: inline-flex; align-items: center; gap: 4px; }
  .chip:hover { border-color: var(--primary); }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .chip.wrong { border-color: var(--neg); background: var(--neg-bg); color: var(--neg); }

  .frac { display: inline-flex; flex-direction: column; align-items: center; font-weight: 700; line-height: 1; vertical-align: middle; margin: 0 4px; }
  .frac .num { font-size: 1em; border-bottom: 2.5px solid currentColor; padding-bottom: 2px; min-width: 18px; text-align: center; white-space: nowrap; }
  .frac .den { font-size: 1em; padding-top: 3px; min-width: 18px; text-align: center; white-space: nowrap; }
  .frac .num:has(.v) { padding-top: .55em; }

  /* ตัวแปรเวกเตอร์: ลูกศรบนหัว (วาดด้วย CSS เพราะอักขระลูกศรรวมแสดงไม่ได้ในหลายฟอนต์) */
  .v { position: relative; display: inline-block; font-style: normal; white-space: nowrap; line-height: 1; padding-top: .34em; }
  .v::before { content: ''; position: absolute; left: 4%; right: 4%; top: .14em; height: 0; border-top: .08em solid currentColor; }
  .v::after { content: ''; position: absolute; right: 4%; top: .14em; width: .32em; height: .32em; border-top: .08em solid currentColor; border-right: .08em solid currentColor; transform: translate(-4%, -50%) rotate(45deg) scale(.75); transform-origin: center; }
  .v.tall { padding-top: .5em; }
  .v.tall::before, .v.tall::after { top: .1em; }
  .cu { color: var(--cu); } .cv { color: var(--cv); } .cw { color: var(--cw); } .cr { color: var(--cr); }
  .ci { color: var(--ci); } .cj { color: var(--cj); } .ck { color: var(--ck); }
  .formula .cu { color: #93C5FD; } .formula .cv { color: #FCA5A5; } .formula .cw { color: #C4B5FD; } .formula .cr { color: #fff; }
  .formula .ci { color: #86EFAC; } .formula .cj { color: #FDBA74; } .formula .ck { color: #67E8F9; }
  .colvec { display: inline-flex; flex-direction: column; align-items: center; border-left: 2px solid currentColor; border-right: 2px solid currentColor; border-radius: 6px; padding: 2px 8px; margin: 0 4px; vertical-align: middle; line-height: 1.25; font-weight: 700; }

  .align { display: grid; grid-template-columns: auto auto auto; justify-content: start; column-gap: .55em; row-gap: 3px; align-items: center; margin: 4px 0; }
  .align .l { justify-self: end; text-align: right; }
  .align .m { justify-self: center; font-weight: 700; }
  .align .r { justify-self: start; }
  .align .full { grid-column: 1 / -1; }

  .wk-cell { position: relative; background: #fff; border: 2px solid var(--border); border-radius: 14px; padding: 12px 16px 12px 52px; margin-bottom: 12px; line-height: 1.9; }
  .wk-cell.fresh { animation: rowIn .5s ease; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .wk-cell .stepno { position: absolute; left: 14px; top: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff; font-size: .85rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .hl-i { background: #D1FAE5; border-radius: 5px; padding: 0 5px; }
  .hl-j { background: #FFEDD5; border-radius: 5px; padding: 0 5px; }
  .hl-k { background: #CFFAFE; border-radius: 5px; padding: 0 5px; }
  .hl-y { background: #FEF9C3; border-radius: 5px; padding: 0 5px; }
  .strike { text-decoration: line-through; opacity: .35; }

  /* เวทีวาดรูป */
  svg.stage { display: block; width: 100%; height: auto; background: #fff; border: 2px solid var(--border); border-radius: 14px; touch-action: none; user-select: none; -webkit-user-select: none; }
  svg.stage text { font-family: 'Anuphan', sans-serif; font-weight: 700; }
  svg.stage .drag { cursor: grab; }
  svg.stage .pick { cursor: pointer; }
  .stage-wrap { max-width: 720px; margin: 8px auto; }
  .readout { background: #F8FAFC; border: 2px solid var(--border); border-radius: 12px; padding: 12px 16px; margin: 10px 0; line-height: 1.9; font-size: 1.02rem; }
  .readout.big { font-size: 1.15rem; font-weight: 700; text-align: center; }
  .readout.ok { border-color: var(--accent-2); background: var(--pos-bg); }
  .readout.no { border-color: var(--secondary); background: var(--neg-bg); }
  .two-col { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; align-items: start; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .92rem; font-weight: 700; margin: 8px 0; }
  .legend .sw { display: inline-block; width: 22px; height: 5px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }

  .stepper { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 12px 0 6px; justify-content: center; }
  .stepper .cnt { font-weight: 800; color: var(--primary); min-width: 52px; text-align: center; }
  .cap { text-align: center; font-size: 1.08rem; font-weight: 600; line-height: 1.8; min-height: 3.6em; margin: 4px 0; }
  .eqline { text-align: center; font-size: 1.35rem; font-weight: 800; line-height: 2.2; min-height: 2.4em; }

  .slider-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
  .slider-row b { min-width: 34px; }
  input[type=range] { accent-color: var(--primary); width: min(320px, 100%); }
  .slider-val { font-weight: 800; color: var(--primary); font-size: 1.1rem; min-width: 44px; }
  .numin { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; margin: 4px 10px 4px 0; }
  .numin input { width: 68px; padding: 6px 8px; border: 2px solid var(--border); border-radius: 10px; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 700; text-align: center; }
  .numin input:focus { outline: none; border-color: var(--primary); }
  .row-inputs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 8px 0; }
  .row-inputs .lbl { font-weight: 800; margin-right: 4px; }
  .err-msg { color: var(--neg); font-weight: 600; font-size: .95rem; min-height: 22px; margin-top: 4px; }

  table.tbl { border-collapse: collapse; margin: 10px auto; font-size: 1.02rem; }
  table.tbl th, table.tbl td { border: 2px solid var(--border); padding: 8px 14px; text-align: center; }
  table.tbl th { background: #E3F3D8; color: var(--primary); }
  table.tbl td.hl { background: #FEF9C3; }

  .quiz-q { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; line-height: 1.8; }
  .quiz-opts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .quiz-opt { padding: 10px 20px; border: 2px solid var(--border); border-radius: 30px; cursor: pointer; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 600; transition: all .2s; background: white; }
  .quiz-opt:hover { border-color: var(--primary); color: var(--primary); }
  .quiz-opt.correct { border-color: var(--accent); background: #ECFDF5; color: #047857; }
  .quiz-opt.wrong { border-color: var(--secondary); background: #FFF4EC; color: #BE185D; }
  .quiz-feedback { font-weight: 700; font-size: 1rem; min-height: 24px; line-height: 1.8; }
  .quiz-feedback.ok { color: #047857; }
  .quiz-feedback.err { color: #BE185D; }
  .quiz-fig { max-width: 340px; margin: 6px 0 12px; }
  .btn-next { margin-top: 10px; padding: 10px 28px; background: var(--primary); color: white; border: none; border-radius: 30px; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s; }
  .btn-next:hover { background: #142B1A; }
  .score-badge { display: inline-block; background: linear-gradient(135deg,#68EF3F,#1C3B22); color: white; border-radius: 30px; padding: 6px 20px; font-weight: 700; font-size: 1rem; }

  @media (max-width: 700px) {
    header { padding: 44px 16px 16px; }
    header h1 { font-size: 1.4rem; }
    .card { padding: 20px 14px; }
    .tab-btn { font-size: .85rem; padding: 8px 10px; }
    .wk-cell { padding-left: 46px; }
    .two-col { grid-template-columns: 1fr; }
    .formula { font-size: 1.1rem; padding: 12px 10px; }
    .eqline { font-size: 1.15rem; }
    main { padding: 20px 10px 50px; }
  }

  .numcircle { display: inline-flex; align-items: center; justify-content: center; min-width: 46px; height: 46px; padding: 0 8px; border-radius: 23px; border: 3px solid var(--primary); font-weight: 800; font-size: 1.3rem; background: #fff; color: var(--primary); }
  .def-list { line-height: 2; font-size: 1.08rem; }
  .def-list b { display: inline-block; min-width: 4.6em; }
/* ── theme:start — สร้างโดย tools/build_lessons.py ห้ามแก้มือ (แก้ที่สคริปต์แล้วรันใหม่) ── */
:root{ --page:#0B57B3; }
:root[data-theme="light"]{
  --bg:#F4F4F1; --card:#FFFFFF; --text:#16181A; --muted:#5E6166; --border:#DEDED8;
  --primary:color-mix(in srgb, var(--page) 86%, #000); --primary-2:color-mix(in srgb, var(--page) 62%, #000);
  --secondary:#C2540A; --secondary-light:#F2A15F; --accent:#68EF3F; --accent-2:#2E9E3F;
  --shadow:0 2px 10px rgba(0,0,0,.07);
  --strong:color-mix(in srgb, var(--page) 76%, #000); --chip:#E8E8E3; --chip-hover:#DCDCD5;
  --hero:color-mix(in srgb, var(--page) 82%, #000);
  --g-x:#E53935; --g-y:#2E9E4F; --g-z:#3949AB; --g-curve:#F07400; --g-curve-fill:rgba(240,116,0,.12);
  --g-pink:#D81B60; --g-plane:rgba(60,190,200,.28); --g-cone:rgba(153,51,0,.20); --g-cone-line:rgba(153,51,0,.35);
  --g-blue:#1E66D0; --g-red:#D32F2F; --g-green:#2E9E4F; --g-purple:#7B3FC4; --g-orange:#E8710A; --g-teal:#0F8A80;
  --g-ring:#FFFFFF;
}
:root[data-theme="dark"]{
  --bg:#121212; --card:#1C1C1C; --text:#FFFFFF; --muted:#B3B3B3; --border:#333333;
  --primary:#79adec; --primary-2:#9dc3f1;
  --secondary:#FFB37A; --secondary-light:#FFD0A8; --accent:#8AF25E; --accent-2:#5BD27E;
  --shadow:0 8px 24px rgba(0,0,0,.5);
  --strong:color-mix(in srgb, var(--page) 48%, #1C1C1C); --chip:#2A2A2A; --chip-hover:#353535;
  --hero:color-mix(in srgb, var(--page) 62%, #000);
  --g-x:#FF6B6B; --g-y:#5BD27E; --g-z:#8C9BFF; --g-curve:#FFA040; --g-curve-fill:rgba(255,160,64,.16);
  --g-pink:#FF5C9A; --g-plane:rgba(90,220,230,.26); --g-cone:rgba(255,170,110,.18); --g-cone-line:rgba(255,170,110,.45);
  --g-blue:#6AA8FF; --g-red:#FF6B6B; --g-green:#5BD27E; --g-purple:#B48CFF; --g-orange:#FFA040; --g-teal:#4FD1C5;
  --g-ring:#1C1C1C;
}
html{ background:var(--bg); }
html[data-theme="dark"]{ color-scheme:dark; }
body{ font-family:'Anuphan',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; -webkit-font-smoothing:antialiased; }

/* หัวหน้า: สีปกของเรื่อง + ปก */
header{
  background:var(--hero); color:#fff; text-align:left;
  display:grid; grid-template-columns:auto 1fr; column-gap:22px; align-items:end;
  padding:62px 32px 26px;
}
header::before, header::after{ display:none !important; }
header > *:not(.lesson-cover):not(.back-link):not(.lang-toggle):not(.theme-toggle){ grid-column:2; }
.lesson-cover{ grid-column:1; grid-row:1 / span 6; align-self:end; width:120px; aspect-ratio:1; border-radius:6px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.45); }
.lesson-cover svg{ display:block; width:100%; height:100%; }
header h1{ font-size:clamp(1.8rem, 4.2vw, 2.9rem); font-weight:700; letter-spacing:-.01em; line-height:1.25; margin:0; color:#fff; }
header p{ font-size:1rem; opacity:.85; margin:6px 0 0; color:#fff; }
.back-link{
  top:14px; left:20px; display:inline-flex; align-items:center; gap:6px;
  padding:6px 14px; border-radius:999px; background:rgba(0,0,0,.32); color:#fff;
  font-size:.88rem; font-weight:600; opacity:1; text-decoration:none;
}
.back-link:hover{ background:rgba(0,0,0,.55); text-decoration:none; }
.lang-toggle, .theme-toggle{
  position:absolute; top:14px; height:34px; background:transparent; color:#fff;
  border:1px solid rgba(255,255,255,.55); border-radius:999px; font-family:inherit; font-weight:700; font-size:.85rem; cursor:pointer; z-index:2;
}
.lang-toggle{ right:20px; padding:0 16px; }
.theme-toggle{ right:86px; width:34px; padding:0; display:grid; place-items:center; }
.theme-toggle svg{ width:18px; height:18px; }
.lang-toggle:hover, .theme-toggle:hover{ background:rgba(255,255,255,.14); border-color:#fff; }
body > .lang-toggle, body > .theme-toggle{ position:fixed; top:14px; z-index:50; background:var(--card); color:var(--text); border-color:var(--border); box-shadow:var(--shadow); }
body > .lang-toggle{ right:14px; } body > .theme-toggle{ right:80px; }
body > .lang-toggle:hover, body > .theme-toggle:hover{ background:var(--chip); border-color:var(--text); }
header:not(:has(.back-link)):not(:has(.lang-toggle)){ padding-top:28px; border-radius:8px; }

/* แถบแท็บ: ชิปทรงแคปซูล */
nav{ background:var(--bg); border-bottom:1px solid var(--border); padding:10px 16px; gap:8px; }
.tab-btn{
  font-family:inherit; border:0; margin:0; border-radius:999px; padding:8px 16px;
  background:var(--chip); color:var(--text); font-weight:600; font-size:.9rem;
}
.tab-btn:hover{ background:var(--chip-hover); color:var(--text); }
.tab-btn.active{ background:var(--text); color:var(--bg); border-bottom-color:transparent; }

/* การ์ดและกล่อง */
.card{ background:var(--card); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow); }
.card-title{ color:var(--text); font-size:1.2rem; }
.card-title .icon{ display:none; }
.desc-text{ color:var(--text); font-size:1rem; }
.formula, .step.result, .stats{ background:var(--strong) !important; color:#fff; border-radius:8px; letter-spacing:0; }
.stat .k, .step-tag{ text-transform:none; letter-spacing:0; }

/* ปุ่ม */
.btn-action{ font-family:inherit; background:var(--text); color:var(--bg); }
.btn-action.secondary{ background:transparent; color:var(--text); border:1px solid var(--muted); }
.mode-btn{ font-family:inherit; border:1px solid var(--border); background:var(--card); color:var(--text); }
.mode-btn:hover{ border-color:var(--text); color:var(--text); }
.mode-btn.active{ background:var(--text); border-color:var(--text); color:var(--bg); }
.quiz-opt{ border-radius:8px; }
input[type=range]{ accent-color:var(--primary); }

@media (max-width:600px){
  header{ padding:58px 16px 20px; column-gap:14px; }
  .lesson-cover{ width:76px; }
  .back-link{ left:12px; max-width:calc(100% - 150px); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; display:block; }
  .lang-toggle{ right:12px; }
  .theme-toggle{ right:74px; }
  nav{ flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; scrollbar-width:none; }
  nav::-webkit-scrollbar{ display:none; }
}
/* โหมดมืด: สีที่หน้านี้ฝังไว้เอง (สร้างอัตโนมัติ) */
:root[data-theme="dark"]{--pos:#a8f8e1;--pos-bg:#102a1d;--neg:#f18fb8;--neg-bg:#291a0f;--cu:#799ff3;--cv:#eb8585;--cw:#a172f2;--cr:#ced7ea;--ci:#9ef7db;--cj:#f5a880;--ck:#94e3f6}

<script>
const PAGE_TITLE = { th: "สื่อการสอน : เวกเตอร์แบบรูปภาพ ม.5", en: "Teaching Aid: Vectors as Pictures (Grade 11)" };
// ══════════════ ภาษาไทย/อังกฤษ (ค่าใน data-th/data-en ถือเป็น HTML — ดู docs/adr/0002) ══════════════
let langMemory = 'th';
function getLang() { try { return localStorage.getItem('siteLang') || 'th'; } catch (e) { return langMemory; } }
function applyLang(lang) {
  document.documentElement.lang = lang;
  document.title = PAGE_TITLE[lang];
  document.querySelectorAll('[data-th]').forEach(el => { el.innerHTML = (lang === 'en' && el.dataset.en) ? el.dataset.en : el.dataset.th; });
  const btn = document.getElementById('langToggle');
  if (btn) btn.textContent = lang === 'en' ? 'ไทย' : 'EN';
  if (typeof onLangChange === 'function') onLangChange(lang);
}
function toggleLang() {
  const next = getLang() === 'en' ? 'th' : 'en';
  langMemory = next;
  try { localStorage.setItem('siteLang', next); } catch (e) {}
  applyLang(next);
}
function onLangChange() { stpStopAll(); renderAll(); refreshQuizLang(); }

// ══════════════ ตัวช่วยพื้นฐาน ══════════════
const $ = id => document.getElementById(id);
const EN = () => getLang() === 'en';
const L = (th, en) => (EN() ? en : th);
const T = (th, en) => ({ th, en });
const tx = v => typeof v === 'function' ? v() : (typeof v === 'string' ? v : v[getLang()]);
const frac = (n, d) => `<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;
const P = s => `<div>${s}</div>`;
const al = rows => `<div class="align">${rows.map(r => Array.isArray(r)
  ? `<span class="l">${r[0]}</span><span class="m">${r[1]}</span><span class="r">${r[2]}</span>` : `<span class="full">${r}</span>`).join('')}</div>`;
const sg = n => { n = Math.round(n * 1000) / 1000; return String(n).replace('-', '−'); };          // เลขติดลบใช้ − จริง
const sgp = n => (n < 0 ? '−' + sg(-n) : sg(n));
// ตัวแปรเวกเตอร์ มีลูกศรบนหัว
const V = (s, cls) => `<span class="v${cls ? ' ' + cls : ''}">${s}</span>`;
const vu = V('u', 'cu'), vv = V('v', 'cv'), vw = V('w', 'cw');
const vi = V('i', 'ci tall'), vj = V('j', 'cj tall'), vk = V('k', 'ck');
const box = (cls, html) => `<div class="${cls}">${html}</div>`;
const linkTag = (th, en) => `<span class="link-tag">🔗 ${L(th, en)}</span>`;
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };
// √n ที่ถอดกรณฑ์แล้ว เช่น 8 → "2√2", 25 → "5", 13 → "√13"
function sqrtParts(n) { let k = 1, r = n; for (let d = 2; d * d <= r; d++) { while (r % (d * d) === 0) { r /= d * d; k *= d; } } return { k, r }; }
function sqrtStr(n) { const { k, r } = sqrtParts(n); if (r === 1) return String(k); return (k > 1 ? k : '') + '√' + r; }
// นิพจน์ a·i + b·j (+ c·k) แบบมีสี ตัดพจน์ที่เป็น 0 และสัมประสิทธิ์ ±1
function comb(a, b, c) {
  const items = [[a, vi], [b, vj]]; if (c !== undefined) items.push([c, vk]);
  let out = '';
  items.forEach(([n, u]) => {
    if (n === 0) return;
    const mag = Math.abs(n) === 1 ? '' : sg(Math.abs(n));
    out += (out ? (n < 0 ? ' − ' : ' + ') : (n < 0 ? '−' : '')) + mag + u;
  });
  return out || V('0', 'cr');
}
const vecCol = (vals) => `<span class="colvec">${vals.map(x => `<span>${x}</span>`).join('')}</span>`;

// ══════════════ แท็บ ══════════════
function showTab(id, btn) {
  stpStopAll();
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  if (btn) btn.classList.add('active');
  if (id !== 'quiz') { resetWkAll(); resetSteppers(); if (typeof resetWidgets === 'function') resetWidgets(id); renderAll(); }
}

// ══════════════ ตัวแสดงขั้นตอนทีละขั้น (ตัวอย่างการคำนวณ — เริ่มที่ 0 ขั้นทุกครั้งที่เปิดแท็บ) ══════════════
const WK = {}, wkShown = {};
function addWk(key, w) { WK[key] = w; wkShown[key] = 0; }
function resetWkAll() { Object.keys(WK).forEach(k => wkShown[k] = 0); }
function wkHtml(key, prev) {
  const w = WK[key], en = EN(), n = w.steps.length;
  let h = `<div class="card" id="wk-${key}">
    <div class="card-title"><span class="icon">✏️</span><span>${tx(w.title)}</span></div>
    ${w.intro ? `<p class="intro">${tx(w.intro)}</p>` : ''}
    <div class="formula">${tx(w.prob)}</div>`;
  w.steps.forEach((s, i) => {
    if (i >= wkShown[key]) return;
    h += `<div class="wk-cell${i >= (prev || 0) ? ' fresh' : ''}"><span class="stepno">${i + 1}</span>${tx(s.h)}</div>`;
  });
  h += `<div class="btn-row">
      <button class="btn" onclick="wkNext('${key}')" ${wkShown[key] >= n ? 'disabled' : ''}>${en ? 'Next step ▶' : 'ขั้นถัดไป ▶'} (${wkShown[key]}/${n})</button>
      <button class="btn ghost" onclick="wkAll('${key}')" ${wkShown[key] >= n ? 'disabled' : ''}>${en ? 'Show all' : 'เผยทั้งหมด'}</button>
      <button class="btn ghost" onclick="wkReset('${key}')" ${wkShown[key] === 0 ? 'disabled' : ''}>${en ? '↺ Reset' : '↺ เริ่มใหม่'}</button>
    </div></div>`;
  return h;
}
function wkRender(key, prev) { const el = document.getElementById('wk-' + key); if (el) el.outerHTML = wkHtml(key, prev); }
function wkNext(k) { const p = wkShown[k]; if (wkShown[k] < WK[k].steps.length) wkShown[k]++; wkRender(k, p); }
function wkAll(k) { const p = wkShown[k]; wkShown[k] = WK[k].steps.length; wkRender(k, p); }
function wkReset(k) { wkShown[k] = 0; wkRender(k, 0); }

// ══════════════ แอนิเมชันหลายขั้น ◀ ▶ / เล่นอัตโนมัติ ══════════════
const STP = {};
function stpReg(id, min, max, draw) { const old = STP[id]; STP[id] = { step: old ? old.step : min, min, max, start: min, draw, timer: null }; }
function stpHtml(id) {
  return `<div class="stepper" id="stp-${id}">
    <button class="btn ghost small" data-act="prev" onclick="stpGo('${id}',-1)">◀ ${L('ย้อน', 'Back')}</button>
    <span class="cnt"></span>
    <button class="btn small" data-act="next" onclick="stpGo('${id}',1)">${L('ถัดไป', 'Next')} ▶</button>
    <button class="btn ghost small" data-act="play" onclick="stpPlay('${id}')">${L('▶▶ เล่นอัตโนมัติ', '▶▶ Auto-play')}</button>
  </div>`;
}
function stpUi(id) {
  const s = STP[id], el = document.getElementById('stp-' + id); if (!s || !el) return;
  el.querySelector('.cnt').textContent = `${s.step - s.min + 1}/${s.max - s.min + 1}`;
  el.querySelector('[data-act=prev]').disabled = s.step <= s.min;
  el.querySelector('[data-act=next]').disabled = s.step >= s.max;
  el.querySelector('[data-act=play]').textContent = s.timer ? L('⏸ หยุด', '⏸ Pause') : L('▶▶ เล่นอัตโนมัติ', '▶▶ Auto-play');
}
function stpDraw(id) { const s = STP[id]; if (!s) return; s.draw(s.step); stpUi(id); }
function stpStop(id) { const s = STP[id]; if (s && s.timer) { clearInterval(s.timer); s.timer = null; } stpUi(id); }
function stpStopAll() { Object.keys(STP).forEach(stpStop); }
function stpGo(id, d) { const s = STP[id]; stpStop(id); s.step = Math.max(s.min, Math.min(s.max, s.step + d)); stpDraw(id); }
function stpSet(id, n) { const s = STP[id]; stpStop(id); s.step = n; stpDraw(id); }
function stpPlay(id) {
  const s = STP[id];
  if (s.timer) { stpStop(id); return; }
  if (s.step >= s.max) { s.step = s.min; stpDraw(id); }
  s.timer = setInterval(() => { if (s.step >= s.max) { stpStop(id); return; } s.step++; stpDraw(id); if (s.step >= s.max) stpStop(id); }, 3000);
  stpUi(id);
}
function resetSteppers() { Object.keys(STP).forEach(id => { stpStop(id); STP[id].step = STP[id].start; }); }

// ══════════════ วาดรูป SVG แบบ 2 มิติ ══════════════
const r1 = n => Math.round(n * 100) / 100;
function svgLine(x1, y1, x2, y2, o) {
  o = o || {};
  return `<line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}" stroke="${o.c || '#94A3B8'}" stroke-width="${o.w || 2}"${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}${o.op !== undefined ? ` opacity="${o.op}"` : ''} stroke-linecap="round"/>`;
}
function svgArrow(x1, y1, x2, y2, o) {
  o = o || {};
  const w = o.w || 4, hd = o.head || (10 + w * 1.4), c = o.c || '#111827';
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  if (len < 1) return '';
  const ux = dx / len, uy = dy / len, hl = Math.min(hd, len * 0.7);
  const bx = x2 - ux * hl, by = y2 - uy * hl, nx = -uy * hl * 0.42, ny = ux * hl * 0.42;
  return `<g${o.op !== undefined ? ` opacity="${o.op}"` : ''}${o.attrs ? ' ' + o.attrs : ''}>
    <line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(bx + ux * 1.5)}" y2="${r1(by + uy * 1.5)}" stroke="${c}" stroke-width="${w}"${o.dash ? ` stroke-dasharray="${o.dash}"` : ''} stroke-linecap="round"/>
    <polygon points="${r1(x2)},${r1(y2)} ${r1(bx + nx)},${r1(by + ny)} ${r1(bx - nx)},${r1(by - ny)}" fill="${c}"/></g>`;
}
// ป้ายชื่อเวกเตอร์: parts เป็นอาเรย์ของข้อความ ตัวที่ขึ้นต้นด้วย ^ จะมีลูกศรบนหัว เช่น ['a·','^i']
function svgLab(x, y, parts, c, size, opts) {
  size = size || 18; opts = opts || {};
  if (typeof parts === 'string') parts = [parts];
  const cw = size * 0.6;
  const widths = parts.map(p => (p[0] === '^' ? p.length - 1 : p.length) * cw);
  const total = widths.reduce((a, b) => a + b, 0);
  let x0 = x - total / 2, out = '';
  parts.forEach((p, i) => {
    const arrow = p[0] === '^', s = arrow ? p.slice(1) : p, w = widths[i], mid = x0 + w / 2;
    out += `<text x="${r1(x0)}" y="${r1(y)}" font-size="${size}" fill="${c || '#111'}" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="start"${opts.bold === false ? ' font-weight="500"' : ''}>${s}</text>`;
    if (arrow) {
      const ay = y - size * (/^[ij]$/.test(s) ? 1.02 : 0.82), hw = Math.max(size * 0.32, w / 2 - 1);
      out += `<path d="M${r1(mid - hw)},${r1(ay)} L${r1(mid + hw)},${r1(ay)} M${r1(mid + hw - 4)},${r1(ay - 3.2)} L${r1(mid + hw)},${r1(ay)} L${r1(mid + hw - 4)},${r1(ay + 3.2)}" stroke="${c || '#111'}" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    x0 += w;
  });
  return out;
}
// ป้ายชื่อข้างกลางลูกศร (เยื้องไปด้านบนของเส้น)
function svgSideLab(x1, y1, x2, y2, parts, c, off, size) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy) || 1;
  let nx = -dy / l, ny = dx / l; if (ny > 0 || (ny === 0 && nx > 0)) { nx = -nx; ny = -ny; }
  return svgLab(mx + nx * (off || 20), my + ny * (off || 20) + (size || 18) * 0.35, parts, c, size);
}
// เลือกตำแหน่งป้ายชื่อข้างเส้น base=[x1,y1,x2,y2] ที่ห่างจากเส้นอื่น (avoid) มากที่สุด — กันป้ายทับเส้น
function segDist(px, py, l) { const dx = l[2] - l[0], dy = l[3] - l[1], t = clamp(((px - l[0]) * dx + (py - l[1]) * dy) / (dx * dx + dy * dy || 1), 0, 1); return Math.hypot(px - (l[0] + t * dx), py - (l[1] + t * dy)); }
function bestLabelSpot(base, avoid, bounds) {
  const [x1, y1, x2, y2] = base, len = Math.hypot(x2 - x1, y2 - y1) || 1, nx = -(y2 - y1) / len, ny = (x2 - x1) / len, bd = bounds || [30, 610, 30, 320];
  let best = null;
  [0.25, 0.35, 0.45, 0.55, 0.65, 0.75].forEach(t => [-1, 1].forEach(side => [24, 34, 46].forEach(off => {
    const px = x1 + (x2 - x1) * t + nx * side * off, py = y1 + (y2 - y1) * t + ny * side * off;
    let d = Infinity; avoid.forEach(a => { d = Math.min(d, segDist(px, py, a)); });
    if (px < bd[0] || px > bd[1] || py < bd[2] || py > bd[3]) d = -1;
    const sc = Math.min(d, 60) - off * 0.2;
    if (!best || sc > best.s) best = { x: px, y: py, s: sc };
  })));
  return best;
}
function svgText(x, y, s, c, size, anchor) {
  return `<text x="${r1(x)}" y="${r1(y)}" font-size="${size || 16}" fill="${c || '#334155'}" text-anchor="${anchor || 'middle'}" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">${s}</text>`;
}
function svgDot(x, y, c, r, extra) { return `<circle cx="${r1(x)}" cy="${r1(y)}" r="${r || 5}" fill="${c || '#111'}" stroke="#fff" stroke-width="2"${extra ? ' ' + extra : ''}/>`; }
// ตัวจับลาก: วงใหญ่โปร่งใสรับเมาส์/นิ้ว + จุดจริงอยู่ข้างใน
function svgHandle(name, x, y, c, r) {

}
function svgPt(svg, e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }

function bindDrag(svg, cb) {

    const t = e.target.closest('[data-drag]'); if (!t) return;
    cur = t.dataset.drag; svg.setPointerCapture(e.pointerId); e.preventDefault();
    const [x, y] = svgPt(svg, e); cb(cur, x, y, 'down');

  svg.addEventListener('pointermove', e => { if (!cur) return; const [x, y] = svgPt(svg, e); cb(cur, x, y, 'move'); });

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// กระดานพิกัด 2 มิติ: origin (ox,oy) หน่วยละ cell พิกเซล
function svgAxes2d(W, H, ox, oy, cell, o) {
  o = o || {};
  const nx = Math.floor(ox / cell), px = Math.floor((W - ox) / cell), ny = Math.floor(oy / cell), py = Math.floor((H - oy) / cell);
  let s = '';
  for (let i = -nx; i <= px; i++) s += svgLine(ox + i * cell, 0, ox + i * cell, H, { c: '#E5EAF0', w: 1 });
  for (let j = -py; j <= ny; j++) s += svgLine(0, oy - j * cell, W, oy - j * cell, { c: '#E5EAF0', w: 1 });
  s += svgArrow(8, oy, W - 8, oy, { c: '#475569', w: 2, head: 11 }) + svgArrow(ox, H - 8, ox, 8, { c: '#475569', w: 2, head: 11 });
  s += svgText(W - 14, oy + 22, o.xn || 'x', '#475569', 16) + svgText(ox + 16, 20, o.yn || 'y', '#475569', 16);
  if (o.ticks) {
    for (let i = -nx + 1; i <= px - 1; i++) if (i !== 0 && i % (o.tickStep || 1) === 0) s += svgText(ox + i * cell, oy + 18, sgp(i), '#94A3B8', 12);
    for (let j = -py + 1; j <= ny - 1; j++) if (j !== 0 && j % (o.tickStep || 1) === 0) s += svgText(ox - 12, oy - j * cell + 4, sgp(j), '#94A3B8', 12, 'end');
  }
  s += svgText(ox - 12, oy + 18, 'O', '#475569', 14, 'end');
  return s;
}

  } else s += svgText(X(last), Y(last) - 14, L('สิ้นสุด', 'end'), '#94A3B8', 14);

  $('rtGoal').innerHTML = L('เป้าหมาย: หาว่าเส้นทางนี้เขียนเป็นนิพจน์ได้ว่าอะไร — กดที่ลูกศรช่วงที่ 1, 2, ... ตามลำดับจากจุดเริ่มต้น', 'Goal: write this route as an expression — tap leg 1, 2, ... in order from the start.');
  let rd = `<div>${L('นิพจน์ที่ได้:', 'Expression so far:')} <b style="font-size:1.2rem">${RT.shown ? exprHtml(segs, RT.shown) : '…'}${done ? ' = ' + exprHtml(segs, segs.length) : ''}</b></div>`;
  if (RT.pending && !done) rd += `<div style="margin-top:6px">${L('ช่วงนี้เทียบกับลูกศรในกรอบซ้าย เดินตามทิศเดียวกัน หรือสวนทาง?', 'Compare with the given arrows: does this leg go the same way, or against?')}</div>
     <div class="btn-row"><button class="btn small" onclick="rtSign(1)">${L('ทิศเดียวกัน → +', 'same direction → +')}</button><button class="btn small ghost" onclick="rtSign(-1)">${L('สวนทาง → −', 'against → −')}</button></div>`;
  if (RT.msg) rd += `<div style="margin-top:8px;font-weight:700;color:${RT.msg.ok ? '#047857' : '#BE185D'}">${RT.msg.t()}</div>`;
  if (done) rd += `<div style="margin-top:8px" class="box-ok">${L('ลูกศรสีดำ (จากจุดเริ่มต้นไปจุดสิ้นสุด) คือผลลัพธ์ = ', 'The black arrow (start → end) is the result = ')}<b>${exprHtml(segs, segs.length)}</b></div>`;
  const rdEl = $('rtRead'); rdEl.innerHTML = rd;
  $('rtChips').innerHTML = RSEGS.map((sg, i) => `<button class="chip ${RT.ex === i ? 'active' : ''}" onclick="rtEx(${i})">${exprHtml(sg, sg.length)}</button>`).join('');
}
const segParts = segs => segs.flatMap(([n, sgn], i) => (i ? [sgn < 0 ? '−' : '+'] : (sgn < 0 ? ['−'] : [])).concat('^' + n));
function rtEx(i) { RT.ex = i; RT.shown = 0; RT.pending = false; RT.msg = null; drawRoute(); }
function rtSign(sv) {
  const segs = RSEGS[RT.ex];
  if (RT.shown >= segs.length || !RT.pending) return;
  const [n, want] = segs[RT.shown];
  if (sv === want) {
    RT.msg = { ok: true, t: () => want > 0 ? L('ถูก! ช่วงนี้เดินตามทิศเดียวกับลูกศรเดิม จึงเป็น +', 'Correct! This leg follows the arrow’s direction, so it is +') : L('ถูก! ช่วงนี้เดินสวนทางกับลูกศรเดิม จึงเป็น −', 'Correct! This leg goes against the arrow, so it is −') };
    RT.shown++; RT.pending = false;
  } else {
    RT.msg = { ok: false, t: () => want > 0
      ? L('ยังไม่ใช่ — ช่วงนี้ชี้ไปทางเดียวกับลูกศรในกรอบซ้ายเป๊ะ (เดินตามลูกศร) ต้องเป็น +', 'Not yet — this leg points exactly like the arrow in the left panel (walking with it), so it must be +')
      : L('ยังไม่ใช่ — ช่วงนี้ชี้ตรงข้ามกับลูกศรในกรอบซ้าย (เดินสวนทาง) ต้องเป็น −', 'Not yet — this leg points opposite to the arrow in the left panel (walking against it), so it must be −') };
  }
  drawRoute();
}
function rtPick(i) {
  if (i < RT.shown) return;
  if (i > RT.shown) { RT.msg = { ok: false, t: () => L(`ต้องไล่จากจุดเริ่มต้นตามลำดับก่อน — ตอนนี้ต้องกดช่วงที่ ${RT.shown + 1}`, `Go in order from the start — you need leg ${RT.shown + 1} now`) }; }
  else { RT.pending = true; RT.msg = null; }
  drawRoute();
}
function mountRoute() {
  const svg = $('rtBoard'); if (!svg) return;
  svg.addEventListener('click', e => { const t = e.target.closest('[data-pick]'); if (t) rtPick(+t.dataset.pick); });
  drawRoute();
}

    L(`ขั้น 3 — <b>เส้นทแยงมุม</b>ที่ออกจากจุดที่หางชนกัน คือ ${vu} + ${vv}<br>${linkTag('จากสื่อ 1 ②: ต่อหัวต่อหางตามเส้นประก็ไปถึงจุดเดียวกัน', 'From ②: walking head-to-tail along the dashes ends at the same point')}`, `Step 3 — the <b>diagonal</b> from the tails’ meeting point is ${vu} + ${vv}<br>${linkTag('จากสื่อ 1 ②: ต่อหัวต่อหางตามเส้นประก็ไปถึงจุดเดียวกัน', 'From ②: walking head-to-tail along the dashes ends at the same point')}`),
  ];

function mountPar() { stpReg('par', 1, 3, drawPar); stpDraw('par'); }

const MUL = { c: 2 };
function tabMul() {
  return `

      <div style="margin-top:6px">${linkTag('ปูทางสื่อ 2: a·' + vi + ' ก็คือ "ยืด ' + vi + ' เป็น a เท่า" แบบนี้แหละ', 'Sets up part 2: a·' + vi + ' means "stretch ' + vi + ' by a" just like this')}</div></div>
  </div>`;
}
function drawMul() {
  const svg = $('mulBoard'); if (!svg) return;

    : c === -1 ? L('c = −1 → ทิศตรงข้าม ขนาดเท่าเดิม (นิเสธ)', 'c = −1 → opposite direction, same length (the negative)')

}
