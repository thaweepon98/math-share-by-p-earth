function build() {
  pmCss();
  const el = id => document.getElementById(id);
  const fm = (...p) => `<div class="formula">${p.map(x => `<span>${x}</span>`).join('')}</div>`;
  const iN = '<i>n</i>', iR = '<i>r</i>', iK = '<i>k</i>';

  // ── ตรวจตัวเลขด้วยการไล่นับจริง (brute force) ──
  const seqCount = (n, r) => { let c = 0; const go = (used, len) => { if (len === r) { c++; return; } for (let i = 0; i < n; i++) if (!(used >> i & 1)) go(used | 1 << i, len + 1); }; go(0, 0); return c; };
  console.assert(seqCount(7, 3) === 210 && cpP(7, 3) === 210 && cpFact(7) / cpFact(4) === 210, 'pm 7P3 = 210');
  console.assert(seqCount(5, 5) === 120 && cpP(5, 5) === 120 && cpFact(5) / cpFact(0) === 120, 'pm 5P5 = 120');
  console.assert(seqCount(10, 3) === 720 && cpP(10, 3) === 720, 'pm 10P3 = 720');
  for (let n = 0; n <= 7; n++) for (let r = 0; r <= n; r++) console.assert(seqCount(n, r) === cpP(n, r) && cpP(n, r) === cpFact(n) / cpFact(n - r), 'pm P table ' + n + ',' + r);
  for (let n = 8; n <= 10; n++) for (let r = 0; r <= n; r++) console.assert(cpP(n, r) === cpFact(n) / cpFact(n - r), 'pm P table big ' + n + ',' + r);
  console.assert(7 * 6 === 42 && 42 * 5 === 210 && 720 / 6 === 120 && 10 * 10 * 10 === 1000 && 10 * 3 === 30, 'pm line numbers + distractors');
  // ของติดกัน
  console.assert(pmCount(6, p => pmBlockOK([0, 1], p)) === 240 && cpFact(5) * cpFact(2) === 240, 'pm together 6 people A B = 240');
  console.assert(pmCount(7, p => pmBlockOK([4, 5, 6], p)) === 720 && cpFact(5) * cpFact(3) === 720, 'pm together 4 men 3 women = 720');
  console.assert(pmCount(6, p => pmBlockOK([0, 1, 2], p) && pmBlockOK([3, 4], p)) === 72 && cpFact(3) * (cpFact(3) * cpFact(2) * cpFact(1)) === 72 && 6 * 12 === 72, 'pm together 3 books groups = 72');
  console.assert(pmCount(5, p => pmBlockOK([0, 1, 2], p)) === 36 && cpFact(3) * cpFact(3) === 36 && cpFact(3) === 6 && cpFact(5) === 120 && cpFact(3) * cpFact(2) === 12, 'pm together predict 36 + distractors 6 120 12');
  // ของแยกกัน
  console.assert(pmCount(5, p => pmApartOK([0, 1], p)) === 72 && cpFact(3) * 4 * 3 === 72 && cpFact(5) - cpFact(4) * cpFact(2) === 72 && 6 * 12 === 72 && 120 - 48 === 72, 'pm apart 5 people A B = 72');
  console.assert(pmCount(7, p => pmApartOK([4, 5, 6], p)) === 1440 && cpFact(4) * 5 * 4 * 3 === 1440 && 24 * 60 === 1440, 'pm apart 4 men 3 women = 1,440');
  console.assert(pmCount(6, p => pmApartOK([0, 1], p)) === 480 && cpFact(4) * 5 * 4 === 480 && cpFact(6) - cpFact(5) * cpFact(2) === 480 && cpFact(6) === 720 && cpFact(5) * cpFact(2) === 240 && cpFact(4) * 5 === 120, 'pm apart predict 480 + distractors 240 720 120');
  for (let n = 3; n <= 8; n++) for (let k = 2; k <= Math.min(4, n); k++) {
    PM_TG[n + ',' + k] = pmCount(n, p => pmBlockOK(pmRng(k), p));
    console.assert(PM_TG[n + ',' + k] === cpFact(n - k + 1) * cpFact(k), 'pm together formula ' + n + ',' + k);
  }
  for (let n = 3; n <= 8; n++) for (let k = 2; k <= Math.min(4, n - 1); k++) {
    PM_AP[n + ',' + k] = pmCount(n, p => pmApartOK(pmRng(k), p));
    const g = n - k + 1;
    console.assert(PM_AP[n + ',' + k] === (g < k ? 0 : cpFact(n - k) * cpP(g, k)), 'pm apart formula ' + n + ',' + k);
  }
  // ของซ้ำ
  console.assert(pmDistinct('BANANA') === 60 && cpFact(6) / (cpFact(3) * cpFact(2)) === 60 && 720 / 12 === 60 && 3 * 2 === 6 && 6 * 2 === 12, 'pm repeat BANANA = 60');
  console.assert(pmDistinct('RRRRWWW') === 35 && cpFact(7) / (cpFact(4) * cpFact(3)) === 35 && 5040 / 144 === 35 && 24 * 6 === 144 && cpFact(7) === 5040, 'pm repeat balls = 35');
  console.assert(pmDistinct('COFFEE') === 180 && 720 / 4 === 180 && 720 / 2 === 360 && 720 / 8 === 90 && cpFact(6) === 720, 'pm repeat COFFEE = 180 + distractors 720 360 90');
  console.assert(pmDistinct('PEPPER') === 60 && 720 / 6 === 120 && 720 / 2 === 360, 'pm quiz PEPPER = 60 + distractors 720 120 360');
  // วงกลม / สร้อย / ที่นั่งพิเศษ (ไล่ทุกแบบ นับการจัดที่ไม่ซ้ำใต้การหมุน / หมุน+พลิก)
  const cycAdj = a => { const n = a.length, q = (a.indexOf(0) - a.indexOf(1) + n) % n; return q === 1 || q === n - 1; };
  console.assert(pmClasses(5, pmRotGroup(5)) === 24 && cpFact(5) / 5 === 24 && cpFact(4) === 24, 'pm circle 5 = 24');
  console.assert(pmClasses(6, pmFlipGroup(6)) === 60 && cpFact(5) / 2 === 60, 'pm necklace 6 = 60');
  console.assert(pmClasses(6, pmIdGroup(6)) === 720 && 6 * cpFact(5) === 720 && cpFact(5) === 120, 'pm special seat 6 = 720');
  console.assert(pmClasses(6, pmRotGroup(6), cycAdj) === 48 && cpFact(4) * cpFact(2) === 48, 'pm circle + bundle 6 = 48');
  console.assert(pmClasses(7, pmRotGroup(7)) === 720 && cpFact(7) === 5040 && 720 / 2 === 360 && cpFact(5) === 120, 'pm predict circle 7 = 720 + distractors 5040 360 120');
  console.assert(pmClasses(8, pmFlipGroup(8)) === 2520 && cpFact(7) / 2 === 2520 && cpFact(8) / 2 === 20160 && cpFact(8) === 40320 && cpFact(7) === 5040, 'pm predict necklace 8 = 2520 + distractors');
  console.assert(pmClasses(6, pmRotGroup(6)) === 120 && 720 / 2 === 360 && cpFact(4) === 24, 'pm quiz circle 6 = 120');
  console.assert(pmClasses(7, pmFlipGroup(7)) === 360 && cpFact(7) / 2 === 2520 && cpFact(6) === 720, 'pm quiz necklace 7 = 360');
  for (let n = 3; n <= 7; n++) PM_CR[n] = { round: pmClasses(n, pmRotGroup(n)), bead: pmClasses(n, pmFlipGroup(n)), special: pmClasses(n, pmIdGroup(n)) };
  for (let n = 3; n <= 7; n++) console.assert(PM_CR[n].round === cpFact(n - 1) && PM_CR[n].bead === cpFact(n - 1) / 2 && PM_CR[n].special === cpFact(n), 'pm circle formula ' + n);
  // แบบฝึกหัด
  console.assert(seqCount(9, 3) === 504 && 9 * 9 * 9 === 729 && 504 / 6 === 84 && 9 * 3 === 27, 'pm quiz 1: 504');

  console.assert(pmCount(5, p => pmBlockOK([0, 1, 2], p) && pmBlockOK([3, 4], p)) === 24 && 2 * 6 * 2 === 24 && 2 * 6 === 12 && 2 * 2 === 4 && cpFact(5) === 120, 'pm quiz 4: 24');
  console.assert(pmCount(7, p => pmApartOK([0, 1], p)) === 3600 && cpFact(5) * 6 * 5 === 3600 && cpFact(7) - cpFact(6) * 2 === 3600, 'pm quiz 5: 3,600');
  window.__pmAsserts = 'done';

  // ── แท็บ line ──
  el('tab-line').innerHTML =
    fm(`${cpPH('n', 'r')} = ${pmF(`${iN}!`, `(${iN} − ${iR})!`)}`, `${cpPH('n', 'r')} = ${mx(`${iN} × (${iN} − 1) × …`)} <span class="fm-o">(${d('ถอยลง', 'step down')} ${iR} ${d('ตัว', 'terms')})</span>`) +
    fm(`<span class="fm-g">${d('สลับแล้วแตกต่าง → เรียง → P', 'Swap and it differs → ordered → P')}</span>`) +
    card('🎤', d('ประกวดร้องเพลง: 7 คน หาที่ 1, 2, 3', 'Singing contest: 7 singers, find 1st, 2nd, 3rd'), '<div id="ln-sc"></div>') +
    card('📚', d('ตัวอย่างที่ 2: เรียงหนังสือทั้งหมด', 'Example 2: arranging all the books'), '<div id="ln-e2"></div>') +
    card('🔮', d('ทายก่อน: ตั้งประธาน รองประธาน เลขานุการ', 'Guess first: president, vice-president, secretary'), '<div id="ln-pr"></div>') +
    card('🖐️', d('ลองทำ: เลื่อน n และ r แล้วดูช่องกับลูกศรถอย', 'Try it: slide n and r and watch the slots and the arrow'), '<div id="ln-try"></div>');
  makeScenes(el('ln-sc'), LN_SC, { prompt: T('กด ▶ ทีละฉาก — คนลงที่ทีละที่ ตัวเลือกเหลือน้อยลง แล้วสลับ', 'Press ▶ one scene at a time — people fill the places, fewer choices each time, then swap') });
  makePmLineE2(el('ln-e2'));
  makePredict(el('ln-pr'), linePredItems(), { label: T('โจทย์', 'Problem'), prompt: T('ดูโจทย์แล้วทาย — เฉลยบนภาพ', 'Read the problem and guess — the answer shows on the picture') });
  makePmLineTry(el('ln-try'));

  // ── แท็บ together ──

<script id="theme-js">
// ── ปุ่มสลับโหมดสว่าง/มืด (สร้างโดย tools/build_lessons.py) — จำค่าไว้ใน localStorage 'siteTheme' ──

}
function toggleTheme() {

}
// ── ตัวปรับสีโหมดมืดตอนรัน: สีที่ JS เขียนตรงๆ ลงกราฟ SVG (fill/stroke) หรือ style="" ──
// โหมดมืด: สีเข้ม → สว่าง (คงเฉดเดิม), พื้นอ่อน → เข้ม, สีสดกลางๆ คงไว้ — กลับโหมดสว่างจะคืนค่าเดิม
(function () {
  function parse(c) {

    if (m) { const p = m[1].split(/[ /]+/).filter(Boolean).map(Number); return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1]; }

  function toRgb(h, s, l) { if (!s) return [l, l, l]; const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q; return [hue(p, q, h + 1 / 3), hue(p, q, h), hue(p, q, h - 1 / 3)]; }

  function remap(c, role) {

    }
    clearTimeout(fcTimer);
    fcTimer = setTimeout(() => { mo.disconnect(); fixContrast(); watch(); }, 300);
  }

    for (const el of document.querySelectorAll('[data-dk-sf]')) { el.style.fill = el.getAttribute('data-dk-sf'); el.removeAttribute('data-dk-sf'); }
    for (const el of document.querySelectorAll('svg text')) {
      if (el.closest('header, .lesson-cover')) continue;
      const fg = rgbOf(getComputedStyle(el).fill);
      if (!fg) continue;
      const hsl = toHsl(fg[0], fg[1], fg[2]);
