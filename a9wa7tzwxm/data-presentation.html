}

// ───────── ตัวช่วยร่วมของ makeUnitCircle / makeTriangle ─────────
// ลบวิดเจ็ตที่ host หายไปจาก DOM ออกจาก LIVE (วิดเจ็ตที่สร้างใน makeScenes ถูกสร้างใหม่ทุกครั้งที่วาดฉาก)
// ตัด widget ที่ตายแล้วออกจาก LIVE — เลื่อนไปทำหลังงานปัจจุบันจบ (microtask) เพราะ makeUnitCircle/makeTriangle อาจถูกเรียกระหว่าง
// applyLang กำลัง LIVE.forEach อยู่ (refresh วาดฉากใหม่) — splice ตอนนั้นทำให้ widget ตัวถัดไปถูกข้าม ภาษาไม่เปลี่ยน
let _tgPruneQ = false;
function _tgPrune() {
  if (_tgPruneQ) return; _tgPruneQ = true;
  queueMicrotask(() => { _tgPruneQ = false; for (let i = LIVE.length - 1; i >= 0; i--) if (LIVE[i]._dead) LIVE.splice(i, 1); });
}
const _TG_TXT = { blue: 'b', orange: 'o', green: 'g', purple: 'p', pink: 'p', red: 'r', teal: 'g' };   // สี → คลาสป้าย .pl-lbl.*

// ───────── 15) วงกลมหนึ่งหน่วย ─────────
// makeUnitCircle(host, o) → w     วาด SVG วงกลมหนึ่งหน่วย (แกน x, y + ป้าย (1,0) (0,1) (−1,0) (0,−1)) + จุด P ลากได้ + ที่แสดงตาม o.show   ⚠️ แทนที่เนื้อหาเดิมของ host ทั้งหมด
//   o = {
//     theta: 0                 มุมเริ่มต้น (เรเดียน)
//     snap: 0                  ดูดมุมตอนลาก (เรเดียน เช่น Math.PI / 12 · 0 = อิสระ)
//     draggable: true          ลาก P ได้ (Pointer Events: กด/ลากที่ไหนในภาพ P ก็วิ่งตามมุมของเมาส์/นิ้ว) · false = ภาพนิ่ง/สั่งด้วยโค้ด
//     range: [0, 2π]           ช่วงมุมที่ลากได้ · ยาวไม่เกิน 2π = ตัดวนเข้าช่วง (ลากข้าม 0 แล้วเป็น 2π−ε) · ยาวกว่า 2π = ต่อเนื่องไม่วน (เช่น [−4π, 4π] ลากได้หลายรอบ)

// makeTriangle(host, o) → w     วาด SVG สามเหลี่ยมจากจุดยอด 3 จุด (พิกัดกราฟ y ขึ้นบน) · ป้ายด้าน/มุม · เครื่องหมายมุมฉาก · ส่วนโค้งมุม · ไฮไลต์ · ลากจุดยอด   ⚠️ แทนที่เนื้อหาเดิมของ host ทั้งหมด
//   o = {

//     sides: [s0, s1, s2]     ป้ายด้าน — ⚠️ ด้าน i = ด้านตรงข้ามจุดยอด i (ด้าน 0 = เส้น V1–V2, ด้าน 1 = V0–V2, ด้าน 2 = V0–V1) ตรงกับ a, b, c = ด้านตรงข้าม A, B, C

//     right: 1                จุดยอดที่เป็นมุมฉาก (ขีดสี่เหลี่ยมเล็ก ไม่วาดส่วนโค้งมุมนั้น)
//     arcs: [0, 2]            จุดยอดที่วาดส่วนโค้งมุม (ไม่ใส่ = ทุกจุดที่มีป้ายมุม ยกเว้นมุมฉาก) · arcR: 28 รัศมีส่วนโค้ง (px)
//     box: { xmin, xmax, ymin, ymax }   กรอบพิกัดกราฟที่ต้องการให้เห็น (สเกล x = y เสมอ ไม่บิดสามเหลี่ยม) — ถ้าจะ setVerts/ลากให้ใส่กรอบที่ครอบทุกตำแหน่งที่เป็นไปได้ ไม่ใส่ = ครอบจุดเริ่มต้น
//     w: 520, h: 340, pad: 46 ขนาด viewBox/ขอบ (px)
//     drag: 2 (หรือ [1, 2])    จุดยอดที่ลากได้ (มีวงจับ) · onDrag: (pt, idx, w) => {}  pt = { x, y (ดูดตาม snap แล้ว), rx, ry (ก่อนดูด) } พิกัดกราฟ — คุณคำนวณจุดใหม่เอง แล้วเรียก w.setVerts([...])
//        (ไม่ใส่ onDrag = จุดยอดวิ่งตามเมาส์ตรงๆ) · snap: 0 ดูดพิกัดตอนลาก (หน่วยกราฟ) · onChange: pts => {} (เรียกหลัง setVerts)
//   }
//   คืน w = { pts (getter, สำเนา), setVerts(pts), setLabels({ sides, angles }), hl(...), vis(key, opacity), grow(i, p, rev?), fillOp(op), parts (องค์ประกอบ SVG ดิบ), svg, g (กลุ่มว่างสำหรับวาดเพิ่ม อยู่บนสุด ไม่ถูกล้าง), px(x, y) → [px, py], V(i) → [px, py] ของจุดยอด, refresh() }
//   ไฮไลต์ hl(key, สี) — key = 's0' | 's1' | 's2' (ด้าน i) หรือ 'a0' | 'a1' | 'a2' (มุมที่จุดยอด i) · สี = 'blue' | 'orange' | 'green' | 'purple' | 'pink' | 'red' | 'teal' (เส้นเรืองแสง + ป้ายสีเดียวกัน)
//     w.hl('s0', 'blue') เพิ่มไฮไลต์ด้าน 0 · w.hl('s0') ล้างด้าน 0 · w.hl({ s0: 'blue', s2: 'orange' }) ตั้งใหม่ทั้งชุด (ที่ไม่อยู่ในอ็อบเจ็กต์ถูกล้าง) · w.hl(null) ล้างทั้งหมด
//   ซ่อน/โชว์ป้าย (เช่นให้ป้ายขึ้นทีละด้านใน makeScenes): w.vis('s1', 0) ซ่อนป้ายด้าน 1 · w.vis('a0', 1) โชว์ป้ายมุม 0 พร้อมส่วนโค้ง (ไล่ opacity ใน S.anim.run ได้) · w.vis('all', 0) ทุกป้าย
//   ใช้ใน makeScenes ได้ตรงๆ (สร้างใหม่ในทุก end()/play() ได้เลย) · ลงทะเบียน LIVE เอง (และออกจาก LIVE เมื่อ host หายไป)
//   ตัวอย่างลากมุมยอดบนของสามเหลี่ยม 3-4-5 ให้ขยายแบบคล้าย:
//     makeTriangle(el, { verts: [[0, 0], [4, 0], [4, 3]], right: 1, angles: ['θ', null, null], sides: ['3', '4', '5'], box: { xmin: -.5, xmax: 13, ymin: -1, ymax: 10 }, drag: 2,
//       onDrag: (pt, i, w) => { const s = Math.max(1, Math.min(3, Math.round(pt.rx / 4))); w.setVerts([[0, 0], [4 * s, 0], [4 * s, 3 * s]]); } })
function makeTriangle(host, o) {
  o = o || {}; _tgPrune();
  const W = o.w || 520, H = o.h || 340, pad = o.pad === undefined ? 46 : o.pad, f1 = v => (+v).toFixed(1);
  let pts = o.verts.map(p => p.slice());
  const bx = o.box || (() => { const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); return { xmin: Math.min(...xs), xmax: Math.max(...xs), ymin: Math.min(...ys), ymax: Math.max(...ys) }; })();
  const bw = Math.max(1e-6, bx.xmax - bx.xmin), bh = Math.max(1e-6, bx.ymax - bx.ymin), sc = Math.min((W - 2 * pad) / bw, (H - 2 * pad) / bh);
  const ox = (W - bw * sc) / 2 - bx.xmin * sc, oy = H - (H - bh * sc) / 2 + bx.ymin * sc;
  const PX = x => ox + x * sc, PY = y => oy - y * sc;
  const dragList = o.drag === undefined || o.drag === null ? [] : [].concat(o.drag);
  let sides = (o.sides || [null, null, null]).slice(), angles = (o.angles || [null, null, null]).slice();
  const arcs = o.arcs || [0, 1, 2].filter(i => angles[i] != null && i !== o.right), arcR0 = o.arcR || 28;
  const w = { _dead: false }, hlState = {};
  host.innerHTML = '<div class="tri-wrap"><svg class="sc-svg tri-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg"></svg></div>';
  const svg = host.querySelector('svg'), mk = (tag, attrs) => sv(tag, attrs, svg);
  const fill = mk('polygon', { class: 'tr-fill' });
  const glow = [0, 1, 2].map(() => mk('line', { class: 'tr-glow' })), edge = [0, 1, 2].map(() => mk('line', { class: 'tr-side' }));
  const arcEl = [0, 1, 2].map(() => mk('path', { class: 'tr-arc' })), rmark = mk('path', { class: 'tr-right' });
  const sLab = [0, 1, 2].map(() => mk('text', { class: 'tr-lab', 'text-anchor': 'middle' })), aLab = [0, 1, 2].map(() => mk('text', { class: 'tr-lab tr-alab', 'text-anchor': 'middle' }));
  const nLab = [0, 1, 2].map(() => mk('text', { class: 'tr-name', 'text-anchor': 'middle' }));
  const handles = dragList.map(i => ({ i, el: mk('circle', { class: 'tr-handle', r: 15 }) }));
  const user = mk('g', { class: 'tr-user' });
  w.svg = svg; w.g = user;
  const P = () => pts.map(p => [PX(p[0]), PY(p[1])]);
  const unit = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
  const estW = t => String(t).replace(/<[^>]*>/g, '').length * 9.5;
  const setLab = (el, t) => { el.innerHTML = t == null ? '' : tx(t); el.style.display = t == null ? 'none' : ''; };
  w.layout = () => {
    const V = P(), G = [(V[0][0] + V[1][0] + V[2][0]) / 3, (V[0][1] + V[1][1] + V[2][1]) / 3];
    fill.setAttribute('points', V.map(p => f1(p[0]) + ',' + f1(p[1])).join(' '));
    for (let i = 0; i < 3; i++) {
      const a = V[(i + 1) % 3], b = V[(i + 2) % 3];
      [glow[i], edge[i]].forEach(l => { l.setAttribute('x1', f1(a[0])); l.setAttribute('y1', f1(a[1])); l.setAttribute('x2', f1(b[0])); l.setAttribute('y2', f1(b[1])); });
      // ป้ายด้าน: กึ่งกลางด้าน ดันออกนอกสามเหลี่ยมตามเส้นตั้งฉาก (ระยะเผื่อความกว้างข้อความ ไม่ให้ทับเส้น)
      const mx_ = (a[0] + b[0]) / 2, my_ = (a[1] + b[1]) / 2; let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
      if (nx * (mx_ - G[0]) + ny * (my_ - G[1]) < 0) { nx = -nx; ny = -ny; }
      const off = 9 + estW(sides[i] == null ? '' : tx(sides[i])) / 2 * Math.abs(nx) + 10 * Math.abs(ny);
      sLab[i].setAttribute('x', f1(mx_ + nx * off)); sLab[i].setAttribute('y', f1(my_ + ny * off + 6));
    }
    for (let i = 0; i < 3; i++) {
      const v = V[i], A = V[(i + 1) % 3], B = V[(i + 2) % 3], u1 = unit(v, A), u2 = unit(v, B);
      const e1 = Math.hypot(A[0] - v[0], A[1] - v[1]), e2 = Math.hypot(B[0] - v[0], B[1] - v[1]);
      const r = Math.min(arcR0, 0.4 * Math.min(e1, e2)), cr = u1[0] * u2[1] - u1[1] * u2[0];
      const p1 = [v[0] + u1[0] * r, v[1] + u1[1] * r], p2 = [v[0] + u2[0] * r, v[1] + u2[1] * r];
      arcEl[i].setAttribute('d', `M${f1(v[0])} ${f1(v[1])} L${f1(p1[0])} ${f1(p1[1])} A${f1(r)} ${f1(r)} 0 0 ${cr > 0 ? 1 : 0} ${f1(p2[0])} ${f1(p2[1])} Z`);
      arcEl[i].style.display = arcs.includes(i) ? '' : 'none';
      let bxv = u1[0] + u2[0], byv = u1[1] + u2[1]; const bl = Math.hypot(bxv, byv); if (bl < 1e-6) { bxv = -u1[1]; byv = u1[0]; } else { bxv /= bl; byv /= bl; }
      // ป้ายมุม: วางบนเส้นแบ่งครึ่งมุม — มุมแคบต้องถอยลึกเข้าไปจนข้อความไม่ทับขอบ · ถ้าในสามเหลี่ยมไม่พอที่ก็วางนอกสามเหลี่ยม
      const lw = estW(angles[i] == null ? '' : tx(angles[i])), alpha = Math.acos(Math.max(-1, Math.min(1, u1[0] * u2[0] + u1[1] * u2[1])));
      let lr = Math.max(r + 14 + lw * 0.45, 30 + lw * 0.45); const need = (lw / 2 + 7) / Math.tan(Math.max(alpha, 0.05) / 2), maxIn = 0.7 * Math.min(e1, e2);
      if (need > lr) lr = need <= maxIn ? need : -(14 + lw * 0.5);
      aLab[i].setAttribute('x', f1(v[0] + bxv * lr)); aLab[i].setAttribute('y', f1(v[1] + byv * lr + 6));
      nLab[i].setAttribute('x', f1(v[0] - bxv * (dragList.includes(i) ? 30 : 22))); nLab[i].setAttribute('y', f1(v[1] - byv * (dragList.includes(i) ? 30 : 22) + 6));   // ชื่อจุดยอด: ดันออกนอกสามเหลี่ยม
      if (i === o.right) rmark.setAttribute('d', `M${f1(v[0] + u1[0] * 15)} ${f1(v[1] + u1[1] * 15)} L${f1(v[0] + (u1[0] + u2[0]) * 15)} ${f1(v[1] + (u1[1] + u2[1]) * 15)} L${f1(v[0] + u2[0] * 15)} ${f1(v[1] + u2[1] * 15)}`);
    }
    rmark.style.display = o.right === undefined || o.right === null ? 'none' : '';
    handles.forEach(h => { h.el.setAttribute('cx', f1(V[h.i][0])); h.el.setAttribute('cy', f1(V[h.i][1])); });
  };
  const paintText = () => { for (let i = 0; i < 3; i++) { setLab(sLab[i], sides[i]); setLab(aLab[i], angles[i]); setLab(nLab[i], o.names ? o.names[i] : null); } };
  w.setVerts = np => { pts = np.map(p => p.slice()); w.layout(); if (o.onChange) o.onChange(w.pts); return w; };
  w.setLabels = l => { l = l || {}; if (l.sides) sides = l.sides.slice(); if (l.angles) angles = l.angles.slice(); paintText(); w.layout(); return w; };
  w.vis = (key, op) => {
    const set = (k, i) => { if (k === 's') sLab[i].style.opacity = op; else { aLab[i].style.opacity = op; arcEl[i].style.opacity = op; } };
    if (key === 'all') { [0, 1, 2].forEach(i => { set('s', i); set('a', i); }); return w; }
    set(key[0], +key[1]); return w;
  };
  const hlApply = key => {
    const c = hlState[key] || '', i = +key[1];
    if (key[0] === 's') { glow[i].setAttribute('class', 'tr-glow' + (c ? ' on ' + c : '')); edge[i].setAttribute('class', 'tr-side' + (c ? ' hl ' + c : '')); sLab[i].setAttribute('class', 'tr-lab' + (c ? ' pl-lbl ' + _TG_TXT[c] : '')); }
    else { arcEl[i].setAttribute('class', 'tr-arc' + (c ? ' hl ' + c : '')); aLab[i].setAttribute('class', 'tr-lab tr-alab' + (c ? ' pl-lbl ' + _TG_TXT[c] : '')); }
  };
  w.hl = (key, c) => {
    const all = ['s0', 's1', 's2', 'a0', 'a1', 'a2'];
    if (key === null || key === undefined) all.forEach(k => { delete hlState[k]; hlApply(k); });
    else if (typeof key === 'object') all.forEach(k => { if (key[k]) hlState[k] = key[k]; else delete hlState[k]; hlApply(k); });
    else { if (c) hlState[key] = c; else delete hlState[key]; hlApply(key); }
    return w;
  };
  w.px = (x, y) => [PX(x), PY(y)];
  w.V = i => P()[i];
  w.parts = { fill, glow, edge, arc: arcEl, sLab, aLab, nLab, right: rmark };   // องค์ประกอบ SVG ดิบ (ไว้ทำแอนิเมชันเอง เช่น style.opacity)
  // grow(i, p, rev) — วาดด้าน i เฉพาะส่วน p (0–1) ให้ "งอก" ออกมา: ปกติจากปลายด้านจุดยอด (i+1)%3 ไปจุดยอด (i+2)%3 · rev = true กลับทาง · p ≥ 1 = ปกติ · p ≤ 0 = ซ่อนด้าน (เส้น+เรืองแสง) · ใช้ใน S.anim.run(…, t => w.grow(2, t))
  w.grow = (i, p, rev) => {
    const V = P(), a = V[(i + 1) % 3], b = V[(i + 2) % 3], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    [edge[i], glow[i]].forEach(l => {
      l.style.display = p <= 0.001 ? 'none' : '';
      if (p >= 1) { l.style.strokeDasharray = ''; l.style.strokeDashoffset = ''; }

  w.refresh = () => { if (!svg.isConnected) { w._dead = true; return; } paintText(); w.layout(); };
  if (dragList.length) {
    const pseudo = { xmin: -1e4, xmax: 1e4, ymin: -1e4, ymax: 1e4, ix: p => (p - ox) / sc, iy: p => (oy - p) / sc };
    let cur = null;
    const pick = pt => { let best = null, bd = 1e9; handles.forEach(h => { const v = P()[h.i], dd = Math.hypot(pt.px - v[0], pt.py - v[1]); if (dd < bd) { bd = dd; best = h.i; } }); return best; };
    const mv = pt => {
      if (cur === null) return;
      const sn = o.snap || 0, q = { x: sn ? Math.round(pt.rx / sn) * sn : pt.rx, y: sn ? Math.round(pt.ry / sn) * sn : pt.ry, rx: pt.rx, ry: pt.ry };
      if (o.onDrag) o.onDrag(q, cur, w); else { const np = w.pts; np[cur] = [q.x, q.y]; w.setVerts(np); }
    };
    svg.style.cursor = 'grab';
    plotPointer(svg, pseudo, { snap: 0, clamp: false, onDown: pt => { cur = pick(pt); mv(pt); }, onDrag: mv, onUp: () => { cur = null; } });
  }
  paintText(); w.layout();
  LIVE.push(w);
  return w;
}

//  ═══ BEGIN ชุดของกลางกลุ่มเมทริกซ์ ม.5 ═══  (docs/design-matrices.md §1.2)

// ───────── 17) จำนวนตรรกยะ ─────────
// Q(n, d) → { n, d } ตัดทอนเองแล้ว ส่วน d > 0 เสมอ (เครื่องหมายอยู่ที่ n) · Q(3) = 3 · Q(-6, 4) = −3/2
//   ทุกฟังก์ชัน q* และ m* รับ "เลขธรรมดา" แทน Q ได้ทุกที่ (แปลงเอง: เลขจำนวนเต็มแม่นยำ · ทศนิยมปัดที่ 6 ตำแหน่ง)

  const arcH = o.arc === true ? 40 : (o.arc || 0), rot = o.rotate || 0, r0 = o.from0 || 0;
  const place = p => { const x = fx + (tx_ - fx) * p, y = fy + (ty_ - fy) * p - arcH * Math.sin(Math.PI * p); c.style.left = x.toFixed(1) + 'px'; c.style.top = y.toFixed(1) + 'px'; c.style.transform = `translate(-50%,-50%) rotate(${(r0 + rot * p).toFixed(1)}deg)`; };
  place(0);
  setTimeout(() => { if (anim.dead && !o.keep && c.parentNode) c.remove(); }, ms + 80);
  return anim.run(ms, place, o.ease || EASE.inOut).then(() => { place(1); if (!o.keep) c.remove(); return c; });
}

// ───────── 22) ดีเทอร์มิแนนต์เป็นพื้นที่ ─────────
// makeDetArea(host, o) → w   กราฟ (Plot + plotPointer) · ลูกศร 2 เส้น = หลัก 2 หลักของ A = [a b; c d] → ลูกศรน้ำเงิน (a, c) · ลูกศรส้ม (b, d) · ลากหัวลูกศรได้ (ดูดจำนวนเต็ม −4..4)
//   สี่เหลี่ยมด้านขนานจากลูกศร 2 เส้นระบาย: det > 0 = ฟ้า · det < 0 = แดง + ป้าย "พลิกด้าน" · det = 0 → แบนเป็นเส้น + ป้าย "แบน! det = 0" · ป้ายพื้นที่ = det สด
//   ใต้กราฟ: A สด (matHtml) + บรรทัด det A = (a)(d) − (b)(c) = ค่า
//   o = { M: [[3, 1], [1, 2]] (เริ่มต้น · ต้อง 2×2) · k: true (ตัวเลื่อน k = 1..3 + ปุ่ม 1 2 3 → แสดงภาพ kA ซ้อน พื้นที่ k² เท่า · หัวลูกศรลากได้ ±4 เท่าเดิม แต่กราฟซูมออกตาม k: ±9 / ±15 / ±21)
//         inv: true (แสดงกล่อง A⁻¹ สด หรือ "ไม่มี A⁻¹" เมื่อ det = 0) · onChange: M => {} (ผู้ใช้ลาก) }
//   คืน w = { M (getter · array ของ Q), set(M), refresh() } · ลงทะเบียน LIVE · ⚠️ แทนที่เนื้อหาเดิมของ host
function makeDetArea(host, o) {
  o = o || {}; _tgPrune();
  const LIM = 4, RNGS = [9, 15, 21];                  // โหมด k: หัวลูกศรลากได้ ±4 · กราฟซูมออกตาม k (k = 1, 2, 3) เพื่อให้ kA ยังอยู่ในกรอบ
  let m = (o.M || [[3, 1], [1, 2]]).map(r => r.map(v => Math.round(qNum(v)))), kk = 1;
  const w = { _dead: false };
  Object.defineProperty(w, 'M', { get: () => _mQ(m) });
  host.innerHTML = `<div class="da-wrap"></div>`;
  const wrap = host.firstChild;
  wrap.innerHTML = `<div class="da-plot"></div>${o.k ? '<div class="slider-row da-k"><b><i>k</i> =</b><input type="range" min="1" max="3" step="1" value="1"><span class="slider-val"></span><span class="da-kc">' + [1, 2, 3].map(v => `<button type="button" class="chip da-kb" data-k="${v}">${v}</button>`).join('') + '</span></div>' : ''}<div class="da-read"></div>`;
  const box = wrap.querySelector('.da-plot'), rd = wrap.querySelector('.da-read');
  let pl, svg, dyn;
  const X = x => pl.X(x), Y = y => pl.Y(y);
  const arrow = (x1, y1, x2, y2, cls) => {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy); if (L < 1) return '';
    const ux = dx / L, uy = dy / L, hl_ = 13, nx = -uy * 6, ny = ux * 6, bx = x2 - ux * hl_, by = y2 - uy * hl_;
    return `<line class="pl-c ${cls}" style="stroke-width:3.4" x1="${x1}" y1="${y1}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}"/><polygon class="${cls.replace('s-', 'f-')}" points="${x2},${y2} ${(bx + nx).toFixed(1)},${(by + ny).toFixed(1)} ${(bx - nx).toFixed(1)},${(by - ny).toFixed(1)}"/>`;
  };
  let cur = null;
  const pickHead = pt => { const d1 = Math.hypot(pt.rx - m[0][0], pt.ry - m[1][0]), d2 = Math.hypot(pt.rx - m[0][1], pt.ry - m[1][1]); return d1 <= d2 ? 1 : 2; };
  const mv = pt => {
    if (!cur) return;
    const x = Math.max(-LIM, Math.min(LIM, Math.round(pt.rx))), y = Math.max(-LIM, Math.min(LIM, Math.round(pt.ry)));
    if (cur === 1) { if (m[0][0] === x && m[1][0] === y) return; m[0][0] = x; m[1][0] = y; } else { if (m[0][1] === x && m[1][1] === y) return; m[0][1] = x; m[1][1] = y; }
    paint(); if (o.onChange) o.onChange(w.M);
  };
  const mount = () => {                                   // สร้างกราฟ (ใหม่ทุกครั้งที่ k เปลี่ยน — ไม่เกิดระหว่างลากหัวลูกศร)
    const R = o.k ? RNGS[kk - 1] : 8, lx = o.k ? (R > 12 ? 6 : 3) : 2;
    pl = new Plot({ w: 480, h: 480, xmin: -R, xmax: R, ymin: -R, ymax: R, pad: 26, gx: R > 12 ? 3 : 1, gy: R > 12 ? 3 : 1, lx, ly: lx });
    box.innerHTML = pl.svg().replace(/<\/svg>$/, '<g class="da-dyn"></g></svg>');
    svg = box.querySelector('svg'); dyn = box.querySelector('.da-dyn');
    plotPointer(svg, pl, { snap: 0, clamp: false, onDown: pt => { cur = pickHead(pt); mv(pt); }, onDrag: mv, onUp: () => { cur = null; } });
    svg.style.cursor = 'grab';
  };
  const paint = () => {
    const a = m[0][0], b = m[0][1], c = m[1][0], d2 = m[1][1], det = a * d2 - b * c, k = kk;
    let g = '';
    const poly = (s, cls, extra) => `<polygon class="${cls}" ${extra || ''} points="${[[0, 0], [a * s, c * s], [(a + b) * s, (c + d2) * s], [b * s, d2 * s]].map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}"/>`;
    if (o.k && k > 1) g += poly(k, 'fa-green') + poly(k, 'da-edge s-green');
    if (det !== 0) g += poly(1, det > 0 ? 'fa-blue' : 'fa-red');
    g += poly(1, 'da-edge ' + (det > 0 ? 's-blue' : det < 0 ? 's-red' : 's-muted'), det === 0 ? 'style="stroke-dasharray:6 5"' : '');
    g += arrow(X(0), Y(0), X(a), Y(c), 's-blue') + arrow(X(0), Y(0), X(b), Y(d2), 's-orange');
    g += `<circle class="da-halo f-blue" cx="${X(a)}" cy="${Y(c)}" r="16"/><circle class="da-halo f-orange" cx="${X(b)}" cy="${Y(d2)}" r="16"/>`;
    g += `<circle class="pl-dot f-blue" cx="${X(a)}" cy="${Y(c)}" r="6.5"/><circle class="pl-dot f-orange" cx="${X(b)}" cy="${Y(d2)}" r="6.5"/>`;
    const lab = (x, y, cl, t) => `<text class="pl-lbl ${cl}" style="font-size:14px;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round" x="${X(x) + (x >= 0 ? 12 : -12)}" y="${Y(y) + (y >= 0 ? -10 : 20)}" text-anchor="${x >= 0 ? 'start' : 'end'}">${t}</text>`;
    g += lab(a, c, 'b', `(${mn(a)}, ${mn(c)})`) + lab(b, d2, 'o', `(${mn(b)}, ${mn(d2)})`);
    const cx_ = X((a + b) / 2), cy_ = Y((c + d2) / 2);
    const area = det === 0 ? tx(T('แบน! det = 0', 'Flat! det = 0')) : (det < 0 ? tx(T('พลิกด้าน ', 'Flipped ')) : '') + 'det = ' + mn(det);
    g += `<text class="pl-lbl ${det > 0 ? 'b' : 'r'}" style="font-size:15px;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round" x="${cx_}" y="${cy_ + 5}" text-anchor="middle">${det === 0 ? '' : area}</text>`;
    if (det === 0) g += `<text class="pl-lbl r" style="font-size:16px;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round" x="${X(0) + 14}" y="${Y(0) + 40}">${area}</text>`;
    dyn.innerHTML = g;
    const Aq = _mQ(m), inv = o.inv ? mInv(Aq) : null;
    let h = matHtml(Aq, { name: 'A' }) + `<span class="da-eq">det <i>A</i> = <i>ad</i> − <i>bc</i> = (${mn(a)})(${mn(d2)}) − (${mn(b)})(${mn(c)}) = <b class="${det === 0 ? 'da-zero' : ''}">${mn(det)}</b></span>`;
    if (o.k) h += `<span class="da-eq">det(<i>kA</i>) = <i>k</i><sup>2</sup> det <i>A</i> = ${k * k} × ${mn(det)} = <b>${mn(k * k * det)}</b></span>`;
    if (o.inv) h += inv ? `<span class="da-inv">${matHtml(inv, { name: 'A<sup>−1</sup>' })}</span>` : `<span class="da-inv da-none">${tx(T('ไม่มี A<sup>−1</sup> (เพราะ det = 0)', 'No A<sup>−1</sup> (because det = 0)'))}</span>`;
    rd.innerHTML = h;
    const kin = wrap.querySelector('.da-k input'); if (kin) { if (+kin.value !== k) kin.value = k; wrap.querySelector('.da-k .slider-val').textContent = k; wrap.querySelectorAll('.da-kb').forEach(bn => bn.classList.toggle('active', +bn.dataset.k === k)); }
  };
  const setK = v => { v = Math.max(1, Math.min(3, Math.round(+v) || 1)); if (v === kk) return; kk = v; mount(); paint(); };
  w.set = M => { m = M.map(r => r.map(v => Math.round(qNum(v)))); paint(); return w; };
  w.refresh = () => { if (!host.isConnected) { w._dead = true; return; } paint(); };
  const kin0 = wrap.querySelector('.da-k input');
  if (kin0) { kin0.oninput = () => setK(kin0.value); kin0.onchange = () => setK(kin0.value); wrap.querySelectorAll('.da-kb').forEach(bn => { bn.onclick = () => { kin0.value = bn.dataset.k; setK(bn.dataset.k); }; }); }
  mount();
  LIVE.push(w); paint();
  return w;
}
//  ═══ END ชุดของกลางกลุ่มเมทริกซ์ ม.5 ═══

// ════════════════════════════════════════════════════════════════════════════
//  ═══ BEGIN ชุดของกลางกลุ่มจำนวนเชิงซ้อน ม.5 ═══  (docs/design-complex-numbers.md §1.2)
//  ⚠️ เพิ่มท้ายไฟล์เท่านั้น — ห้ามแก้ของเดิมด้านบน (สื่อ 21 ชิ้นเดิมต้องไม่เปลี่ยน — มีแค่บล็อกนี้ที่เพิ่ม)
//  ใช้ของกลางเมทริกซ์ (Q, qAdd…, qHtml, _qTxt) กับของกลางตรีโกณ (rad, _tgPrune) ที่อยู่ด้านบน
//  ชื่อ const/function ระดับบนสุดที่เพิ่ม: Cx cxAdd cxSub cxMul cxDiv cxNeg cxConj cxEq cxAbs2 cxPow cxHtml cxText makeCStepper makeCPlane cisHtml
//     cxI cxRt (ค่าคงที่ i · เครื่องหมายรากสำหรับสมการตัวโต) (+ ตัวช่วยภายใน _toC _cx… _CX_CLS)
//  คลาส CSS ที่เพิ่ม (base.css ท้ายไฟล์): .cx-stp .cx-out .cx-grp .cx-k .cx-v · .cx-i (i ตัวเอียงเว้นขวา) · .cx-rt .cx-ri (รากสองแบบวาดเอง) · .cp-wrap .cp-lbl .cp-halo · .cx-bar (เส้นขีดบน z̄: <span class="cx-bar"><i>z</i></span>)
//
//  23) Cx / cxAdd … cxPow       จำนวนเชิงซ้อนแม่นยำ (ส่วนจริง/จินตภาพเป็น Q)
//  24) cxHtml / cxText          เขียน a + bi เป็น HTML / ข้อความธรรมดา
//  25) makeCStepper(host, z, o) แถว −/+ ของ a และ b → "z = a + bi" สด
//  26) makeCPlane(host, o)      ระนาบเชิงซ้อน: จุดลากได้ + ลูกศร + ป้าย HTML บนพื้นทึบ + arc / circle / arrow
//  27) cisHtml(r, k, n, o)      "r cis kπ/n"  /  "r(cos θ + i sin θ)"
// ════════════════════════════════════════════════════════════════════════════

// ───────── 22b) i และเครื่องหมายราก ─────────
// cxI = '<i class="cx-i">i</i>' — หน่วยจินตภาพ i ตัวเอียงที่เว้นขวานิดหน่อย (i ไม่ชนตัวยก i² หรือวงเล็บ "i)") · ใช้ทุกที่ที่ต้องเขียน i ใน HTML (cxHtml ใช้ตัวนี้)
// cxRt(h) → รากที่สองสำหรับสมการตัวโต/ใน .cb-big: เครื่องหมาย √ เป็น SVG ยืดตามความสูงของเส้นขีดบน ปลายบนของ √ ต่อกับปลายซ้ายของเส้นขีดพอดี (ไม่ลอยแยก ไม่ขึ้นกับ line-height)
//   cxRt('−9') → √(−9) แบบเส้นขีดบน · ในร้อยแก้ว/คำบรรยาย/ตัวเลือกใช้ข้อความธรรมดา √(−9) ตามเดิม
const cxI = '<i class="cx-i">i</i>';
const cxRt = h => `<span class="cx-rt"><svg viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0.6 13 L2.8 11.4 L5.2 18.6 L10 1.1"/></svg><span class="cx-ri">${h}</span></span>`;

// ───────── 23) จำนวนเชิงซ้อน ─────────
// Cx(re, im) → { re: Q, im: Q }   รับ "เลขธรรมดา" หรือ Q ได้ทั้งสองช่อง (แปลงเอง · ทศนิยมปัดที่ 6 ตำแหน่ง) · Cx(3) = 3 + 0i · Cx(z) = z (ส่ง Cx เข้ามาคืนตัวเดิม)
//   ทุกฟังก์ชัน cx* รับ "เลขธรรมดา / Q / Cx" แทน Cx ได้ทุกที่ (เลขธรรมดา = ส่วนจริงอย่างเดียว) และคืน Cx ใหม่ (ไม่แก้ตัวที่ส่งเข้ามา)
//   cxAdd(a, b) cxSub(a, b) cxMul(a, b) · cxDiv(a, b) (b = 0 → throw) · cxNeg(a) = −a · cxConj(a) = สังยุค a − bi · cxEq(a, b) → boolean
//   cxAbs2(z) → Q ของ a² + b² (กำลังสองของ |z| — ใช้แทน |z| จะได้ไม่ติดราก) · cxPow(z, n) n เต็ม ≥ 0 (n = 0 → 1 · n ติดลบ/ไม่เต็ม → throw)
//   ตัวอย่าง: cxMul(Cx(1, 2), Cx(3, -5)) = 13 + 1i · cxDiv(Cx(5, 5), Cx(1, 2)) = 3 − i · cxPow(Cx(2, -1), 2) = 3 − 4i
//   อ่านค่า: z.re / z.im เป็น Q → qHtml(z.re) · qNum(z.re) (ทศนิยม ไว้เทียบ/วาด ห้ามไว้คำนวณต่อ) · qEq(z.im, 0)
function Cx(re, im) {
  if (re && re._c) return re;
  return { re: _toQ(re === undefined ? 0 : re), im: _toQ(im === undefined ? 0 : im), _c: true };
}
const _toC = x => (x && x._c) ? x : Cx(x, 0);
const cxAdd = (a, b) => { a = _toC(a); b = _toC(b); return Cx(qAdd(a.re, b.re), qAdd(a.im, b.im)); };
const cxSub = (a, b) => { a = _toC(a); b = _toC(b); return Cx(qSub(a.re, b.re), qSub(a.im, b.im)); };
const cxMul = (a, b) => { a = _toC(a); b = _toC(b); return Cx(qSub(qMul(a.re, b.re), qMul(a.im, b.im)), qAdd(qMul(a.re, b.im), qMul(a.im, b.re))); };
const cxNeg = a => { a = _toC(a); return Cx(qNeg(a.re), qNeg(a.im)); };
const cxConj = a => { a = _toC(a); return Cx(a.re, qNeg(a.im)); };
const cxEq = (a, b) => { a = _toC(a); b = _toC(b); return qEq(a.re, b.re) && qEq(a.im, b.im); };
const cxAbs2 = z => { z = _toC(z); return qAdd(qMul(z.re, z.re), qMul(z.im, z.im)); };
function cxDiv(a, b) {
  a = _toC(a); b = _toC(b);
  const d0 = cxAbs2(b);
  if (qIsZero(d0)) throw new Error('cxDiv: หารด้วย 0');
  const n = cxMul(a, cxConj(b));
  return Cx(qDiv(n.re, d0), qDiv(n.im, d0));
}
function cxPow(z, n) {
  if (!Number.isInteger(n) || n < 0) throw new Error('cxPow: n ต้องเป็นจำนวนเต็ม ≥ 0');
  let r = Cx(1, 0); z = _toC(z);
  for (let k = 0; k < n; k++) r = cxMul(r, z);
  return r;
}

// ───────── 24) เขียน a + bi ─────────
// cxHtml(z, o) → HTML ก้อน mx เดียว (ไม่ตัดบรรทัด) · i เป็นตัวเอียง · เครื่องหมาย + − เว้นวรรครอบ · ลบเป็น "−" (U+2212)
//   Cx(3, -4) → 3 − 4i · Cx(0, -1) → −i · Cx(0, 3) → 3i · Cx(5, 0) → 5 · Cx(Q(13, 34), Q(1, 34)) → 13/34 + 1/34 i (เศษส่วนบน/ล่าง) · 1i เขียน "i" ไม่ใช่ "1i"
//   o.paren: true → ใส่วงเล็บเมื่อมี 2 พจน์ (a + bi) (พจน์เดียวไม่ใส่) · o.var: 'z₁' → นำหน้า "z₁ = " (ตัวแรกที่เป็นตัวอักษรถูกทำเอียงเอง ในก้อนเดียวกัน)
//   ⚠️ ส่วนจินตภาพเป็นรากไม่ได้ (Cx เป็น Q) — "√19 i" ให้เขียนสตริงเองในไฟล์ lesson (เว้นวรรค √19 i)
// cxText(z, o) → ข้อความธรรมดาไว้ใส่ aria / <text> ใน SVG: "3 − 4i" · เศษส่วน "13/34 + (1/34)i" · o.var / o.paren เหมือนกัน
const _cxAbsQ = q => (q.n < 0 ? qNeg(q) : q);
function cxHtml(z, o) {
  o = o || {}; z = _toC(z);
  const a = z.re, b = z.im, az = qIsZero(a), bz = qIsZero(b), ib = q => (qEq(q, 1) ? '' : qHtml(q)) + cxI;
  let s;
  if (bz) s = qHtml(a);
  else if (az) s = (b.n < 0 ? '−' : '') + ib(_cxAbsQ(b));
  else s = qHtml(a) + (b.n < 0 ? ' − ' : ' + ') + ib(_cxAbsQ(b));
  if (o.paren && !az && !bz) s = '(' + s + ')';
  if (o.var) s = o.var.replace(/^([A-Za-z])/, '<i>$1</i>') + ' = ' + s;
  return mx(s);
}
function cxText(z, o) {
  o = o || {}; z = _toC(z);
  const a = z.re, b = z.im, az = qIsZero(a), bz = qIsZero(b);
  const ib = q => (qEq(q, 1) ? '' : (q.d === 1 ? String(q.n) : '(' + _qTxt(q) + ')')) + 'i';
  let s;
  if (bz) s = _qTxt(a);
  else if (az) s = (b.n < 0 ? '−' : '') + ib(_cxAbsQ(b));
  else s = _qTxt(a) + (b.n < 0 ? ' − ' : ' + ') + ib(_cxAbsQ(b));
  if (o.paren && !az && !bz) s = '(' + s + ')';
  if (o.var) s = o.var + ' = ' + s;
  return s;
}

// ───────── 25) ตัวปรับ a, b ─────────
// makeCStepper(host, z, o) → w     ⚠️ แทนที่เนื้อหาเดิมของ host ทั้งหมด · แถว [a − 3 +] [b − 5 +] ใต้บรรทัดโตตรงกลาง "z = a + bi" (เปลี่ยนสดทุกครั้งที่กด)
//   z = Cx เริ่มต้น (a, b ปัดเป็นจำนวนเต็ม — ตัวปรับเดินทีละ 1)
//   o = { name: 'z₁' (ชื่อที่ขึ้นหน้า "z₁ = " · ค่าเริ่ม 'z') · cls: 'b' (น้ำเงิน · ค่าเริ่ม) | 'o' (ส้ม) · min: −9, max: 9 (ช่วงของ a และ b)

function makeCPlane(host, o) {
  o = o || {}; _tgPrune();
  const R = o.range || 6, W = 460, H = 460, pad = 30, tick = o.tick || (R > 8 ? 2 : 1);
  const pl = new Plot({ w: W, h: H, xmin: -R, xmax: R, ymin: -R, ymax: R, pad, gx: 1, gy: 1, lx: 1000, ly: 1000 });

  const wrap = host.querySelector('.cp-wrap'), svg = wrap.querySelector('svg'), gx = svg.querySelector('.cp-x'), gp = svg.querySelector('.cp-p');
  const pts = (o.points || []).map(p => ({ id: p.id, z: Cx(p.z), cls: p.cls || 'b', label: p.label, drag: !!p.drag, arrow: !!p.arrow, snap: p.snap === undefined ? 1 : p.snap, guide: !!p.guide }));

        cx = px + u[0] * d0 + Math.sign(u[0]) * bw / 2 * Math.min(1, Math.abs(u[0]) * 2.2);

  // ลากจุด
  const drags = pts.filter(p => p.drag);
  if (drags.length) {

      let best = null, bd = 1e9;

async function dpTyFly(S, idxs) {

}

// แผนภูมิเชิงคุณภาพ: กรุ๊ปเลือด 40 คน
const BLOOD = [['A', 12], ['B', 10], ['O', 14], ['AB', 4]], BLOOD_N = 40;
const BLOOD_ANG = BLOOD.map(b => b[1] * 360 / BLOOD_N);
function dpQualChart(host) {
  const w = { mode: 'bar' };
  const bar = () => {
    const W = 560, H = 330, ML = 50, MR = 14, MT = 18, MB = 44, pw = W - ML - MR, ph = H - MT - MB, ymax = 16, Y = v => MT + ph - v / ymax * ph;
    let s = `<svg viewBox="0 0 ${W} ${H}">`;
    for (let v = 0; v <= ymax; v += 4) s += `<line class="gr" x1="${ML}" y1="${Y(v)}" x2="${W - MR}" y2="${Y(v)}"/><text class="tk" x="${ML - 8}" y="${Y(v) + 5}" text-anchor="end">${v}</text>`;
    s += `<line class="ax" x1="${ML}" y1="${Y(0)}" x2="${W - MR}" y2="${Y(0)}"/><line class="ax" x1="${ML}" y1="${Y(0)}" x2="${ML}" y2="${MT - 4}"/>`;
    const slot = pw / BLOOD.length, bw = 70;
    BLOOD.forEach((b, i) => {
      const x = ML + slot * i + (slot - bw) / 2, y = Y(b[1]);
      s += `<g><rect class="bar" x="${x}" y="${y}" width="${bw}" height="${Y(0) - y}"/></g>`;
      s += `<g class="lb"><rect x="${x + bw / 2 - 20}" y="${y - 31}" width="40" height="26" rx="6"/><text x="${x + bw / 2}" y="${y - 12}" text-anchor="middle" font-size="17">${b[1]}</text></g>`;
      s += `<text x="${x + bw / 2}" y="${H - 14}" text-anchor="middle" font-size="18">${b[0]}</text>`;
    });
    return s + '</svg>';
  };
  const pie = () => {
    const W = 360, c = 180, r = 150, P = (a, rr) => [c + rr * Math.cos((a - 90) * Math.PI / 180), c + rr * Math.sin((a - 90) * Math.PI / 180)];
    let s = `<svg viewBox="0 0 ${W} ${W}">`, a0 = 0;
    BLOOD.forEach((b, i) => {
      const a1 = a0 + BLOOD_ANG[i], p0 = P(a0, r), p1 = P(a1, r), m = P((a0 + a1) / 2, i === 3 ? r * .8 : r * .6);
      s += `<g class="dp-c${i}"><path class="sl" d="M${c} ${c} L${p0[0].toFixed(2)} ${p0[1].toFixed(2)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${p1[0].toFixed(2)} ${p1[1].toFixed(2)} Z"/></g>`;
      s += `<g class="lb"><rect x="${(m[0] - 19).toFixed(1)}" y="${(m[1] - 14).toFixed(1)}" width="38" height="28" rx="6"/><text x="${m[0].toFixed(1)}" y="${(m[1] + 6).toFixed(1)}" text-anchor="middle" font-size="18">${b[0]}</text></g>`;
      a0 = a1;
    });
    return s + '</svg>';
  };
  const eqs = () => BLOOD.map((b, i) => `<div class="dp-eq dp-c${i}"><span class="dp-sw8"></span>${mx(`<b>${b[0]}</b> : ${frac(dpNb(b[1]), dpNb(BLOOD_N))} × 360° = <b class="dp-g">${BLOOD_ANG[i]}°</b>`)}</div>`).join('');
  const draw = () => {
    host.innerHTML = `<div class="chips dp-sw"><button class="chip${w.mode === 'bar' ? ' active' : ''}" data-m="bar">${tx(T('แผนภูมิแท่ง', 'Bar chart'))}</button><button class="chip${w.mode === 'pie' ? ' active' : ''}" data-m="pie">${tx(T('แผนภูมิวงกลม', 'Pie chart'))}</button></div>` +
      `<div class="dp-sm">${tx(T('กรุ๊ปเลือดของนักเรียน 40 คน (จำนวนคน)', 'Blood groups of 40 students (number of students)'))}</div>` +
      `<div class="dp-chart ${w.mode}">${w.mode === 'bar' ? bar() : pie()}</div>` +
      (w.mode === 'pie' ? `<div class="dp-sm">${tx(T(`มุมของแต่ละชิ้น = ${mx(frac('ความถี่', '40'))} × 360°`, `Angle of each slice = ${mx(frac('frequency', '40'))} × 360°`))}</div><div class="dp-eqs">${eqs()}</div>` : `<div class="dp-sm">${tx(T('แท่งแยกกัน มีช่องว่างระหว่างแท่ง เพราะแต่ละหมวดเป็นคนละกลุ่ม', 'The bars are separate, with gaps, because each category is its own group'))}</div>`);
    host.querySelectorAll('.chip').forEach(b => { b.onclick = () => { w.mode = b.dataset.m; draw(); }; });
  };
  w.refresh = () => { if (!host.isConnected) return; draw(); };
  draw(); LIVE.push(w);
  return w;
}

// ═══════ ชุด ก: ทำไมต้องจัดชั้น (คะแนน 60 คน แต่งใหม่ สร้างด้วย seed คงที่) ═══════
const WY_TARGET = [3, 7, 14, 17, 12, 7];
const WY_DATA = (() => {
  let s = 20261101; const rnd = () => (s = (s * 48271) % 2147483647) / 2147483647;
  const v = []; F20C.forEach((c, i) => { for (let n = 0; n < WY_TARGET[i]; n++) v.push(c[0] + Math.floor(rnd() * (c[1] - c[0] + 1))); });
  for (let i = v.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [v[i], v[j]] = [v[j], v[i]]; }
  return v;
})();
const WY_F = dpCount(F20C, WY_DATA);

function makeDpHgTry(host) {

  const draw = () => {
    host.innerHTML = `<div class="chips dp-sw">${[['bar', T('ฮิสโทแกรม', 'Histogram')], ['polygon', T('หลายเหลี่ยม', 'Polygon')], ['ogive', T('โอไจฟ์', 'Ogive')]].map(m => `<button class="chip${w.mode === m[0] ? ' active' : ''}" data-m="${m[0]}">${tx(m[1])}</button>`).join('')}</div>` +
      `<div class="dp-slg">${F20C.map((c, i) => `<label class="dp-slr"><span>${c[0]} – ${c[1]}</span><input type="range" min="0" max="8" step="1" value="${w.f[i]}" data-i="${i}"><b>${w.f[i]}</b></label>`).join('')}</div><div class="dp-hgh"></div><div class="dp-inf"></div>`;
    dpQ(host, '.dp-inf').innerHTML = info(); paintHist();
    host.querySelectorAll('.chip').forEach(b => { b.onclick = () => { w.mode = b.dataset.m; draw(); }; });
    host.querySelectorAll('input').forEach(inp => {
      inp.oninput = () => {
        const i = +inp.dataset.i; w.f[i] = +inp.value; inp.nextElementSibling.textContent = w.f[i];

        const N = w.f.reduce((a, b) => a + b, 0);

async function dpSortLeaves(S) {

  info.forEach(i => { i.d = i.ls.map((l, k) => i.from[k] - l.getBoundingClientRect().left); });

      const fg = rgbOf(getComputedStyle(el).fill);
      if (!fg) continue;
      const hsl = toHsl(fg[0], fg[1], fg[2]);
      if (hsl[1] > .3 || hsl[2] < .3 || hsl[2] > .8) continue;
      const bg = bgBehind(el.ownerSVGElement || el);
      if (!bg || contrast(fg, bg) >= 3.2) continue;
      el.setAttribute('data-dk-sf', el.style.fill || '');
      el.style.fill = readable(fg, bg);
    }
  }
  let queued = false;
  const mo = new MutationObserver(schedule);
  function watch() { mo.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['fill', 'stroke', 'style'] }); }
  function schedule() { if (queued) return; queued = true; setTimeout(() => { queued = false; mo.disconnect(); adapt(); watch(); }, 30); }
  new MutationObserver(schedule).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  watch(); schedule();
})();
syncThemeButton();
new MutationObserver(syncThemeButton).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
// แถบแท็บบนจอแคบเลื่อนซ้าย-ขวาได้: กดแท็บแล้วเลื่อนปุ่มนั้นมาให้เห็นทั้งปุ่ม
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('nav .tab-btn');
  if (b && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
});
</script>
