  el.className = 'tl-row cl-' + (CL[o.cls || 'b'] || o.cls); el.style.setProperty('--tl', (o.size || 38) + 'px');
  el.tiles = [];
  for (let i = 0; i < n; i++) {
    const t = document.createElement('span'); t.className = 'tl-tile'; t.innerHTML = mx(base);
    el.appendChild(t); el.tiles.push(t);
    if (gaps.includes(i + 1) && i + 1 < n) { const g = document.createElement('span'); g.className = 'tl-gap'; el.appendChild(g); }
  }
  if (o.label) { const l = document.createElement('span'); l.className = 'tl-label'; l.innerHTML = o.label; el.appendChild(l); }
  return el;
}
tileRow.html = (base, n, o) => tileRow(base, n, o).outerHTML;

// ════════════════════════════════════════════════════════════════════════════
//  ชุดของกลางเพิ่มสำหรับกลุ่ม "ตรีโกณมิติ ม.5" (docs/design-trigonometry.md §1.2)
//  ⚠️ เพิ่มท้ายไฟล์เท่านั้น — ห้ามแก้ของเดิมด้านบน (สื่อ 11 ชิ้นเดิมต้องไม่เปลี่ยน)
//  ชื่อ const/function ระดับบนสุดที่เพิ่ม: rad radDeg radText radAuto piFrac piTicks exactVal exactPlain makeUnitCircle makeTriangle (+ _tg… _TG_…)
//
//   12) rad / radDeg / radText / radAuto / piFrac   ป้ายมุมแบบ kπ/n (HTML เศษส่วนบน/ล่าง · ข้อความธรรมดาสำหรับ SVG)
//   13) piTicks()                                    ป้ายแกน x เป็นพหุคูณ π ลง Plot
//   14) exactVal() / exactPlain()                    ค่าแม่นของ sin cos tan csc sec cot ที่มุม kπ/n (n = 1, 2, 3, 4, 6)
//   15) makeUnitCircle()                             วงกลมหนึ่งหน่วย + จุด P ลากได้
//   16) makeTriangle()                               สามเหลี่ยม SVG ป้ายด้าน/มุม ไฮไลต์ ลากจุดยอด
// ════════════════════════════════════════════════════════════════════════════

// ───────── 12) ป้ายมุม kπ/n ─────────
const _tgGcd = (a, b) => b ? _tgGcd(b, a % b) : Math.abs(a);
// ลดทอน k/n → { k, n } (n > 0, เครื่องหมายอยู่ที่ k)
function _tgRed(k, n) { n = n === undefined ? 1 : n; if (n < 0) { k = -k; n = -n; } const g = _tgGcd(k, n) || 1; return { k: k / g, n: n / g }; }
// rad(k, n) → ป้ายมุม kπ/n เป็น HTML (ก้อน mx เดียว ไม่ตัดบรรทัด) · ตัดทอนเศษส่วนเอง
//   rad(1, 6) = π/6 (เศษส่วนบน/ล่าง) · rad(5, 6) = 5π/6 · rad(1) = π · rad(2) = 2π · rad(0) = 0 · rad(-1, 3) = −π/3 · rad(2, 4) = π/2
//   ใช้ได้ทั้งในร้อยแก้ว/คำบรรยายฉาก/ตัวเลือก quiz/ชิป/.formula  (ใน SVG ใช้ radText ไม่ใช่ตัวนี้ — HTML ใส่ใน <text> ไม่ได้)
function rad(k, n) {
  const r = _tgRed(k, n);
  if (r.k === 0) return mx('0');
  const a = Math.abs(r.k), top = (a === 1 ? '' : a) + 'π';
  return mx((r.k < 0 ? '−' : '') + (r.n === 1 ? top : frac(top, r.n)));
}
// radText(k, n) → ข้อความธรรมดา "5π/6" "−π/3" "2π" "0" — ไว้ใส่ <text> ใน SVG / title / aria
function radText(k, n) {
  const r = _tgRed(k, n);
  if (r.k === 0) return '0';
  const a = Math.abs(r.k);
  return (r.k < 0 ? '−' : '') + (a === 1 ? '' : a) + 'π' + (r.n === 1 ? '' : '/' + r.n);
}
const _tgDeg = (k, n) => mn(Math.round(k * 180 / (n === undefined ? 1 : n) * 1000) / 1000) + '°';
// radDeg(k, n) → rad(k, n) + " (30°)"  องศาคำนวณเอง · ใช้ทั้งชิ้น ① (ยังไม่นิยามเรเดียน เขียนคู่กันเสมอ)   radDeg(1, 6) = π/6 (30°) · radDeg(2, 3) = 2π/3 (120°)
const radDeg = (k, n) => mx(rad(k, n) + ' (' + _tgDeg(k, n) + ')');
// piFrac(theta) → { k, n } ถ้า theta (เรเดียน) เป็นพหุคูณตรรกยะของ π ที่ n ∈ 1, 2, 3, 4, 6, 8, 12 (ตัดทอนแล้ว) · ไม่ใช่ → null
function piFrac(theta) {
  for (const n of [1, 2, 3, 4, 6, 8, 12]) { const v = theta / Math.PI * n; if (Math.abs(v - Math.round(v)) < 1e-6) return _tgRed(Math.round(v), n); }
  return null;
}
// radAuto(theta, o) → ป้ายมุมจากค่าเรเดียนจริง (เช่นมุมที่ลาก): เป็นพหุคูณ π → rad() (o.deg = true → radDeg()) · ไม่ใช่ → ทศนิยม "1.234 rad"
function radAuto(theta, o) {
  o = o || {}; const f = piFrac(theta);
  if (f) return o.deg ? radDeg(f.k, f.n) : rad(f.k, f.n);
  return mx(mn(Math.round(theta * 1000) / 1000) + ' rad' + (o.deg ? ' (' + mn(Math.round(theta * 180 / Math.PI * 10) / 10) + '°)' : ''));
}

// ───────── 13) ป้ายแกน x เป็นพหุคูณ π ─────────
// piTicks(plot, step, o) → plot   เรียกก่อน plot.svg()  ·  step = ระยะป้าย (เรเดียน เช่น Math.PI / 2) ต้องเป็นพหุคูณตรรกยะของ π (mπ/n, n ≤ 12)
//   o = { every: 1 (ป้ายทุก k ช่อง) · size: 13 (px) · dy: 17 (ระยะป้ายใต้แกน) · ticks: true (ขีดสั้นบนแกน) · cls: 'pl-tick' }
//   ข้ามป้าย 0 (เหมือนเลขแกนปกติ) · ป้ายเป็นข้อความ SVG ("π/2", "3π/2", "−π") ไม่ใช่ HTML
//   ⚠️ ปิดเลขแกน x เดิมของ Plot ด้วย lx ใหญ่ๆ:  const pl = new Plot({ xmin: -2 * Math.PI, xmax: 2 * Math.PI, gx: Math.PI / 2, lx: 100, … }); piTicks(pl, Math.PI / 2); … pl.svg()
//      (gx = ระยะเส้นกริด · lx = ระยะเลขแกนเดิม — lx: 100 = ไม่มีเลขเดิมเลย)  · ห้ามแก้ class Plot
function piTicks(plot, step, o) {
  o = o || {};
  const ratio = step / Math.PI; let d = 0, nn = 0;
  for (let q = 1; q <= 12; q++) { const p = ratio * q; if (Math.abs(p - Math.round(p)) < 1e-6) { d = q; nn = Math.round(p); break; } }
  if (!d) return plot;
  const y0 = Math.min(Math.max(0, plot.ymin), plot.ymax), every = o.every || 1, size = o.size || 13, dy = o.dy === undefined ? 17 : o.dy;
  let s = '';
  for (let m = Math.ceil(plot.xmin / step - 1e-9); m <= Math.floor(plot.xmax / step + 1e-9); m++) {
    if (m === 0 || m % every !== 0) continue;
    const px = plot.X(m * step), py = plot.Y(y0);
    if (o.ticks !== false) s += `<line class="pl-axis" x1="${px}" y1="${py - 4}" x2="${px}" y2="${py + 4}"/>`;
    const edge = Math.abs(m * step - plot.xmax) < 1e-6;   // ป้ายที่ขอบขวาสุดชิดซ้ายของขอบ ไม่ชนตัวอักษร x ปลายแกน
    s += `<text class="${o.cls || 'pl-tick'}" style="font-size:${size}px" x="${edge ? px + 2 : px}" y="${py + dy}" text-anchor="${edge ? 'end' : 'middle'}">${radText(m * nn, d)}</text>`;
  }
  return plot.raw(s, true);
}

// ───────── 14) ค่าแม่นของฟังก์ชันตรีโกณ ─────────
// ตารางที่มุมอ้างอิง 0° 30° 45° 60° 90°: [สปส.เศษ, รากในเศษ, สปส.ส่วน, รากในส่วน] (0 = [0]) · null = หาค่าไม่ได้
// ⚠️ tan 30° = 1/√3 ตามสรุปครู (ไม่ใช่ √3/3)
const _TG_EX = {
  sin: { 0: [0], 30: [1, 1, 2, 1], 45: [1, 2, 2, 1], 60: [1, 3, 2, 1], 90: [1, 1, 1, 1] },
  cos: { 0: [1, 1, 1, 1], 30: [1, 3, 2, 1], 45: [1, 2, 2, 1], 60: [1, 1, 2, 1], 90: [0] },
  tan: { 0: [0], 30: [1, 1, 1, 3], 45: [1, 1, 1, 1], 60: [1, 3, 1, 1], 90: null },
  csc: { 0: null, 30: [2, 1, 1, 1], 45: [1, 2, 1, 1], 60: [2, 1, 1, 3], 90: [1, 1, 1, 1] },
  sec: { 0: [1, 1, 1, 1], 30: [2, 1, 1, 3], 45: [1, 2, 1, 1], 60: [2, 1, 1, 1], 90: null },
  cot: { 0: null, 30: [1, 3, 1, 1], 45: [1, 1, 1, 1], 60: [1, 1, 1, 3], 90: [0] }
};
// → { v: [..] | null (หาค่าไม่ได้), neg } หรือ undefined (มุมที่ไม่รองรับ)
function _tgExact(fn, k, n) {
  const d0 = k * 180 / (n === undefined ? 1 : n), deg = Math.round(d0);
  if (!_TG_EX[fn] || Math.abs(d0 - deg) > 1e-9 || (deg % 30 !== 0 && deg % 45 !== 0)) return undefined;
  const a = ((deg % 360) + 360) % 360; let ref, sS, cS;
  if (a <= 90) { ref = a; sS = 1; cS = 1; } else if (a <= 180) { ref = 180 - a; sS = 1; cS = -1; } else if (a <= 270) { ref = a - 180; sS = -1; cS = -1; } else { ref = 360 - a; sS = -1; cS = 1; }
  const v = _TG_EX[fn][ref], sg = { sin: sS, cos: cS, tan: sS * cS, csc: sS, sec: cS, cot: sS * cS }[fn];
  return { v, neg: !!v && v[0] !== 0 && sg < 0 };
}
function _tgFmt(v, plain) {
  if (v[0] === 0) return '0';
  const part = (a, b) => (a > 1 || b === 1 ? a : '') + (b > 1 ? (plain ? '√' + b : `<span style="line-height:1.2">${rt(b)}</span>`) : '');   // line-height 1.2: ขีดบนรากไม่ลอยในบรรทัดที่สูง
  const num = part(v[0], v[1]);
  if (v[2] === 1 && v[3] === 1) return num;
  return plain ? num + '/' + part(v[2], v[3]) : frac(num, part(v[2], v[3]));
}
// exactVal(fn, k, n) → ค่าแม่นของ fn ('sin' | 'cos' | 'tan' | 'csc' | 'sec' | 'cot') ที่มุม kπ/n เป็น HTML ก้อน mx เดียว
//   n ∈ 1, 2, 3, 4, 6 (k เป็นจำนวนเต็มใดก็ได้ รวมมุมลบ/เกินรอบ — หาจตุภาคและมุมอ้างอิงให้เอง)
//   exactVal('sin', 1, 6) = ½ · exactVal('cos', 1, 6) = √3/2 · exactVal('cos', 3, 4) = −√2/2 · exactVal('tan', 1, 3) = √3 · exactVal('tan', 5, 6) = −1/√3 ·
//   exactVal('tan', 1, 6) = 1/√3 (ตามสรุปครู ไม่ใช่ √3/3) · exactVal('tan', 1, 2) = "หาค่าไม่ได้" / "undefined" (ตามภาษาปัจจุบัน และตัวสลับภาษาเปลี่ยนให้เอง) · exactVal('csc', 1, 3) = 2/√3
//   มุมที่ไม่รองรับ (เช่น π/12) → ทศนิยม 3 ตำแหน่ง (ไม่ error)
//   ใช้สร้างตาราง/เฉลย/ป้ายสด จะได้ไม่พิมพ์ค่าผิด — เทียบเลขได้ด้วย Math.sin(k * Math.PI / n)

  if (!e.v) { const th = 'หาค่าไม่ได้', en = 'undefined'; return mx(`<span data-th="${th}" data-en="${en}">${EN() ? en : th}</span>`); }
  return mx((e.neg ? '−' : '') + _tgFmt(e.v, false));
}
// exactPlain(fn, k, n) → เหมือน exactVal แต่เป็นข้อความธรรมดา ("√3/2", "−1/2", "1/√3") ไว้ใส่ <text> ใน SVG · หาค่าไม่ได้ → ตามภาษาปัจจุบัน
function exactPlain(fn, k, n) {
  n = n === undefined ? 1 : n;
  const e = _tgExact(fn, k, n);
  if (!e) { const x = Math[fn] ? Math[fn](k * Math.PI / n) : NaN; return isFinite(x) ? mn(Math.round(x * 1000) / 1000) : 'undefined'; }
  if (!e.v) return EN() ? 'undefined' : 'หาค่าไม่ได้';

}

// ───────── ตัวช่วยร่วมของ makeUnitCircle / makeTriangle ─────────
// ลบวิดเจ็ตที่ host หายไปจาก DOM ออกจาก LIVE (วิดเจ็ตที่สร้างใน makeScenes ถูกสร้างใหม่ทุกครั้งที่วาดฉาก)
// ตัด widget ที่ตายแล้วออกจาก LIVE — เลื่อนไปทำหลังงานปัจจุบันจบ (microtask) เพราะ makeUnitCircle/makeTriangle อาจถูกเรียกระหว่าง
// applyLang กำลัง LIVE.forEach อยู่ (refresh วาดฉากใหม่) — splice ตอนนั้นทำให้ widget ตัวถัดไปถูกข้าม ภาษาไม่เปลี่ยน
let _tgPruneQ = false;
function _tgPrune() {
  if (_tgPruneQ) return; _tgPruneQ = true;
  queueMicrotask(() => { _tgPruneQ = false; for (let i = LIVE.length - 1; i >= 0; i--) if (LIVE[i]._dead) LIVE.splice(i, 1); });
}
const _TG_TXT = { blue: 'b', orange: 'o', green: 'g', purple: 'p', pink: 'p', red: 'r', teal: 'g' };   // สี → คลาสป้าย .pl-lbl.*

// ───────── 15) วงกลมหนึ่งหน่วย ─────────
// makeUnitCircle(host, o) → w     วาด SVG วงกลมหนึ่งหน่วย (แกน x, y + ป้าย (1,0) (0,1) (−1,0) (0,−1)) + จุด P ลากได้ + ที่แสดงตาม o.show   ⚠️ แทนที่เนื้อหาเดิมของ host ทั้งหมด
//   o = {
//     theta: 0                 มุมเริ่มต้น (เรเดียน)
//     snap: 0                  ดูดมุมตอนลาก (เรเดียน เช่น Math.PI / 12 · 0 = อิสระ)

  const arcEl = [0, 1, 2].map(() => mk('path', { class: 'tr-arc' })), rmark = mk('path', { class: 'tr-right' });

      if (i === o.right) rmark.setAttribute('d', `M${f1(v[0] + u1[0] * 15)} ${f1(v[1] + u1[1] * 15)} L${f1(v[0] + (u1[0] + u2[0]) * 15)} ${f1(v[1] + (u1[1] + u2[1]) * 15)} L${f1(v[0] + u2[0] * 15)} ${f1(v[1] + u2[1] * 15)}`);
    }

  };

  w.setVerts = np => { pts = np.map(p => p.slice()); w.layout(); if (o.onChange) o.onChange(w.pts); return w; };

    const set = (k, i) => { if (k === 's') sLab[i].style.opacity = op; else { aLab[i].style.opacity = op; arcEl[i].style.opacity = op; } };

    else { arcEl[i].setAttribute('class', 'tr-arc' + (c ? ' hl ' + c : '')); aLab[i].setAttribute('class', 'tr-lab tr-alab' + (c ? ' pl-lbl ' + _TG_TXT[c] : '')); }

//  ═══ BEGIN ชุดของกลางกลุ่มเมทริกซ์ ม.5 ═══  (docs/design-matrices.md §1.2)

// ───────── 20) เมทริกซ์มีชีวิต ─────────
// makeMatrix(host, M, o) → w     ⚠️ แทนที่เนื้อหาเดิมของ host ทั้งหมด · ทุกช่องเป็น element จริง (กดได้ ไฮไลต์ได้ บินได้)

// ───────── 21) ตัวเลข/ก้อนบิน ─────────

  const fx = f.left + f.width / 2 - sr.left, fy = f.top + f.height / 2 - sr.top, tx_ = t.left + t.width / 2 - sr.left + (o.dx || 0), ty_ = t.top + t.height / 2 - sr.top + (o.dy || 0);

  if (cs) c.style.cssText = `font-size:${cs.fontSize};font-weight:${cs.fontWeight};color:${cs.color}`;
  c.innerHTML = html; stage.appendChild(c);
  const arcH = o.arc === true ? 40 : (o.arc || 0), rot = o.rotate || 0, r0 = o.from0 || 0;
  const place = p => { const x = fx + (tx_ - fx) * p, y = fy + (ty_ - fy) * p - arcH * Math.sin(Math.PI * p); c.style.left = x.toFixed(1) + 'px'; c.style.top = y.toFixed(1) + 'px'; c.style.transform = `translate(-50%,-50%) rotate(${(r0 + rot * p).toFixed(1)}deg)`; };

}

// ───────── 22) ดีเทอร์มิแนนต์เป็นพื้นที่ ─────────
// makeDetArea(host, o) → w   กราฟ (Plot + plotPointer) · ลูกศร 2 เส้น = หลัก 2 หลักของ A = [a b; c d] → ลูกศรน้ำเงิน (a, c) · ลูกศรส้ม (b, d) · ลากหัวลูกศรได้ (ดูดจำนวนเต็ม −4..4)
//   สี่เหลี่ยมด้านขนานจากลูกศร 2 เส้นระบาย: det > 0 = ฟ้า · det < 0 = แดง + ป้าย "พลิกด้าน" · det = 0 → แบนเป็นเส้น + ป้าย "แบน! det = 0" · ป้ายพื้นที่ = det สด
//   ใต้กราฟ: A สด (matHtml) + บรรทัด det A = (a)(d) − (b)(c) = ค่า
//   o = { M: [[3, 1], [1, 2]] (เริ่มต้น · ต้อง 2×2) · k: true (ตัวเลื่อน k = 1..3 + ปุ่ม 1 2 3 → แสดงภาพ kA ซ้อน พื้นที่ k² เท่า · หัวลูกศรลากได้ ±4 เท่าเดิม แต่กราฟซูมออกตาม k: ±9 / ±15 / ±21)
//         inv: true (แสดงกล่อง A⁻¹ สด หรือ "ไม่มี A⁻¹" เมื่อ det = 0) · onChange: M => {} (ผู้ใช้ลาก) }
//   คืน w = { M (getter · array ของ Q), set(M), refresh() } · ลงทะเบียน LIVE · ⚠️ แทนที่เนื้อหาเดิมของ host
function makeDetArea(host, o) {
  o = o || {}; _tgPrune();
  const LIM = 4, RNGS = [9, 15, 21];                  // โหมด k: หัวลูกศรลากได้ ±4 · กราฟซูมออกตาม k (k = 1, 2, 3) เพื่อให้ kA ยังอยู่ในกรอบ
  let m = (o.M || [[3, 1], [1, 2]]).map(r => r.map(v => Math.round(qNum(v)))), kk = 1;
  const w = { _dead: false };
  Object.defineProperty(w, 'M', { get: () => _mQ(m) });
  host.innerHTML = `<div class="da-wrap"></div>`;
  const wrap = host.firstChild;
  wrap.innerHTML = `<div class="da-plot"></div>${o.k ? '<div class="slider-row da-k"><b><i>k</i> =</b><input type="range" min="1" max="3" step="1" value="1"><span class="slider-val"></span><span class="da-kc">' + [1, 2, 3].map(v => `<button type="button" class="chip da-kb" data-k="${v}">${v}</button>`).join('') + '</span></div>' : ''}<div class="da-read"></div>`;
  const box = wrap.querySelector('.da-plot'), rd = wrap.querySelector('.da-read');
  let pl, svg, dyn;
  const X = x => pl.X(x), Y = y => pl.Y(y);
  const arrow = (x1, y1, x2, y2, cls) => {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy); if (L < 1) return '';
    const ux = dx / L, uy = dy / L, hl_ = 13, nx = -uy * 6, ny = ux * 6, bx = x2 - ux * hl_, by = y2 - uy * hl_;
    return `<line class="pl-c ${cls}" style="stroke-width:3.4" x1="${x1}" y1="${y1}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}"/><polygon class="${cls.replace('s-', 'f-')}" points="${x2},${y2} ${(bx + nx).toFixed(1)},${(by + ny).toFixed(1)} ${(bx - nx).toFixed(1)},${(by - ny).toFixed(1)}"/>`;
  };
  let cur = null;
  const pickHead = pt => { const d1 = Math.hypot(pt.rx - m[0][0], pt.ry - m[1][0]), d2 = Math.hypot(pt.rx - m[0][1], pt.ry - m[1][1]); return d1 <= d2 ? 1 : 2; };
  const mv = pt => {
    if (!cur) return;
    const x = Math.max(-LIM, Math.min(LIM, Math.round(pt.rx))), y = Math.max(-LIM, Math.min(LIM, Math.round(pt.ry)));
    if (cur === 1) { if (m[0][0] === x && m[1][0] === y) return; m[0][0] = x; m[1][0] = y; } else { if (m[0][1] === x && m[1][1] === y) return; m[0][1] = x; m[1][1] = y; }
    paint(); if (o.onChange) o.onChange(w.M);
  };
  const mount = () => {                                   // สร้างกราฟ (ใหม่ทุกครั้งที่ k เปลี่ยน — ไม่เกิดระหว่างลากหัวลูกศร)
    const R = o.k ? RNGS[kk - 1] : 8, lx = o.k ? (R > 12 ? 6 : 3) : 2;
    pl = new Plot({ w: 480, h: 480, xmin: -R, xmax: R, ymin: -R, ymax: R, pad: 26, gx: R > 12 ? 3 : 1, gy: R > 12 ? 3 : 1, lx, ly: lx });
    box.innerHTML = pl.svg().replace(/<\/svg>$/, '<g class="da-dyn"></g></svg>');
    svg = box.querySelector('svg'); dyn = box.querySelector('.da-dyn');
    plotPointer(svg, pl, { snap: 0, clamp: false, onDown: pt => { cur = pickHead(pt); mv(pt); }, onDrag: mv, onUp: () => { cur = null; } });
    svg.style.cursor = 'grab';
  };
  const paint = () => {
    const a = m[0][0], b = m[0][1], c = m[1][0], d2 = m[1][1], det = a * d2 - b * c, k = kk;
    let g = '';
    const poly = (s, cls, extra) => `<polygon class="${cls}" ${extra || ''} points="${[[0, 0], [a * s, c * s], [(a + b) * s, (c + d2) * s], [b * s, d2 * s]].map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}"/>`;
    if (o.k && k > 1) g += poly(k, 'fa-green') + poly(k, 'da-edge s-green');
    if (det !== 0) g += poly(1, det > 0 ? 'fa-blue' : 'fa-red');
    g += poly(1, 'da-edge ' + (det > 0 ? 's-blue' : det < 0 ? 's-red' : 's-muted'), det === 0 ? 'style="stroke-dasharray:6 5"' : '');
    g += arrow(X(0), Y(0), X(a), Y(c), 's-blue') + arrow(X(0), Y(0), X(b), Y(d2), 's-orange');
    g += `<circle class="da-halo f-blue" cx="${X(a)}" cy="${Y(c)}" r="16"/><circle class="da-halo f-orange" cx="${X(b)}" cy="${Y(d2)}" r="16"/>`;
    g += `<circle class="pl-dot f-blue" cx="${X(a)}" cy="${Y(c)}" r="6.5"/><circle class="pl-dot f-orange" cx="${X(b)}" cy="${Y(d2)}" r="6.5"/>`;
    const lab = (x, y, cl, t) => `<text class="pl-lbl ${cl}" style="font-size:14px;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round" x="${X(x) + (x >= 0 ? 12 : -12)}" y="${Y(y) + (y >= 0 ? -10 : 20)}" text-anchor="${x >= 0 ? 'start' : 'end'}">${t}</text>`;
    g += lab(a, c, 'b', `(${mn(a)}, ${mn(c)})`) + lab(b, d2, 'o', `(${mn(b)}, ${mn(d2)})`);
    const cx_ = X((a + b) / 2), cy_ = Y((c + d2) / 2);
    const area = det === 0 ? tx(T('แบน! det = 0', 'Flat! det = 0')) : (det < 0 ? tx(T('พลิกด้าน ', 'Flipped ')) : '') + 'det = ' + mn(det);
    g += `<text class="pl-lbl ${det > 0 ? 'b' : 'r'}" style="font-size:15px;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round" x="${cx_}" y="${cy_ + 5}" text-anchor="middle">${det === 0 ? '' : area}</text>`;
    if (det === 0) g += `<text class="pl-lbl r" style="font-size:16px;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round" x="${X(0) + 14}" y="${Y(0) + 40}">${area}</text>`;
    dyn.innerHTML = g;
    const Aq = _mQ(m), inv = o.inv ? mInv(Aq) : null;
    let h = matHtml(Aq, { name: 'A' }) + `<span class="da-eq">det <i>A</i> = <i>ad</i> − <i>bc</i> = (${mn(a)})(${mn(d2)}) − (${mn(b)})(${mn(c)}) = <b class="${det === 0 ? 'da-zero' : ''}">${mn(det)}</b></span>`;
    if (o.k) h += `<span class="da-eq">det(<i>kA</i>) = <i>k</i><sup>2</sup> det <i>A</i> = ${k * k} × ${mn(det)} = <b>${mn(k * k * det)}</b></span>`;
    if (o.inv) h += inv ? `<span class="da-inv">${matHtml(inv, { name: 'A<sup>−1</sup>' })}</span>` : `<span class="da-inv da-none">${tx(T('ไม่มี A<sup>−1</sup> (เพราะ det = 0)', 'No A<sup>−1</sup> (because det = 0)'))}</span>`;
    rd.innerHTML = h;
    const kin = wrap.querySelector('.da-k input'); if (kin) { if (+kin.value !== k) kin.value = k; wrap.querySelector('.da-k .slider-val').textContent = k; wrap.querySelectorAll('.da-kb').forEach(bn => bn.classList.toggle('active', +bn.dataset.k === k)); }
  };
  const setK = v => { v = Math.max(1, Math.min(3, Math.round(+v) || 1)); if (v === kk) return; kk = v; mount(); paint(); };
  w.set = M => { m = M.map(r => r.map(v => Math.round(qNum(v)))); paint(); return w; };
  w.refresh = () => { if (!host.isConnected) { w._dead = true; return; } paint(); };
  const kin0 = wrap.querySelector('.da-k input');
  if (kin0) { kin0.oninput = () => setK(kin0.value); kin0.onchange = () => setK(kin0.value); wrap.querySelectorAll('.da-kb').forEach(bn => { bn.onclick = () => { kin0.value = bn.dataset.k; setK(bn.dataset.k); }; }); }
  mount();
  LIVE.push(w); paint();
  return w;
}
//  ═══ END ชุดของกลางกลุ่มเมทริกซ์ ม.5 ═══

// ════════════════════════════════════════════════════════════════════════════
//  ═══ BEGIN ชุดของกลางกลุ่มจำนวนเชิงซ้อน ม.5 ═══  (docs/design-complex-numbers.md §1.2)
//  ⚠️ เพิ่มท้ายไฟล์เท่านั้น — ห้ามแก้ของเดิมด้านบน (สื่อ 21 ชิ้นเดิมต้องไม่เปลี่ยน — มีแค่บล็อกนี้ที่เพิ่ม)
//  ใช้ของกลางเมทริกซ์ (Q, qAdd…, qHtml, _qTxt) กับของกลางตรีโกณ (rad, _tgPrune) ที่อยู่ด้านบน
//  ชื่อ const/function ระดับบนสุดที่เพิ่ม: Cx cxAdd cxSub cxMul cxDiv cxNeg cxConj cxEq cxAbs2 cxPow cxHtml cxText makeCStepper makeCPlane cisHtml
//     cxI cxRt (ค่าคงที่ i · เครื่องหมายรากสำหรับสมการตัวโต) (+ ตัวช่วยภายใน _toC _cx… _CX_CLS)
//  คลาส CSS ที่เพิ่ม (base.css ท้ายไฟล์): .cx-stp .cx-out .cx-grp .cx-k .cx-v · .cx-i (i ตัวเอียงเว้นขวา) · .cx-rt .cx-ri (รากสองแบบวาดเอง) · .cp-wrap .cp-lbl .cp-halo · .cx-bar (เส้นขีดบน z̄: <span class="cx-bar"><i>z</i></span>)
//
//  23) Cx / cxAdd … cxPow       จำนวนเชิงซ้อนแม่นยำ (ส่วนจริง/จินตภาพเป็น Q)
//  24) cxHtml / cxText          เขียน a + bi เป็น HTML / ข้อความธรรมดา
//  25) makeCStepper(host, z, o) แถว −/+ ของ a และ b → "z = a + bi" สด
//  26) makeCPlane(host, o)      ระนาบเชิงซ้อน: จุดลากได้ + ลูกศร + ป้าย HTML บนพื้นทึบ + arc / circle / arrow
//  27) cisHtml(r, k, n, o)      "r cis kπ/n"  /  "r(cos θ + i sin θ)"
// ════════════════════════════════════════════════════════════════════════════

// ───────── 22b) i และเครื่องหมายราก ─────────
// cxI = '<i class="cx-i">i</i>' — หน่วยจินตภาพ i ตัวเอียงที่เว้นขวานิดหน่อย (i ไม่ชนตัวยก i² หรือวงเล็บ "i)") · ใช้ทุกที่ที่ต้องเขียน i ใน HTML (cxHtml ใช้ตัวนี้)
// cxRt(h) → รากที่สองสำหรับสมการตัวโต/ใน .cb-big: เครื่องหมาย √ เป็น SVG ยืดตามความสูงของเส้นขีดบน ปลายบนของ √ ต่อกับปลายซ้ายของเส้นขีดพอดี (ไม่ลอยแยก ไม่ขึ้นกับ line-height)
//   cxRt('−9') → √(−9) แบบเส้นขีดบน · ในร้อยแก้ว/คำบรรยาย/ตัวเลือกใช้ข้อความธรรมดา √(−9) ตามเดิม
const cxI = '<i class="cx-i">i</i>';
const cxRt = h => `<span class="cx-rt"><svg viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0.6 13 L2.8 11.4 L5.2 18.6 L10 1.1"/></svg><span class="cx-ri">${h}</span></span>`;

// ───────── 23) จำนวนเชิงซ้อน ─────────
// Cx(re, im) → { re: Q, im: Q }   รับ "เลขธรรมดา" หรือ Q ได้ทั้งสองช่อง (แปลงเอง · ทศนิยมปัดที่ 6 ตำแหน่ง) · Cx(3) = 3 + 0i · Cx(z) = z (ส่ง Cx เข้ามาคืนตัวเดิม)
//   ทุกฟังก์ชัน cx* รับ "เลขธรรมดา / Q / Cx" แทน Cx ได้ทุกที่ (เลขธรรมดา = ส่วนจริงอย่างเดียว) และคืน Cx ใหม่ (ไม่แก้ตัวที่ส่งเข้ามา)
//   cxAdd(a, b) cxSub(a, b) cxMul(a, b) · cxDiv(a, b) (b = 0 → throw) · cxNeg(a) = −a · cxConj(a) = สังยุค a − bi · cxEq(a, b) → boolean
//   cxAbs2(z) → Q ของ a² + b² (กำลังสองของ |z| — ใช้แทน |z| จะได้ไม่ติดราก) · cxPow(z, n) n เต็ม ≥ 0 (n = 0 → 1 · n ติดลบ/ไม่เต็ม → throw)
//   ตัวอย่าง: cxMul(Cx(1, 2), Cx(3, -5)) = 13 + 1i · cxDiv(Cx(5, 5), Cx(1, 2)) = 3 − i · cxPow(Cx(2, -1), 2) = 3 − 4i
//   อ่านค่า: z.re / z.im เป็น Q → qHtml(z.re) · qNum(z.re) (ทศนิยม ไว้เทียบ/วาด ห้ามไว้คำนวณต่อ) · qEq(z.im, 0)
function Cx(re, im) {
  if (re && re._c) return re;
  return { re: _toQ(re === undefined ? 0 : re), im: _toQ(im === undefined ? 0 : im), _c: true };
}
const _toC = x => (x && x._c) ? x : Cx(x, 0);
const cxAdd = (a, b) => { a = _toC(a); b = _toC(b); return Cx(qAdd(a.re, b.re), qAdd(a.im, b.im)); };
const cxSub = (a, b) => { a = _toC(a); b = _toC(b); return Cx(qSub(a.re, b.re), qSub(a.im, b.im)); };
const cxMul = (a, b) => { a = _toC(a); b = _toC(b); return Cx(qSub(qMul(a.re, b.re), qMul(a.im, b.im)), qAdd(qMul(a.re, b.im), qMul(a.im, b.re))); };
const cxNeg = a => { a = _toC(a); return Cx(qNeg(a.re), qNeg(a.im)); };
const cxConj = a => { a = _toC(a); return Cx(a.re, qNeg(a.im)); };
const cxEq = (a, b) => { a = _toC(a); b = _toC(b); return qEq(a.re, b.re) && qEq(a.im, b.im); };
const cxAbs2 = z => { z = _toC(z); return qAdd(qMul(z.re, z.re), qMul(z.im, z.im)); };
function cxDiv(a, b) {
  a = _toC(a); b = _toC(b);
  const d0 = cxAbs2(b);
  if (qIsZero(d0)) throw new Error('cxDiv: หารด้วย 0');
  const n = cxMul(a, cxConj(b));
  return Cx(qDiv(n.re, d0), qDiv(n.im, d0));
}
function cxPow(z, n) {
  if (!Number.isInteger(n) || n < 0) throw new Error('cxPow: n ต้องเป็นจำนวนเต็ม ≥ 0');
  let r = Cx(1, 0); z = _toC(z);
  for (let k = 0; k < n; k++) r = cxMul(r, z);
  return r;
}

// ───────── 24) เขียน a + bi ─────────
// cxHtml(z, o) → HTML ก้อน mx เดียว (ไม่ตัดบรรทัด) · i เป็นตัวเอียง · เครื่องหมาย + − เว้นวรรครอบ · ลบเป็น "−" (U+2212)
//   Cx(3, -4) → 3 − 4i · Cx(0, -1) → −i · Cx(0, 3) → 3i · Cx(5, 0) → 5 · Cx(Q(13, 34), Q(1, 34)) → 13/34 + 1/34 i (เศษส่วนบน/ล่าง) · 1i เขียน "i" ไม่ใช่ "1i"
//   o.paren: true → ใส่วงเล็บเมื่อมี 2 พจน์ (a + bi) (พจน์เดียวไม่ใส่) · o.var: 'z₁' → นำหน้า "z₁ = " (ตัวแรกที่เป็นตัวอักษรถูกทำเอียงเอง ในก้อนเดียวกัน)
//   ⚠️ ส่วนจินตภาพเป็นรากไม่ได้ (Cx เป็น Q) — "√19 i" ให้เขียนสตริงเองในไฟล์ lesson (เว้นวรรค √19 i)
// cxText(z, o) → ข้อความธรรมดาไว้ใส่ aria / <text> ใน SVG: "3 − 4i" · เศษส่วน "13/34 + (1/34)i" · o.var / o.paren เหมือนกัน
const _cxAbsQ = q => (q.n < 0 ? qNeg(q) : q);
function cxHtml(z, o) {
  o = o || {}; z = _toC(z);
  const a = z.re, b = z.im, az = qIsZero(a), bz = qIsZero(b), ib = q => (qEq(q, 1) ? '' : qHtml(q)) + cxI;
  let s;
  if (bz) s = qHtml(a);
  else if (az) s = (b.n < 0 ? '−' : '') + ib(_cxAbsQ(b));
  else s = qHtml(a) + (b.n < 0 ? ' − ' : ' + ') + ib(_cxAbsQ(b));
  if (o.paren && !az && !bz) s = '(' + s + ')';
  if (o.var) s = o.var.replace(/^([A-Za-z])/, '<i>$1</i>') + ' = ' + s;
  return mx(s);
}
function cxText(z, o) {
  o = o || {}; z = _toC(z);
  const a = z.re, b = z.im, az = qIsZero(a), bz = qIsZero(b);
  const ib = q => (qEq(q, 1) ? '' : (q.d === 1 ? String(q.n) : '(' + _qTxt(q) + ')')) + 'i';
  let s;
  if (bz) s = _qTxt(a);
  else if (az) s = (b.n < 0 ? '−' : '') + ib(_cxAbsQ(b));
  else s = _qTxt(a) + (b.n < 0 ? ' − ' : ' + ') + ib(_cxAbsQ(b));
  if (o.paren && !az && !bz) s = '(' + s + ')';
  if (o.var) s = o.var + ' = ' + s;
  return s;
}

// ───────── 25) ตัวปรับ a, b ─────────
// makeCStepper(host, z, o) → w     ⚠️ แทนที่เนื้อหาเดิมของ host ทั้งหมด · แถว [a − 3 +] [b − 5 +] ใต้บรรทัดโตตรงกลาง "z = a + bi" (เปลี่ยนสดทุกครั้งที่กด)
//   z = Cx เริ่มต้น (a, b ปัดเป็นจำนวนเต็ม — ตัวปรับเดินทีละ 1)
//   o = { name: 'z₁' (ชื่อที่ขึ้นหน้า "z₁ = " · ค่าเริ่ม 'z') · cls: 'b' (น้ำเงิน · ค่าเริ่ม) | 'o' (ส้ม) · min: −9, max: 9 (ช่วงของ a และ b)

  host.innerHTML = `<div class="cx-stp cl-${cc}"><div class="cx-out"></div><span class="cx-grp"><b class="cx-k"><i>a</i></b>${btn('a-', '−')}<span class="cx-v" data-v="a"></span>${btn('a+', '+')}</span><span class="cx-grp"><b class="cx-k"><i>b</i></b>${btn('b-', '−')}<span class="cx-v" data-v="b"></span>${btn('b+', '+')}</span></div>`;
  const q = s => host.querySelector(s);
  const paint = () => {
    q('.cx-out').innerHTML = cxHtml(Cx(a, b), { var: o.name || 'z' });
    q('[data-v="a"]').textContent = mn(a); q('[data-v="b"]').textContent = mn(b);
    host.querySelectorAll('.mk-b').forEach(e => { const k = e.dataset.k, v = k[0] === 'a' ? a : b; e.disabled = k[1] === '-' ? v <= lo : v >= hi; });

    const k = e.dataset.k, d1 = k[1] === '-' ? -1 : 1;

  w.refresh = () => { if (!host.isConnected) { w._dead = true; return; } paint(); };
  LIVE.push(w); paint();
  return w;
}

// ───────── 26) ระนาบเชิงซ้อน ─────────
// makeCPlane(host, o) → w     ⚠️ แทนที่เนื้อหาเดิมของ host ทั้งหมด · ระนาบ (Plot ตาราง 1 หน่วย) แกนจริง/แกนจินตภาพ + จุดลากได้ + ลูกศรจากจุดกำเนิด + ป้าย HTML

//   คืน w = { plot, svg, layer, get(id), set(id, z, quiet?), toSvg(x, y), label(x, y, html, cls, o?), arrow(z0, z1, cls, o?), arc(r, t0, t1, cls, o?), circle(r, cls, o?), clearExtras(), redraw(), refresh() }
//     get(id) → Cx · set(id, z, quiet) ขยับจุด (วาดใหม่ ป้ายตาม) — ใช้ใน S.anim.run ทุกเฟรมด้วย quiet = true · ลากจุดข้างนอกกรอบ = ตรึงที่ขอบ
//     toSvg(x, y) → [px, py] พิกัด SVG (viewBox 460 × 460) ของจุด (x, y) บนระนาบ

//     arrow(z0, z1, cls, o) ลูกศรจากจุดเชิงซ้อน z0 ไป z1 (เลข/Cx) · cls 'b'|'o'|'g'|'p'|'r'|'m' (m = เทา) · o = { dash: true (เส้นประ), width: 3.4 } → คืน <g>

//     circle(r, cls, o) วงกลมรัศมี r รอบจุดกำเนิด (o.dash) → คืน <circle> · ใช้ปรับเป็นกวาดได้ด้วย el.setAttribute('r', r * w.plot.sx)
//     label(x, y, html, cls, o) ป้าย HTML ที่จุด (x, y) บนระนาบ · cls สีขอบ/ตัวอักษร 'b'|'o'|'g'|'p'|'r' หรือว่าง · o = { at: 'auto' (ค่าเริ่ม) | 'r' | 'l' | 't' | 'b' | 'tr' | 'tl' | 'br' | 'bl' ทิศของป้ายเทียบกับจุด, gap: 8 (px) } → คืน <div>
//        html เป็น T | สตริง | () => html (วาดใหม่ตามภาษา)

//   ตัวอย่าง:
//     const pl = makeCPlane(el, { range: 5, points: [{ id: 'z', z: Cx(3, 2), cls: 'b', drag: true, arrow: true, guide: true, label: z => cxHtml(z, { var: 'z' }) }] });

const _CX_CLS = { b: 'blue', o: 'orange', g: 'green', p: 'purple', r: 'red', t: 'teal' };

function makeCPlane(host, o) {
  o = o || {}; _tgPrune();
  const R = o.range || 6, W = 460, H = 460, pad = 30, tick = o.tick || (R > 8 ? 2 : 1);
  const pl = new Plot({ w: W, h: H, xmin: -R, xmax: R, ymin: -R, ymax: R, pad, gx: 1, gy: 1, lx: 1000, ly: 1000 });
  const X0 = pl.X(0), Y0 = pl.Y(0), U = pl.sx, F = v => +v.toFixed(2);
  let tk = '';
  for (let k = -R; k <= R; k += tick) {
    if (k === 0) continue;
    tk += `<line class="pl-axis" x1="${pl.X(k)}" y1="${Y0 - 4}" x2="${pl.X(k)}" y2="${Y0 + 4}"/><text class="pl-tick" style="font-size:15px" x="${pl.X(k)}" y="${Y0 + 22}" text-anchor="middle">${mn(k)}</text>`;
    tk += `<line class="pl-axis" x1="${X0 - 4}" y1="${pl.Y(k)}" x2="${X0 + 4}" y2="${pl.Y(k)}"/><text class="pl-tick" style="font-size:15px" x="${X0 - 9}" y="${pl.Y(k) + 5}" text-anchor="end">${k === 1 ? '' : k === -1 ? '−' : mn(k)}<tspan font-style="italic">i</tspan></text>`;
  }
  pl.raw(tk, true);
  const svgStr = pl.svg().replace(/<text class="pl-tick"[^>]*font-style:italic[^>]*>[xy]<\/text>/g, '').replace(/<\/svg>$/, '<g class="cp-x"></g><g class="cp-p"></g></svg>');
  host.innerHTML = `<div class="cp-wrap">${svgStr}</div>`;
  const wrap = host.querySelector('.cp-wrap'), svg = wrap.querySelector('svg'), gx = svg.querySelector('.cp-x'), gp = svg.querySelector('.cp-p');
  const pts = (o.points || []).map(p => ({ id: p.id, z: Cx(p.z), cls: p.cls || 'b', label: p.label, drag: !!p.drag, arrow: !!p.arrow, snap: p.snap === undefined ? 1 : p.snap, guide: !!p.guide }));
  const byId = id => pts.find(p => p.id === id);
  const w = { _dead: false, plot: pl, svg, layer: gx };
  const entries = [];                                                   // ป้ายทั้งหมด: { el, kind: 'axRe' | 'axIm' | 'pt' | 'ex', p?, x?, y?, at, gap, spec }
  const zs = () => { const m = {}; pts.forEach(p => { m[p.id] = p.z; }); return m; };
  const specHtml = (spec, z) => (typeof spec === 'function' ? spec(z) : tx(spec));
  const mkLabel = (kind, spec, cls, extra) => {
    const el = document.createElement('div'); el.className = 'cp-lbl ' + (cls || '');
    wrap.appendChild(el);
    const e = Object.assign({ el, kind, spec, at: 'auto', gap: 8 }, extra || {});

      else if (e.kind === 'axIm') { cx = X0p + 12 + bw / 2; cy = Math.max(bh / 2 + 3, (pad - 8) * sc); }

        let u = AT[e.at];

        cx = px + u[0] * d0 + Math.sign(u[0]) * bw / 2 * Math.min(1, Math.abs(u[0]) * 2.2);

    });
  };

    let h = '';
    pts.forEach(p => {
      const px = pl.X(qNum(p.z.re)), py = pl.Y(qNum(p.z.im)), cl = _CX_CLS[p.cls] || 'blue';

      if (p.arrow) h += _cxArrowSvg(X0, Y0, px, py, p.cls, { trim: 8 });
    });
    pts.forEach(p => {
      const px = pl.X(qNum(p.z.re)), py = pl.Y(qNum(p.z.im)), cl = _CX_CLS[p.cls] || 'blue';
      if (p.drag) h += `<circle class="cp-halo f-${cl}" cx="${px}" cy="${py}" r="18"/>`;
      h += `<circle class="pl-dot f-${cl}" cx="${px}" cy="${py}" r="7.5"/>`;
    });
    gp.innerHTML = h;
  };
  const paintLabels = () => entries.forEach(fillLabel);
  const redraw = () => { paintPts(); paintLabels(); layout(); return w; };
  // ป้ายประจำ: ชื่อแกน + ป้ายของจุด
  mkLabel('axRe', T('แกนจริง / Re', 'Real axis / Re'), 'ax');
  mkLabel('axIm', T('แกนจินตภาพ / Im', 'Imaginary axis / Im'), 'ax');
  pts.forEach(p => { if (p.label !== undefined && p.label !== null) mkLabel('pt', p.label, p.cls, { p }); });

  w.get = id => { const p = byId(id); return p ? p.z : undefined; };
  w.set = (id, z, quiet) => {
    const p = byId(id); if (!p) return w;
    p.z = Cx(z); redraw();
    if (!quiet && o.onChange) o.onChange(zs(), id);
    return w;
  };
  w.toSvg = (x, y) => [pl.X(x), pl.Y(y)];
  const addEl = html => { gx.insertAdjacentHTML('beforeend', html); return gx.lastElementChild; };
  w.arrow = (z0, z1, cls, ao) => { ao = ao || {}; z0 = Cx(z0); z1 = Cx(z1); return addEl(_cxArrowSvg(pl.X(qNum(z0.re)), pl.Y(qNum(z0.im)), pl.X(qNum(z1.re)), pl.Y(qNum(z1.im)), cls, ao)); };
  w.arc = (r, t0, t1, cls, ao) => {
    ao = ao || {}; const n = Math.max(2, Math.ceil(Math.abs(t1 - t0) / 0.05)), rp = r * U, P = t => [X0 + rp * Math.cos(t), Y0 - rp * Math.sin(t)];
    let d = ''; for (let i = 0; i <= n; i++) { const q = P(t0 + (t1 - t0) * i / n); d += (i ? 'L' : 'M') + F(q[0]) + ' ' + F(q[1]); }

    if (ao.head && Math.abs(t1 - t0) > 0.02) {                          // หัวลูกศรปลายโค้ง ตามแนวเส้นสัมผัส
      const sg = t1 >= t0 ? 1 : -1, e = P(t1), tg = [-Math.sin(t1) * sg, -Math.cos(t1) * sg], nm = [-tg[1], tg[0]], hl = 12, hw = 5.5;

      gx.insertAdjacentHTML('beforeend', `<polygon ${_cxFillAttr(cls)} points="${f(e[0] + tg[0] * 3)},${f(e[1] + tg[1] * 3)} ${f(b[0] + nm[0] * hw)},${f(b[1] + nm[1] * hw)} ${f(b[0] - nm[0] * hw)},${f(b[1] - nm[1] * hw)}"/>`);

  w.circle = (r, cls, co) => { co = co || {}; return addEl(`<circle class="pl-c ${_cxStroke(cls)}" style="stroke-width:${co.width || 2.8}${co.dash ? ';stroke-dasharray:7 6' : ''}" cx="${X0}" cy="${Y0}" r="${F(r * U)}"/>`); };
  w.label = (x, y, html, cls, lo) => { lo = lo || {}; const e = mkLabel('ex', html, cls, { x, y, at: lo.at || 'auto', gap: lo.gap === undefined ? 8 : lo.gap }); layout(); return e.el; };

    gx.innerHTML = '';
    for (let i = entries.length - 1; i >= 0; i--) if (entries[i].kind === 'ex') { entries[i].el.remove(); entries.splice(i, 1); }

  w.refresh = () => { if (!host.isConnected) { w._dead = true; if (ro) ro.disconnect(); return; } paintLabels(); layout(); };

  // ลากจุด
  const drags = pts.filter(p => p.drag);
  if (drags.length) {
    let cur = null;
    const pick = pt => {
      let best = null, bd = 1e9;

    };

      if (!cur) return;
      const sn = v => cur.snap ? Math.round(v / cur.snap) * cur.snap : Math.round(v * 100) / 100, cl = v => Math.max(-R, Math.min(R, v));

      if (cxEq(nz, cur.z)) return;

  w.leafCount = () => leaves.length;

  w.refresh = () => { if (!wrap.isConnected) { w._dead = true; return; } setTexts(); layout(); };

  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => { if (wrap.clientWidth !== lastCw) layout(); }).observe(wrap); else window.addEventListener('resize', layout);

}

function makeObjRow(host, items0, o) {
  o = o || {};
  const w = { _dead: false };
  const items = items0.map(it => ({ t: it.t, sub: it.sub, sub0: it.sub, c: it.c || 'b' }));
  const wrap = document.createElement('div'); wrap.className = 'cp-ob';
  host.innerHTML = ''; host.appendChild(wrap);
  const HC = ['hb', 'ho', 'hg', 'hp', 'hr'];
  const els = items.map(it => { const e = document.createElement('div'); e.className = 'cp-o c-' + it.c; wrap.appendChild(e); return e; });
  const paintItem = i => { const it = items[i]; els[i].innerHTML = `<span class="cp-ot">${it.t}${(it.sub === undefined || it.sub === null || it.sub === '') ? '' : `<sub>${_cpV(it.sub)}</sub>`}</span>`; };
  items.forEach((_, i) => paintItem(i));
  const S0 = () => ({ order: items.map((_, i) => i), lifted: [], fill: {}, bundles: [], gapsOn: false, everGaps: false, everLift: false });

    const placed = new Set(); Object.keys(S.fill).forEach(k => S.fill[k].forEach(i => placed.add(i)));
    const base = S.order.filter(i => S.lifted.indexOf(i) < 0 && !placed.has(i));

      if (seen.has(i)) return;

      if (bd) { const ms = base.filter(j => bd.idxs.indexOf(j) >= 0); ms.forEach(j => seen.add(j)); units.push({ items: ms, bundled: true }); }

        if (k <= U) { const u = units[k - 1], mm = u.items.length; list.push({ kind: 'unit', u, w: u.bundled ? mm * d + (mm - 1) * spb + 2 * padb : d }); }
      }
      let tot = 0; list.forEach((e, i) => { tot += e.w + (i ? sp : 0); });
      return { list, tot, sp, spb, padb };
    };
    const avail = cw - 16;
    let d = o.size || 48, L = layoutFor(d);
    for (let k = 0; k < 2 && L.tot > avail; k++) { d = Math.max(22, d * avail / L.tot); L = layoutFor(d); }
    const hasTop = !!o.room || S.everLift, hasBot = !!o.room || S.everGaps || S.gapsOn;
    const liftY = 12 + d / 2, rowY = hasTop ? liftY + d + 26 : 12 + d / 2 + 6;
    const labelDy = d / 2 + 18, H = rowY + d / 2 + (hasBot ? d * .35 + 30 : 14);
    const pos = items.map(() => null), markers = [];
    let x = (cw - L.tot) / 2;

      if (idx) x += L.sp;
      if (e.kind === 'slot') {
        if (e.m) fillOf(e.k).forEach((it, j) => { pos[it] = { x: x + d / 2 + j * (d + L.spb), y: rowY }; });
        if (showGaps) markers.push({ k: e.k, x: x + e.w / 2, filled: e.m > 0 });
      } else {
        const ix = x + (e.u.bundled ? L.padb : 0);
        e.u.items.forEach((it, j) => { pos[it] = { x: ix + d / 2 + j * (d + L.spb), y: rowY }; });

  };
  const liftIn = idxs => { idxs.forEach(i => { if (S.lifted.indexOf(i) < 0) S.lifted.push(i); Object.keys(S.fill).forEach(k => { S.fill[k] = S.fill[k].filter(x => x !== i); }); }); S.everLift = true; };
  w.lift = (idxs, anim) => { liftIn(idxs); return transition(anim, 650); };
  w.place = (idx, gapNo, anim) => { S.lifted = S.lifted.filter(i => i !== idx); (S.fill[gapNo] = S.fill[gapNo] || []).push(idx); return transition(anim, 750); };

  }

// ภาพเปลี่ยน 20 → 60 · st = { v, ax (ค่าสูงสุดของแกน), ghost (ยังไม่เปลี่ยน: โชว์วงประที่ 60), done (โชว์วงเล็บ) }
function dsBigFig(fig, st) {

const dsT = tx;   // อ่านง่าย: dsT(T(...)) = ข้อความตามภาษาปัจจุบัน
function dsRangeScenes() {
  const sc = [];
  sc.push({ cap: T('ฉากตั้งต้น: สองชุดข้อมูล ค่าเฉลี่ยเท่ากัน', 'Starting picture: two data sets with the same mean'), end: S => { dsRangeDraw(S, 0); } });
  sc.push({ cap: T('วัดจากจุดซ้ายสุดถึงขวาสุด = พิสัย', 'Measure leftmost to rightmost = the range'),
    end: S => { dsRangeDraw(S, 1); },
    play: async S => {
      const f = dsRangeDraw(S, 1, true); await dsWait(S, 500);
      for (const i of [0, 1]) { await dsRun(S, 800, t => dsRowsFig(f.fig, { pin: true, brk: i ? [1, t] : [t, 0] })); await dsWait(S, 300); }
    } });
  sc.push({ cap: T('ค่าโดดตัวเดียวลากพิสัยไปไกล', 'One outlier drags the range away'),

      await dsWait(S, 300); dsOn(f.calc, 0);

  sc.push({ cap: T('ดูแค่ครึ่งกลาง: Q.D.', 'Look only at the middle half: Q.D.'),
    end: S => { dsRangeDraw(S, 3); },
    play: async S => {
      const f = dsRangeDraw(S, 3, true); await dsWait(S, 400);
      await dsRun(S, 700, t => dsBoxFig(f.fig, { dim: t, band: t, br: 0, split: 0 })); await dsWait(S, 500);
      await dsRun(S, 800, t => dsBoxFig(f.fig, { dim: 1, band: 1, br: t, split: 0 })); dsOn(f.calc, 0); await dsWait(S, 800);
      await dsRun(S, 800, t => dsBoxFig(f.fig, { dim: 1, band: 1, br: 1, split: t })); dsOn(f.calc, 1); await dsWait(S, 400);
    } });
  sc.push({ cap: T('เปลี่ยน 20 เป็น 60: พิสัยกระโดด Q.D. อยู่นิ่ง', 'Change 20 to 60: the range jumps, Q.D. stays'),
    end: S => { dsRangeDraw(S, 4); },
    play: async S => {
      const f = dsRangeDraw(S, 4, true); await dsWait(S, 600);
      await dsRun(S, 2000, t => dsBigFig(f.fig, { v: lerp(20, 60, t), ax: lerp(22, 62, t), done: false }));
      dsBigFig(f.fig, { v: 60, ax: 62, done: true }); dsOn(f.calc, 0); await dsWait(S, 700); dsOn(f.calc, 1); await dsWait(S, 300);
    } });
  return sc;
}

  const info = d => {

    if (bx) bx.set(five(d));

    q('.ds-hint').innerHTML = tx(T('ลากจุดไปที่ค่าอื่น (ลองลากจุดขวาสุดไปไกลๆ แล้วลากกลับ) · กล่องคือ Q₁ ถึง Q₃ · ตารางเทียบว่าตัวไหนขยับ', 'Drag a dot to another value (try dragging the rightmost dot far away and back) · the box is Q₁ to Q₃ · the table shows which measure moves'));
    q('.ds-btns').innerHTML = `<button class="chip" data-a="reset">${tx(T('กลับค่าเริ่มต้น', 'Reset'))}</button>`;
    q('[data-a="reset"]').onclick = () => { dp.set(D0.slice()); info(D0); };

function dsMdScenes() {

// ── ลองทำ: ลากจุด 5 จุด ดูลูกศร + Σ(x − x̄) ค้างที่ 0 + M.D. สด ──
function makeDsMdTry(host) {

    dsMdFig(q('.ds-fig'), { ax: DS_MX, data: xs, m, A: 'lanes', B: 'lanes' });
    const sum = dsR(devs.reduce((s, v) => s + v, 0)), ab = dsR(devs.reduce((s, v) => s + Math.abs(v), 0)), md = ab / n, f = stFmt(md), nb = dsNb;
    q('.ds-out').innerHTML = dsLn(`${mx('Σ(<i>x</i> − ' + DS_XBI + ')')} = ${mx(devs.map(v => nb(v < 0 ? '(' + dsF(v) + ')' : dsF(v))).join(' + '))} = <b class="ds-g">${dsF(sum)}</b>`, 's') +
      dsLn(`${mx('Σ|<i>x</i> − ' + DS_XBI + '|')} = ${mx(devs.map(v => nb(dsF(Math.abs(v)))).join(' + '))} = <b class="ds-o">${dsF(ab)}</b>`, 's') +
      dsLn(`M.D. = ${frac(nb(dsF(ab)), nb(n))} ${f.approx ? '≈' : '='} <b class="ds-g">${f.text}</b>`);
  };
  const paint = () => {
    q('.ds-hint').innerHTML = tx(T('ลากจุดทั้ง 5 ไปที่ค่าอื่น — ลูกศรจาก x̄ เปลี่ยนตามสด · สังเกตว่า Σ(x − x̄) ค้างอยู่ที่ 0 ไม่ว่าจะลากไปไหน', 'Drag the 5 dots to other values — the arrows from x̄ change live · notice that Σ(x − x̄) stays at 0 wherever you drag'));
    q('.ds-btns').innerHTML = `<button class="chip" data-a="reset">${tx(T('กลับค่าเริ่มต้น', 'Reset'))}</button>`;
    q('[data-a="reset"]').onclick = () => { dp.set(D0.slice()); info(D0); };
  };
  dp = makeDotPlot(q('.ds-dph'), D0, { min: 0, max: 12, step: 1, drag: true, snap: 1, onChange: d => info(d) });
  dp.markers(['mean']);

  LIVE.push(w);
  return w;
}

const DS_SD = [2, 4, 4, 4, 5, 5, 7, 9];                              // ประชากร: x̄ = 5, Σ(x − x̄)² = 32, σ² = 4
const DS_POP = [2, 4, 6, 8];                                         // ประชากรเล็กของฉาก B: μ = 5, σ² = 5
const dsSS = (xs, c) => xs.reduce((s, x) => s + (x - c) * (x - c), 0);
const dsVarP = xs => dsSS(xs, stMean(xs)) / xs.length;
const dsVarS = xs => dsSS(xs, stMean(xs)) / (xs.length - 1);
// ตัวอย่างทุกแบบ (ใส่คืน) ขนาด n จากประชากร pop → ค่าเฉลี่ยของ SS/n และ SS/(n − 1)
function dsAllSamples(pop, n) {
  let list = [[]]; for (let k = 0; k < n; k++) { const nx = []; list.forEach(l => pop.forEach(v => nx.push(l.concat(v)))); list = nx; }
  const a = list.map(s => dsSS(s, stMean(s)) / s.length), b = list.map(s => dsSS(s, stMean(s)) / (s.length - 1));
  return { list, avgN: a.reduce((s, v) => s + v, 0) / list.length, avgN1: b.reduce((s, v) => s + v, 0) / list.length };
}

// ── ลองทำ 2: จับตัวอย่าง (ประชากร 2, 4, 6, 8 · n = 2, 3 · สุ่ม/ครบทุกแบบ) ──
function makeDsSampTry(host) {
  const w = { n: 2, cnt: 0, sN: 0, sN1: 0, last: null, exact: false, seed: 20261030, k: 0 };
  const reset = () => { w.cnt = 0; w.sN = 0; w.sN1 = 0; w.last = null; w.exact = false; };
  const add = s => { const ss = dsSS(s, stMean(s)); w.cnt++; w.sN += ss / s.length; w.sN1 += ss / (s.length - 1); w.last = s; };
  const rnd = () => { w.k++; return dsRng(w.seed + w.k * 7919); };
  const draw = () => {
    const nb = dsNb, c = w.cnt, aN = c ? w.sN / c : 0, aN1 = c ? w.sN1 / c : 0;
    host.innerHTML = `<div class="ds-btns">${[2, 3].map(n => `<button class="chip${w.n === n ? ' active' : ''}" data-n="${n}">n = ${n}</button>`).join('')}<button class="chip" data-a="one">${tx(T('สุ่ม 1 ตัวอย่าง', 'Draw 1 sample'))}</button><button class="chip" data-a="hun">${tx(T('สุ่ม 100 ตัวอย่าง', 'Draw 100 samples'))}</button><button class="chip" data-a="all">${tx(T('ครบทุกแบบ', 'Every sample'))}</button></div>` +
      `<div class="ds-sm">${tx(T('ประชากร 2, 4, 6, 8 (σ² = 5) · จับแล้วใส่คืน', 'Population 2, 4, 6, 8 (σ² = 5) · each draw is put back'))}</div>` +
      (c ? dsLn(`${tx(T('ตัวอย่างล่าสุด', 'latest sample'))}: ${mx(w.last.join(', '))}${w.exact ? '' : ''} · ${tx(T('จำนวนตัวอย่าง', 'samples'))} ${nb(dsF(c))}`, 's') : dsLn(tx(T('กดปุ่มเพื่อจับตัวอย่าง', 'Press a button to draw samples')), 's m')) +
      dsBarsHtml([{ label: 'σ² = 5', cls: 'g', v: 5 }, { label: `${tx(T('เฉลี่ย หาร n', 'average ÷ n'))} ${c ? (stFmt(aN).approx ? '≈ ' : '= ') + stFmt(aN).text : ''}`, cls: 'o', v: aN }, { label: `${tx(T('เฉลี่ย หาร n − 1', 'average ÷ n − 1'))} ${c ? (stFmt(aN1).approx ? '≈ ' : '= ') + stFmt(aN1).text : ''}`, cls: 'b', v: aN1 }]);
    host.querySelectorAll('[data-n]').forEach(b => { b.onclick = () => { w.n = +b.dataset.n; reset(); draw(); }; });
    host.querySelectorAll('[data-a]').forEach(b => { b.onclick = () => {
      const a = b.dataset.a;
      if (a === 'all') { reset(); dsAllSamples(DS_POP, w.n).list.forEach(add); w.exact = true; }
      else { if (w.exact) reset(); const r = rnd(), times = a === 'one' ? 1 : 100; for (let i = 0; i < times; i++) add(Array.from({ length: w.n }, () => DS_POP[Math.floor(r() * 4)])); }
      draw();
    }; });
  };
  w.refresh = () => { if (!host.isConnected) return; draw(); };
  draw(); LIVE.push(w);
  return w;
}

const DS_G = { A: { N: 10, mu: 60, v: 16 }, B: { N: 15, mu: 70, v: 25 } };
function dsPoolCalc(G) {
  const gs = [G.A, G.B], N = gs.reduce((s, g) => s + g.N, 0), mu = gs.reduce((s, g) => s + g.N * g.mu, 0) / N;

    { cap: T('ฉากตั้งต้น: ข้อมูลถูก แต่วัดจากจุดผิด', 'Starting picture: correct data, wrong measuring point'), end: S => { dsCDraw(S, 0); } },
    { cap: T('ที่มา: ผลรวมกำลังสองจากจุด c = จาก x̄ + N(x̄ − c)²', 'Where it comes from: sum of squares from c = from x̄ + N(x̄ − c)²'), end: S => { dsStackDraw(S, false); },
      play: async S => {
        const f = dsStackDraw(S, true); await dsWait(S, 500);
        await dsRun(S, 900, t => dsStackFig(f.fig, { b1: t, b2: 0, blocks: 0 })); await dsWait(S, 500);
        await dsRun(S, 900, t => dsStackFig(f.fig, { b1: 1, b2: t, blocks: 0 })); await dsWait(S, 300);
        await dsRun(S, 1500, t => dsStackFig(f.fig, { b1: 1, b2: 1, blocks: 5 * t })); await dsWait(S, 500); dsOn(f.calc, 0); await dsWait(S, 1000); dsOn(f.calc, 1); await dsWait(S, 400);
      } },
    { cap: T('ตัวอย่าง: วัดจาก 8 ได้ 14.2 → แก้เป็น 13.2', 'Example: measuring from 8 gives 14.2 → corrected to 13.2'), end: S => { dsCDraw(S, 2); },
      play: async S => { const f = dsCDraw(S, 2); const ls = f.calc.querySelectorAll('.ds-line'); ls.forEach(l => { l.style.opacity = 0; }); await dsWait(S, 500); for (const l of ls) { await dsRun(S, 500, t => { l.style.opacity = t; }); await dsWait(S, 600); } } }
  ];
}

// ───────── ทาย ─────────
function dsFixPredItems() {
  const nb = dsNb;
  const op = [T('ต้องแก้ทั้ง Σx และ Σx²', 'Both Σx and Σx² must be fixed'), T('แก้ Σx อย่างเดียวก็พอ', 'Fixing Σx alone is enough'), T('ไม่ต้องแก้ผลรวม เอา σ² เดิมลบ (21 − 15)² ก็ได้ค่าที่ถูก', 'No need to fix the sums: take the old σ² and subtract (21 − 15)²')];
  const wy = [T('σ² สร้างจาก Σx² และ x̄ (ซึ่งมาจาก Σx) · ค่าที่จดผิดปนอยู่ในผลรวมทั้งสองตัว (21 อยู่ใน Σx, 21² = 441 อยู่ใน Σx²) จึงต้องแก้ทั้งคู่ → Σx = 45, Σx² = 471, σ² = 13.2', 'σ² is built from Σx² and x̄ (which comes from Σx) · the wrong value sits inside both sums (21 in Σx, 21² = 441 in Σx²), so both must be fixed → Σx = 45, Σx² = 471, σ² = 13.2'),
    T('ไม่พอ: ถ้าแก้แค่ Σx แล้วใช้ Σx² เดิม (687) จะได้ 687/5 − 9² = 137.4 − 81 = 56.4 ไม่ใช่ 13.2 เพราะ 21² = 441 ยังปนอยู่', 'Not enough: fixing only Σx and keeping the old Σx² (687) gives 687/5 − 9² = 137.4 − 81 = 56.4, not 13.2, because 21² = 441 is still inside'),
    T('ไม่ได้: σ² เดิมคือ 33.36 ลบ (21 − 15)² = 36 ได้ −2.64 ซึ่งเป็นไปไม่ได้ (ความแปรปรวนติดลบไม่ได้) · ผลต่างของ "ค่าที่จดผิด" ไม่เท่ากับผลต่างของ "ค่ากำลังสอง" (441 − 225 = 216)', 'No: the old σ² is 33.36, minus (21 − 15)² = 36 gives −2.64, which is impossible (a variance cannot be negative) · the difference of the values is not the difference of their squares (441 − 225 = 216)')];
  return [{
    chip: T('จดข้อมูลผิดหนึ่งค่า', 'One value recorded wrongly'),
    draw: (el, ctx) => {
      const done = ctx.done[0]; el.innerHTML = '<div class="ds-wrap"><div class="ds-fig"></div></div><div class="ds-calc"></div>';
      dsFixFig(el.querySelector('.ds-fig'), dsFixSt(done ? 2 : 0));
      if (done) el.querySelector('.ds-calc').innerHTML = dsLn(`${dsSx}: ${mx(nb(51) + ' → ' + nb(45))}`, 's') + dsLn(`${dsSx2}: ${mx(nb(687) + ' → ' + nb(471))}`, 's');
    },
    qs: [{ q: T('ประชากร 5 ค่า จดเป็น 4, 7, 9, 10, 21 แต่ 21 ที่ถูกคือ 15 ก่อนหา σ² ที่ถูก ต้องแก้ผลรวมตัวไหนบ้าง?', 'A population of 5 was recorded as 4, 7, 9, 10, 21 but the right last value is 15. Before finding the correct σ², which sums must be fixed?'), o: op, a: 0, why: ctx => tx(wy[ctx.picks[0]]) }]
  }];
}

// ───────── ลองทำ: เลือกตัวที่จดผิด เลื่อนค่าที่ถูก ─────────
function makeDsFixTry(host) {
  const w = { rec: [5, 8, 11, 14, 22], idx: 4, val: 17 };
  const calc = () => { const r = w.rec, fx = r.map((v, i) => i === w.idx ? w.val : v); return { r, fx, mW: dsSum(r) / r.length, mR: dsSum(fx) / fx.length, vW: dsVarSq(r), vR: dsVarSq(fx) }; };
  const cell = v => { const f = stFmt(v); return (f.approx ? '≈ ' : '') + f.text; };
  const paintOut = () => {
    const k = calc(), orig = w.rec[w.idx], moved = w.val !== orig, nb = dsNb;
    const short = k.vW - Math.pow(k.mR - k.mW, 2), same = Math.abs(short - k.vR) < 1e-9;
    const pins = [dsPin(k.mR, 'g', k.mR <= k.mW ? -1 : 1, `${DS_XB} ${tx(T('ถูก', 'correct'))} = ${cell(k.mR)}`)];
    if (moved) pins.push(dsPin(k.mW, 'o', k.mR <= k.mW ? 1 : -1, `${DS_XB} ${tx(T('ผิด', 'wrong'))} = ${cell(k.mW)}`));
    dsFixFig(host.querySelector('.ds-fig'), { data: w.rec, idx: w.idx, to: w.val, ghost: moved ? 1 : 0, tag: moved ? `${tx(T('ถูก', 'right'))} ${w.val}` : '', ghostTag: moved ? `${tx(T('จดผิด', 'wrong'))} ${orig}` : '', pins, ax: { min: 0, max: 30, step: 2 } });
    const row = (lab, a, b) => `<tr><td class="lb">${lab}</td><td class="${moved && a !== b ? 'bad' : ''}">${cell(a)}</td><td class="st">${cell(b)}</td></tr>`;
    host.querySelector('.ds-out').innerHTML = `<table class="ds-cmpt"><tr><th></th><th>${tx(T('ก่อนแก้ (ข้อมูลที่จดไว้)', 'before (as recorded)'))}</th><th>${tx(T('หลังแก้', 'after the fix'))}</th></tr>` +
      row(dsSx, dsSum(k.r), dsSum(k.fx)) + row(dsSx2, dsSum2(k.r), dsSum2(k.fx)) + row(DS_XBI, k.mW, k.mR) + row('σ²', k.vW, k.vR) + '</table>' +
      dsLn(`${dsSubT('σ²', tx(T('ทางลัด', 'shortcut')))} = ${mx(nb(cell(k.vW)) + ' − (' + nb(cell(k.mR)) + ' − ' + nb(cell(k.mW)) + ')²')} = <b class="${same ? 'ds-g' : 'ds-o'}">${cell(short)}</b> ${same ? '=' : '≠'} ${dsSubT('σ²', dsCr())} = <b class="ds-g">${cell(k.vR)}</b> ${same ? '✓' : '✗'}`, 's') +
      `<div class="ds-sm">${tx(moved ? T('ค่าที่จดผิดเปลี่ยนจริง → ทางลัด "ลบ (ผลต่างของค่าเฉลี่ย)²" ใช้ไม่ได้ ต้องแก้ Σx และ Σx² แล้วคิดใหม่', 'The recorded value really changed → the shortcut "subtract (difference of means)²" does not work; fix Σx and Σx² and recompute') : T('ค่าที่ถูกเท่ากับค่าที่จดไว้ ไม่มีอะไรต้องแก้ จึงเท่ากันพอดี · ลองเลื่อนค่าที่ถูกให้ต่างออกไป', 'The right value equals the recorded one, so nothing needs fixing and both agree · slide the right value somewhere else'))}</div>`;
  };
  const draw = () => {
    host.innerHTML = `<div class="ds-sm">${tx(T('ข้อมูลที่จดไว้ 5 ค่า — เลือกตัวที่จดผิด แล้วเลื่อนค่าที่ถูก · Σx, Σx², σ² ก่อน/หลังแก้เปลี่ยนตามสด', 'Five recorded values — pick the wrong one, then slide the right value · Σx, Σx², σ² before/after update live'))}</div>` +
      `<div class="ds-btns">${w.rec.map((v, i) => `<button class="chip${i === w.idx ? ' active' : ''}" data-i="${i}">${v}</button>`).join('')}</div>` +
      `<div class="slider-row"><b>${tx(T('ค่าที่ถูก', 'right value'))}</b><input type="range" min="0" max="30" step="1" value="${w.val}"><span class="slider-val">${w.val}</span></div>` +
      `<div class="ds-wrap"><div class="ds-fig"></div></div><div class="ds-out"></div>`;
    const inp = host.querySelector('input');
    inp.oninput = () => { w.val = +inp.value; inp.nextElementSibling.textContent = inp.value; paintOut(); };
    host.querySelectorAll('[data-i]').forEach(b => { b.onclick = () => { w.idx = +b.dataset.i; w.val = Math.max(0, w.rec[w.idx] - 5); host.querySelectorAll('[data-i]').forEach(c => c.classList.toggle('active', c === b)); inp.value = w.val; inp.nextElementSibling.textContent = w.val; paintOut(); }; });
    paintOut();
  };
  w.refresh = () => { if (host.isConnected) draw(); };
  draw(); LIVE.push(w);
  return w;
}

function dsBuildFix(el, fm) {
  const c = d('ถูก', 'correct');
  el('tab-fix').innerHTML =
    fm(mx(`σ²<sub>${c}</sub> = ${frac('Σ<i>x</i>²<sub>' + c + '</sub>', '<i>N</i>')} − (${DS_XBI}<sub>${c}</sub>)²`), mx(`${DS_XBI}<sub>${c}</sub> = ${frac('Σ<i>x</i><sub>' + c + '</sub>', '<i>N</i>')}`)) +
    `<div class="ds-sm">${d('จดข้อมูลผิดหนึ่งค่า → Σx และ Σx² ผิดทั้งคู่ → แก้ทั้งสองแล้วคิดใหม่ (ไม่มีสูตรลัด) · ส่วน "ข้อมูลถูกหมดแต่วัดจากค่าเฉลี่ยผิด" มีสูตรลัดอีกแบบ (การ์ดที่ 2)', 'One wrong data value → both Σx and Σx² are wrong → fix both and recompute (no shortcut) · "all data correct but measured from the wrong mean" has its own shortcut (card 2)')}</div>` +
    card('🛠️', d('ที่มา: ข้อมูลจดผิด ต้องแก้ทั้ง Σx และ Σx²', 'Where it comes from: a wrong data value must be fixed in both Σx and Σx²'), '<div id="ds-fx1"></div>') +
    card('🧭', d('ข้อมูลถูกหมด แต่วัดจากค่าเฉลี่ยผิด', 'All data correct, but measured from the wrong mean'),
      `<div class="formula ds-fmsm"><span>${mx(`σ²<sub>${c}</sub> = σ²<sub>${d('ผิด', 'wrong')}</sub> − (μ<sub>${c}</sub> − μ<sub>${d('ผิด', 'wrong')}</sub>)²`)}</span><span>${mx(`<i>S</i>²<sub>${c}</sub> = <i>S</i>²<sub>${d('ผิด', 'wrong')}</sub> − ${frac('<i>n</i>(' + DS_XBI + '<sub>' + c + '</sub> − ' + DS_XBI + '<sub>' + d('ผิด', 'wrong') + '</sub>)²', '<i>n</i> − 1')}`)}</span></div>` + '<div id="ds-fx2"></div>') +
    card('🔮', d('ทายก่อน: ข้อมูลจดผิดหนึ่งค่า ต้องแก้อะไรบ้าง', 'Guess first: one value recorded wrongly — what must be fixed'), '<div id="ds-fxpr"></div>') +
    card('🖐️', d('ลองทำ: เลือกตัวที่จดผิด เลื่อนค่าที่ถูก', 'Try it: pick the wrong value, slide the right one'), '<div id="ds-fxtry"></div>');
  makeScenes(el('ds-fx1'), dsFixScenes(), { prompt: T('กด ▶ ทีละฉาก — จุดน้ำเงิน = ข้อมูล · จุดส้ม = ค่าที่จดผิด · หมุดเขียว = ค่าเฉลี่ยที่ถูก', 'Press ▶ one scene at a time — blue dot = data · orange dot = the wrongly recorded value · green pin = the correct mean') });
  makeScenes(el('ds-fx2'), dsCScenes(), { prompt: T('กด ▶ ทีละฉาก — หมุดเขียว = ค่าเฉลี่ยจริง · หมุดส้ม = จุดที่วัดผิด', 'Press ▶ one scene at a time — green pin = the true mean · orange pin = the wrong measuring point') });
  makePredict(el('ds-fxpr'), dsFixPredItems(), { label: T('โจทย์', 'Problem'), prompt: T('ดูภาพแล้วทายเหตุผล — เฉลยบนภาพ', 'Look at the picture and guess — the answer shows on the picture') });
  makeDsFixTry(el('ds-fxtry'));
}

// ═══════════════════════════════════════════════════════════════
//  แท็บ coef · เทียบการกระจายต่างหน่วย
// ═══════════════════════════════════════════════════════════════
// o = { rows: [{ label, x, s }], sbar: ความเข้มแถบ S, tiles: 0..1 (S ต่อกันเต็มแถบ x̄), cnt: ความเข้มป้ายจำนวนชิ้น, ax }
function dsCoefFig(fig, o) {
  const ax = o.ax || { min: 0, max: 90, step: 10 }, C = dsCanvas(fig, ax), fs = C.fs, X = C.X, bh = 28, RH = 2 * fs + 78, bx0 = X(0);
  o.rows.forEach((row, i) => {
    const y0 = i * RH, nameY = y0 + fs + 2, brkY = y0 + fs + 20, barY = y0 + fs + 30, xw = X(row.x) - bx0;
    C.text(C.ML, nameY, row.label, '', { anchor: 'start' });
    C.text(X(row.x), nameY, `${DS_XB} = ${dsF(row.x)}`, 'g', { anchor: 'end' });
    C.brk(0, row.x, brkY, 1, 'g', -1);
    const gop = o.tiles > 0 ? 1 - o.tiles : 1; if (gop > .01) dsRect(C, bx0, barY, xw, bh, 'ds-sq g', gop);
    if (o.tiles > 0) {
      const n = row.x / row.s, shown = o.tiles * n;
      for (let j = 0; j < Math.ceil(shown - 1e-9); j++) { const a = j * row.s, b = Math.min((j + 1) * row.s, row.x, shown * row.s); if (b > a + 1e-6) dsRect(C, X(a), barY, X(b) - X(a), bh, 'ds-sq ds-seg'); }
      const f = stFmt(row.x / row.s), lab = `S = ${dsF(row.s)}` + (o.cnt > .01 ? ` · ${tx(T('ใส่ได้', 'fits'))} ${f.approx ? '≈ ' : ''}${f.text} ${tx(T('ชิ้น', 'pieces'))}` : '');
      C.text(C.ML, barY + bh + fs + 6, lab, 'o', { anchor: 'start', op: Math.min(1, o.tiles * 3) });
    }
    if (o.sbar > .01) { const sy = barY + bh + 8; dsRect(C, bx0, sy, X(row.s) - bx0, 18, 'ds-sq', o.sbar); C.text(X(row.s) + 8, sy + 14, `S = ${dsF(row.s)}`, 'o', { anchor: 'start', op: o.sbar }); }
  });
  const yAx = o.rows.length * RH; C.ticks(yAx, ax.min, ax.max, ax.step);
  fig.innerHTML = C.svg(yAx + fs + 22);
}
const dsCoefRows = () => [{ label: `${tx(T('ห้อง', 'Room'))} A`, x: 50, s: 5 }, { label: `${tx(T('ห้อง', 'Room'))} B`, x: 80, s: 6 }];
const dsCoefSt = k => ({ rows: dsCoefRows(), sbar: k === 0 ? 1 : 0, tiles: k >= 1 ? 1 : 0, cnt: k >= 1 ? 1 : 0 });
const DS_COEFEXP = [
  T('ห้อง A คะแนนเฉลี่ย x̄ = 50 ส่วนเบี่ยงเบนมาตรฐาน S = 5 · ห้อง B x̄ = 80 และ S = 6 · แถบเขียวยาว = ค่าเฉลี่ยของแต่ละห้อง แถบส้มสั้น = ค่า S · S ของ B (6) มากกว่า A (5) — แปลว่า B กระจายมากกว่าจริงไหม?',
    'Room A has mean x̄ = 50 and standard deviation S = 5 · room B has x̄ = 80 and S = 6 · the long green bar = each room\'s mean, the short orange bar = its S · B\'s S (6) is larger than A\'s (5) — does that mean B is really more spread out?'),
  T('S มีหน่วยเดียวกับคะแนน และ "ใหญ่แค่ไหน" ต้องดูเทียบกับขนาดของค่าเฉลี่ย · เอาชิ้น S มาต่อกันให้เต็มแถบ x̄: ห้อง A ใส่ S ได้ 10 ชิ้นพอดี (S เป็น 1 ใน 10 ของ x̄) · ห้อง B ใส่ได้ประมาณ 13.33 ชิ้น (S เป็นเสี้ยวที่เล็กกว่าของ x̄) · ชิ้นน้อย = S กินสัดส่วนของ x̄ มาก = กระจายมากเมื่อเทียบกับค่ากลางของตัวเอง',
    'S has the same unit as the scores, and "how big" only makes sense next to the size of the mean · lay copies of S end to end to fill the x̄ bar: room A fits exactly 10 pieces (S is 1 tenth of x̄) · room B fits about 13.33 pieces (S is a smaller slice of x̄) · fewer pieces = S takes a bigger share of x̄ = more spread compared with its own centre'),
  T('"S เป็นกี่ส่วนของ x̄" ก็คือการหาร S ด้วย x̄ · ห้อง A: 5/50 = 0.10 · ห้อง B: 6/80 = 0.075 · หารแล้วหน่วยหายไป (คะแนน ÷ คะแนน) จึงเทียบข้ามวิชา ข้ามหน่วยได้ เช่น น้ำหนัก (กก.) กับส่วนสูง (ซม.) · ค่านี้เรียกว่า <b>สัมประสิทธิ์การกระจาย</b>',
    '"What share of x̄ is S" is just S divided by x̄ · room A: 5/50 = 0.10 · room B: 6/80 = 0.075 · the unit cancels (scores ÷ scores), so we can compare across subjects and units, such as weight (kg) with height (cm) · this value is called the <b>coefficient of dispersion</b>'),
  T('ห้อง B ได้ 0.075 น้อยกว่าห้อง A ที่ 0.10 → <b>B สม่ำเสมอกว่า</b> (กระจายน้อยกว่าเมื่อเทียบกับค่าเฉลี่ยของตัวเอง) แม้ S ดิบของ B จะมากกว่า · ข้อตกลง: สัมประสิทธิ์ยิ่งน้อย ยิ่งสม่ำเสมอ',
    'Room B scores 0.075, less than room A\'s 0.10 → <b>B is more consistent</b> (less spread compared with its own mean) even though B\'s raw S is larger · a convention: the smaller the coefficient, the more consistent')
];
function dsCoefEq(k, hide) {
  const nb = dsNb, p = h => dsP(h, hide), sox = frac('<span class="ds-o"><i>S</i></span>', `<span class="ds-g">${DS_XBI}</span>`), rm = n => tx(T('ห้อง', 'Room')) + ' ' + n;
  if (k === 2) return p(dsLn(`${rm('A')} : ${sox} = ${frac(nb(5), nb(50))} = <b class="ds-o">0.10</b>`)) + p(dsLn(`${rm('B')} : ${sox} = ${frac(nb(6), nb(80))} = <b class="ds-o">0.075</b>`));
  if (k === 3) return dsBars2([{ label: `${rm('A')} · 0.10`, cls: 'o', v: .10 }, { label: `${rm('B')} · 0.075`, cls: 'g', v: .075 }], .12) + p(dsLn(`<b class="ds-g">${rm('B')} : 0.075 &lt; 0.10 → ${tx(T('สม่ำเสมอกว่า', 'more consistent'))}</b>`));
  return '';
}
function dsCoefDraw(S, k, hide) {
  const f = dsFrame(S, dsCoefEq(k, hide), tx(DS_COEFEXP[k]), k === 0 ? tx(T('S ของ B มากกว่า — B กระจายกว่าจริงหรือ?', 'B has the bigger S — is B really more spread out?')) : '');
  dsCoefFig(f.fig, dsCoefSt(hide && k > 0 ? k - 1 : k));
  return f;
}
function dsCoefScenes() {
  return [
    { cap: T('ฉากตั้งต้น: ห้อง A และห้อง B', 'Starting picture: room A and room B'), end: S => { dsCoefDraw(S, 0); } },
    { cap: T('S ต่อกันได้กี่ชิ้นเต็มแถบ x̄', 'How many copies of S fill the x̄ bar'), end: S => { dsCoefDraw(S, 1); },
      play: async S => { const f = dsCoefDraw(S, 1, true); await dsWait(S, 700); await dsRun(S, 2000, t => dsCoefFig(f.fig, Object.assign(dsCoefSt(0), { sbar: 1 - t, tiles: t, cnt: 0 }))); await dsRun(S, 500, t => dsCoefFig(f.fig, Object.assign(dsCoefSt(1), { cnt: t }))); await dsWait(S, 400); } },
    { cap: T('หาร S ด้วย x̄', 'Divide S by x̄'), end: S => { dsCoefDraw(S, 2); },
      play: async S => { const f = dsCoefDraw(S, 2, true); await dsWait(S, 600); dsOn(f.calc, 0); await dsWait(S, 1000); dsOn(f.calc, 1); await dsWait(S, 400); } },
    { cap: T('เทียบสัมประสิทธิ์: B สม่ำเสมอกว่า', 'Compare the coefficients: B is more consistent'), end: S => { dsCoefDraw(S, 3); },
      play: async S => { const f = dsCoefDraw(S, 3, true); await dsWait(S, 800); dsOn(f.calc, 0); await dsWait(S, 400); } }
  ];
}

// ── ลองทำ: สองกลุ่ม เลื่อน x̄, S ──
function makeDsCoefTry(host) {
  const w = { G: [{ x: 50, s: 5 }, { x: 80, s: 6 }] };
  const rows = [[0, 'x', 30, 100, 'x̄<sub>A</sub>'], [0, 's', 1, 30, 'S<sub>A</sub>'], [1, 'x', 30, 100, 'x̄<sub>B</sub>'], [1, 's', 1, 30, 'S<sub>B</sub>']];
  const paint = () => {
    const [a, b] = w.G, ca = a.s / a.x, cb = b.s / b.x, nb = dsNb, f = v => stFmt(v, 3), cell = v => (f(v).approx ? '≈ ' : '= ') + f(v).text, rm = n => tx(T('ห้อง', 'Room')) + ' ' + n;
    dsCoefFig(host.querySelector('.ds-fig'), { rows: [{ label: rm('A'), x: a.x, s: a.s }, { label: rm('B'), x: b.x, s: b.s }], sbar: 1, tiles: 0, cnt: 0, ax: { min: 0, max: 100, step: 10 } });
    const eq = Math.abs(ca - cb) < 1e-9, better = ca < cb ? 'A' : 'B';
    host.querySelector('.ds-out').innerHTML = dsLn(`${rm('A')} : ${frac('<i>S</i>', DS_XBI)} = ${frac(nb(a.s), nb(a.x))} ${cell(ca)}`, 's') + dsLn(`${rm('B')} : ${frac('<i>S</i>', DS_XBI)} = ${frac(nb(b.s), nb(b.x))} ${cell(cb)}`, 's') +
      `<div class="ds-ok ds-g">${eq ? tx(T('เท่ากัน — สม่ำเสมอเท่ากัน', 'Equal — equally consistent')) : tx(T('ห้อง ' + better + ' สม่ำเสมอกว่า', 'Room ' + better + ' is more consistent'))}</div>` +
      `<div class="ds-sm">${tx((a.s > b.s) === (ca > cb) ? T('ลองทำให้ S ของ A มากกว่า B แต่ A ยังสม่ำเสมอกว่า — ทำได้ถ้า x̄ ของ A ใหญ่พอ', 'Try making A\'s S bigger than B\'s while A is still more consistent — possible when A\'s x̄ is big enough') : T('ตอนนี้ S กับสัมประสิทธิ์ ชี้ไปคนละทางกับที่คิด — S ใหญ่กว่า แต่สม่ำเสมอกว่า', 'Right now S and the coefficient point opposite ways — the bigger S is the more consistent one'))}</div>`;
  };
  const draw = () => {
    host.innerHTML = `<div class="ds-sm">${tx(T('เลื่อนค่า x̄ และ S ของสองห้อง · สัมประสิทธิ์และป้าย "ห้องไหนสม่ำเสมอกว่า" เปลี่ยนตามสด', 'Slide x̄ and S of the two rooms · the coefficients and the "which is more consistent" label update live'))}</div>` +
      `<div class="ds-ctl">${rows.map(([g, f, lo, hi, nm], i) => `<div class="slider-row"><b>${mx(nm + ' =')}</b><input type="range" min="${lo}" max="${hi}" step="1" value="${w.G[g][f]}" data-i="${i}"><span class="slider-val">${w.G[g][f]}</span></div>`).join('')}</div>` +
      `<div class="ds-btns"><button class="chip" data-a="eq">${tx(T('ทำให้ S เท่ากัน', 'Make the S equal'))}</button></div><div class="ds-wrap"><div class="ds-fig"></div></div><div class="ds-out"></div>`;
    host.querySelectorAll('input').forEach(inp => { inp.oninput = () => { const [g, f] = rows[+inp.dataset.i]; w.G[g][f] = +inp.value; inp.nextElementSibling.textContent = inp.value; paint(); }; });
    host.querySelector('[data-a="eq"]').onclick = () => { w.G[1].s = w.G[0].s; draw(); };
    paint();
  };
  w.refresh = () => { if (host.isConnected) draw(); };
  draw(); LIVE.push(w);
  return w;
}

function dsBuildCoef(el, fm) {
  const xM = '<i>x</i><sub>max</sub>', xm = '<i>x</i><sub>min</sub>', q3 = dsQ(3), q1 = dsQ(1);
  const one = (lab, num, den) => `<span>${lab} = ${mx(frac(num, den))}</span>`;
  el('tab-coef').innerHTML =
    card('⚖️', d('ที่มา: ทำไมต้องหารด้วย x̄', 'Where it comes from: why divide by x̄'), '<div id="ds-cf1"></div>') +
    `<div class="formula">${one(d('สัมประสิทธิ์ของพิสัย', 'Coefficient of range'), `${xM} − ${xm}`, `${xM} + ${xm}`)}${one(d('สัมประสิทธิ์ของ Q.D.', 'Coefficient of Q.D.'), `${q3} − ${q1}`, `${q3} + ${q1}`)}</div>` +
    `<div class="formula">${one(d('สัมประสิทธิ์ของ M.D.', 'Coefficient of M.D.'), 'M.D.', DS_XBI)}${one(d('สัมประสิทธิ์ของ S.D.', 'Coefficient of S.D.'), 'S.D.', DS_XBI)}</div>` +
    `<div class="ds-note">${d('ทั้ง 4 สูตรคือ "การกระจาย ÷ ค่ากลาง" เหมือนกัน (สองสูตรแรก ตัด 2 ออกจากทั้งเศษและส่วน) · ในตำราสถิติเรียกชุดนี้ว่า coefficients of dispersion (ดู Wikipedia: Quartile coefficient of dispersion, Coefficient of variation)', 'All four formulas are "spread ÷ centre" (for the first two, the 2 cancels on top and bottom) · in statistics books these are the coefficients of dispersion (see Wikipedia: Quartile coefficient of dispersion, Coefficient of variation)')}</div>` +
    card('🔢', d('ตัวอย่างสั้น: ชุดข้อมูล A11', 'A short example: data set A11'), '<div id="ds-cf2"></div>') +
    card('🔮', d('ทายก่อน: น้ำหนัก (กก.) กับส่วนสูง (ซม.)', 'Guess first: weight (kg) versus height (cm)'), '<div id="ds-cfpr"></div>') +
    card('🖐️', d('ลองทำ: เลื่อน x̄ และ S ของสองห้อง', 'Try it: slide x̄ and S of two rooms'), '<div id="ds-cftry"></div>');
  makeScenes(el('ds-cf1'), dsCoefScenes(), { prompt: T('กด ▶ ทีละฉาก — แถบเขียว = x̄ · ชิ้นส้ม = S', 'Press ▶ one scene at a time — green bar = x̄ · orange piece = S') });
  makeScenes(el('ds-cf2'), dsA11Scenes(), { prompt: T('กด ▶ ทีละฉาก — จุดน้ำเงิน = ข้อมูล A11 · กรอบส้ม = Q₁ ถึง Q₃', 'Press ▶ one scene at a time — blue dots = data A11 · orange box = Q₁ to Q₃') });
  makePredict(el('ds-cfpr'), dsCoefPredItems(), { label: T('โจทย์', 'Problem'), prompt: T('ดูภาพแล้วทายเหตุผล — เฉลยบนภาพ', 'Look at the picture and guess — the answer shows on the picture') });
  makeDsCoefTry(el('ds-cftry'));
}

    for (const el of document.querySelectorAll('svg [fill], svg [stroke]')) {
      if (el.matches(SKIP)) continue;
      for (const prop of ['fill', 'stroke']) {
        const flag = 'data-dk-' + prop;
        if (!dark) { if (el.hasAttribute(flag)) { el.style.removeProperty(prop); el.removeAttribute(flag); } continue; }
        const v = el.getAttribute(prop);
        if (!v || v.includes('var(')) continue;
        const tag = el.tagName.toLowerCase();
        const role = prop === 'stroke' ? 'stroke' : (tag === 'text' || tag === 'tspan') ? 'fg' : 'shape';
        const m = remap(v, role);
        if (m && el.style.getPropertyValue(prop) !== m) { el.style.setProperty(prop, m); el.setAttribute(flag, ''); }
      }
    }
    for (const el of document.querySelectorAll('body [style]')) {
      if (el.matches(SKIP) || el.closest('svg')) continue;
      if (!dark) { if (el.hasAttribute('data-dk-style')) { el.style.cssText = el.getAttribute('data-dk-style'); el.removeAttribute('data-dk-style'); } continue; }
      if (el.hasAttribute('data-dk-style')) continue;
      const st = el.style, orig = st.cssText;
      let changed = false;
      const bgKept = st.backgroundColor && !remap(st.backgroundColor, 'bg');
      for (const pr of [['background-color', 'bg'], ['color', 'fg'], ['border-color', 'stroke']]) {
        const v = st.getPropertyValue(pr[0]);
        if (!v || v.includes('var(') || (pr[1] === 'fg' && bgKept)) continue;
        let m = remap(v, pr[1]);
        // แถบสีเล็กๆ (ตัวอย่างสีในคำอธิบายกราฟ) ที่เป็นสีเข้ม → ทำแบบเส้น: ยกให้สว่าง
        if (!m && pr[1] === 'bg' && el.offsetWidth * el.offsetHeight < 1500) m = remap(v, 'stroke');
        if (m) { st.setProperty(pr[0], m); changed = true; }
      }
      if (changed) el.setAttribute('data-dk-style', orig);
    }
    clearTimeout(fcTimer);
    fcTimer = setTimeout(() => { mo.disconnect(); fixContrast(); watch(); }, 300);
  }
  let fcTimer = 0;
  function rgbOf(c) { const p = parse(c); return p ? p : null; }
  function lum(p) { const f = v => v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); return .2126 * f(p[0]) + .7152 * f(p[1]) + .0722 * f(p[2]); }
  function contrast(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
  function bgBehind(el) {
    for (let e = el; e && e.nodeType === 1; e = e.parentElement) {
      const cs = getComputedStyle(e);
      if (cs.backgroundImage !== 'none') return null;
      const c = rgbOf(cs.backgroundColor);
      if (!c) return null;
      if (c[3] >= .9) return c;
    }
    return rgbOf(getComputedStyle(document.body).backgroundColor);
  }
  function readable(fg, bg) {
    const hsl = toHsl(fg[0], fg[1], fg[2]), darker = lum(bg) > .4;
    for (let l = hsl[2], i = 0; i < 25; i++) {
      l = darker ? l - .035 : l + .035;
      if (l < .05 || l > .97) break;
      const c = toRgb(hsl[0], Math.min(hsl[1], .9), l);
      if (contrast([c[0], c[1], c[2], 1], bg) >= 3.6) return fmt(c, 1);
    }
    return darker ? '#121212' : '#ffffff';
  }
  function fixContrast() {
    for (const el of document.querySelectorAll('[data-dk-c]')) { el.style.color = el.getAttribute('data-dk-c'); el.removeAttribute('data-dk-c'); }
    for (const el of document.querySelectorAll('body *')) {
      if (el.closest('svg, header, script, style')) continue;
      let own = false;
      for (const n of el.childNodes) if (n.nodeType === 3 && n.textContent.trim()) { own = true; break; }
      if (!own) continue;
      const fg = rgbOf(getComputedStyle(el).color), bg = bgBehind(el);
      if (!fg || !bg || fg[3] < .5) continue;
      if (contrast(fg, bg) >= 3) continue;
      el.setAttribute('data-dk-c', el.style.color || '');
      el.style.color = readable(fg, bg);
    }
    // ตัวเลขแกน/ป้ายสีเทากลางๆ ในกราฟ (#94A3B8 บนพื้นขาว) — ปรับเฉพาะสีเทา ไม่แตะตัวหนังสือขาวบนป้ายสี
    for (const el of document.querySelectorAll('[data-dk-sf]')) { el.style.fill = el.getAttribute('data-dk-sf'); el.removeAttribute('data-dk-sf'); }
    for (const el of document.querySelectorAll('svg text')) {
      if (el.closest('header, .lesson-cover')) continue;
      const fg = rgbOf(getComputedStyle(el).fill);
      if (!fg) continue;
      const hsl = toHsl(fg[0], fg[1], fg[2]);
      if (hsl[1] > .3 || hsl[2] < .3 || hsl[2] > .8) continue;
      const bg = bgBehind(el.ownerSVGElement || el);
      if (!bg || contrast(fg, bg) >= 3.2) continue;
      el.setAttribute('data-dk-sf', el.style.fill || '');
      el.style.fill = readable(fg, bg);
    }
  }
  let queued = false;
  const mo = new MutationObserver(schedule);
  function watch() { mo.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['fill', 'stroke', 'style'] }); }
  function schedule() { if (queued) return; queued = true; setTimeout(() => { queued = false; mo.disconnect(); adapt(); watch(); }, 30); }
  new MutationObserver(schedule).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  watch(); schedule();
})();
syncThemeButton();
new MutationObserver(syncThemeButton).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
// แถบแท็บบนจอแคบเลื่อนซ้าย-ขวาได้: กดแท็บแล้วเลื่อนปุ่มนั้นมาให้เห็นทั้งปุ่ม
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('nav .tab-btn');
  if (b && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
});
</script>
