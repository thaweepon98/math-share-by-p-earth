<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ม.6 — รวมสื่อการสอน by P'Earth</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');

:root {
  --primary: #1C3B22;
  --secondary: #FF8A3D;
  --accent: #68EF3F;
  --bg: #F3F7EC;
  --card: #FFFFFF;
  --text: #2D3748;
  --muted: #718096;
  --border: #E2E8F0;
  --shadow: 0 4px 24px rgba(28,59,34,0.10);
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sarabun', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header {
  background: linear-gradient(135deg, #1C3B22 0%, #2E5936 100%);
  color: white;
  padding: 32px 24px 28px;
  text-align: center;
  position: relative;
}

header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
header p { font-size: 0.95rem; opacity: 0.9; }
.lang-toggle {
  position: absolute;
  top: 12px; right: 20px;
  background: rgba(255,255,255,.15);
  color: white;
  border: 1.5px solid rgba(255,255,255,.5);
  border-radius: 20px;
  padding: 5px 14px;
  font-family: 'Sarabun', sans-serif;
  font-size: .8rem;
  font-weight: 700;
  cursor: pointer;
  z-index: 2;
}
.lang-toggle:hover { background: rgba(255,255,255,.28); }

.crumb {
  max-width: 1000px;
  margin: 20px auto 0;
  padding: 0 24px;
}
.crumb a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
}
.crumb a:hover { text-decoration: underline; }

main {
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 18px;
  margin-top: 20px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px 20px;
  text-decoration: none;
  color: var(--text);
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.card-wrap {
  position: relative;
  display: flex;
  transition: transform 0.15s ease;
}
.card-wrap > .card { flex: 1; }
.card-wrap:hover { transform: translateY(-3px); }
.card-wrap:hover > .card { box-shadow: 0 8px 28px rgba(28,59,34,0.18); }

/* ปุ่มคัดลอกลิงก์ของการ์ด — ลิงก์ชี้ไปที่เว็บจริงเสมอ แม้เปิดไฟล์จากเครื่อง */
.copy-link {
  position: absolute;
  top: 14px; right: 14px;
  background: #F3F7EC;
  color: var(--primary);
  border: 1px solid #CFE3C3;
  border-radius: 999px;
  padding: 4px 11px;
  font-family: 'Sarabun', sans-serif;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s ease;
}
.copy-link:hover { background: #E3F3D8; }
.copy-link.done { background: var(--primary); color: white; border-color: var(--primary); }
.copy-link.missing { background: #FFF1E6; color: #B4531A; border-color: #FFC9A3; }

.card .icon { font-size: 2.2rem; }
.card .title { font-size: 1.1rem; font-weight: 700; }
.card .desc { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
.card .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.card .tag {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--primary);
  background: #E3F3D8;
  border-radius: 999px;
  padding: 3px 10px;
}

.empty-note {
  color: var(--muted);
  font-size: 0.9rem;
  margin-top: 16px;
}
</style>
</head>
<body>

<header>
  <button id="langToggle" class="lang-toggle" onclick="toggleLang()">EN</button>
  <h1 data-th="🎓 ม.6" data-en="🎓 Grade 12 (M.6)">🎓 ม.6</h1>
  <p data-th="สื่อการสอนคณิตศาสตร์ ม.6" data-en="Mathematics teaching materials for Grade 12 (M.6)">สื่อการสอนคณิตศาสตร์ ม.6</p>
</header>


<main>
  <div id="topicGrid" class="grid"></div>
  <p id="emptyNote" class="empty-note" style="display:none;" data-th="ยังไม่มีหัวข้อ" data-en="No topics yet">ยังไม่มีหัวข้อ</p>
</main>

<script>
// ── ปุ่มสลับภาษาไทย/อังกฤษ (โค้ดชุดนี้ฝังซ้ำในทุกหน้าของเว็บ) ──
const PAGE_TITLE = { th: "ม.6 — รวมสื่อการสอน by P'Earth", en: "Grade 12 (M.6) — Teaching Materials by P'Earth" };

let langMemory = 'th';
function getLang() {
  try { return localStorage.getItem('siteLang') || 'th'; }
  catch (e) { return langMemory; }
}
function applyLang(lang) {
  document.documentElement.lang = lang;
  document.title = PAGE_TITLE[lang];
  document.querySelectorAll('[data-th]').forEach(el => {
    el.textContent = (lang === 'en' && el.dataset.en) ? el.dataset.en : el.dataset.th;
  });
  const btn = document.getElementById('langToggle');
  if (btn) btn.textContent = lang === 'en' ? 'ไทย' : 'EN';
  if (typeof onLangChange === 'function') onLangChange(lang);
}
function toggleLang() {
  const next = getLang() === 'en' ? 'th' : 'en';
  langMemory = next;
  try { localStorage.setItem('siteLang', next); } catch (e) {}
  applyLang(next);
}
function onLangChange(lang) { renderTopics(); }

// เพิ่มหัวข้อใหม่: copy ไฟล์ html เข้าโฟลเดอร์นี้ แล้วเพิ่ม object ในนี้ (ใส่ทั้ง _th และ _en)
const TOPICS = [
  { file: "calculus/index.html", title_th: "แคลคูลัส", title_en: "Calculus", desc_th: "ลิมิต อนุพันธ์ และปริพันธ์", desc_en: "Limits, derivatives, and integrals", icon: "🔬", tags_th: ["แคลคูลัส"], tags_en: ["Calculus"] },
  { file: "sequences-series/index.html", title_th: "ลำดับและอนุกรม", title_en: "Sequences & Series", desc_th: "ลำดับเลขคณิต-เรขาคณิต สูตรผลรวม ตัวอย่างการแพร่เชื้อไวรัส และอนุกรมลู่เข้า-ลู่ออก", desc_en: "Arithmetic & geometric sequences, sum formulas, a virus-spread example, and convergent/divergent series", icon: "📈", tags_th: ["ลำดับและอนุกรม"], tags_en: ["Sequences & Series"] },
  { file: "arithmetic-mean.html", title_th: "ค่าเฉลี่ยเลขคณิต (The Meaning of MEAN)", title_en: "Arithmetic Mean (The Meaning of MEAN)", desc_th: "ลากกล่องข้อมูลไปรวมแล้วเกลี่ยคืนให้เท่ากันทุกคอลัมน์ พร้อมตัดเศษเมื่อหารไม่ลงตัว", desc_en: "Drag data blocks together then redistribute them evenly across columns, including remainders when division isn't exact", icon: "⚖️", tags_th: ["สถิติ"], tags_en: ["Statistics"] }
];

function renderTopics() {
  const lang = getLang();
  const grid = document.getElementById("topicGrid");
  if (TOPICS.length === 0) {
    document.getElementById("emptyNote").style.display = "block";
  } else {
    grid.innerHTML = TOPICS.map(t => `
      <div class="card-wrap">
      <a class="card" href="./${t.file}">
        <div class="icon">${t.icon}</div>
        <div class="title">${lang === 'en' ? t.title_en : t.title_th}</div>
        <div class="desc">${lang === 'en' ? t.desc_en : t.desc_th}</div>
        <div class="tags">${(lang === 'en' ? t.tags_en : t.tags_th).map(tag => `<span class="tag">${tag}</span>`).join("")}</div>
      </a>
      </div>
    `).join("");
  }
}

renderTopics();
applyLang(getLang());
</script>

</body>
</html>
