<!DOCTYPE html>
<html lang="th">
<head>
<script id="theme-boot">(function(){var t='light';try{t=localStorage.getItem('siteTheme')||'light'}catch(e){}document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สื่อการสอน : การดำเนินการพหุนามและการแยกตัวประกอบ ม.4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap');

  :root {
    --primary: #1C3B22; --secondary: #FF8A3D; --accent: #68EF3F; --accent-2: #3FA82E; --warning: #FFB347;
    --bg: #F3F7EC; --card: #FFFFFF; --text: #2D3748; --muted: #718096; --border: #E2E8F0;
    --shadow: 0 4px 24px rgba(28,59,34,0.10); --radius: 16px;
    --pos: #047857; --pos-bg: #ECFDF5; --neg: #BE185D; --neg-bg: #FFF4EC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Anuphan', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: linear-gradient(135deg, #1C3B22 0%, #2E5936 100%); color: white; padding: 28px 40px 20px; text-align: center; position: relative; overflow: hidden; }
  header::before { content: ''; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; background: rgba(255,255,255,0.07); border-radius: 50%; }
  header h1 { font-size: 2rem; font-weight: 800; letter-spacing: .5px; }
  header p { font-size: 1rem; opacity: .85; margin-top: 4px; }
  .back-link { position: absolute; top: 14px; left: 20px; color: white; text-decoration: none; font-size: .85rem; font-weight: 600; opacity: .9; z-index: 2; }
  .back-link:hover { opacity: 1; text-decoration: underline; }
  .lang-toggle { position: absolute; top: 14px; right: 20px; background: rgba(255,255,255,.15); color: white; border: 1.5px solid rgba(255,255,255,.5); border-radius: 20px; padding: 5px 14px; font-family: 'Anuphan', sans-serif; font-size: .8rem; font-weight: 700; cursor: pointer; z-index: 2; }
  .lang-toggle:hover { background: rgba(255,255,255,.28); }

  nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 20px 24px 0; background: white; border-bottom: 3px solid var(--border); }
  .tab-btn { padding: 10px 18px; border: none; background: transparent; border-radius: 10px 10px 0 0; font-family: 'Anuphan', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .25s; border-bottom: 3px solid transparent; margin-bottom: -3px; }
  .tab-btn:hover { color: var(--primary); background: #E3F3D8; }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: #E3F3D8; }

  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 60px; }
  .tab-panel { display: none; animation: fadeIn .35s ease; }
  .tab-panel.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 32px; margin-bottom: 24px; }
  .card-title { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .card-title .icon { font-size: 1.5rem; }
  .intro { font-size: 1.02rem; line-height: 1.8; margin-bottom: 14px; }
  .box-info { background: #EEF7E6; border-left: 4px solid var(--primary); border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .box-warn { background: #FFF7ED; border-left: 4px solid var(--warning); border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .box-ok   { background: #ECFDF5; border-left: 4px solid var(--accent);  border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .formula { background: linear-gradient(135deg,#1C3B22,#2E5936); color: white; border-radius: 12px; padding: 14px 24px; text-align: center; font-size: 1.3rem; font-weight: 700; margin: 14px 0; letter-spacing: .5px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px; }

  .btn { padding: 10px 24px; background: var(--primary); color: white; border: none; border-radius: 30px; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s, opacity .2s; }
  .btn:hover:not(:disabled) { background: #2E5936; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: white; color: var(--primary); border: 2px solid var(--primary); }
  .btn.ghost:hover:not(:disabled) { background: #E3F3D8; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chip { padding: 8px 16px; border: 2px solid var(--border); border-radius: 30px; background: #fff; font-family: 'Anuphan', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; color: var(--text); display: inline-flex; align-items: center; gap: 4px; }
  .chip:hover { border-color: var(--primary); }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .chip.wrong { border-color: var(--neg); background: var(--neg-bg); color: var(--neg); }

  .frac { display: inline-flex; flex-direction: column; align-items: center; font-weight: 700; line-height: 1; vertical-align: middle; margin: 0 4px; }
  .frac .num { font-size: 1em; border-bottom: 2.5px solid currentColor; padding-bottom: 2px; min-width: 18px; text-align: center; white-space: nowrap; }
  .frac .den { font-size: 1em; padding-top: 3px; min-width: 18px; text-align: center; white-space: nowrap; }

  .align { display: grid; grid-template-columns: auto auto auto; justify-content: start; column-gap: .55em; row-gap: 3px; align-items: center; margin: 4px 0; }
  .align .l { justify-self: end; text-align: right; }
  .align .m { justify-self: center; font-weight: 700; }
  .align .r { justify-self: start; }
  .align .full { grid-column: 1 / -1; }

  .wk-cell { position: relative; background: #fff; border: 2px solid var(--border); border-radius: 14px; padding: 12px 16px 12px 52px; margin-bottom: 12px; line-height: 1.8; }
  .wk-cell.fresh { animation: rowIn .5s ease; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .wk-cell .stepno { position: absolute; left: 14px; top: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff; font-size: .85rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }

  /* พจน์กำลังเดียวกันติดสีเดียวกันเพื่อให้เห็นว่ารวมกลุ่มกัน */
  .g0 { background: #DBEAFE; color: #1E40AF; border-radius: 5px; padding: 0 4px; }
  .g1 { background: #FDE68A; color: #92400E; border-radius: 5px; padding: 0 4px; }
  .g2 { background: #FBCFE8; color: #9D174D; border-radius: 5px; padding: 0 4px; }
  .g3 { background: #D9F99D; color: #3F6212; border-radius: 5px; padding: 0 4px; }

  svg.diag { display: block; width: 100%; max-width: 460px; height: auto; margin: 10px auto; }
  /* ลูกศรกระจาย: วัดตำแหน่งจริงจาก DOM แล้วค่อยวาด svg ทับ จึงตรงกับตัวอักษรเป๊ะไม่ว่าจอกว้างแค่ไหน */
  .dist-wrap { position: relative; display: inline-block; font-size: 1.2rem; font-weight: 800; padding: 30px 4px 2px; color: var(--text); }
  .dist-wrap .dt { display: inline-block; }
  .dist-wrap .dt.active { color: var(--secondary); }
  .dist-wrap .dt.dim { opacity: .32; }
  .slider-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
  .slider-row b { min-width: 34px; }
  input[type=range] { accent-color: var(--primary); width: min(320px, 100%); }
  .slider-val { font-weight: 800; color: var(--primary); font-size: 1.1rem; min-width: 44px; }
  .err-msg { color: var(--neg); font-weight: 600; font-size: .95rem; min-height: 22px; margin-top: 4px; }

  /* วงกลมตัวเลขจับคู่ตัวประกอบ (สไตล์ลูกศร/วงกลมลายมือ) */
  .numcircle { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 38px; padding: 0 6px; border-radius: 19px; border: 2.5px solid var(--border); font-weight: 800; font-size: 1.05rem; background: #fff; color: var(--text); }
  .numcircle.hit { border-color: #3F6212; color: #3F6212; background: #ECFDF0; }
  .numcircle.sel { border-color: var(--primary); background: #E3F3D8; }
  .numcircle.wrong { border-color: var(--neg); color: var(--neg); background: var(--neg-bg); }
  .numcircle.c-green { border-color: #3F6212; color: #3F6212; background: #ECFDF0; }
  .numcircle.c-purple { border-color: #7C3AED; color: #5B21B6; background: #F5F3FF; }
  /* ต้นไม้ตัวประกอบ: เขียนพหุนาม แล้วคู่ตัวเลขห้อยใต้พจน์ที่ถูกแตก (ตำแหน่งวัดจาก DOM ใน layoutFtrees) */
  /* overflow-anchor: none กัน Chrome เลื่อนจอชดเชยตอนความสูงการ์ดเปลี่ยน ซึ่งทำให้ตำแหน่งที่วัดไว้ก่อนหน้ากลายเป็นค่าเก่า (ดูสาเหตุจริงใน layoutFtrees) */
  .ftree { position: relative; margin: 16px 0 10px 8px; width: fit-content; max-width: 100%; overflow-anchor: none; }
  .ft-poly { display: flex; gap: .35em; align-items: baseline; font-size: 1.35rem; font-weight: 800; white-space: nowrap; }
  .ft-cols { position: relative; }
  .ft-col { position: absolute; top: 26px; display: flex; flex-direction: column; gap: 8px; }
  .ft-row { position: relative; display: flex; gap: 6px; background: none; border: none; padding: 0; font: inherit; }
  button.ft-row { cursor: pointer; }
  button.ft-row:hover .numcircle { border-color: var(--primary); }
  .ft-row.dim { opacity: .35; }
  .ft-notes { display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .ft-note { white-space: nowrap; font-weight: 700; font-size: .95rem; }
  .ft-note.hit { color: #047857; }
  .ft-note.wrong { color: var(--neg); }
  .ft-sum { font-weight: 700; margin-top: 2px; }
  /* แถบทดลอง: คู่หน้า + คู่หลังที่ลองแล้วผิด พร้อมเส้นจับคู่/ผลคูณ ใต้แผนภาพหลัก */
  .ft-trial { position: relative; margin: 14px 0 4px; padding-top: 2px; overflow-anchor: none; }
  .ft-trial-row { display: flex; gap: 44px; margin: 4px 0 66px; align-items: center; }
  /* ชิ้นส่วนตอนดึงตัวร่วม: ส้ม = ชิ้นร่วมทุกพจน์มี, ฟ้า = ชิ้นที่เหลือ */
  /* ภาพเคลื่อนไหวกำลังสองสมบูรณ์ */
  svg.sq-anim [data-sq] { transition: transform .9s ease, fill .6s, stroke .6s, stroke-width .6s, opacity .6s; }
  svg.sq-anim.sq-instant [data-sq] { transition: none !important; }
  .sq-eq { text-align: center; font-size: 1.25rem; font-weight: 800; color: var(--primary); margin: 6px 0 4px; min-height: 5.6em; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .pc { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 32px; padding: 0 6px; border-radius: 9px; font-weight: 800; font-size: 1.05rem; }
  .pc.com { background: #FFEDD5; border: 2.5px solid #F97316; color: #9A3412; }
  .pc.rest { background: #DBEAFE; border: 2.5px solid #2563EB; color: #1E40AF; }
  .pc-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 800; font-size: 1.1rem; margin: 8px 0; }
  .pc-row .pc-label { min-width: 52px; text-align: right; }
  /* ดึงตัวร่วมออกหน้าวงเล็บ: แถวบนกระจาย [3x²]∙(x)+[3x²]∙(2) แถวล่างรวมเป็น [3x²]( (x)+(2) ) ลูกศรวัดจาก DOM (drawPullOut) */
  .pullout { position: relative; padding: 4px 4px 40px; overflow-anchor: none; }
  .po-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 800; font-size: 1.1rem; }
  .po-row + .po-row { margin-top: 48px; }

  .pascal { display: flex; justify-content: center; gap: 30px; margin: 18px 0; flex-wrap: wrap; }
  .pterm { text-align: center; }
  .pterm .co { font-size: 1.3rem; font-weight: 800; color: var(--secondary); }
  .pterm .expr { font-size: 1.15rem; font-weight: 700; margin-top: 4px; }
  .pterm .arrows { font-size: .8rem; color: var(--muted); margin-top: 4px; }

  .quiz-q { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }
  .quiz-opts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .quiz-opt { padding: 10px 20px; border: 2px solid var(--border); border-radius: 30px; cursor: pointer; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 600; transition: all .2s; background: white; }
  .quiz-opt:hover { border-color: var(--primary); color: var(--primary); }
  .quiz-opt.correct { border-color: var(--accent); background: #ECFDF5; color: #047857; }
  .quiz-opt.wrong { border-color: var(--secondary); background: #FFF4EC; color: #BE185D; }
  .quiz-feedback { font-weight: 700; font-size: 1rem; min-height: 24px; }
  .quiz-feedback.ok { color: #047857; }
  .quiz-feedback.err { color: #BE185D; }
  .btn-next { margin-top: 10px; padding: 10px 28px; background: var(--primary); color: white; border: none; border-radius: 30px; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s; }
  .btn-next:hover { background: #142B1A; }
  .score-badge { display: inline-block; background: linear-gradient(135deg,#68EF3F,#1C3B22); color: white; border-radius: 30px; padding: 6px 20px; font-weight: 700; font-size: 1rem; }

  @media (max-width: 700px) {
    header h1 { font-size: 1.4rem; }
    .card { padding: 20px 14px; }
    .tab-btn { font-size: .85rem; padding: 8px 10px; }
    .wk-cell { padding-left: 46px; }
    .pascal { gap: 14px; }
  }
/* ── theme:start — สร้างโดย tools/build_lessons.py ห้ามแก้มือ (แก้ที่สคริปต์แล้วรันใหม่) ── */
:root{ --page:#2E4A8C; }
:root[data-theme="light"]{
  --bg:#F4F4F1; --card:#FFFFFF; --text:#16181A; --muted:#5E6166; --border:#DEDED8;
  --primary:color-mix(in srgb, var(--page) 86%, #000); --primary-2:color-mix(in srgb, var(--page) 62%, #000);
  --secondary:#C2540A; --secondary-light:#F2A15F; --accent:#68EF3F; --accent-2:#2E9E3F;
  --shadow:0 2px 10px rgba(0,0,0,.07);
  --strong:color-mix(in srgb, var(--page) 76%, #000); --chip:#E8E8E3; --chip-hover:#DCDCD5;
  --hero:color-mix(in srgb, var(--page) 82%, #000);
  --g-x:#E53935; --g-y:#2E9E4F; --g-z:#3949AB; --g-curve:#F07400; --g-curve-fill:rgba(240,116,0,.12);
  --g-pink:#D81B60; --g-plane:rgba(60,190,200,.28); --g-cone:rgba(153,51,0,.20); --g-cone-line:rgba(153,51,0,.35);
  --g-blue:#1E66D0; --g-red:#D32F2F; --g-green:#2E9E4F; --g-purple:#7B3FC4; --g-orange:#E8710A; --g-teal:#0F8A80;
  --g-ring:#FFFFFF;
}
:root[data-theme="dark"]{
  --bg:#121212; --card:#1C1C1C; --text:#FFFFFF; --muted:#B3B3B3; --border:#333333;
  --primary:#8ca3d9; --primary-2:#abbbe3;
  --secondary:#FFB37A; --secondary-light:#FFD0A8; --accent:#8AF25E; --accent-2:#5BD27E;
  --shadow:0 8px 24px rgba(0,0,0,.5);
  --strong:color-mix(in srgb, var(--page) 48%, #1C1C1C); --chip:#2A2A2A; --chip-hover:#353535;
  --hero:color-mix(in srgb, var(--page) 62%, #000);
  --g-x:#FF6B6B; --g-y:#5BD27E; --g-z:#8C9BFF; --g-curve:#FFA040; --g-curve-fill:rgba(255,160,64,.16);
  --g-pink:#FF5C9A; --g-plane:rgba(90,220,230,.26); --g-cone:rgba(255,170,110,.18); --g-cone-line:rgba(255,170,110,.45);
  --g-blue:#6AA8FF; --g-red:#FF6B6B; --g-green:#5BD27E; --g-purple:#B48CFF; --g-orange:#FFA040; --g-teal:#4FD1C5;
  --g-ring:#1C1C1C;
}
html{ background:var(--bg); }
html[data-theme="dark"]{ color-scheme:dark; }
body{ font-family:'Anuphan',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; -webkit-font-smoothing:antialiased; }

/* หัวหน้า: สีปกของเรื่อง + ปก */
header{
  background:var(--hero); color:#fff; text-align:left;
  display:grid; grid-template-columns:auto 1fr; column-gap:22px; align-items:end;
  padding:62px 32px 26px;
}
header::before, header::after{ display:none !important; }
header > *:not(.lesson-cover):not(.back-link):not(.lang-toggle):not(.theme-toggle){ grid-column:2; }
.lesson-cover{ grid-column:1; grid-row:1 / span 6; align-self:end; width:120px; aspect-ratio:1; border-radius:6px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.45); }
.lesson-cover svg{ display:block; width:100%; height:100%; }
header h1{ font-size:clamp(1.8rem, 4.2vw, 2.9rem); font-weight:700; letter-spacing:-.01em; line-height:1.25; margin:0; color:#fff; }
header p{ font-size:1rem; opacity:.85; margin:6px 0 0; color:#fff; }
.back-link{
  top:14px; left:20px; display:inline-flex; align-items:center; gap:6px;
  padding:6px 14px; border-radius:999px; background:rgba(0,0,0,.32); color:#fff;
  font-size:.88rem; font-weight:600; opacity:1; text-decoration:none;
}
.back-link:hover{ background:rgba(0,0,0,.55); text-decoration:none; }
.lang-toggle, .theme-toggle{
  position:absolute; top:14px; height:34px; background:transparent; color:#fff;
  border:1px solid rgba(255,255,255,.55); border-radius:999px; font-family:inherit; font-weight:700; font-size:.85rem; cursor:pointer; z-index:2;
}
.lang-toggle{ right:20px; padding:0 16px; }
.theme-toggle{ right:86px; width:34px; padding:0; display:grid; place-items:center; }
.theme-toggle svg{ width:18px; height:18px; }
.lang-toggle:hover, .theme-toggle:hover{ background:rgba(255,255,255,.14); border-color:#fff; }
body > .lang-toggle, body > .theme-toggle{ position:fixed; top:14px; z-index:50; background:var(--card); color:var(--text); border-color:var(--border); box-shadow:var(--shadow); }
body > .lang-toggle{ right:14px; } body > .theme-toggle{ right:80px; }
body > .lang-toggle:hover, body > .theme-toggle:hover{ background:var(--chip); border-color:var(--text); }
header:not(:has(.back-link)):not(:has(.lang-toggle)){ padding-top:28px; border-radius:8px; }

/* แถบแท็บ: ชิปทรงแคปซูล */
nav{ background:var(--bg); border-bottom:1px solid var(--border); padding:10px 16px; gap:8px; }
.tab-btn{
  font-family:inherit; border:0; margin:0; border-radius:999px; padding:8px 16px;
  background:var(--chip); color:var(--text); font-weight:600; font-size:.9rem;
}
.tab-btn:hover{ background:var(--chip-hover); color:var(--text); }
.tab-btn.active{ background:var(--text); color:var(--bg); border-bottom-color:transparent; }

/* การ์ดและกล่อง */
.card{ background:var(--card); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow); }
.card-title{ color:var(--text); font-size:1.2rem; }
.card-title .icon{ display:none; }
.desc-text{ color:var(--text); font-size:1rem; }
.formula, .step.result, .stats{ background:var(--strong) !important; color:#fff; border-radius:8px; letter-spacing:0; }
.stat .k, .step-tag{ text-transform:none; letter-spacing:0; }

/* ปุ่ม */
.btn-action{ font-family:inherit; background:var(--text); color:var(--bg); }
.btn-action.secondary{ background:transparent; color:var(--text); border:1px solid var(--muted); }
.mode-btn{ font-family:inherit; border:1px solid var(--border); background:var(--card); color:var(--text); }
.mode-btn:hover{ border-color:var(--text); color:var(--text); }
.mode-btn.active{ background:var(--text); border-color:var(--text); color:var(--bg); }
.quiz-opt{ border-radius:8px; }
input[type=range]{ accent-color:var(--primary); }

@media (max-width:600px){
  header{ padding:58px 16px 20px; column-gap:14px; }
  .lesson-cover{ width:76px; }
  .back-link{ left:12px; max-width:calc(100% - 150px); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; display:block; }
  .lang-toggle{ right:12px; }
  .theme-toggle{ right:74px; }

<script>
// ══════════════ ภาษาไทย/อังกฤษ (ค่าใน data-th/data-en ถือเป็น HTML — ดู docs/adr/0002) ══════════════
const PAGE_TITLE = { th: "สื่อการสอน : การดำเนินการพหุนามและการแยกตัวประกอบ ม.4", en: "Teaching Aid: Polynomial Operations & Factoring" };
let langMemory = 'th';
function getLang() { try { return localStorage.getItem('siteLang') || 'th'; } catch (e) { return langMemory; } }
function applyLang(lang) {
  document.documentElement.lang = lang;
  document.title = PAGE_TITLE[lang];
  document.querySelectorAll('[data-th]').forEach(el => { el.innerHTML = (lang === 'en' && el.dataset.en) ? el.dataset.en : el.dataset.th; });
  const btn = document.getElementById('langToggle');
  if (btn) btn.textContent = lang === 'en' ? 'ไทย' : 'EN';
  if (typeof onLangChange === 'function') onLangChange(lang);
}
function toggleLang() {
  const next = getLang() === 'en' ? 'th' : 'en';
  langMemory = next;
  try { localStorage.setItem('siteLang', next); } catch (e) {}
  applyLang(next);
}
function onLangChange() { renderAll(); refreshQuizLang(); }
function renderAll() { renderOps(); renderFac(); renderSq(); renderForm(); requestAnimationFrame(drawAllArrows); }

// สีมาตรฐาน 3 ขั้นที่ใช้ทุกที่ที่มีการกระจาย/ดึงทีละขั้น (ฟ้า→ส้ม→ม่วง)
const STEP_COLOR = ['#2563EB', '#EA580C', '#9333EA'];
// สร้างนิพจน์ (ก)(ข) เป็น <span> รายพจน์ — พจน์ที่กำลังกระจายเน้นสีส้ม(active) ฝั่งตรงข้ามทั้งหมดเป็นเป้าลูกศร (สีเดียวกันหมดตามขั้นที่ระบุ) ฝั่งเดียวกันที่ไม่ใช่ตัวกระจายให้จาง
function distExpr(leftTerms, rightTerms, activeSide, activeIdx, color) {
  const mk = (terms, side) => terms.map((t, i) => {
    const isActive = side === activeSide && i === activeIdx;
    const isTarget = side !== activeSide;
    const cls = isActive ? 'dt active' : (isTarget ? 'dt' : 'dt dim');
    const role = isActive ? 'from' : (isTarget ? 'to' : '');
    const colorAttr = isTarget && color ? ` data-gcolor="${color}"` : '';
    return `<span class="${cls}"${role ? ` data-role="${role}"` : ''}${colorAttr}>${t}</span>`;
  }).join('');
  return `<div class="dist-wrap" data-arrows>(${mk(leftTerms, 'l')})(${mk(rightTerms, 'r')})</div>`;
}
// วัดตำแหน่งพจน์ "ต้นทาง" กับทุกพจน์ "ปลายทาง" จริงจาก DOM แล้ววาดเส้นโค้งลูกศรทับ (แม่นยำไม่ว่าฟอนต์/จอกว้างแค่ไหน)
function drawDistArrows() {
  document.querySelectorAll('.dist-wrap[data-arrows]').forEach(wrap => {
    const from = wrap.querySelector('[data-role="from"]');
    const tos = [...wrap.querySelectorAll('[data-role="to"]')];
    wrap.querySelectorAll('.dist-arrows-svg').forEach(e => e.remove());
    if (!from || !tos.length) return;
    const wr = wrap.getBoundingClientRect();
    const fr = from.getBoundingClientRect();
    const fx = fr.left + fr.width / 2 - wr.left, fy = fr.top - wr.top;
    const colors = [...new Set(tos.map(t => t.dataset.gcolor || '#FF8A3D'))];
    let svg = `<svg class="dist-arrows-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;pointer-events:none;">
      <defs>${colors.map(c => `<marker id="distArrow-${c.slice(1)}" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="${c}"/></marker>`).join('')}</defs>`;
    tos.forEach((to, i) => {
      const tr = to.getBoundingClientRect();
      const tx = tr.left + tr.width / 2 - wr.left, ty = tr.top - wr.top;
      const midY = Math.min(fy, ty) - 20 - i * 4;
      const c = to.dataset.gcolor || '#FF8A3D';
      svg += `<path d="M${fx},${fy} Q${(fx + tx) / 2},${midY} ${tx},${ty}" fill="none" stroke="${c}" stroke-width="2" marker-end="url(#distArrow-${c.slice(1)})"/>`;
    });
    wrap.insertAdjacentHTML('beforeend', svg + '</svg>');
  });
}
// ═══════════════════════ ดึงตัวร่วม: แตกเป็นชิ้นสี แล้วดึงชิ้นร่วมออกหน้าวงเล็บ ═══════════════════════
// terms: พจน์ตั้งต้น 2 พจน์ (string), common: ตัวร่วมที่ดึงออก (string), rests: พจน์ที่เหลือหลังดึง 2 ตัว (string[])
function pullOutHtml(terms, common, rests) {
  const top = `<div class="po-row">
    <span>${terms[0]}</span><span>${terms[1]}</span><span> = </span>
    <span class="pc com" data-role="src0">${common}</span><span>·</span><span class="pc rest" data-role="restA0">${rests[0]}</span>
    <span> + </span>
    <span class="pc com" data-role="src1">${common}</span><span>·</span><span class="pc rest" data-role="restA1">${rests[1]}</span>
  </div>`;
  const bot = `<div class="po-row">
    <span> = </span><span class="pc com" data-role="dst">${common}</span>
    <span>( </span><span class="pc rest" data-role="restB0">${rests[0]}</span><span> + </span><span class="pc rest" data-role="restB1">${rests[1]}</span><span> )</span>
  </div>`;
  return `<div class="pullout" data-pullout>${top}${bot}</div>`;
}
// ลูกศรส้ม 2 เส้น: ตัวร่วมทั้งสองตัวแถวบนบรรจบเป็นตัวเดียวแถวล่าง — ลูกศรฟ้า: พจน์ที่เหลือแต่ละตัวชี้ตรงลงไปยังตัวเดียวกันในวงเล็บ
function drawPullOut() {
  document.querySelectorAll('[data-pullout]').forEach(wrap => {
    wrap.querySelectorAll('.ft-svg').forEach(e => e.remove());
    const src0 = wrap.querySelector('[data-role="src0"]'), src1 = wrap.querySelector('[data-role="src1"]'), dst = wrap.querySelector('[data-role="dst"]');
    const rA0 = wrap.querySelector('[data-role="restA0"]'), rA1 = wrap.querySelector('[data-role="restA1"]');
    const rB0 = wrap.querySelector('[data-role="restB0"]'), rB1 = wrap.querySelector('[data-role="restB1"]');
    if (!src0 || !dst) return;
    const wr = wrap.getBoundingClientRect();
    if (!wr.width) return;
    const P = el => { const b = el.getBoundingClientRect(); return { x: b.left + b.width / 2 - wr.left, top: b.top - wr.top, bot: b.bottom - wr.top }; };
    let svg = `<svg class="ft-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;pointer-events:none;">
      <defs>
        <marker id="poArrowO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#F97316"/></marker>
        <marker id="poArrowB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#2563EB"/></marker>
      </defs>`;
    [src0, src1].forEach(s => { const S = P(s), D = P(dst);
      svg += `<path d="M${S.x},${S.bot} Q${(S.x + D.x) / 2},${(S.bot + D.top) / 2 + 16} ${D.x},${D.top}" fill="none" stroke="#F97316" stroke-width="2.5" marker-end="url(#poArrowO)"/>`;
    });
    [[rA0, rB0], [rA1, rB1]].forEach(([a, b]) => { if (!a || !b) return; const A = P(a), B = P(b);
      svg += `<path d="M${A.x},${A.bot} L${B.x},${B.top - 2}" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#poArrowB)"/>`;
    });
    wrap.insertAdjacentHTML('beforeend', svg + '</svg>');
  });
}
function drawAllArrows() { drawDistArrows(); drawPullOut(); layoutFtrees(); drawTrials(); }
// วาดใหม่เมื่อหน้าจอเปลี่ยนขนาด (debounce) และเมื่อฟอนต์ Sarabun โหลดเสร็จ (โหลดช้ากว่า layout แรกเสมอ ทำให้ตำแหน่งที่วัดไว้ตอนแรกคลาดเคลื่อน)
let _ftResizeT;
window.addEventListener('resize', () => { clearTimeout(_ftResizeT); _ftResizeT = setTimeout(drawAllArrows, 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawAllArrows);

// เข้าแท็บที่มีตัวแสดงขั้นตอนทีไร เริ่มที่ 0 ขั้นเสมอ (ยังไม่เฉลย)
function showTab(id) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  event.target.classList.add('active');
  if (['op', 'fac', 'sq', 'form'].includes(id)) { resetWkAll(); renderAll(); }
}

// ══════════════ ตัวช่วย ══════════════
const EN = () => getLang() === 'en';
const frac = (n, d) => `<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;
const T = (th, en) => ({ th, en });
const tx = v => typeof v === 'string' ? v : v[getLang()];
const al = rows => `<div class="align">${rows.map(r => Array.isArray(r)
  ? `<span class="l">${r[0]}</span><span class="m">${r[1]}</span><span class="r">${r[2]}</span>` : `<span class="full">${r}</span>`).join('')}</div>`;
const P = s => `<div>${s}</div>`;
const sgn = v => v.toString().replace('-', '−');
const g = (n, cls) => `<span class="${cls}">${n}</span>`;
const markChips = btn => btn.parentNode.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b === btn));

// ═══════════════════════ ตัวแสดงขั้นตอนทีละขั้น (ทุกแท็บใช้ร่วมกัน) ═══════════════════════
const WK = {};
const wkShown = {};
function addWk(key, w) { WK[key] = w; wkShown[key] = 0; }
function resetWkAll() { Object.keys(WK).forEach(k => wkShown[k] = 0); }
function wkHtml(key, prev) {
  const w = WK[key], en = EN(), n = w.steps.length;
  let h = `<div class="card" id="wk-${key}">
    <div class="card-title"><span class="icon">✏️</span><span>${tx(w.title)}</span></div>
    ${w.intro ? `<p class="intro">${tx(w.intro)}</p>` : ''}
    <div class="formula">${w.prob}</div>`;
  w.steps.forEach((s, i) => {
    if (i >= wkShown[key]) return;
    // ขั้นแรกเขียนโจทย์ตั้งต้นซ้ำก่อนลงมือ (ขั้นถัดไปเห็นสมการก่อนหน้าจากกล่องที่ยังเปิดค้างไว้ด้านบนอยู่แล้ว)
    const echo = i === 0 ? P('<b>' + w.prob + '</b>') : '';
    h += `<div class="wk-cell${i >= prev ? ' fresh' : ''}"><span class="stepno">${i + 1}</span>${echo}${tx(s.h)}${s.vis ? `<div>${s.vis()}</div>` : ''}</div>`;
  });
  h += `<div class="btn-row">
      <button class="btn" onclick="wkNext('${key}')" ${wkShown[key] >= n ? 'disabled' : ''}>${en ? 'Next step ▶' : 'ขั้นถัดไป ▶'} (${wkShown[key]}/${n})</button>
      <button class="btn ghost" onclick="wkAll('${key}')" ${wkShown[key] >= n ? 'disabled' : ''}>${en ? 'Show all' : 'เผยทั้งหมด'}</button>
      <button class="btn ghost" onclick="wkReset('${key}')" ${wkShown[key] === 0 ? 'disabled' : ''}>${en ? '↺ Reset' : '↺ เริ่มใหม่'}</button>
    </div></div>`;
  return h;
}
function wkRender(key, prev) { const el = document.getElementById('wk-' + key); if (el) el.outerHTML = wkHtml(key, prev); requestAnimationFrame(drawAllArrows); }
function wkNext(k) { const p = wkShown[k]; if (wkShown[k] < WK[k].steps.length) wkShown[k]++; wkRender(k, p); }
function wkAll(k) { const p = wkShown[k]; wkShown[k] = WK[k].steps.length; wkRender(k, p); }
function wkReset(k) { wkShown[k] = 0; wkRender(k, 0); }

const SEL = { op: 1, fac: 1 };
function chipRow(kind, labels) {
  return `<div class="chips">${labels.map((l, i) => `<button class="chip ${SEL[kind] === i + 1 ? 'active' : ''}" onclick="setSel('${kind}', ${i + 1})">${l}</button>`).join('')}</div>`;
}
function setSel(kind, n) { SEL[kind] = n; resetWkAll(); renderAll(); }

// ═══════════════════════ TAB 1: การดำเนินการ (บวก ลบ คูณ) ═══════════════════════
addWk('add1', { title: T('ตัวอย่าง: การบวก', 'Example: addition'), prob: '(2x + 3) + (4x² + 4x + 1)',
  steps: [

// ═══ ตัวช่วยของ mul1/mul2: แต่ละขั้นกระจาย "สีของขั้นนั้น" เหมือนกันทั้งลูกศรและพจน์ผลลัพธ์ แล้วต่อบรรทัด "=" ให้ยาวขึ้นเรื่อยๆ ทีละขั้น ═══
const SUP = { 0: '', 1: '', 2: '²', 3: '³', 4: '⁴' };
const GROUP_SYM = { 0: '☆', 1: '○', 2: '□', 3: '△' };
// เขียนพจน์เดี่ยว {c,d} เป็นข้อความ เช่น (5,2)→"5x²", (-1,3)→"− x³" (สัมประสิทธิ์ 1 ไม่แสดง) — first: ไม่ใส่เครื่องหมาย + นำหน้า
function termStr(c, d, first) {
  const av = Math.abs(c);
  const varStr = d === 0 ? '' : 'x' + (SUP[d] || '');
  const coefStr = (av === 1 && d !== 0) ? '' : String(av);
  const body = coefStr + varStr;
  return first ? (c < 0 ? '−' : '') + body : (c < 0 ? ' − ' : ' + ') + body;
}
function flattenSteps(steps) {
  const flat = [];
  steps.forEach((s, si) => s.terms.forEach(t => flat.push({ c: t.c, d: t.d, step: si })));
  return flat;
}
// คืนอาเรย์บรรทัด "=" หนึ่งบรรทัดต่อขั้น ให้แต่ละขั้นดึง[i]ไปต่อท้าย h ของตัวเอง (ของเก่าคงสีเดิม ของใหม่ที่เพิ่งเติมตัวหนา)
function growSteps(steps, prob) {
  const flat = flattenSteps(steps);
  let before = 0;
  return steps.map(s => {
    const upto = before + s.terms.length;
    const html = flat.slice(0, upto).map((t, i) => {
      const bold = i >= before;
      return `<span style="color:${STEP_COLOR[t.step]};${bold ? 'font-weight:800' : ''}">${termStr(t.c, t.d, i === 0)}</span>`;
    }).join('');
    const line = `<div class="ft-sum" style="margin-top:10px;">${before === 0 ? prob + ' = ' : '= '}${html}</div>`;
    before = upto;
    return line;
  });
}
// ขั้นรวมพจน์เหมือนสุดท้าย: พจน์เลขชี้กำลังเดียวกัน (≥2 พจน์) ติดสัญลักษณ์ใต้พจน์ (ตัวหนังสือคงสีของขั้นที่มา) แล้วโชว์บรรทัดรวมทีละกลุ่ม
function combineStepHtml(steps) {
  const flat = flattenSteps(steps);
  const byDeg = {};
  flat.forEach(t => (byDeg[t.d] = byDeg[t.d] || []).push(t));
  const groupDegs = Object.keys(byDeg).map(Number).filter(d => byDeg[d].length >= 2).sort((a, b) => b - a);
  const line = flat.map((t, i) => {
    // white-space:pre — ไม่งั้นช่องว่างหน้าเครื่องหมาย +/− ถูกตัดทิ้งเมื่ออยู่ใน inline-flex ทำให้ระยะห่างระหว่างพจน์ไม่เท่ากัน
    const span = `<span style="color:${STEP_COLOR[t.step]};white-space:pre;">${termStr(t.c, t.d, i === 0)}</span>`;
    if (!groupDegs.includes(t.d)) return span;
    return `<span style="display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;">${span}<span style="font-size:.95em;line-height:1;color:var(--text);">${GROUP_SYM[t.d]}</span></span>`;
  }).join('');
  const groupLines = groupDegs.map(d => {
    const members = byDeg[d];
    const expr = members.map((t, i) => `<span style="color:${STEP_COLOR[t.step]};">${termStr(t.c, t.d, i === 0)}</span>`).join('');
    const sum = members.reduce((s, t) => s + t.c, 0);
    return `<div>${GROUP_SYM[d]} ${d === 0 ? '' : 'x' + (SUP[d] || '')}: ${expr} = <b>${termStr(sum, d, true)}</b></div>`;
  });
  const finalTerms = [];
  Object.keys(byDeg).map(Number).sort((a, b) => b - a).forEach(d => {
    const sum = byDeg[d].reduce((s, t) => s + t.c, 0);
    if (sum !== 0) finalTerms.push({ c: sum, d });
  });
  const finalLine = finalTerms.map((t, i) => termStr(t.c, t.d, i === 0)).join('');
  return `<div class="ft-sum">${line}</div>${groupLines.join('')}<div class="ft-sum" style="margin-top:6px;">= <b>${finalLine}</b></div>`;
}

// เขียนตัวประกอบของ n ทุกคู่ (ไม่เรียงซ้ำ ไม่นับสลับข้าง) แล้วลองใส่เครื่องหมายตามกฎ เพื่อดูว่าคู่ไหนบวกกันได้ตรงพจน์กลาง
function divPairsHalf(n) { n = Math.abs(n); const out = []; for (let i = 1; i * i <= n; i++) if (n % i === 0) out.push([i, n / i]); return out; }
// ตัวประกอบของ a ต้องนับทั้งสองข้าง (สลับ p,q) เพราะ p ผูกกับวงเล็บหน้า q ผูกกับวงเล็บหลัง สลับแล้วได้ผลไขว้ต่างกัน
function divPairsFull(n) { n = Math.abs(n); const out = []; for (let i = 1; i <= n; i++) if (n % i === 0) out.push([i, n / i]); return out; }
// คู่ตัวประกอบของ c พร้อมเครื่องหมาย เรียงตัวใหญ่ก่อนแบบที่ครูเขียนมือ ("2 1" แล้ว "−2 −1")
// bothOrders: ตอน a≠1 ลำดับสำคัญ (ตัวซ้ายคูณกับตัวหน้าซ้าย) จึงต้องมีทั้ง "2 1" และ "1 2" ไม่งั้นเลือกตัวหน้าบางแบบแล้วจะไม่มีคู่หลังที่ถูก
function backPairs(c, bothOrders) {
  const out = [];
  divPairsHalf(c).forEach(([i, j]) => (c >= 0 ? [[j, i], [-j, -i]] : [[j, -i], [-j, i]]).forEach(k => {
    out.push(k);
    if (bothOrders && k[0] !== k[1]) out.push([k[1], k[0]]);
  }));
  return out;
}
// เหมือน backPairs แต่กรองเฉพาะเครื่องหมายที่เลือกไว้แล้ว (sign: 'pp' บวกทั้งคู่ / 'nn' ลบทั้งคู่ / 'pn' ต่างกันทั้งสองแบบ)
function backPairsForSign(c, sign, bothOrders) {
  const out = [];
  divPairsHalf(c).forEach(([i, j]) => {
    const variants = sign === 'pp' ? [[j, i]] : sign === 'nn' ? [[-j, -i]] : [[j, -i], [-j, i]];
    variants.forEach(k => { out.push(k); if (bothOrders && k[0] !== k[1]) out.push([k[1], k[0]]); });
  });

window.addEventListener('load', () => { initQuiz(); applyLang(getLang()); });
</script>
