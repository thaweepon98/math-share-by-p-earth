<!DOCTYPE html>
<html lang="th">
<head>
<script id="theme-boot">(function(){var t='light';try{t=localStorage.getItem('siteTheme')||'light'}catch(e){}document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สื่อการสอน : เทียบความต่างของโจทย์ สมการ vs อสมการ ม.4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap');

  :root {
    --primary: #1C3B22; --secondary: #FF8A3D; --accent: #68EF3F; --accent-2: #3FA82E; --warning: #FFB347;
    --bg: #F3F7EC; --card: #FFFFFF; --text: #2D3748; --muted: #718096; --border: #E2E8F0;
    --shadow: 0 4px 24px rgba(28,59,34,0.10); --radius: 16px;
    --pos: #047857; --pos-bg: #ECFDF5; --neg: #BE185D; --neg-bg: #FFF4EC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Anuphan', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: linear-gradient(135deg, #1C3B22 0%, #2E5936 100%); color: white; padding: 28px 40px 20px; text-align: center; position: relative; overflow: hidden; }
  header::before { content: ''; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; background: rgba(255,255,255,0.07); border-radius: 50%; }
  header h1 { font-size: 2rem; font-weight: 800; letter-spacing: .5px; }
  header p { font-size: 1rem; opacity: .85; margin-top: 4px; }
  .back-link { position: absolute; top: 14px; left: 20px; color: white; text-decoration: none; font-size: .85rem; font-weight: 600; opacity: .9; z-index: 2; }
  .back-link:hover { opacity: 1; text-decoration: underline; }
  .lang-toggle { position: absolute; top: 14px; right: 20px; background: rgba(255,255,255,.15); color: white; border: 1.5px solid rgba(255,255,255,.5); border-radius: 20px; padding: 5px 14px; font-family: 'Anuphan', sans-serif; font-size: .8rem; font-weight: 700; cursor: pointer; z-index: 2; }
  .lang-toggle:hover { background: rgba(255,255,255,.28); }

  nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 20px 24px 0; background: white; border-bottom: 3px solid var(--border); }
  .tab-btn { padding: 10px 18px; border: none; background: transparent; border-radius: 10px 10px 0 0; font-family: 'Anuphan', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .25s; border-bottom: 3px solid transparent; margin-bottom: -3px; }
  .tab-btn:hover { color: var(--primary); background: #E3F3D8; }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: #E3F3D8; }

  main { max-width: 1040px; margin: 0 auto; padding: 32px 20px 60px; }
  .tab-panel { display: none; animation: fadeIn .35s ease; }
  .tab-panel.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 32px; margin-bottom: 24px; }
  .card-title { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .card-title .icon { font-size: 1.5rem; }
  .intro { font-size: 1.02rem; line-height: 1.7; margin-bottom: 14px; }

  .box-info { background: #EEF7E6; border-left: 4px solid var(--primary); border-radius: 10px; padding: 14px 18px; margin: 14px 0; }
  .box-warn { background: #FFF7ED; border-left: 4px solid var(--warning); border-radius: 10px; padding: 14px 18px; margin: 14px 0; }
  .box-ok   { background: #ECFDF5; border-left: 4px solid var(--accent);  border-radius: 10px; padding: 14px 18px; margin: 14px 0; }

  .btn { padding: 10px 26px; background: var(--primary); color: white; border: none; border-radius: 30px; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s, opacity .2s; }
  .btn:hover:not(:disabled) { background: #2E5936; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: white; color: var(--primary); border: 2px solid var(--primary); }
  .btn.ghost:hover:not(:disabled) { background: #E3F3D8; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }

  .frac { display: inline-flex; flex-direction: column; align-items: center; font-weight: 700; line-height: 1; vertical-align: middle; margin: 0 4px; }
  .frac .num { font-size: 1em; border-bottom: 2.5px solid currentColor; padding-bottom: 2px; min-width: 18px; text-align: center; white-space: nowrap; }
  .frac .den { font-size: 1em; padding-top: 3px; min-width: 18px; text-align: center; white-space: nowrap; }

  /* ── ตารางเทียบ 2 ฝั่ง: หัวโจทย์ + แถวขั้นตอน (ซ้าย = สมการ, ขวา = อสมการ) ── */
  .cmp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cmp-head { border-radius: 14px; padding: 14px 16px; text-align: center; color: white; font-weight: 800; }
  .cmp-head.eq   { background: linear-gradient(135deg,#1C3B22,#2E5936); }
  .cmp-head.ineq { background: linear-gradient(135deg,#C2570C,#FF8A3D); }
  .cmp-head .kind { font-size: .85rem; font-weight: 700; opacity: .9; margin-bottom: 4px; }
  .cmp-head .prob { font-size: 1.35rem; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px; }
  .cmp-cell { position: relative; background: #fff; border: 2px solid var(--border); border-radius: 14px; padding: 12px 14px; font-size: 1rem; line-height: 1.8; min-height: 64px; }
  .cmp-cell .lab { display: none; font-size: .78rem; font-weight: 800; color: var(--muted); margin-bottom: 2px; }
  .cmp-cell.fresh { animation: rowIn .5s ease; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .cmp-cell.diff { border-color: var(--secondary); background: #FFF9F2; box-shadow: 0 0 0 3px rgba(255,138,61,.18); }
  /* เลขขั้นวางมุมซ้ายบนของกล่อง ไม่แย่งบรรทัดกับสมการ (สมการที่จัดแนวเป็นบล็อก จะได้ไม่ถูกดันลงไปอีกบรรทัด) */
  .cmp-cell { padding-left: 46px; }
  .cmp-cell .stepno { position: absolute; left: 12px; top: 13px; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: white; font-size: .8rem; font-weight: 800; }
  .cmp-cell.diff .stepno { background: var(--secondary); }
  .difftag { position: absolute; top: -11px; right: 10px; background: var(--secondary); color: white; font-size: .72rem; font-weight: 800; padding: 2px 10px; border-radius: 20px; }
  .flipsign { display: inline-block; color: var(--neg); font-weight: 800; animation: flip 1.1s ease 2; }
  @keyframes flip { 0% { transform: rotate(0); } 50% { transform: rotate(180deg) scale(1.5); } 100% { transform: rotate(360deg); } }
  /* สมการแบบจัดแนวเครื่องหมาย: 3 คอลัมน์ (ซ้ายชิดขวา | เครื่องหมายกึ่งกลาง | ขวาชิดซ้าย) ทุกแถวใช้คอลัมน์ร่วมกัน เครื่องหมายจึงตรงกันเป๊ะ */
  .align { display: grid; grid-template-columns: auto auto auto; justify-content: start; column-gap: .55em; row-gap: 3px; align-items: center; margin: 4px 0; }
  .align .l { justify-self: end; text-align: right; }
  .align .m { justify-self: center; font-weight: 700; }
  .align .r { justify-self: start; }
  .align .full { grid-column: 1 / -1; }
  .vis { margin-top: 6px; }
  .vis svg { width: 100%; height: auto; display: block; }

  /* ── ตัวทดสอบ "ห้ามคูณไขว้" ── */
  .xm-row { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0; }
  .xm-box { flex: 1 1 240px; border: 2px solid var(--border); border-radius: 12px; padding: 12px 16px; background: #fff; line-height: 1.8; }
  .xm-box.bad { border-color: var(--neg); background: var(--neg-bg); }
  .xm-box.good { border-color: var(--accent-2); background: var(--pos-bg); }
  .slider-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 10px 0; }
  input[type=range] { accent-color: var(--primary); width: min(320px, 100%); }
  .slider-val { font-weight: 800; color: var(--primary); font-size: 1.15rem; min-width: 48px; }

  .quiz-q { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }
  .quiz-opts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .quiz-opt { padding: 10px 20px; border: 2px solid var(--border); border-radius: 30px; cursor: pointer; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 600; transition: all .2s; background: white; }
  .quiz-opt:hover { border-color: var(--primary); color: var(--primary); }
  .quiz-opt.correct { border-color: var(--accent); background: #ECFDF5; color: #047857; }
  .quiz-opt.wrong { border-color: var(--secondary); background: #FFF4EC; color: #BE185D; }
  .quiz-feedback { font-weight: 700; font-size: 1rem; min-height: 24px; }
  .quiz-feedback.ok { color: #047857; }
  .quiz-feedback.err { color: #BE185D; }
  .btn-next { margin-top: 10px; padding: 10px 28px; background: var(--primary); color: white; border: none; border-radius: 30px; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s; }
  .btn-next:hover { background: #142B1A; }
  .score-badge { display: inline-block; background: linear-gradient(135deg,#68EF3F,#1C3B22); color: white; border-radius: 30px; padding: 6px 20px; font-weight: 700; font-size: 1rem; }

  @media (max-width: 700px) {
    header h1 { font-size: 1.4rem; }
    .card { padding: 20px 14px; }
    .tab-btn { font-size: .85rem; padding: 8px 10px; }
    /* จอแคบ: เรียงบนลงล่าง (สมการแล้วอสมการ ทีละขั้น) และแปะป้ายบอกว่าเป็นฝั่งไหน */
    .cmp-grid { grid-template-columns: 1fr; }
    .cmp-cell .lab { display: block; }
  }
/* ── theme:start — สร้างโดย tools/build_lessons.py ห้ามแก้มือ (แก้ที่สคริปต์แล้วรันใหม่) ── */
:root{ --page:#3F6E86; }
:root[data-theme="light"]{
  --bg:#F4F4F1; --card:#FFFFFF; --text:#16181A; --muted:#5E6166; --border:#DEDED8;
  --primary:color-mix(in srgb, var(--page) 86%, #000); --primary-2:color-mix(in srgb, var(--page) 62%, #000);
  --secondary:#C2540A; --secondary-light:#F2A15F; --accent:#68EF3F; --accent-2:#2E9E3F;
  --shadow:0 2px 10px rgba(0,0,0,.07);
  --strong:color-mix(in srgb, var(--page) 76%, #000); --chip:#E8E8E3; --chip-hover:#DCDCD5;
  --hero:color-mix(in srgb, var(--page) 82%, #000);
  --g-x:#E53935; --g-y:#2E9E4F; --g-z:#3949AB; --g-curve:#F07400; --g-curve-fill:rgba(240,116,0,.12);
  --g-pink:#D81B60; --g-plane:rgba(60,190,200,.28); --g-cone:rgba(153,51,0,.20); --g-cone-line:rgba(153,51,0,.35);
  --g-blue:#1E66D0; --g-red:#D32F2F; --g-green:#2E9E4F; --g-purple:#7B3FC4; --g-orange:#E8710A; --g-teal:#0F8A80;
  --g-ring:#FFFFFF;
}
:root[data-theme="dark"]{
  --bg:#121212; --card:#1C1C1C; --text:#FFFFFF; --muted:#B3B3B3; --border:#333333;
  --primary:#97bbce; --primary-2:#b3cddb;
  --secondary:#FFB37A; --secondary-light:#FFD0A8; --accent:#8AF25E; --accent-2:#5BD27E;
  --shadow:0 8px 24px rgba(0,0,0,.5);
  --strong:color-mix(in srgb, var(--page) 48%, #1C1C1C); --chip:#2A2A2A; --chip-hover:#353535;
  --hero:color-mix(in srgb, var(--page) 62%, #000);
  --g-x:#FF6B6B; --g-y:#5BD27E; --g-z:#8C9BFF; --g-curve:#FFA040; --g-curve-fill:rgba(255,160,64,.16);
  --g-pink:#FF5C9A; --g-plane:rgba(90,220,230,.26); --g-cone:rgba(255,170,110,.18); --g-cone-line:rgba(255,170,110,.45);
  --g-blue:#6AA8FF; --g-red:#FF6B6B; --g-green:#5BD27E; --g-purple:#B48CFF; --g-orange:#FFA040; --g-teal:#4FD1C5;
  --g-ring:#1C1C1C;
}
html{ background:var(--bg); }
html[data-theme="dark"]{ color-scheme:dark; }
body{ font-family:'Anuphan',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; -webkit-font-smoothing:antialiased; }

/* หัวหน้า: สีปกของเรื่อง + ปก */
header{
  background:var(--hero); color:#fff; text-align:left;
  display:grid; grid-template-columns:auto 1fr; column-gap:22px; align-items:end;
  padding:62px 32px 26px;
}
header::before, header::after{ display:none !important; }
header > *:not(.lesson-cover):not(.back-link):not(.lang-toggle):not(.theme-toggle){ grid-column:2; }
.lesson-cover{ grid-column:1; grid-row:1 / span 6; align-self:end; width:120px; aspect-ratio:1; border-radius:6px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.45); }
.lesson-cover svg{ display:block; width:100%; height:100%; }
header h1{ font-size:clamp(1.8rem, 4.2vw, 2.9rem); font-weight:700; letter-spacing:-.01em; line-height:1.25; margin:0; color:#fff; }
header p{ font-size:1rem; opacity:.85; margin:6px 0 0; color:#fff; }
.back-link{
  top:14px; left:20px; display:inline-flex; align-items:center; gap:6px;
  padding:6px 14px; border-radius:999px; background:rgba(0,0,0,.32); color:#fff;
  font-size:.88rem; font-weight:600; opacity:1; text-decoration:none;
}
.back-link:hover{ background:rgba(0,0,0,.55); text-decoration:none; }
.lang-toggle, .theme-toggle{
  position:absolute; top:14px; height:34px; background:transparent; color:#fff;
  border:1px solid rgba(255,255,255,.55); border-radius:999px; font-family:inherit; font-weight:700; font-size:.85rem; cursor:pointer; z-index:2;
}
.lang-toggle{ right:20px; padding:0 16px; }
.theme-toggle{ right:86px; width:34px; padding:0; display:grid; place-items:center; }
.theme-toggle svg{ width:18px; height:18px; }
.lang-toggle:hover, .theme-toggle:hover{ background:rgba(255,255,255,.14); border-color:#fff; }
body > .lang-toggle, body > .theme-toggle{ position:fixed; top:14px; z-index:50; background:var(--card); color:var(--text); border-color:var(--border); box-shadow:var(--shadow); }
body > .lang-toggle{ right:14px; } body > .theme-toggle{ right:80px; }
body > .lang-toggle:hover, body > .theme-toggle:hover{ background:var(--chip); border-color:var(--text); }
header:not(:has(.back-link)):not(:has(.lang-toggle)){ padding-top:28px; border-radius:8px; }

/* แถบแท็บ: ชิปทรงแคปซูล */
nav{ background:var(--bg); border-bottom:1px solid var(--border); padding:10px 16px; gap:8px; }
.tab-btn{
  font-family:inherit; border:0; margin:0; border-radius:999px; padding:8px 16px;
  background:var(--chip); color:var(--text); font-weight:600; font-size:.9rem;
}
.tab-btn:hover{ background:var(--chip-hover); color:var(--text); }
.tab-btn.active{ background:var(--text); color:var(--bg); border-bottom-color:transparent; }

/* การ์ดและกล่อง */
.card{ background:var(--card); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow); }
.card-title{ color:var(--text); font-size:1.2rem; }
.card-title .icon{ display:none; }
.desc-text{ color:var(--text); font-size:1rem; }
.formula, .step.result, .stats{ background:var(--strong) !important; color:#fff; border-radius:8px; letter-spacing:0; }
.stat .k, .step-tag{ text-transform:none; letter-spacing:0; }

/* ปุ่ม */
.btn-action{ font-family:inherit; background:var(--text); color:var(--bg); }
.btn-action.secondary{ background:transparent; color:var(--text); border:1px solid var(--muted); }
.mode-btn{ font-family:inherit; border:1px solid var(--border); background:var(--card); color:var(--text); }
.mode-btn:hover{ border-color:var(--text); color:var(--text); }
.mode-btn.active{ background:var(--text); border-color:var(--text); color:var(--bg); }
.quiz-opt{ border-radius:8px; }
input[type=range]{ accent-color:var(--primary); }

@media (max-width:600px){
  header{ padding:58px 16px 20px; column-gap:14px; }
  .lesson-cover{ width:76px; }
  .back-link{ left:12px; max-width:calc(100% - 150px); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; display:block; }
  .lang-toggle{ right:12px; }
  .theme-toggle{ right:74px; }
  nav{ flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; scrollbar-width:none; }
  nav::-webkit-scrollbar{ display:none; }
}
/* โหมดมืด: สีที่หน้านี้ฝังไว้เอง (สร้างอัตโนมัติ) */
:root[data-theme="dark"]{--pos:#a8f8e1;--pos-bg:#102a1d;--neg:#f18fb8;--neg-bg:#291a0f}
:root[data-theme="dark"] .box-info{background:#1f2e12}
:root[data-theme="dark"] .box-warn{background:#281d0f}
:root[data-theme="dark"] .box-ok{background:#102a1d}
:root[data-theme="dark"] .btn{background:var(--strong)}
:root[data-theme="dark"] .btn.ghost{background:#171717}
:root[data-theme="dark"] .btn.ghost:hover:not(:disabled){background:#223614}
:root[data-theme="dark"] .cmp-cell{background:#171717}
:root[data-theme="dark"] .cmp-cell.diff{background:#261b0f}
:root[data-theme="dark"] .cmp-cell .stepno{background:var(--strong)}
:root[data-theme="dark"] .xm-box{background:#171717}
:root[data-theme="dark"] .quiz-opt{background:#171717}
:root[data-theme="dark"] .quiz-opt.correct{background:#102a1d;color:#a8f8e1}
:root[data-theme="dark"] .quiz-opt.wrong{background:#291a0f;color:#f18fb8}
:root[data-theme="dark"] .quiz-feedback.ok{color:#a8f8e1}
:root[data-theme="dark"] .quiz-feedback.err{color:#f18fb8}
:root[data-theme="dark"] .btn-next{background:var(--strong)}
/* ── theme:end ── */
</style>
</head>
<body>

<header>
  <div class="lesson-cover" aria-hidden="true"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><rect width="120" height="120" fill="#3F6E86"/><circle cx="14" cy="16" r="46" fill="#000" fill-opacity=".14"/><g fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M108 12 L12 108" stroke-opacity=".45" stroke-width="2"/><path d="M18 40 L50 40 M18 54 L50 54" stroke-width="5"/><path d="M100 66 L72 80 L100 94" stroke-width="5"/></g></svg></div>
  <button id="themeToggle" class="theme-toggle" type="button" onclick="toggleTheme()" title="สลับโหมดสว่าง/มืด" aria-label="สลับโหมดสว่าง/มืด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button>
  <button id="langToggle" class="lang-toggle" onclick="toggleLang()">EN</button>
  <h1 data-th="เทียบความต่างของโจทย์" data-en="Equation vs Inequality">เทียบความต่างของโจทย์</h1>
  <p data-th="โจทย์หน้าตาคล้ายกัน แต่วิธีทำต่างกันตรงไหน • ม.4" data-en="Similar-looking problems — where the method really differs">โจทย์หน้าตาคล้ายกัน แต่วิธีทำต่างกันตรงไหน • ม.4</p>
</header>

<nav id="tabNav">
  <button class="tab-btn active" onclick="showTab('poly')" data-th="1 พหุนาม" data-en="1 Polynomial">1 พหุนาม</button>
  <button class="tab-btn" onclick="showTab('flip')" data-th="2 ย้ายข้าง" data-en="2 Moving Terms">2 ย้ายข้าง</button>
  <button class="tab-btn" onclick="showTab('frac')" data-th="3 เศษส่วน" data-en="3 Fractions">3 เศษส่วน</button>

<script>
// ══════════════ ภาษาไทย/อังกฤษ (ค่าใน data-th/data-en ถือเป็น HTML — ดู docs/adr/0002) ══════════════
const PAGE_TITLE = { th: "สื่อการสอน : เทียบความต่างของโจทย์ สมการ vs อสมการ ม.4", en: "Teaching Aid: Equation vs Inequality" };
let langMemory = 'th';
function getLang() { try { return localStorage.getItem('siteLang') || 'th'; } catch (e) { return langMemory; } }
function applyLang(lang) {
  document.documentElement.lang = lang;
  document.title = PAGE_TITLE[lang];
  document.querySelectorAll('[data-th]').forEach(el => {
    el.innerHTML = (lang === 'en' && el.dataset.en) ? el.dataset.en : el.dataset.th;
  });
  const btn = document.getElementById('langToggle');
  if (btn) btn.textContent = lang === 'en' ? 'ไทย' : 'EN';
  if (typeof onLangChange === 'function') onLangChange(lang);
}
function toggleLang() {
  const next = getLang() === 'en' ? 'th' : 'en';
  langMemory = next;
  try { localStorage.setItem('siteLang', next); } catch (e) {}
  applyLang(next);
}
// เนื้อหาของแท็บเทียบทั้งหมดสร้างจาก JS (ไม่ใช้ data-th) จึงต้องวาดใหม่เองตอนสลับภาษา โดยคงจำนวนขั้นที่เปิดไว้
function onLangChange() { renderAllCmp(0); renderXmul(); refreshQuizLang(); }

function showTab(id) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  event.target.classList.add('active');
  // เข้าแท็บเทียบทีไรให้เริ่มที่ 0 ขั้น (ยังไม่เฉลย) — ไม่ให้เจอของที่เปิดจนจบค้างไว้ (สลับภาษายังคงขั้นเดิม)
  if (CMP_ORDER.includes(id)) { CMP_ORDER.forEach(k => shown[k] = 0); renderAllCmp(0); }
}

// ══════════════ ตัวช่วยแสดงผล ══════════════
const frac = (n, d) => `<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;
const T = (th, en) => ({ th, en });
const tx = v => typeof v === 'string' ? v : v[getLang()];
// จัดสมการให้เครื่องหมาย = ≥ ≤ อยู่ตรงกันเป็นแนวตั้ง: แต่ละแถว [ซ้าย, เครื่องหมาย, ขวา] ส่วนสตริงเดี่ยวคือบรรทัดข้อความเต็มความกว้าง
const al = rows => `<div class="align">${rows.map(r => Array.isArray(r)
  ? `<span class="l">${r[0]}</span><span class="m">${r[1]}</span><span class="r">${r[2]}</span>` : `<span class="full">${r}</span>`).join('')}</div>`;
const P = s => `<div>${s}</div>`;

// เส้นจำนวนขนาดเล็กสำหรับโชว์คำตอบในแต่ละฝั่ง
// spec: { min, max, points:[{v,closed}], ranges:[{a,b,ac,bc}] (a/b เป็น ±Infinity ได้), signs:[{v,t,c}], labels:[{v,t}], marker:{v} }
function numberLine(spec) {
  const W = 320, pad = 16, ay = 46;
  const H = (spec.labels && spec.labels.length) ? 96 : 84; // มีป้ายเศษส่วนสองแถวจึงต้องสูงขึ้นอีกหน่อย
  const { min, max } = spec;
  const X = v => pad + (v - min) * (W - 2 * pad) / (max - min);
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<line x1="${pad-8}" y1="${ay}" x2="${W-pad+8}" y2="${ay}" stroke="#94A3B8" stroke-width="2"/>`;
  s += `<polygon points="${W-pad+8},${ay} ${W-pad},${ay-4} ${W-pad},${ay+4}" fill="#94A3B8"/><polygon points="${pad-8},${ay} ${pad},${ay-4} ${pad},${ay+4}" fill="#94A3B8"/>`;
  for (let v = Math.ceil(min); v <= Math.floor(max); v++) {
    s += `<line x1="${X(v)}" y1="${ay-4}" x2="${X(v)}" y2="${ay+4}" stroke="#CBD5E0"/>`;
    s += `<text x="${X(v)}" y="${ay+18}" text-anchor="middle" font-size="9.5" fill="#4A5568">${v}</text>`;
  }
  // ป้ายเศษส่วนต้องเป็นบน/ล่างตาม CONTEXT.md — วาดเลขเศษ ขีด เลขส่วน เอง (ใส่ HTML ใน SVG ไม่ได้) พร้อมเครื่องหมายลบนำหน้า
  (spec.labels || []).forEach(l => {
    const x = X(l.v), c = '#1C3B22';
    s += `<text x="${x - 11}" y="${ay + 38}" text-anchor="middle" font-size="11" font-weight="700" fill="${c}">−</text>`;
    s += `<text x="${x}" y="${ay + 33}" text-anchor="middle" font-size="10" font-weight="700" fill="${c}">${l.n}</text>`;
    s += `<line x1="${x - 8}" y1="${ay + 36}" x2="${x + 8}" y2="${ay + 36}" stroke="${c}" stroke-width="1.3"/>`;
    s += `<text x="${x}" y="${ay + 46}" text-anchor="middle" font-size="10" font-weight="700" fill="${c}">${l.d}</text>`;
  });
  (spec.signs || []).forEach(g => {
    const col = g.c === 'pos' ? '#047857' : g.c === 'neg' ? '#BE185D' : '#4A5568';
    s += `<text x="${X(g.v)}" y="${ay-14}" text-anchor="middle" font-size="17" font-weight="800" fill="${col}">${g.t}</text>`;
  });
  (spec.ranges || []).forEach(r => {
    const a = r.a === -Infinity ? pad - 8 : X(r.a), b = r.b === Infinity ? W - pad + 8 : X(r.b);
    s += `<line x1="${a}" y1="${ay}" x2="${b}" y2="${ay}" stroke="#3FA82E" stroke-width="6"/>`;
    if (r.a !== -Infinity) s += `<circle cx="${a}" cy="${ay}" r="5.5" fill="${r.ac ? '#1C3B22' : '#fff'}" stroke="#1C3B22" stroke-width="2"/>`;
    if (r.b !== Infinity) s += `<circle cx="${b}" cy="${ay}" r="5.5" fill="${r.bc ? '#1C3B22' : '#fff'}" stroke="#1C3B22" stroke-width="2"/>`;
  });
  (spec.points || []).forEach(p => {
    s += `<circle cx="${X(p.v)}" cy="${ay}" r="5.5" fill="${p.closed === false ? '#fff' : '#3FA82E'}" stroke="#1C3B22" stroke-width="2"/>`;
  });
  if (spec.marker) s += `<circle cx="${X(spec.marker.v)}" cy="${ay}" r="7" fill="#FF8A3D" stroke="#7C2D12" stroke-width="2"/>`;
  return s + '</svg>';
}

// ══════════════ ข้อมูลการเทียบ 5 คู่ ══════════════
// steps[i] = { l, r (ข้อความซ้าย/ขวา), diff (ขั้นนี้ต่างกันจริงหรือไม่), lv, rv (ภาพเส้นจำนวน ถ้ามี) }
// ข้อความเป็น HTML สร้างจาก JS ครั้งเดียวผ่าน innerHTML จึงเขียน &lt; &gt; ได้ตามปกติ (ไม่เกี่ยวกับกฎ double-escape ของ data-th)
const CMP = {
  poly: {

    eq: '(x + 2)(x − 1) = 0', ineq: '(x + 2)(x − 1) &lt; 0',

        r: T('ขวามือเป็น 0 อยู่แล้ว และแยกตัวประกอบพร้อมแล้ว', 'The right side is already 0 and it is already factored'), diff: false },
      { l: T(P('ให้แต่ละวงเล็บ = 0') + al([['x + 2', '=', '0'], ['x − 1', '=', '0']]), P('Set each bracket to 0') + al([['x + 2', '=', '0'], ['x − 1', '=', '0']])),
        r: T(P('หาค่าวิกฤต (แต่ละวงเล็บ = 0)') + al([['x', '=', '−2'], ['x', '=', '1']]), P('Find the critical values (each bracket = 0)') + al([['x', '=', '−2'], ['x', '=', '1']])), diff: false },

        r: T('ยังไม่จบ! ต้องวาดเส้นจำนวนแล้วใส่เครื่องหมาย <b>+ − +</b>', 'Not done! Draw the number line and mark the signs <b>+ − +</b>'), diff: true,
        rv: () => numberLine({ min: -5, max: 4, points: [{ v: -2, closed: false }, { v: 1, closed: false }], signs: [{ v: -3.5, t: '+', c: 'pos' }, { v: -0.5, t: '−', c: 'neg' }, { v: 2.5, t: '+', c: 'pos' }] }) },
      { l: T('ตอบ: <b>{−2, 1}</b> ได้เป็น "จุด"', 'Answer: <b>{−2, 1}</b> — "points"'),
        r: T('ถามน้อยกว่า → เลือกช่วง <b>−</b><br>ตอบ: <b>(−2, 1)</b> ได้เป็น "ช่วง"', 'Asked "less than" → pick the <b>−</b> region<br>Answer: <b>(−2, 1)</b> — an "interval"'), diff: true,
        lv: () => numberLine({ min: -5, max: 4, points: [{ v: -2 }, { v: 1 }] }),
        rv: () => numberLine({ min: -5, max: 4, ranges: [{ a: -2, b: 1, ac: false, bc: false }] }) },
    ]
  },
  flip: {
    title: T('ย้ายข้าง: ตอนหารด้วยจำนวนลบ', 'Moving terms: dividing by a negative'),
    intro: T('ย้ายข้างเหมือนกันทุกอย่าง ต่างกันตรงตอนหารหรือคูณด้วย "จำนวนลบ" — อสมการต้องกลับเครื่องหมาย', 'Moving terms works the same — the difference is when you divide or multiply by a "negative": the inequality must flip'),
    eq: '−x + 1 = 0', ineq: '−x + 1 &gt; 0',
    steps: [
      { l: T(P('ย้าย +1 ไปอีกข้าง (บวกกลายเป็นลบ)') + al([['−x + 1', '=', '0'], ['−x', '=', '−1']]), P('Move +1 across (plus becomes minus)') + al([['−x + 1', '=', '0'], ['−x', '=', '−1']])),
        r: T(P('ย้าย +1 ไปอีกข้าง (บวกกลายเป็นลบ)') + al([['−x + 1', '&gt;', '0'], ['−x', '&gt;', '−1']]), P('Move +1 across (plus becomes minus)') + al([['−x + 1', '&gt;', '0'], ['−x', '&gt;', '−1']])), diff: false },
      { l: T(P('หารทั้งสองข้างด้วย −1') + al([['x', '=', '1']]), P('Divide both sides by −1') + al([['x', '=', '1']])),
        r: T(P('หารทั้งสองข้างด้วย −1 <b>ต้องกลับเครื่องหมาย!</b>') + al([['x', '<span class="flipsign">&lt;</span>', '1']]), P('Divide both sides by −1 — <b>flip the sign!</b>') + al([['x', '<span class="flipsign">&lt;</span>', '1']])), diff: true },
      { l: T('ตอบ: <b>{1}</b>', 'Answer: <b>{1}</b>'),
        r: T('ตอบ: <b>(−∞, 1)</b><br>ลองเช็ก x = 0 ได้ −0 + 1 = 1 ซึ่งเป็นบวก ✓', 'Answer: <b>(−∞, 1)</b><br>Check x = 0: −0 + 1 = 1, which is positive ✓'), diff: true,
        lv: () => numberLine({ min: -4, max: 4, points: [{ v: 1 }] }),

  },
  frac: {

        r: T(P('ต้องหาค่าวิกฤตจาก<b>ทั้งเศษและส่วน</b>') + P('เศษ:') + al([['x + 2', '=', '0'], ['x', '=', '−2']]) + P('ส่วน:') + al([['x − 1', '=', '0'], ['x', '=', '1']]),
             P('Find critical values from <b>both parts</b>') + P('Top:') + al([['x + 2', '=', '0'], ['x', '=', '−2']]) + P('Bottom:') + al([['x − 1', '=', '0'], ['x', '=', '1']])), diff: true },
      { l: T('เช็กว่าส่วนไม่เป็น 0: x ≠ 1<br>x = −2 ผ่าน ✓', 'Check the denominator is not 0: x ≠ 1<br>x = −2 passes ✓'),

        rv: () => numberLine({ min: -5, max: 4, points: [{ v: -2, closed: true }, { v: 1, closed: false }], signs: [{ v: -3.5, t: '+', c: 'pos' }, { v: -0.5, t: '−', c: 'neg' }, { v: 2.5, t: '+', c: 'pos' }] }) },
      { l: T('ตอบ: <b>{−2}</b>', 'Answer: <b>{−2}</b>'),
        r: T('ตอบ: <b>(−∞, −2] ∪ (1, ∞)</b>', 'Answer: <b>(−∞, −2] ∪ (1, ∞)</b>'), diff: true,
        lv: () => numberLine({ min: -5, max: 4, points: [{ v: -2 }] }),
        rv: () => numberLine({ min: -5, max: 4, ranges: [{ a: -Infinity, b: -2, bc: true }, { a: 1, b: Infinity, ac: false }] }) },

  },

        r: T(P('ย้ายส่วนไปคูณ (เงื่อนไข x ≠ 2)') + al([['|x + 1|', '&gt;', '2|x − 2|']]) + P('<small>ส่วนเป็นค่าสัมบูรณ์ จึงเป็นบวกเสมอ ไม่ต้องกลับเครื่องหมาย</small>'),

const CMP_ORDER = ['poly', 'flip', 'frac', 'sq', 'cases'];
const shown = { poly: 0, flip: 0, frac: 0, sq: 0, cases: 0 };

function renderCmp(key, prevShown) {
  const d = CMP[key], lang = getLang();
  const en = lang === 'en';
  const n = d.steps.length;
  let html = `<div class="card">
    <div class="card-title"><span class="icon">🆚</span><span>${tx(d.title)}</span></div>
    <p class="intro">${tx(d.intro)}</p>
    <div class="cmp-grid" style="margin-top:18px;">
      <div class="cmp-head eq"><div class="kind">🟰 ${en ? 'Equation' : 'สมการ'}</div><div class="prob">${d.eq}</div></div>
      <div class="cmp-head ineq"><div class="kind">⚖️ ${en ? 'Inequality' : 'อสมการ'}</div><div class="prob">${d.ineq}</div></div>`;
  d.steps.forEach((s, i) => {
    if (i >= shown[key]) return;
    const fresh = i >= prevShown ? ' fresh' : '';
    const diff = s.diff ? ' diff' : '';
    const tag = s.diff ? `<span class="difftag">${en ? 'Differs here' : 'ต่างตรงนี้'}</span>` : '';
    const cell = (side, text, vis, lab) => `<div class="cmp-cell${diff}${fresh}">${tag}<div class="lab">${lab}</div><span class="stepno">${i + 1}</span>${tx(text)}${vis ? `<div class="vis">${vis()}</div>` : ''}</div>`;
    html += cell('l', s.l, s.lv, en ? '🟰 Equation' : '🟰 สมการ') + cell('r', s.r, s.rv, en ? '⚖️ Inequality' : '⚖️ อสมการ');
  });
  html += `</div>
    <div class="btn-row">
      <button class="btn" onclick="cmpNext('${key}')" ${shown[key] >= n ? 'disabled' : ''}>${en ? 'Next step ▶' : 'ขั้นถัดไป ▶'} (${shown[key]}/${n})</button>
      <button class="btn ghost" onclick="cmpAll('${key}')" ${shown[key] >= n ? 'disabled' : ''}>${en ? 'Show all' : 'เผยทั้งหมด'}</button>
      <button class="btn ghost" onclick="cmpReset('${key}')" ${shown[key] === 0 ? 'disabled' : ''}>${en ? '↺ Reset' : '↺ เริ่มใหม่'}</button>
    </div>`;
  if (shown[key] >= n) {
    const keyTh = { poly: 'สมการได้ "จุด" ส่วนอสมการได้ "ช่วง"', flip: 'หารหรือคูณด้วยจำนวนลบ อสมการต้องกลับเครื่องหมาย', frac: 'อสมการต้องดูทั้งเศษและส่วน ส่วนเป็นวงกลมโปร่งเสมอ', sq: 'ยกกำลังสองได้ แต่อสมการต้องวาด + − + และตัดค่าที่ส่วนเป็น 0', cases: 'สมการ "เช็กว่าอยู่ในช่วง" อสมการ "∩ แล้ว ∪"' };
    const keyEn = { poly: 'The equation gives "points", the inequality gives an "interval"', flip: 'Dividing or multiplying by a negative flips the inequality', frac: 'The inequality needs both top and bottom; the bottom root is always open', sq: 'Squaring works, but the inequality needs + − + and must cut out zeros of the denominator', cases: 'Equation: "check it is in the interval". Inequality: "∩ then ∪"' };
    html += `<div class="box-ok"><b>${en ? '💡 Key difference:' : '💡 สรุปความต่าง:'}</b> ${en ? keyEn[key] : keyTh[key]}</div>`;
  }
  html += `</div>`;
  if (key === 'frac') html += `<div class="card" id="xmulCard"></div>`;
  document.getElementById('tab-' + key).innerHTML = html;
  if (key === 'frac') renderXmul();
}
function renderAllCmp(prev) { CMP_ORDER.forEach(k => renderCmp(k, prev === undefined ? 0 : (prev === 0 ? shown[k] : prev))); }
function cmpNext(k) { const p = shown[k]; if (shown[k] < CMP[k].steps.length) shown[k]++; renderCmp(k, p); }
function cmpAll(k) { const p = shown[k]; shown[k] = CMP[k].steps.length; renderCmp(k, p); }
function cmpReset(k) { shown[k] = 0; renderCmp(k, 0); }

// ══════════════ ตัวทดสอบ "ห้ามคูณไขว้" (แท็บเศษส่วน) ══════════════
// โจทย์: 1/(x+1) ≥ 1/(x+4)  คำตอบจริง: x &lt; −4 หรือ x &gt; −1  แต่คูณไขว้ได้ x+4 ≥ x+1 ซึ่งจริงเสมอ (ผิด!)
let xmX = -2;
// วาดโครงการ์ด "ครั้งเดียว" (รวมตัวสไลเดอร์) แล้วให้ updateXmul() เขียนเฉพาะผลลัพธ์ตอนลาก
// ห้ามเขียน innerHTML ทับสไลเดอร์ระหว่างลาก ไม่งั้น element ที่กำลังลากถูกทำลายและการลากขาดกลางคัน
// (เคยเป็นบั๊กจริง: ลากจาก −2 ไปเป้า 1 แล้วหยุดที่ −0.5 / ตัวควบคุมที่ไม่รีบิลด์ลากถึง 1)
function renderXmul() {
  const el = document.getElementById('xmulCard');
  if (!el) return;
  const en = getLang() === 'en';
  el.innerHTML = `
    <div class="card-title"><span class="icon">🚫</span><span>${en ? 'Why you must NOT cross-multiply an inequality' : 'ทำไมอสมการ "ห้ามคูณไขว้"'}</span></div>
    <p class="intro">${en ? 'Solve' : 'โจทย์'}: ${frac('1', 'x + 1')} ≥ ${frac('1', 'x + 4')}<br>${en ? 'Cross-multiplying gives x + 4 ≥ x + 1, i.e. 4 ≥ 1 — always true. Drag x and see if that can be right.' : 'ถ้าคูณไขว้จะได้ x + 4 ≥ x + 1 หรือ 4 ≥ 1 ซึ่งจริงเสมอ — ลองลาก x แล้วดูว่าจริงหรือไม่'}</p>
    <div class="slider-row"><b>x =</b><input type="range" id="xmSlider" min="-7" max="3" step="0.5" value="${xmX}" oninput="xmX=parseFloat(this.value);updateXmul()"><span class="slider-val" id="xmVal">${xmX}</span>
      <button class="btn ghost" onclick="xmX=-2;renderXmul()">x = −2</button></div>
    <div id="xmResult"></div>`;
  updateXmul();
}
function updateXmul() {
  const el = document.getElementById('xmResult');
  if (!el) return;
  document.getElementById('xmVal').textContent = xmX;
  const en = getLang() === 'en';
  const x = xmX;
  const undef = (x === -1 || x === -4);
  const lhs = 1 / (x + 1), rhs = 1 / (x + 4);
  const orig = !undef && lhs >= rhs;
  const cross = (x + 4) >= (x + 1); // จริงเสมอ
  const mismatch = !undef && orig !== cross;
  const f3 = v => (Math.round(v * 1000) / 1000).toString();
  el.innerHTML = `
    <div class="xm-row">
      <div class="xm-box ${mismatch ? 'bad' : ''}"><b>${en ? 'Real values' : 'แทนค่าจริง'}</b><br>
        ${undef ? (en ? 'The denominator is 0 — undefined' : 'ตัวส่วนเป็น 0 — นิยามไม่ได้') : `${frac('1', 'x + 1')} = ${f3(lhs)} &nbsp; , &nbsp; ${frac('1', 'x + 4')} = ${f3(rhs)}<br>${f3(lhs)} ≥ ${f3(rhs)} ? <b>${orig ? (en ? '✅ true' : '✅ จริง') : (en ? '❌ false' : '❌ เท็จ')}</b>`}</div>
      <div class="xm-box ${mismatch ? 'bad' : ''}"><b>${en ? 'Cross-multiplied says' : 'วิธีคูณไขว้บอกว่า'}</b>${al([['x + 4', '≥', 'x + 1'], ['4', '≥', '1']])}<b>${en ? '✅ always true' : '✅ จริงเสมอ'}</b></div>
    </div>
    ${mismatch ? `<div class="box-warn"><b>${en ? '⚠️ They disagree!' : '⚠️ ขัดแย้งกัน!'}</b> ${en ? 'At this x the real inequality is false, yet cross-multiplying said "true". Cross-multiplying only works if you know both denominators are positive — here they can be negative.' : 'ที่ x นี้อสมการจริงเป็นเท็จ แต่วิธีคูณไขว้บอกว่าจริง เพราะคูณไขว้ได้เฉพาะตอนรู้ว่าตัวส่วนทั้งสองเป็นบวก แต่ตรงนี้ตัวส่วนอาจติดลบ'}</div>` : ''}
    <div class="xm-box good"><b>${en ? 'Correct way: move everything to one side' : 'วิธีที่ถูก: ย้ายมาอยู่ข้างเดียว'}</b><br>
      ${al([[frac('1', 'x + 1') + ' − ' + frac('1', 'x + 4'), '≥', '0'], [frac('3', '(x + 1)(x + 4)'), '≥', '0'], ['(x + 1)(x + 4)', '&gt;', '0']])}
      <div><small>${en ? '(numerator 3 is positive; denominator can never be 0)' : '(เศษ 3 เป็นบวก และส่วนเป็น 0 ไม่ได้)'}</small></div>
      <div>${en ? 'Answer' : 'ตอบ'}: <b>(−∞, −4) ∪ (−1, ∞)</b></div>
      <div class="vis" style="max-width:420px;">${numberLine({ min: -7, max: 3, ranges: [{ a: -Infinity, b: -4, bc: false }, { a: -1, b: Infinity, ac: false }], marker: undef ? null : { v: x } })}</div></div>`;
}

  const box = document.getElementById('quizBox');

  const q = quizData[qIdx], en = getLang() === 'en';
  document.getElementById('quizProgress').textContent = qt('prog');
  box.querySelector('.quiz-q').innerHTML = `${qIdx + 1}. ${en ? q.q_en : q.q_th}`;

    if (idx === q.ans) b.classList.add('correct'); else if (idx === i) b.classList.add('wrong');

  });
  if (i === q.ans) { score++; document.getElementById('quizScore').textContent = score; fb.className = 'quiz-feedback ok'; fb.innerHTML = qt('ok') + exp; }

}
// การ์ดคะแนนแยกเป็นฟังก์ชัน เพื่อให้ refreshQuizLang() วาดใหม่ตามภาษาได้ (เคยค้างเป็น "Your Score" หลังสลับภาษา)
function scoreCardHtml() {
  return `<div id="scoreCard" style="margin-top:20px; background:linear-gradient(135deg,#1C3B22,#2E5936); color:white; border-radius:16px; padding:24px; text-align:center;">
    <div style="font-size:2.5rem;">🎉</div><div style="font-size:1.5rem; font-weight:800; margin:8px 0;">${qt('title')}</div>
    <div style="font-size:3rem; font-weight:800;">${score} / ${quizData.length}</div>

function nextQuestion() { qIdx++; renderQuestion(); }

window.addEventListener('load', () => { renderAllCmp(0); initQuiz(); applyLang(getLang()); });
</script>
