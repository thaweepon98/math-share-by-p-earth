    s += `<line class="pl-c ${col}" style="stroke-width:7" x1="${x1}" y1="${y - 14}" x2="${x2}" y2="${y - 14}"/>`;
    if (a.lo !== -Infinity) s += `<circle class="${a.lc ? 'pl-dot ' + fcol : 'pl-open ' + col}" cx="${x1}" cy="${y - 14}" r="6"/>`;
    if (a.hi !== Infinity) s += `<circle class="${a.hc ? 'pl-dot ' + fcol : 'pl-open ' + col}" cx="${x2}" cy="${y - 14}" r="6"/>`;
  });
  return s + '</svg>';
}

// ════════════════════════════════════════════════════════════════════════════
//  ชุดของกลางสำหรับสื่อ "เห็นภาพ + ได้ลองทำ" (docs/media-design-guide.md) — ใช้ร่วมทั้ง 5 ชิ้น
//  ไม่มีไลบรารีภายนอก: SVG + requestAnimationFrame + Promise (เปิดจาก file:// ได้)
//
//  1) makeAnimator()        ตัวคุมแอนิเมชัน: await A.run(ms, t => …) · await A.wait(ms) · A.kill()
//  2) sv / svArrow / svChip ตัวช่วยสร้างองค์ประกอบ SVG (ลูกศรที่ยืด/เลื่อนปลายได้, "ชิปคู่อันดับ")
//  3) makeScenes()          ตัวเล่นฉาก  ◀ ↻ ▶ + "ฉากที่ k / n"
//  4) makePredict()         ทายก่อนเฉลย (เลือกข้อ → ภาพ → ทาย → ผล + เฉลยบนภาพ)
//  5) plotPointer()         คลิก/ลากบน Plot ในพิกัดกราฟ (ดูดเข้าจุดจำนวนเต็ม)
// ════════════════════════════════════════════════════════════════════════════

// ───────── 1) แอนิเมชัน ─────────
const EASE = {
  lin: t => t,
  out: t => 1 - Math.pow(1 - t, 3),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }   // เกินนิดแล้วเด้งกลับ (ใช้ "เด้งขึ้น")
};
const lerp = (a, b, t) => a + (b - a) * t;
const reducedMotion = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
// makeAnimator() → A  (ใช้ 1 ตัวต่อ 1 การเล่น พอ A.kill() ทุกอย่างที่ค้างอยู่หยุดทันทีและ Promise ที่รอไม่คืนค่าอีก)
//   await A.run(ms, t => {…}, ease?)   เรียก fn(t) ทุกเฟรม t = 0→1 (ผ่าน ease, ค่าเริ่ม inOut) ; เฟรมสุดท้ายได้ t = 1 พอดี
//   await A.wait(ms)                   หน่วงเวลา
//   await Promise.all([A.run(…), A.run(…)])   เล่นพร้อมกัน
function makeAnimator() {
  const A = { dead: false };
  A.run = (ms, fn, ease) => new Promise(res => {
    if (A.dead) return;
    const e = ease || EASE.inOut, t0 = performance.now();
    const step = now => { if (A.dead) return; const t = Math.max(0, Math.min(1, (now - t0) / ms)); fn(Math.max(0, e(t))); if (t < 1) requestAnimationFrame(step); else res(); };   // (now ของ rAF อาจน้อยกว่า t0 นิดหน่อย → ตรึง t และค่า ease ไม่ให้ติดลบ)
    requestAnimationFrame(step);
  });
  A.wait = ms => new Promise(res => setTimeout(() => { if (!A.dead) res(); }, ms));
  A.kill = () => { A.dead = true; };
  return A;
}

// ───────── 2) ตัวช่วย SVG ─────────
const SVGNS = 'http://www.w3.org/2000/svg';
// sv('rect', {x:1, …, text:'ข้อความ'}, parent?) — attrs.text = textContent
function sv(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in (attrs || {})) { if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  if (parent) parent.appendChild(e);
  return e;
}
// ลูกศรที่ "ยืด" ได้: a = svArrow(parent, 'red'?) ; a.set(x1, y1, x2, y2, p) วาดลูกศรไปถึง p ของความยาว (p 0→1 = เส้นพุ่งออก, p<0.04 = ซ่อน)
//   เปลี่ยนสี: a.cls('red' | 'green' | 'muted' | '') · เลื่อนปลายลูกศร = เรียก set ซ้ำด้วย y2 ที่ค่อยๆ เปลี่ยน
function svArrow(parent, cls) {
  const g = sv('g', { class: 'sc-arr ' + (cls || '') }, parent), line = sv('line', {}, g), head = sv('polygon', {}, g);
  const a = { g, line, head };
  a.cls = c => { g.setAttribute('class', 'sc-arr ' + (c || '')); return a; };
  a.set = (x1, y1, x2, y2, p) => {
    p = p === undefined ? 1 : p;
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, tx = x1 + dx * p, ty = y1 + dy * p, hl = Math.min(11, L * p);
    g.style.display = p < 0.04 ? 'none' : '';
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', (tx - ux * hl * .8).toFixed(2)); line.setAttribute('y2', (ty - uy * hl * .8).toFixed(2));
    const bx = tx - ux * hl, by = ty - uy * hl, nx = -uy * hl * .42, ny = ux * hl * .42;
    head.setAttribute('points', `${tx.toFixed(2)},${ty.toFixed(2)} ${(bx + nx).toFixed(2)},${(by + ny).toFixed(2)} ${(bx - nx).toFixed(2)},${(by - ny).toFixed(2)}`);
    return a;
  };
  return a;
}
// "ชิปคู่อันดับ" ใน SVG: c = svChip(parent, '(1, a)', 'sel'?) ; c.at(x, y, scale, opacity) วางที่จุดกึ่งกลาง ; c.cls('sel' | 'dim' | '')
function svChip(parent, text, cls, w, h) {
  w = w || 70; h = h || 30;
  const g = sv('g', { class: 'sc-chip ' + (cls || '') }, parent);
  sv('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2 }, g);
  sv('text', { x: 0, y: 6, 'text-anchor': 'middle', text }, g);
  const c = { g, w, h };
  c.at = (x, y, s, o) => { g.setAttribute('transform', `translate(${(+x).toFixed(2)} ${(+y).toFixed(2)}) scale(${s === undefined ? 1 : s})`); g.style.opacity = o === undefined ? 1 : o; g.style.display = o === 0 ? 'none' : ''; return c; };
  c.cls = k => { g.setAttribute('class', 'sc-chip ' + (k || '')); return c; };
  return c;
}

// ───────── 3) ตัวเล่นฉาก ─────────
// makeScenes(host, scenes, o) → w            o = { prompt: T|html  (คำโปรย ≤ 1 บรรทัด เหนือภาพ) }
//   scene = {
//     cap:  T(th, en) | html | () => html     คำบรรยาย/เหตุผล — ขึ้นใต้ปุ่มทันทีที่กด ▶ ของฉากนี้ (เหตุผลยาวอยู่ที่นี่เท่านั้น)
//     end:  S => {}                           วาด "สภาพจบฉาก" ลง S.el (ที่ว่างเปล่า) ทันที ไม่มีแอนิเมชัน — ใช้ตอนย้อน/ข้าม/เปลี่ยนภาษา/ลดการเคลื่อนไหว
//     play: async S => {}   (ไม่บังคับ)       เล่นแอนิเมชัน: ตอนเรียก S.el มีภาพ "จบฉากก่อนหน้า" วาดไว้แล้ว (ฉากแรก = ว่าง; อยากเริ่มจากภาพอื่นก็ล้าง S.el แล้ววาดเอง)
//                                            ใช้ await S.anim.run(ms, t => …) / await S.anim.wait(ms) · จบแล้วผู้เล่นวาด end(S) ซ้ำให้อัตโนมัติ (ต้องหน้าตาเหมือนจุดจบของ play)
//   }
//   S = { el, k, anim (makeAnimator), reduced }   แอนิเมชันถูกตัดด้วย anim.kill() เสมอเมื่อ ▶ / ◀ / ↻ / เปลี่ยนภาษา — end() ต้องวาดจากศูนย์ได้เองโดยไม่พึ่งผลของ play
//   พฤติกรรม: เปิดมาที่ฉาก 1 ในสภาพจบ (ภาพมาก่อน) · ↻ เล่นฉากนี้ซ้ำ · ◀ วาดจบฉากก่อนหน้าทันที ·
//             ▶ ระหว่างแอนิเมชัน = กระโดดไปจบฉากนั้นก่อน (กดอีกครั้งถึงไปฉากถัดไป) · prefers-reduced-motion = ไม่เล่น แสดงภาพจบทันที
//   w.k = ฉากปัจจุบัน (0-based) · w.go(k, play) · w.refresh() (ลงทะเบียนใน LIVE แล้ว — เปลี่ยนภาษากลางฉากไม่รีเซ็ต)
function makeScenes(host, scenes, o) {
  o = o || {};
  const w = { k: 0, playing: false, anim: null };
  host.innerHTML = '<div class="sc-prompt"></div><div class="sc-stage"></div><div class="wg-nav sc-nav"><button class="btn ghost sc-prev"></button><button class="btn ghost sc-rep"></button><span class="wg-cnt"></span><button class="btn sc-next"></button></div><div class="wg-cap sc-cap"></div>';
  const q = s => host.querySelector(s), stage = q('.sc-stage'), cap = q('.sc-cap'), prev = q('.sc-prev'), rep = q('.sc-rep'), next = q('.sc-next'), cnt = q('.wg-cnt'), pr = q('.sc-prompt');
  const mkS = (k, anim) => ({ el: stage, k, anim, reduced: reducedMotion() });
  const drawEnd = k => { stage.innerHTML = ''; scenes[k].end(mkS(k, null)); };
  const capOf = sc => typeof sc.cap === 'function' ? sc.cap() : tx(sc.cap);
  const paint = fresh => {
    pr.innerHTML = o.prompt ? tx(o.prompt) : ''; pr.style.display = o.prompt ? '' : 'none';
    cap.innerHTML = capOf(scenes[w.k]);
    if (fresh) { cap.classList.remove('fresh'); void cap.offsetWidth; cap.classList.add('fresh'); }
    cnt.textContent = (EN() ? 'Scene ' : 'ฉากที่ ') + (w.k + 1) + ' / ' + scenes.length;
    prev.textContent = '◀ ' + (EN() ? 'Back' : 'ย้อน'); rep.textContent = '↻ ' + (EN() ? 'Replay' : 'เล่นซ้ำ'); next.textContent = (EN() ? 'Next' : 'ถัดไป') + ' ▶';
    prev.disabled = w.k === 0; next.disabled = w.k >= scenes.length - 1 && !w.playing;
  };
  const stop = () => { if (w.anim) w.anim.kill(); w.anim = null; w.playing = false; };
  w.go = (k, play) => {
    stop(); w.k = Math.max(0, Math.min(scenes.length - 1, k));
    const sc = scenes[w.k];
    if (play && sc.play && !reducedMotion()) {
      const anim = makeAnimator(), kk = w.k; w.anim = anim; w.playing = true;
      stage.innerHTML = ''; if (kk > 0) scenes[kk - 1].end(mkS(kk, anim));
      paint(true);
      // ถูกตัดก่อน play ได้เริ่ม (กด ▶ สองครั้งในเฟรมเดียว) = ห้ามวาดภาพต้นแอนิเมชันทับภาพจบที่ finish() วาดไว้แล้ว
      Promise.resolve().then(() => { if (!anim.dead) return sc.play(mkS(kk, anim)); }).catch(e => console.error(e)).then(() => { if (w.anim === anim && !anim.dead) { stop(); drawEnd(kk); paint(false); } });
    } else { drawEnd(w.k); paint(!!play); }
  };
  const finish = () => { stop(); drawEnd(w.k); paint(false); };
  prev.onclick = () => w.go(w.k - 1, false);
  rep.onclick = () => w.go(w.k, true);
  next.onclick = () => { if (w.playing) finish(); else w.go(w.k + 1, true); };
  w.refresh = () => { if (w.playing) finish(); else { drawEnd(w.k); paint(false); } };
  LIVE.push(w); w.go(0, false);
  return w;
}

// ───────── 4) ทายก่อนเฉลย ─────────
// makePredict(host, items, o) → w           o = { label: T (หัวแถวชิป), prompt: T|html (คำโปรย ≤ 1 บรรทัดเหนือภาพ) }
//   item = {
//     chip: T|html                            ข้อความบนชิปเลือกข้อ (ห้ามบอกคำตอบ)
//     draw: (el, ctx) => {}                   วาด "ภาพ" ลง el (ล้างแล้วก่อนเรียก) — เรียกตอนเลือกข้อ (ยังไม่มีคำตัดสิน) และเรียกซ้ำทุกครั้งที่มีการทาย/เปลี่ยนภาษา
//                                             ภาพเป็นฟังก์ชันของสถานะ: อ่าน ctx.done[i] (ข้อ i ถูกทายแล้ว) ctx.ok[i] (ทายถูก) ctx.picks[i] แล้วไฮไลต์เหตุผลเฉพาะข้อที่ทายแล้ว
//                                             ctx.animate = true เมื่อเรียกเพราะ "เพิ่งทายข้อ ctx.last" (เล่นแอนิเมชันเฉลยได้ด้วย await ctx.anim.run(…)) · false = วาดนิ่งๆ (เปลี่ยนภาษา/รีเฟรช)
//                                             ctx.data = วัตถุว่างที่เก็บสถานะภายในของภาพ (เช่น ตำแหน่งตัวเลื่อน) คงอยู่ตลอดข้อนี้ · ctx.anim = makeAnimator ของการวาดรอบนี้ (ถูก kill เมื่อวาดรอบถัดไป)
//     qs: [{ q: T|html (คำถาม), o: [T|html…] ตัวเลือก (เรียงตามที่ต้องการ), a: index คำตอบถูก, why: T|html|(ctx)=>… เหตุผล (ขึ้นหลังทายเท่านั้น) }]   ← ถามได้หลายข้อต่อภาพ
//   }
//   ไม่นับคะแนน · กดชิปข้อเดิมซ้ำ = ล้างคำตอบเริ่มใหม่ · ลงทะเบียน LIVE แล้ว (เปลี่ยนภาษาแล้วคำตอบยังอยู่)
function makePredict(host, items, o) {
  o = o || {};
  const w = { cur: 0, st: null, anim: null };
  host.innerHTML = '<div class="chips pr-chips"></div><div class="sc-prompt"></div><div class="pr-stage"></div><div class="pr-qs"></div>';
  const chips = host.querySelector('.pr-chips'), pr = host.querySelector('.sc-prompt'), stage = host.querySelector('.pr-stage'), qbox = host.querySelector('.pr-qs');
  const fresh = i => ({ i, picks: items[i].qs.map(() => null), data: {} });
  const ctxOf = last => {
    const st = w.st, it = items[st.i];
    return { picks: st.picks.slice(), done: st.picks.map(p => p !== null), ok: st.picks.map((p, k) => p !== null && p === it.qs[k].a), last, animate: last !== undefined && !reducedMotion(), anim: w.anim, data: st.data, item: st.i };
  };
  const drawStage = last => {
    if (w.anim) w.anim.kill(); w.anim = makeAnimator();
    stage.innerHTML = '';
    const ctx = ctxOf(last);
    Promise.resolve().then(() => items[w.st.i].draw(stage, ctx)).catch(e => console.error(e));
  };
  const paintQs = () => {
    const st = w.st, it = items[st.i];
    qbox.innerHTML = it.qs.map((qq, k) => `<div class="pr-q" data-k="${k}"><div class="quiz-q">${tx(qq.q)}</div><div class="quiz-opts">${qq.o.map((op, j) => `<button class="quiz-opt" data-j="${j}">${tx(op)}</button>`).join('')}</div><div class="pr-res"></div></div>`).join('');
    it.qs.forEach((qq, k) => {
      const box = qbox.children[k], p = st.picks[k];
      box.querySelectorAll('.quiz-opt').forEach(b => { b.onclick = () => answer(k, +b.dataset.j); });
      if (p === null) return;
      box.querySelectorAll('.quiz-opt').forEach((b, j) => { if (j === qq.a) b.classList.add('correct'); else if (j === p) b.classList.add('wrong'); b.style.pointerEvents = 'none'; });
      const ok = p === qq.a, why = typeof qq.why === 'function' ? qq.why(ctxOf()) : tx(qq.why);
      box.querySelector('.pr-res').innerHTML = `<div class="verdict ${ok ? 'ok' : 'no'}"><span class="mk">${ok ? '✓' : '✗'}</span><div>${ok ? (EN() ? 'Correct! ' : 'ทายถูก! ') : (EN() ? 'Not quite — ' : 'ยังไม่ใช่ — ')}${why}</div></div>`;
    });
  };
  const answer = (k, j) => { if (w.st.picks[k] !== null) return; w.st.picks[k] = j; paintQs(); drawStage(k); };
  const paint = () => {
    chips.innerHTML = (o.label ? `<span class="chips-label">${tx(o.label)}</span>` : '') + items.map((it, i) => `<button class="chip${i === w.cur ? ' active' : ''}" data-i="${i}">${tx(it.chip)}</button>`).join('');
    chips.querySelectorAll('.chip').forEach(c => c.onclick = () => select(+c.dataset.i));
    pr.innerHTML = o.prompt ? tx(o.prompt) : ''; pr.style.display = o.prompt ? '' : 'none';
  };
  const select = i => { w.cur = i; w.st = fresh(i); paint(); paintQs(); drawStage(); };
  w.refresh = () => { paint(); paintQs(); drawStage(); };
  LIVE.push(w); select(0);
  return w;
}

// ───────── 5) คลิก/ลากบน Plot ─────────
// plotPointer(svgEl, plot, o) → { toPt }       เรียกหลังใส่ plot.svg() ลง DOM ทุกครั้ง (svg ถูกสร้างใหม่ทุกครั้งที่วาดซ้ำ)
//   o = { snap: 1 (ระยะดูดเป็นหน่วยกราฟ · 0 = ไม่ดูด) , clamp: true (ตรึงให้อยู่ในกราฟ) ,
//         onDown(pt, e), onDrag(pt, e) (ระหว่างกดค้างลาก), onUp(pt, e), onClick(pt, e) (กด-ปล่อยโดยแทบไม่ขยับ = คลิก), onHover(pt, e) (เมาส์เคลื่อนโดยไม่กด),
//         onLeave(e) (เมาส์ออกจากกราฟ), touchAction: 'none' (ค่าเริ่ม ใช้กับการลาก) | 'pan-y' (แตะอย่างเดียว ให้นิ้วเลื่อนหน้าผ่านกราฟได้) }
//   ⚠️ ถ้าต้องลากต่อเนื่อง อย่าสร้าง svg ใหม่ระหว่างลาก (pointer capture จะหลุด) — วาดส่วนที่ขยับลงใน <g> ภายใน svg เดิม
//   pt = { x, y (พิกัดกราฟที่ดูดแล้ว), rx, ry (ก่อนดูด), px, py (พิกัด SVG), inside (อยู่ในกรอบกราฟไหม) }
//   ใช้ Pointer Events (เมาส์ + นิ้ว), svg.style.touchAction = 'none', แปลงพิกัดจอ→กราฟด้วย getScreenCTM
function plotPointer(svg, plot, o) {
  o = o || {};
  const snap = o.snap === undefined ? 1 : o.snap;
  svg.style.touchAction = o.touchAction || 'none';
  svg.style.userSelect = 'none'; svg.style.webkitUserSelect = 'none';   // ลากแล้วไม่ให้ตัวหนังสือในกราฟถูกเลือก
  const toPt = e => {
    const m = svg.getScreenCTM(); if (!m) return null;
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const s = p.matrixTransform(m.inverse());
    const rx = plot.ix(s.x), ry = plot.iy(s.y), sn = v => snap ? Math.round(v / snap) * snap : v;
    let x = sn(rx), y = sn(ry);
    const inside = rx >= plot.xmin - .01 && rx <= plot.xmax + .01 && ry >= plot.ymin - .01 && ry <= plot.ymax + .01;
    if (o.clamp !== false) { x = Math.min(plot.xmax, Math.max(plot.xmin, x)); y = Math.min(plot.ymax, Math.max(plot.ymin, y)); }
    return { x: +x.toFixed(6) + 0, y: +y.toFixed(6) + 0, rx, ry, px: s.x, py: s.y, inside };
  };
  let down = null;
  svg.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    down = { x: e.clientX, y: e.clientY, moved: false };
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    const p = toPt(e); if (p && o.onDown) o.onDown(p, e);
  });
  svg.addEventListener('pointermove', e => {
    const p = toPt(e); if (!p) return;
    if (down) { if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) down.moved = true; if (o.onDrag) o.onDrag(p, e); }
    else if (o.onHover) o.onHover(p, e);
  });
  svg.addEventListener('pointerup', e => {
    if (!down) return; const was = down; down = null;
    const p = toPt(e); if (!p) return;
    if (o.onUp) o.onUp(p, e);
    if (!was.moved && o.onClick) o.onClick(p, e);
  });
  svg.addEventListener('pointercancel', () => { down = null; });
  svg.addEventListener('pointerleave', e => { if (!down && o.onLeave) o.onLeave(e); });
  return { toPt };
}

// ════════════════════════════════════════════════════════════════════════════
//  ชุดของกลางเพิ่มสำหรับกลุ่ม "เอกซ์โพเนนเชียลและลอการิทึม" (docs/design-exponential-log.md §1.2)
//  ⚠️ เพิ่มท้ายไฟล์เท่านั้น — ห้ามแก้ของเดิมด้านบน (ผลของสื่อกลุ่มฟังก์ชัน 5 ชิ้นต้องไม่เปลี่ยน)
//  ชื่อ const/function ระดับบนสุดที่เพิ่ม: mx pwr nrt baseLabel lg makeBaseSlider plotExpo plotLog makeMatch makeSort tileRow (+ _XL_UF)
//  ⚠️ lesson_graphs.js มี makeMatch(host) ของตัวเอง (คนละอย่าง) — ฟังก์ชันของไฟล์ lesson ประกาศทีหลังจึงใช้ของตัวเองในหน้านั้น
//
//   6) mx / pwr / nrt / baseLabel / lg     นิพจน์คณิตศาสตร์ (ตัวยก/ตัวห้อย/รากที่ n/ป้ายฐาน/log)
//   7) makeBaseSlider()                    ตัวเลื่อนฐาน a แบบค่าเป็นรายการ
//   8) plotExpo() / plotLog()              วาดกราฟ y = a^(x−h) + k  และ  y = log_a(x−h) + k ลง Plot
//   9) makeMatch()                         เกมจับคู่  ·  10) makeSort() เกมคัดแยก  ·  11) tileRow() แถวแผ่นฐาน
// ════════════════════════════════════════════════════════════════════════════

// ───────── 6) นิพจน์ ─────────
// mx(html) → '<span class="mx">…</span>'   inline-block + white-space:nowrap
//   ⚠️ กล่อง flex (.wg-eq.row, .chips, ปุ่ม flex ฯลฯ) จะแยกข้อความกับ <sup>/<sub>/<i> เป็นก้อนๆ ("2³" → "2 3")
//   ห่อนิพจน์ที่มีตัวยก/ตัวห้อยด้วย mx() ทุกครั้งที่จะเป็นลูกตรงๆ ของกล่อง flex  เช่น  '<div class="wg-eq row">' + mx('2<sup>3</sup>') + ' = ' + mx('8') + '</div>'
const mx = h => `<span class="mx">${h}</span>`;
// pwr(base, exp) → mx(base<sup>exp</sup>)  ถ้า exp มีเศษส่วน (.frac) จะใช้ sup.fx ให้เศษส่วนในตัวยกไม่เบี้ยว
//   เช่น pwr('8', frac(2, 3)) · pwr('(' + frac(1, 2) + ')', '<i>x</i>') · pwr('2', '<i>x</i> + 1')
const pwr = (b, e) => mx(`${b}<sup${/class="frac"/.test(e) ? ' class="fx"' : ''}>${e}</sup>`);
// nrt(n, s) → รากที่ n ของ s  (n = 2 หรือไม่ใส่ = √ ธรรมดา เหมือน rt())   เช่น nrt(3, '8') = ∛8 · nrt(4, '5<sup>3</sup>')
const nrt = (n, s) => (n === undefined || n === null || +n === 2) ? rt(s) : `<span class="rt nrt"><span class="rt-n">${n}</span><span class="rt-s">√</span><span class="rt-in">${s}</span></span>`;
// baseLabel(a, o) → ป้ายฐาน a เป็น HTML:  Math.E หรือ 'e' → <i>e</i> · ค่าเท่า 1/n (n = 2..10) → เศษส่วนบน/ล่าง (0.5 → ½ · 1/3 → ⅓ · 0.2 → ⅕) · อื่นๆ เป็นทศนิยม (0.7, 1.5, 2)
//   สตริง = คืนตามเดิม (ใส่ HTML เองได้) · o.plain = true → ได้อักษรเศษส่วนยูนิโค้ด (½ ⅓ ¼ …) ไว้ใช้ในข้อความ SVG ที่ใส่ HTML ไม่ได้
const _XL_UF = { 2: '½', 3: '⅓', 4: '¼', 5: '⅕', 6: '⅙', 7: '⅐', 8: '⅛', 9: '⅑', 10: '⅒' };
function baseLabel(a, o) {
  o = o || {};
  if (a === 'e' || (typeof a === 'number' && Math.abs(a - Math.E) < 1e-9)) return '<i>e</i>';
  if (typeof a === 'string') return a;
  for (let n = 2; n <= 10; n++) if (Math.abs(a - 1 / n) < 1e-9) return o.plain ? _XL_UF[n] : frac(1, n);
  return mn(Math.round(a * 1000) / 1000);
}
// lg(base, arg) → log ฐาน base ของ arg  เช่น lg(2, '8') = log₂ 8 · lg(null, 'x') = log x (ฐาน 10 ไม่มีตัวห้อย) · lg('e', 'x') = ln x · lg(0.5, 'x') = log_{½} x
//   base เป็นตัวเลข (ผ่าน baseLabel) หรือสตริง/HTML ก็ได้ · คืนก้อน mx เดียว (log + ตัวห้อย + ช่องว่างไม่ตัดบรรทัด + อาร์กิวเมนต์)
const lg = (base, arg) => {
  if (base === 'e') return mx(`ln&nbsp;${arg}`);
  const b = base === null || base === undefined ? '' : `<sub>${typeof base === 'number' ? baseLabel(base) : base}</sub>`;
  return mx(`log${b}&nbsp;${arg}`);
};

// ───────── 7) ตัวเลื่อนฐาน ─────────
// makeBaseSlider(host, o) → { a (getter), set(a), el, list }
//   o = { list: [0.2, 0.25, 1/3, 0.5, 0.7, 1, 1.5, 2, Math.E, 3, 4, 5]   ค่าที่เลื่อนได้ (เรียงน้อย→มาก)
//         value: 2                ค่าเริ่ม (ใกล้ที่สุดในรายการ)
//         label: '<i>a</i> ='     ป้ายหน้าตัวเลื่อน (HTML)
//         allowOne: false         false = ตัดฐาน 1 ออกจากรายการ (ฐาน 1 ใช้ไม่ได้) · true = ให้เลื่อนถึง 1
//         onChange: a => {}       เรียกเมื่อผู้ใช้ขยับ (และเมื่อเรียก set) — ไม่เรียกตอนสร้าง · ค่าที่ส่งเป็นตัวเลขจริง (1/3 ไม่ปัดเศษ) }
//   ป้ายค่าใช้ baseLabel() · ลงทะเบียน LIVE แล้ว · host ว่างๆ ได้ (ฟังก์ชันเขียนแถวตัวเลื่อนลงไปเอง)
function makeBaseSlider(host, o) {
  o = o || {};
  const base = o.list || [0.2, 0.25, 1 / 3, 0.5, 0.7, 1, 1.5, 2, Math.E, 3, 4, 5];
  const list = o.allowOne ? base.slice() : base.filter(v => Math.abs(v - 1) > 1e-9);
  const w = { i: 0 };
  host.innerHTML = `<div class="slider-row bs-row"><b>${o.label || '<i>a</i> ='}</b><input type="range" min="0" max="${list.length - 1}" step="1" value="0" class="bs-in"><span class="slider-val bs-val"></span></div>`;
  const inp = host.querySelector('.bs-in'), val = host.querySelector('.bs-val');
  const near = a => { let b = 0; list.forEach((v, i) => { if (Math.abs(v - a) < Math.abs(list[b] - a)) b = i; }); return b; };
  const paint = () => { inp.value = w.i; val.innerHTML = baseLabel(list[w.i]); };
  inp.oninput = () => { w.i = +inp.value; paint(); if (o.onChange) o.onChange(list[w.i]); };
  Object.defineProperty(w, 'a', { get: () => list[w.i] });
  w.set = a => { w.i = near(a); paint(); if (o.onChange) o.onChange(list[w.i]); };
  w.el = host; w.list = list; w.refresh = paint;
  w.i = near(o.value === undefined ? 2 : o.value); paint();
  LIVE.push(w);
  return w;
}

// ───────── 8) กราฟ expo / log ลง Plot ─────────
// เรียกก่อน plot.svg()  ·  cls = 's-blue' | 's-orange' | … (สีเส้น)
// plotExpo(plot, a, cls, o)   y = a^(x − h) + k
//   o = { h: 0, k: 0, asym: true | 's-muted' | …  เส้นประเส้นกำกับ y = k (true = สีเทา) · dot: true | 'f-red'  จุด (h, 1 + k) · dash: true  เส้นกราฟเป็นเส้นประ (กราฟเป้าหมาย)
//         front: false  วางไว้หน้าแกน · n: 500 จำนวนจุดสุ่ม · r: 6 รัศมีจุด }
function plotExpo(plot, a, cls, o) {
  o = o || {}; const h = o.h || 0, k = o.k || 0;
  if (o.asym) plot.dash(plot.xmin - 1, k, plot.xmax + 1, k, typeof o.asym === 'string' ? o.asym : 's-muted');
  plot.path(x => Math.pow(a, x - h) + k, cls, { n: o.n || 500, dash: o.dash, front: o.front });
  if (o.dot) plot.dot(h, 1 + k, typeof o.dot === 'string' ? o.dot : 'f-red', false, o.r || 6);
  return plot;
}
// plotLog(plot, a, cls, o)    y = log_a(x − h) + k  เฉพาะ x > h  (สุ่มจุดถี่ใกล้เส้นกำกับ เพื่อให้เส้นทิ่มลงขอบกรอบจริง)
//   o = { h: 0, k: 0, asym: true | 's-muted' | …  เส้นประเส้นกำกับแนวตั้ง x = h · dot: true | 'f-red'  จุด (1 + h, k) · dash · front · n: 500 · r: 6 }
function plotLog(plot, a, cls, o) {
  o = o || {}; const h = o.h || 0, k = o.k || 0, la = Math.log(a);
  if (o.asym) plot.dash(h, plot.ymin - 1, h, plot.ymax + 1, typeof o.asym === 'string' ? o.asym : 's-muted');
  const xe = plot.xmax + 0.5;
  if (xe - h > 1e-3) {
    const n = o.n || 500, t0 = Math.log(1e-3), t1 = Math.log(xe - h);   // x − h = e^t  →  y = t / ln a + k
    let d = '';
    for (let i = 0; i <= n; i++) { const t = t0 + (t1 - t0) * i / n; d += (i ? 'L' : 'M') + plot.X(h + Math.exp(t)) + ' ' + plot.Y(t / la + k); }
    plot.put(`<path class="pl-c ${cls}" d="${d}" clip-path="url(#${plot.id})"${o.dash ? ' stroke-dasharray="7 6"' : ''}/>`, o.front);
  }
  if (o.dot) plot.dot(1 + h, k, typeof o.dot === 'string' ? o.dot : 'f-red', false, o.r || 6);
  return plot;
}

// ───────── 9) เกมจับคู่ ─────────
// makeMatch(host, pairs, o) → w     pairs = [{ l: T|html (คอลัมน์ซ้าย เรียงตามเดิม), r: T|html (คอลัมน์ขวา สลับลำดับ), c: 'blue'|'orange'|'green'|'purple'|'pink'|'teal' (สีคู่ ไม่ใส่ = ไล่สีตามลำดับ), why: T|html (ขึ้นเมื่อจับถูก) }]
//   o = { prompt: T|html (คำโปรย ≤ 1 บรรทัด), hint: T|html (ขึ้นเมื่อจับผิด), seed: 1 (ลำดับสุ่มของคอลัมน์ขวา — ปุ่มเริ่มใหม่สุ่มใหม่) }
//   กดซ้ายแล้วกดขวา → ถูก = ล็อกสีคู่ + เลขวงกลมกำกับทั้งสองฝั่ง + เหตุผล · ผิด = สั่นแดงแล้วปล่อย · ตัวนับ "จับคู่แล้ว k / n" · ปุ่มเริ่มใหม่
//   ลงทะเบียน LIVE แล้ว — เปลี่ยนภาษาไม่รีเซ็ต · ข้อความในปุ่มเป็นบล็อกธรรมดา (ไม่ใช่ flex) ตัวยกไม่แยกก้อน
//   w.done[i] (จับแล้วหรือยัง) · w.count · w.order (ลำดับของคอลัมน์ขวา) · w.reset()
function makeMatch(host, pairs, o) {
  o = o || {};
  const n = pairs.length, PAL = ['blue', 'orange', 'green', 'purple', 'pink', 'teal'], CIRC = '①②③④⑤⑥⑦⑧⑨⑩';
  const w = { seed: o.seed || 1, sel: null, done: pairs.map(() => false), order: [], msg: null, bad: null, count: 0 };
  const shuffle = () => {
    let s = (w.seed * 2654435761) >>> 0;
    const rnd = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    for (let tries = 0; tries < 20; tries++) {
      w.order = pairs.map((_, i) => i);
      for (let k = n - 1; k > 0; k--) { const m = Math.floor(rnd() * (k + 1)); [w.order[k], w.order[m]] = [w.order[m], w.order[k]]; }
      if (n < 2 || w.order.some((v, i) => v !== i)) break;
    }
  };
  host.innerHTML = '<div class="sc-prompt"></div><div class="mt-grid"><div class="mt-col mt-l"></div><div class="mt-col mt-r"></div></div><div class="mt-bar"><span class="mt-cnt"></span><button class="btn ghost mt-reset"></button></div><div class="mt-msg"></div>';
  const q = s => host.querySelector(s), pr = q('.sc-prompt');
  const colOf = i => pairs[i].c || PAL[i % PAL.length];
  const item = (side, i) => {
    const p = pairs[i], done = w.done[i], bad = w.bad && ((side === 'l' && w.bad.l === i) || (side === 'r' && w.bad.r === i));
    return `<button class="mt-item cl-${colOf(i)}${done ? ' done' : ''}${side === 'l' && w.sel === i ? ' sel' : ''}${bad ? ' bad' : ''}" data-side="${side}" data-i="${i}">${done ? `<span class="mt-badge">${CIRC[i] || i + 1}</span>` : ''}${tx(side === 'l' ? p.l : p.r)}</button>`;
  };
  w.paint = () => {
    pr.innerHTML = o.prompt ? tx(o.prompt) : ''; pr.style.display = o.prompt ? '' : 'none';
    q('.mt-l').innerHTML = pairs.map((_, i) => item('l', i)).join('');
    q('.mt-r').innerHTML = w.order.map(i => item('r', i)).join('');
    q('.mt-cnt').textContent = (EN() ? 'Matched ' : 'จับคู่แล้ว ') + w.count + ' / ' + n;
    q('.mt-reset').textContent = EN() ? '↻ Start over' : '↻ เริ่มใหม่';
    const m = w.msg;
    q('.mt-msg').innerHTML = m ? `<div class="verdict ${m.ok ? 'ok' : 'no'}"><span class="mk">${m.ok ? '✓' : '✗'}</span><div>${typeof m.html === 'function' ? m.html() : m.html}</div></div>` : '';
    host.querySelectorAll('.mt-item').forEach(b => { b.onclick = () => click(b.dataset.side, +b.dataset.i); });
  };
  const click = (side, i) => {
    if (side === 'l') { if (w.done[i]) return; w.sel = w.sel === i ? null : i; w.msg = null; w.bad = null; w.paint(); return; }
    if (w.done[i]) return;
    if (w.sel === null) { w.msg = { ok: false, html: () => tx(T('เลือกฝั่งซ้ายก่อน แล้วค่อยกดฝั่งขวาที่เป็นคู่กัน', 'Pick something on the left first, then its partner on the right.')) }; w.paint(); return; }
    if (w.sel === i) {
      w.done[i] = true; w.count++;
      const p = pairs[i], all = w.count === n;
      w.msg = { ok: true, html: () => (p.why ? tx(p.why) : tx(T('ถูกต้อง!', 'Correct!'))) + (all ? ` <b>${tx(T('จับคู่ครบทุกคู่แล้ว 🎉', 'All pairs matched 🎉'))}</b>` : '') };
      w.sel = null; w.bad = null; w.paint();
    } else {
      w.bad = { l: w.sel, r: i }; w.msg = { ok: false, html: () => o.hint ? tx(o.hint) : tx(T('ยังไม่ใช่คู่กัน — ลองใหม่', 'Not a pair — try again')) };
      w.sel = null; w.paint();
      const mark = w.bad; setTimeout(() => { if (w.bad === mark) { w.bad = null; w.paint(); } }, 600);
    }
  };
  w.reset = () => { w.seed++; w.sel = null; w.msg = null; w.bad = null; w.done = pairs.map(() => false); w.count = 0; shuffle(); w.paint(); };
  q('.mt-reset').onclick = w.reset;
  w.refresh = () => w.paint();
  shuffle(); LIVE.push(w); w.paint();
  return w;
}

// ───────── 10) เกมคัดแยก ─────────
// makeSort(host, cards, bins, o) → w    cards = [{ t: T|html (หน้าการ์ด), bin: index ถังที่ถูก, why: T|html (เหตุผลสั้น ขึ้นใต้การ์ดในถังเมื่อถูก), no: T|html (ไม่ใส่ก็ได้ — ขึ้นเมื่อใส่ผิดถัง) }] · bins = [T|html]
//   o = { prompt: T|html, colors: ['green','red'] (สีถังตามลำดับ ค่าเริ่ม blue/orange/purple/teal), seed: 1 (ลำดับการ์ดในกอง) }
//   กดการ์ด (ในกอง) แล้วกดถัง (ไม่ใช้ลาก — ใช้ได้บนจอสัมผัส) · ถูก = การ์ดเข้าถัง + เหตุผล · ผิด = การ์ดสั่นแดงและยังอยู่ในกอง · ตัวนับ "จัดแล้ว k / n" · ปุ่มเริ่มใหม่ · ลงทะเบียน LIVE
//   w.placed[i] (index ถังที่การ์ด i เข้าไปแล้ว หรือ null) · w.count · w.reset()
function makeSort(host, cards, bins, o) {
  o = o || {};
  const n = cards.length, PAL = o.colors || ['blue', 'orange', 'purple', 'teal'];
  const w = { seed: o.seed || 1, sel: null, placed: cards.map(() => null), pool: [], msg: null, bad: null, count: 0 };
  const shuffle = () => {
    let s = (w.seed * 2246822519) >>> 0;
    const rnd = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    for (let tries = 0; tries < 20; tries++) {
      w.pool = cards.map((_, i) => i);
      for (let k = n - 1; k > 0; k--) { const m = Math.floor(rnd() * (k + 1)); [w.pool[k], w.pool[m]] = [w.pool[m], w.pool[k]]; }
      if (n < 3 || w.pool.slice(0, 3).some(i => cards[i].bin !== cards[w.pool[0]].bin)) break;   // ไม่ให้ 3 ใบแรกในกองอยู่ถังเดียวกันหมด
    }
  };
  host.innerHTML = '<div class="sc-prompt"></div><div class="so-pool"></div><div class="so-bins"></div><div class="mt-bar"><span class="mt-cnt"></span><button class="btn ghost mt-reset"></button></div><div class="mt-msg"></div>';
  const q = s => host.querySelector(s), pr = q('.sc-prompt');
  w.paint = () => {
    pr.innerHTML = o.prompt ? tx(o.prompt) : ''; pr.style.display = o.prompt ? '' : 'none';
    q('.so-pool').innerHTML = w.pool.filter(i => w.placed[i] === null).map(i => `<button class="chip so-card${w.sel === i ? ' active' : ''}${w.bad === i ? ' bad' : ''}" data-i="${i}">${tx(cards[i].t)}</button>`).join('') || `<span class="so-empty">${tx(T('จัดครบทุกใบแล้ว', 'Every card is sorted'))}</span>`;
    q('.so-bins').innerHTML = bins.map((b, j) => `<div class="so-bin cl-${PAL[j % PAL.length]}${w.sel !== null ? ' ready' : ''}" data-b="${j}" tabindex="0" role="button"><div class="so-bin-h">${tx(b)}</div>${w.pool.filter(i => w.placed[i] === j).map(i => `<div class="so-item"><span class="so-chip">${tx(cards[i].t)}</span>${cards[i].why ? `<span class="so-why">${tx(cards[i].why)}</span>` : ''}</div>`).join('')}</div>`).join('');
    q('.mt-cnt').textContent = (EN() ? 'Sorted ' : 'จัดแล้ว ') + w.count + ' / ' + n;
    q('.mt-reset').textContent = EN() ? '↻ Start over' : '↻ เริ่มใหม่';
    const m = w.msg;
    q('.mt-msg').innerHTML = m ? `<div class="verdict ${m.ok ? 'ok' : 'no'}"><span class="mk">${m.ok ? '✓' : '✗'}</span><div>${typeof m.html === 'function' ? m.html() : m.html}</div></div>` : '';
    host.querySelectorAll('.so-card').forEach(b => { b.onclick = () => { const i = +b.dataset.i; w.sel = w.sel === i ? null : i; w.msg = null; w.bad = null; w.paint(); }; });
    host.querySelectorAll('.so-bin').forEach(b => { const go = () => drop(+b.dataset.b); b.onclick = go; b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }; });
  };
  const drop = j => {
    if (w.sel === null) { w.msg = { ok: false, html: () => tx(T('เลือกการ์ดก่อน แล้วค่อยกดถังที่ใช่', 'Pick a card first, then press the bin it belongs to.')) }; w.paint(); return; }
    const i = w.sel, c = cards[i];
    if (c.bin === j) {
      w.placed[i] = j; w.count++; w.sel = null; w.bad = null;
      w.msg = { ok: true, html: () => (c.why ? tx(c.why) : tx(T('ถูกถัง!', 'Right bin!'))) + (w.count === n ? ` <b>${tx(T('จัดครบทุกใบแล้ว 🎉', 'Everything is sorted 🎉'))}</b>` : '') };
      w.paint();
    } else {
      w.bad = i; w.msg = { ok: false, html: () => c.no ? tx(c.no) : tx(T('ยังไม่ใช่ถังนี้ — ลองถังอื่น', 'Not this bin — try another one')) };
      w.paint();
      const mark = i; setTimeout(() => { if (w.bad === mark) { w.bad = null; w.paint(); } }, 600);
    }
  };
  w.reset = () => { w.seed++; w.sel = null; w.msg = null; w.bad = null; w.placed = cards.map(() => null); w.count = 0; shuffle(); w.paint(); };
  q('.mt-reset').onclick = w.reset;
  w.refresh = () => w.paint();
  shuffle(); LIVE.push(w); w.paint();
  return w;
}

// ───────── 11) แถวแผ่นฐาน ─────────
// tileRow(base, n, o) → <div class="tl-row"> (element)   แถว "แผ่นฐาน" n แผ่น แต่ละแผ่นเขียน base (HTML) · el.tiles = [แผ่น…] (animate ทีละแผ่นได้ เช่น t.style.opacity / transform)
//   o = { cls: 'b'|'o'|'g'|'p'|'r'|'t' (สีแผ่น ค่าเริ่ม b) · gap: 3 หรือ [3, 5] (เว้นช่องหลังแผ่นที่ 3 / 5 — แบ่งกลุ่ม เช่น 3 + 2) · size: 38 (px กว้างแผ่น) · label: html ต่อท้ายแถว }
//   ใช้ใน makeScenes ได้ตรงๆ:  S.el.appendChild(tileRow('2', 5, { gap: 3 }))   ·   tileRow.html(...) → สตริง HTML (ไม่มีแอนิเมชัน)
//   (ความหมาย: เลขชี้กำลัง = จำนวนแผ่นฐาน · เครื่องหมาย + ไม่ต่อแถวแผ่น ต่างจาก ×)
function tileRow(base, n, o) {
  o = o || {};
  const el = document.createElement('div'), CL = { b: 'blue', o: 'orange', g: 'green', p: 'purple', r: 'red', t: 'teal' }, gaps = o.gap === undefined || o.gap === null ? [] : [].concat(o.gap);
  el.className = 'tl-row cl-' + (CL[o.cls || 'b'] || o.cls); el.style.setProperty('--tl', (o.size || 38) + 'px');
  el.tiles = [];
  for (let i = 0; i < n; i++) {
    const t = document.createElement('span'); t.className = 'tl-tile'; t.innerHTML = mx(base);
    el.appendChild(t); el.tiles.push(t);
    if (gaps.includes(i + 1) && i + 1 < n) { const g = document.createElement('span'); g.className = 'tl-gap'; el.appendChild(g); }
  }
  if (o.label) { const l = document.createElement('span'); l.className = 'tl-label'; l.innerHTML = o.label; el.appendChild(l); }
  return el;
}
tileRow.html = (base, n, o) => tileRow(base, n, o).outerHTML;

// ════════════════════════════════════════════════════════════════════════════
//  ชุดของกลางเพิ่มสำหรับกลุ่ม "ตรีโกณมิติ ม.5" (docs/design-trigonometry.md §1.2)
//  ⚠️ เพิ่มท้ายไฟล์เท่านั้น — ห้ามแก้ของเดิมด้านบน (สื่อ 11 ชิ้นเดิมต้องไม่เปลี่ยน)
//  ชื่อ const/function ระดับบนสุดที่เพิ่ม: rad radDeg radText radAuto piFrac piTicks exactVal exactPlain makeUnitCircle makeTriangle (+ _tg… _TG_…)
//
//   12) rad / radDeg / radText / radAuto / piFrac   ป้ายมุมแบบ kπ/n (HTML เศษส่วนบน/ล่าง · ข้อความธรรมดาสำหรับ SVG)
//   13) piTicks()                                    ป้ายแกน x เป็นพหุคูณ π ลง Plot
//   14) exactVal() / exactPlain()                    ค่าแม่นของ sin cos tan csc sec cot ที่มุม kπ/n (n = 1, 2, 3, 4, 6)
//   15) makeUnitCircle()                             วงกลมหนึ่งหน่วย + จุด P ลากได้
//   16) makeTriangle()                               สามเหลี่ยม SVG ป้ายด้าน/มุม ไฮไลต์ ลากจุดยอด
// ════════════════════════════════════════════════════════════════════════════

// ───────── 12) ป้ายมุม kπ/n ─────────
const _tgGcd = (a, b) => b ? _tgGcd(b, a % b) : Math.abs(a);
// ลดทอน k/n → { k, n } (n > 0, เครื่องหมายอยู่ที่ k)
function _tgRed(k, n) { n = n === undefined ? 1 : n; if (n < 0) { k = -k; n = -n; } const g = _tgGcd(k, n) || 1; return { k: k / g, n: n / g }; }
// rad(k, n) → ป้ายมุม kπ/n เป็น HTML (ก้อน mx เดียว ไม่ตัดบรรทัด) · ตัดทอนเศษส่วนเอง
//   rad(1, 6) = π/6 (เศษส่วนบน/ล่าง) · rad(5, 6) = 5π/6 · rad(1) = π · rad(2) = 2π · rad(0) = 0 · rad(-1, 3) = −π/3 · rad(2, 4) = π/2
//   ใช้ได้ทั้งในร้อยแก้ว/คำบรรยายฉาก/ตัวเลือก quiz/ชิป/.formula  (ใน SVG ใช้ radText ไม่ใช่ตัวนี้ — HTML ใส่ใน <text> ไม่ได้)
function rad(k, n) {
  const r = _tgRed(k, n);
  if (r.k === 0) return mx('0');
  const a = Math.abs(r.k), top = (a === 1 ? '' : a) + 'π';
  return mx((r.k < 0 ? '−' : '') + (r.n === 1 ? top : frac(top, r.n)));
}
// radText(k, n) → ข้อความธรรมดา "5π/6" "−π/3" "2π" "0" — ไว้ใส่ <text> ใน SVG / title / aria
function radText(k, n) {
  const r = _tgRed(k, n);
  if (r.k === 0) return '0';
  const a = Math.abs(r.k);
  return (r.k < 0 ? '−' : '') + (a === 1 ? '' : a) + 'π' + (r.n === 1 ? '' : '/' + r.n);
}
const _tgDeg = (k, n) => mn(Math.round(k * 180 / (n === undefined ? 1 : n) * 1000) / 1000) + '°';
// radDeg(k, n) → rad(k, n) + " (30°)"  องศาคำนวณเอง · ใช้ทั้งชิ้น ① (ยังไม่นิยามเรเดียน เขียนคู่กันเสมอ)   radDeg(1, 6) = π/6 (30°) · radDeg(2, 3) = 2π/3 (120°)
const radDeg = (k, n) => mx(rad(k, n) + ' (' + _tgDeg(k, n) + ')');
// piFrac(theta) → { k, n } ถ้า theta (เรเดียน) เป็นพหุคูณตรรกยะของ π ที่ n ∈ 1, 2, 3, 4, 6, 8, 12 (ตัดทอนแล้ว) · ไม่ใช่ → null
function piFrac(theta) {
  for (const n of [1, 2, 3, 4, 6, 8, 12]) { const v = theta / Math.PI * n; if (Math.abs(v - Math.round(v)) < 1e-6) return _tgRed(Math.round(v), n); }
  return null;
}
// radAuto(theta, o) → ป้ายมุมจากค่าเรเดียนจริง (เช่นมุมที่ลาก): เป็นพหุคูณ π → rad() (o.deg = true → radDeg()) · ไม่ใช่ → ทศนิยม "1.234 rad"
function radAuto(theta, o) {
  o = o || {}; const f = piFrac(theta);
  if (f) return o.deg ? radDeg(f.k, f.n) : rad(f.k, f.n);
  return mx(mn(Math.round(theta * 1000) / 1000) + ' rad' + (o.deg ? ' (' + mn(Math.round(theta * 180 / Math.PI * 10) / 10) + '°)' : ''));
}

// ───────── 13) ป้ายแกน x เป็นพหุคูณ π ─────────
// piTicks(plot, step, o) → plot   เรียกก่อน plot.svg()  ·  step = ระยะป้าย (เรเดียน เช่น Math.PI / 2) ต้องเป็นพหุคูณตรรกยะของ π (mπ/n, n ≤ 12)
//   o = { every: 1 (ป้ายทุก k ช่อง) · size: 13 (px) · dy: 17 (ระยะป้ายใต้แกน) · ticks: true (ขีดสั้นบนแกน) · cls: 'pl-tick' }
//   ข้ามป้าย 0 (เหมือนเลขแกนปกติ) · ป้ายเป็นข้อความ SVG ("π/2", "3π/2", "−π") ไม่ใช่ HTML
//   ⚠️ ปิดเลขแกน x เดิมของ Plot ด้วย lx ใหญ่ๆ:  const pl = new Plot({ xmin: -2 * Math.PI, xmax: 2 * Math.PI, gx: Math.PI / 2, lx: 100, … }); piTicks(pl, Math.PI / 2); … pl.svg()
//      (gx = ระยะเส้นกริด · lx = ระยะเลขแกนเดิม — lx: 100 = ไม่มีเลขเดิมเลย)  · ห้ามแก้ class Plot
function piTicks(plot, step, o) {
  o = o || {};
  const ratio = step / Math.PI; let d = 0, nn = 0;
  for (let q = 1; q <= 12; q++) { const p = ratio * q; if (Math.abs(p - Math.round(p)) < 1e-6) { d = q; nn = Math.round(p); break; } }
  if (!d) return plot;
  const y0 = Math.min(Math.max(0, plot.ymin), plot.ymax), every = o.every || 1, size = o.size || 13, dy = o.dy === undefined ? 17 : o.dy;
  let s = '';
  for (let m = Math.ceil(plot.xmin / step - 1e-9); m <= Math.floor(plot.xmax / step + 1e-9); m++) {
    if (m === 0 || m % every !== 0) continue;
    const px = plot.X(m * step), py = plot.Y(y0);
    if (o.ticks !== false) s += `<line class="pl-axis" x1="${px}" y1="${py - 4}" x2="${px}" y2="${py + 4}"/>`;
    const edge = Math.abs(m * step - plot.xmax) < 1e-6;   // ป้ายที่ขอบขวาสุดชิดซ้ายของขอบ ไม่ชนตัวอักษร x ปลายแกน
    s += `<text class="${o.cls || 'pl-tick'}" style="font-size:${size}px" x="${edge ? px + 2 : px}" y="${py + dy}" text-anchor="${edge ? 'end' : 'middle'}">${radText(m * nn, d)}</text>`;
  }
  return plot.raw(s, true);
}

// ───────── 14) ค่าแม่นของฟังก์ชันตรีโกณ ─────────
// ตารางที่มุมอ้างอิง 0° 30° 45° 60° 90°: [สปส.เศษ, รากในเศษ, สปส.ส่วน, รากในส่วน] (0 = [0]) · null = หาค่าไม่ได้
// ⚠️ tan 30° = 1/√3 ตามสรุปครู (ไม่ใช่ √3/3)
const _TG_EX = {
  sin: { 0: [0], 30: [1, 1, 2, 1], 45: [1, 2, 2, 1], 60: [1, 3, 2, 1], 90: [1, 1, 1, 1] },
  cos: { 0: [1, 1, 1, 1], 30: [1, 3, 2, 1], 45: [1, 2, 2, 1], 60: [1, 1, 2, 1], 90: [0] },
  tan: { 0: [0], 30: [1, 1, 1, 3], 45: [1, 1, 1, 1], 60: [1, 3, 1, 1], 90: null },
  csc: { 0: null, 30: [2, 1, 1, 1], 45: [1, 2, 1, 1], 60: [2, 1, 1, 3], 90: [1, 1, 1, 1] },
  sec: { 0: [1, 1, 1, 1], 30: [2, 1, 1, 3], 45: [1, 2, 1, 1], 60: [2, 1, 1, 1], 90: null },
  cot: { 0: null, 30: [1, 3, 1, 1], 45: [1, 1, 1, 1], 60: [1, 1, 1, 3], 90: [0] }
};
// → { v: [..] | null (หาค่าไม่ได้), neg } หรือ undefined (มุมที่ไม่รองรับ)
function _tgExact(fn, k, n) {
  const d0 = k * 180 / (n === undefined ? 1 : n), deg = Math.round(d0);
  if (!_TG_EX[fn] || Math.abs(d0 - deg) > 1e-9 || (deg % 30 !== 0 && deg % 45 !== 0)) return undefined;
  const a = ((deg % 360) + 360) % 360; let ref, sS, cS;
  if (a <= 90) { ref = a; sS = 1; cS = 1; } else if (a <= 180) { ref = 180 - a; sS = 1; cS = -1; } else if (a <= 270) { ref = a - 180; sS = -1; cS = -1; } else { ref = 360 - a; sS = -1; cS = 1; }
  const v = _TG_EX[fn][ref], sg = { sin: sS, cos: cS, tan: sS * cS, csc: sS, sec: cS, cot: sS * cS }[fn];
  return { v, neg: !!v && v[0] !== 0 && sg < 0 };
}
function _tgFmt(v, plain) {
  if (v[0] === 0) return '0';
  const part = (a, b) => (a > 1 || b === 1 ? a : '') + (b > 1 ? (plain ? '√' + b : `<span style="line-height:1.2">${rt(b)}</span>`) : '');   // line-height 1.2: ขีดบนรากไม่ลอยในบรรทัดที่สูง
  const num = part(v[0], v[1]);
  if (v[2] === 1 && v[3] === 1) return num;
  return plain ? num + '/' + part(v[2], v[3]) : frac(num, part(v[2], v[3]));
}
// exactVal(fn, k, n) → ค่าแม่นของ fn ('sin' | 'cos' | 'tan' | 'csc' | 'sec' | 'cot') ที่มุม kπ/n เป็น HTML ก้อน mx เดียว
//   n ∈ 1, 2, 3, 4, 6 (k เป็นจำนวนเต็มใดก็ได้ รวมมุมลบ/เกินรอบ — หาจตุภาคและมุมอ้างอิงให้เอง)
//   exactVal('sin', 1, 6) = ½ · exactVal('cos', 1, 6) = √3/2 · exactVal('cos', 3, 4) = −√2/2 · exactVal('tan', 1, 3) = √3 · exactVal('tan', 5, 6) = −1/√3 ·
//   exactVal('tan', 1, 6) = 1/√3 (ตามสรุปครู ไม่ใช่ √3/3) · exactVal('tan', 1, 2) = "หาค่าไม่ได้" / "undefined" (ตามภาษาปัจจุบัน และตัวสลับภาษาเปลี่ยนให้เอง) · exactVal('csc', 1, 3) = 2/√3
//   มุมที่ไม่รองรับ (เช่น π/12) → ทศนิยม 3 ตำแหน่ง (ไม่ error)
//   ใช้สร้างตาราง/เฉลย/ป้ายสด จะได้ไม่พิมพ์ค่าผิด — เทียบเลขได้ด้วย Math.sin(k * Math.PI / n)

  if (!e.v) { const th = 'หาค่าไม่ได้', en = 'undefined'; return mx(`<span data-th="${th}" data-en="${en}">${EN() ? en : th}</span>`); }
  return mx((e.neg ? '−' : '') + _tgFmt(e.v, false));
}
// exactPlain(fn, k, n) → เหมือน exactVal แต่เป็นข้อความธรรมดา ("√3/2", "−1/2", "1/√3") ไว้ใส่ <text> ใน SVG · หาค่าไม่ได้ → ตามภาษาปัจจุบัน
function exactPlain(fn, k, n) {

  const e = _tgExact(fn, k, n);
  if (!e) { const x = Math[fn] ? Math[fn](k * Math.PI / n) : NaN; return isFinite(x) ? mn(Math.round(x * 1000) / 1000) : 'undefined'; }
  if (!e.v) return EN() ? 'undefined' : 'หาค่าไม่ได้';

}

// ───────── ตัวช่วยร่วมของ makeUnitCircle / makeTriangle ─────────
// ลบวิดเจ็ตที่ host หายไปจาก DOM ออกจาก LIVE (วิดเจ็ตที่สร้างใน makeScenes ถูกสร้างใหม่ทุกครั้งที่วาดฉาก)
// ตัด widget ที่ตายแล้วออกจาก LIVE — เลื่อนไปทำหลังงานปัจจุบันจบ (microtask) เพราะ makeUnitCircle/makeTriangle อาจถูกเรียกระหว่าง
// applyLang กำลัง LIVE.forEach อยู่ (refresh วาดฉากใหม่) — splice ตอนนั้นทำให้ widget ตัวถัดไปถูกข้าม ภาษาไม่เปลี่ยน
let _tgPruneQ = false;
function _tgPrune() {
  if (_tgPruneQ) return; _tgPruneQ = true;
  queueMicrotask(() => { _tgPruneQ = false; for (let i = LIVE.length - 1; i >= 0; i--) if (LIVE[i]._dead) LIVE.splice(i, 1); });
}
const _TG_TXT = { blue: 'b', orange: 'o', green: 'g', purple: 'p', pink: 'p', red: 'r', teal: 'g' };   // สี → คลาสป้าย .pl-lbl.*

// ───────── 15) วงกลมหนึ่งหน่วย ─────────
// makeUnitCircle(host, o) → w     วาด SVG วงกลมหนึ่งหน่วย (แกน x, y + ป้าย (1,0) (0,1) (−1,0) (0,−1)) + จุด P ลากได้ + ที่แสดงตาม o.show   ⚠️ แทนที่เนื้อหาเดิมของ host ทั้งหมด
//   o = {
//     theta: 0                 มุมเริ่มต้น (เรเดียน)
//     snap: 0                  ดูดมุมตอนลาก (เรเดียน เช่น Math.PI / 12 · 0 = อิสระ)
//     draggable: true          ลาก P ได้ (Pointer Events: กด/ลากที่ไหนในภาพ P ก็วิ่งตามมุมของเมาส์/นิ้ว) · false = ภาพนิ่ง/สั่งด้วยโค้ด
//     range: [0, 2π]           ช่วงมุมที่ลากได้ · ยาวไม่เกิน 2π = ตัดวนเข้าช่วง (ลากข้าม 0 แล้วเป็น 2π−ε) · ยาวกว่า 2π = ต่อเนื่องไม่วน (เช่น [−4π, 4π] ลากได้หลายรอบ)
//     show: ['proj', 'arc', …] ของที่แสดง (ดูด้านล่าง) — สลับทีหลังด้วย w.setShow([...])
//     onChange: (θ, byUser) => {}   เรียกทุกครั้งที่มุมเปลี่ยน (ลาก, w.set, ทุกเฟรมของ animateTo) — byUser = true เมื่อมาจากการลากจริง
//     readout: ป้ายสดใต้ภาพ — ไม่ใส่ = ถ้า show มี 'proj' ใช้ ['theta', 'cos', 'sin'] · ใส่เป็น array ของ 'theta' | 'cos' | 'sin' | 'tan' · [] = ไม่แสดง · หรือฟังก์ชัน (θ, w) => html ของคุณเอง
//        ค่าแสดงทศนิยม 3 ตำแหน่ง + ค่าแม่นนำหน้าเมื่อมุมเป็น kπ/n (n = 1, 2, 3, 4, 6) เช่น "cos θ = x = √3/2 ≈ 0.866"

// ───────── 20) เมทริกซ์มีชีวิต ─────────
// makeMatrix(host, M, o) → w     ⚠️ แทนที่เนื้อหาเดิมของ host ทั้งหมด · ทุกช่องเป็น element จริง (กดได้ ไฮไลต์ได้ บินได้)

// ───────── 21) ตัวเลข/ก้อนบิน ─────────
// flyTo(stage, from, to, html, anim, ms, o) → Promise      โคลนก้อน HTML ลอยใน stage จาก from ไปทับ to แล้วหายไป (ไม่ใส่ o.keep)

//   anim = makeAnimator (S.anim ในฉาก — ถูก kill แล้วโคลนหายเอง) · ms ค่าเริ่ม 800
//   o = { arc: true | px (โค้งขึ้นระหว่างบิน · true = 40px) · rotate: 90 (องศาที่หมุนตลอดทาง — "แถวหมุนตั้ง" ใช้ 90 ตามเข็ม: ตัวซ้ายสุดไปอยู่บนสุด) · keep: true (ทิ้งโคลนไว้ที่ปลายทาง · คืน element ผ่าน Promise)
//         dx, dy (px เลื่อนจุดปลายทาง — ให้เลข 2 ตัวมาชนกันไม่ทับพอดี) · from0 (องศาเริ่มต้นของการหมุน) · ease: EASE.inOut }

function flyTo(stage, from, to, html, anim, ms, o) {

  place(0);
  setTimeout(() => { if (anim.dead && !o.keep && c.parentNode) c.remove(); }, ms + 80);

}

// ───────── 22) ดีเทอร์มิแนนต์เป็นพื้นที่ ─────────
// makeDetArea(host, o) → w   กราฟ (Plot + plotPointer) · ลูกศร 2 เส้น = หลัก 2 หลักของ A = [a b; c d] → ลูกศรน้ำเงิน (a, c) · ลูกศรส้ม (b, d) · ลากหัวลูกศรได้ (ดูดจำนวนเต็ม −4..4)
//   สี่เหลี่ยมด้านขนานจากลูกศร 2 เส้นระบาย: det > 0 = ฟ้า · det < 0 = แดง + ป้าย "พลิกด้าน" · det = 0 → แบนเป็นเส้น + ป้าย "แบน! det = 0" · ป้ายพื้นที่ = det สด
//   ใต้กราฟ: A สด (matHtml) + บรรทัด det A = (a)(d) − (b)(c) = ค่า
//   o = { M: [[3, 1], [1, 2]] (เริ่มต้น · ต้อง 2×2) · k: true (ตัวเลื่อน k = 1..3 + ปุ่ม 1 2 3 → แสดงภาพ kA ซ้อน พื้นที่ k² เท่า · หัวลูกศรลากได้ ±4 เท่าเดิม แต่กราฟซูมออกตาม k: ±9 / ±15 / ±21)
//         inv: true (แสดงกล่อง A⁻¹ สด หรือ "ไม่มี A⁻¹" เมื่อ det = 0) · onChange: M => {} (ผู้ใช้ลาก) }
//   คืน w = { M (getter · array ของ Q), set(M), refresh() } · ลงทะเบียน LIVE · ⚠️ แทนที่เนื้อหาเดิมของ host
function makeDetArea(host, o) {
  o = o || {}; _tgPrune();
  const LIM = 4, RNGS = [9, 15, 21];                  // โหมด k: หัวลูกศรลากได้ ±4 · กราฟซูมออกตาม k (k = 1, 2, 3) เพื่อให้ kA ยังอยู่ในกรอบ
  let m = (o.M || [[3, 1], [1, 2]]).map(r => r.map(v => Math.round(qNum(v)))), kk = 1;
  const w = { _dead: false };
  Object.defineProperty(w, 'M', { get: () => _mQ(m) });
  host.innerHTML = `<div class="da-wrap"></div>`;
  const wrap = host.firstChild;
  wrap.innerHTML = `<div class="da-plot"></div>${o.k ? '<div class="slider-row da-k"><b><i>k</i> =</b><input type="range" min="1" max="3" step="1" value="1"><span class="slider-val"></span><span class="da-kc">' + [1, 2, 3].map(v => `<button type="button" class="chip da-kb" data-k="${v}">${v}</button>`).join('') + '</span></div>' : ''}<div class="da-read"></div>`;
  const box = wrap.querySelector('.da-plot'), rd = wrap.querySelector('.da-read');
  let pl, svg, dyn;
  const X = x => pl.X(x), Y = y => pl.Y(y);
  const arrow = (x1, y1, x2, y2, cls) => {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy); if (L < 1) return '';
    const ux = dx / L, uy = dy / L, hl_ = 13, nx = -uy * 6, ny = ux * 6, bx = x2 - ux * hl_, by = y2 - uy * hl_;
    return `<line class="pl-c ${cls}" style="stroke-width:3.4" x1="${x1}" y1="${y1}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}"/><polygon class="${cls.replace('s-', 'f-')}" points="${x2},${y2} ${(bx + nx).toFixed(1)},${(by + ny).toFixed(1)} ${(bx - nx).toFixed(1)},${(by - ny).toFixed(1)}"/>`;
  };
  let cur = null;
  const pickHead = pt => { const d1 = Math.hypot(pt.rx - m[0][0], pt.ry - m[1][0]), d2 = Math.hypot(pt.rx - m[0][1], pt.ry - m[1][1]); return d1 <= d2 ? 1 : 2; };
  const mv = pt => {
    if (!cur) return;
    const x = Math.max(-LIM, Math.min(LIM, Math.round(pt.rx))), y = Math.max(-LIM, Math.min(LIM, Math.round(pt.ry)));
    if (cur === 1) { if (m[0][0] === x && m[1][0] === y) return; m[0][0] = x; m[1][0] = y; } else { if (m[0][1] === x && m[1][1] === y) return; m[0][1] = x; m[1][1] = y; }
    paint(); if (o.onChange) o.onChange(w.M);
  };
  const mount = () => {                                   // สร้างกราฟ (ใหม่ทุกครั้งที่ k เปลี่ยน — ไม่เกิดระหว่างลากหัวลูกศร)
    const R = o.k ? RNGS[kk - 1] : 8, lx = o.k ? (R > 12 ? 6 : 3) : 2;
    pl = new Plot({ w: 480, h: 480, xmin: -R, xmax: R, ymin: -R, ymax: R, pad: 26, gx: R > 12 ? 3 : 1, gy: R > 12 ? 3 : 1, lx, ly: lx });
    box.innerHTML = pl.svg().replace(/<\/svg>$/, '<g class="da-dyn"></g></svg>');
    svg = box.querySelector('svg'); dyn = box.querySelector('.da-dyn');
    plotPointer(svg, pl, { snap: 0, clamp: false, onDown: pt => { cur = pickHead(pt); mv(pt); }, onDrag: mv, onUp: () => { cur = null; } });
    svg.style.cursor = 'grab';
  };
  const paint = () => {
    const a = m[0][0], b = m[0][1], c = m[1][0], d2 = m[1][1], det = a * d2 - b * c, k = kk;
    let g = '';
    const poly = (s, cls, extra) => `<polygon class="${cls}" ${extra || ''} points="${[[0, 0], [a * s, c * s], [(a + b) * s, (c + d2) * s], [b * s, d2 * s]].map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}"/>`;
    if (o.k && k > 1) g += poly(k, 'fa-green') + poly(k, 'da-edge s-green');
    if (det !== 0) g += poly(1, det > 0 ? 'fa-blue' : 'fa-red');
    g += poly(1, 'da-edge ' + (det > 0 ? 's-blue' : det < 0 ? 's-red' : 's-muted'), det === 0 ? 'style="stroke-dasharray:6 5"' : '');
    g += arrow(X(0), Y(0), X(a), Y(c), 's-blue') + arrow(X(0), Y(0), X(b), Y(d2), 's-orange');
    g += `<circle class="da-halo f-blue" cx="${X(a)}" cy="${Y(c)}" r="16"/><circle class="da-halo f-orange" cx="${X(b)}" cy="${Y(d2)}" r="16"/>`;
    g += `<circle class="pl-dot f-blue" cx="${X(a)}" cy="${Y(c)}" r="6.5"/><circle class="pl-dot f-orange" cx="${X(b)}" cy="${Y(d2)}" r="6.5"/>`;
    const lab = (x, y, cl, t) => `<text class="pl-lbl ${cl}" style="font-size:14px;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round" x="${X(x) + (x >= 0 ? 12 : -12)}" y="${Y(y) + (y >= 0 ? -10 : 20)}" text-anchor="${x >= 0 ? 'start' : 'end'}">${t}</text>`;
    g += lab(a, c, 'b', `(${mn(a)}, ${mn(c)})`) + lab(b, d2, 'o', `(${mn(b)}, ${mn(d2)})`);
    const cx_ = X((a + b) / 2), cy_ = Y((c + d2) / 2);
    const area = det === 0 ? tx(T('แบน! det = 0', 'Flat! det = 0')) : (det < 0 ? tx(T('พลิกด้าน ', 'Flipped ')) : '') + 'det = ' + mn(det);
    g += `<text class="pl-lbl ${det > 0 ? 'b' : 'r'}" style="font-size:15px;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round" x="${cx_}" y="${cy_ + 5}" text-anchor="middle">${det === 0 ? '' : area}</text>`;
    if (det === 0) g += `<text class="pl-lbl r" style="font-size:16px;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round" x="${X(0) + 14}" y="${Y(0) + 40}">${area}</text>`;
    dyn.innerHTML = g;
    const Aq = _mQ(m), inv = o.inv ? mInv(Aq) : null;
    let h = matHtml(Aq, { name: 'A' }) + `<span class="da-eq">det <i>A</i> = <i>ad</i> − <i>bc</i> = (${mn(a)})(${mn(d2)}) − (${mn(b)})(${mn(c)}) = <b class="${det === 0 ? 'da-zero' : ''}">${mn(det)}</b></span>`;
    if (o.k) h += `<span class="da-eq">det(<i>kA</i>) = <i>k</i><sup>2</sup> det <i>A</i> = ${k * k} × ${mn(det)} = <b>${mn(k * k * det)}</b></span>`;
    if (o.inv) h += inv ? `<span class="da-inv">${matHtml(inv, { name: 'A<sup>−1</sup>' })}</span>` : `<span class="da-inv da-none">${tx(T('ไม่มี A<sup>−1</sup> (เพราะ det = 0)', 'No A<sup>−1</sup> (because det = 0)'))}</span>`;
    rd.innerHTML = h;
    const kin = wrap.querySelector('.da-k input'); if (kin) { if (+kin.value !== k) kin.value = k; wrap.querySelector('.da-k .slider-val').textContent = k; wrap.querySelectorAll('.da-kb').forEach(bn => bn.classList.toggle('active', +bn.dataset.k === k)); }
  };
  const setK = v => { v = Math.max(1, Math.min(3, Math.round(+v) || 1)); if (v === kk) return; kk = v; mount(); paint(); };
  w.set = M => { m = M.map(r => r.map(v => Math.round(qNum(v)))); paint(); return w; };
  w.refresh = () => { if (!host.isConnected) { w._dead = true; return; } paint(); };
  const kin0 = wrap.querySelector('.da-k input');
  if (kin0) { kin0.oninput = () => setK(kin0.value); kin0.onchange = () => setK(kin0.value); wrap.querySelectorAll('.da-kb').forEach(bn => { bn.onclick = () => { kin0.value = bn.dataset.k; setK(bn.dataset.k); }; }); }
  mount();
  LIVE.push(w); paint();
  return w;
}
//  ═══ END ชุดของกลางกลุ่มเมทริกซ์ ม.5 ═══

// ════════════════════════════════════════════════════════════════════════════
//  ═══ BEGIN ชุดของกลางกลุ่มจำนวนเชิงซ้อน ม.5 ═══  (docs/design-complex-numbers.md §1.2)
//  ⚠️ เพิ่มท้ายไฟล์เท่านั้น — ห้ามแก้ของเดิมด้านบน (สื่อ 21 ชิ้นเดิมต้องไม่เปลี่ยน — มีแค่บล็อกนี้ที่เพิ่ม)
//  ใช้ของกลางเมทริกซ์ (Q, qAdd…, qHtml, _qTxt) กับของกลางตรีโกณ (rad, _tgPrune) ที่อยู่ด้านบน
//  ชื่อ const/function ระดับบนสุดที่เพิ่ม: Cx cxAdd cxSub cxMul cxDiv cxNeg cxConj cxEq cxAbs2 cxPow cxHtml cxText makeCStepper makeCPlane cisHtml
//     cxI cxRt (ค่าคงที่ i · เครื่องหมายรากสำหรับสมการตัวโต) (+ ตัวช่วยภายใน _toC _cx… _CX_CLS)
//  คลาส CSS ที่เพิ่ม (base.css ท้ายไฟล์): .cx-stp .cx-out .cx-grp .cx-k .cx-v · .cx-i (i ตัวเอียงเว้นขวา) · .cx-rt .cx-ri (รากสองแบบวาดเอง) · .cp-wrap .cp-lbl .cp-halo · .cx-bar (เส้นขีดบน z̄: <span class="cx-bar"><i>z</i></span>)
//
//  23) Cx / cxAdd … cxPow       จำนวนเชิงซ้อนแม่นยำ (ส่วนจริง/จินตภาพเป็น Q)
//  24) cxHtml / cxText          เขียน a + bi เป็น HTML / ข้อความธรรมดา
//  25) makeCStepper(host, z, o) แถว −/+ ของ a และ b → "z = a + bi" สด
//  26) makeCPlane(host, o)      ระนาบเชิงซ้อน: จุดลากได้ + ลูกศร + ป้าย HTML บนพื้นทึบ + arc / circle / arrow
//  27) cisHtml(r, k, n, o)      "r cis kπ/n"  /  "r(cos θ + i sin θ)"
// ════════════════════════════════════════════════════════════════════════════

// ───────── 22b) i และเครื่องหมายราก ─────────
// cxI = '<i class="cx-i">i</i>' — หน่วยจินตภาพ i ตัวเอียงที่เว้นขวานิดหน่อย (i ไม่ชนตัวยก i² หรือวงเล็บ "i)") · ใช้ทุกที่ที่ต้องเขียน i ใน HTML (cxHtml ใช้ตัวนี้)
// cxRt(h) → รากที่สองสำหรับสมการตัวโต/ใน .cb-big: เครื่องหมาย √ เป็น SVG ยืดตามความสูงของเส้นขีดบน ปลายบนของ √ ต่อกับปลายซ้ายของเส้นขีดพอดี (ไม่ลอยแยก ไม่ขึ้นกับ line-height)
//   cxRt('−9') → √(−9) แบบเส้นขีดบน · ในร้อยแก้ว/คำบรรยาย/ตัวเลือกใช้ข้อความธรรมดา √(−9) ตามเดิม
const cxI = '<i class="cx-i">i</i>';
const cxRt = h => `<span class="cx-rt"><svg viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0.6 13 L2.8 11.4 L5.2 18.6 L10 1.1"/></svg><span class="cx-ri">${h}</span></span>`;

// ───────── 23) จำนวนเชิงซ้อน ─────────
// Cx(re, im) → { re: Q, im: Q }   รับ "เลขธรรมดา" หรือ Q ได้ทั้งสองช่อง (แปลงเอง · ทศนิยมปัดที่ 6 ตำแหน่ง) · Cx(3) = 3 + 0i · Cx(z) = z (ส่ง Cx เข้ามาคืนตัวเดิม)
//   ทุกฟังก์ชัน cx* รับ "เลขธรรมดา / Q / Cx" แทน Cx ได้ทุกที่ (เลขธรรมดา = ส่วนจริงอย่างเดียว) และคืน Cx ใหม่ (ไม่แก้ตัวที่ส่งเข้ามา)
//   cxAdd(a, b) cxSub(a, b) cxMul(a, b) · cxDiv(a, b) (b = 0 → throw) · cxNeg(a) = −a · cxConj(a) = สังยุค a − bi · cxEq(a, b) → boolean
//   cxAbs2(z) → Q ของ a² + b² (กำลังสองของ |z| — ใช้แทน |z| จะได้ไม่ติดราก) · cxPow(z, n) n เต็ม ≥ 0 (n = 0 → 1 · n ติดลบ/ไม่เต็ม → throw)
//   ตัวอย่าง: cxMul(Cx(1, 2), Cx(3, -5)) = 13 + 1i · cxDiv(Cx(5, 5), Cx(1, 2)) = 3 − i · cxPow(Cx(2, -1), 2) = 3 − 4i
//   อ่านค่า: z.re / z.im เป็น Q → qHtml(z.re) · qNum(z.re) (ทศนิยม ไว้เทียบ/วาด ห้ามไว้คำนวณต่อ) · qEq(z.im, 0)
function Cx(re, im) {
  if (re && re._c) return re;
  return { re: _toQ(re === undefined ? 0 : re), im: _toQ(im === undefined ? 0 : im), _c: true };
}
const _toC = x => (x && x._c) ? x : Cx(x, 0);
const cxAdd = (a, b) => { a = _toC(a); b = _toC(b); return Cx(qAdd(a.re, b.re), qAdd(a.im, b.im)); };
const cxSub = (a, b) => { a = _toC(a); b = _toC(b); return Cx(qSub(a.re, b.re), qSub(a.im, b.im)); };
const cxMul = (a, b) => { a = _toC(a); b = _toC(b); return Cx(qSub(qMul(a.re, b.re), qMul(a.im, b.im)), qAdd(qMul(a.re, b.im), qMul(a.im, b.re))); };
const cxNeg = a => { a = _toC(a); return Cx(qNeg(a.re), qNeg(a.im)); };
const cxConj = a => { a = _toC(a); return Cx(a.re, qNeg(a.im)); };
const cxEq = (a, b) => { a = _toC(a); b = _toC(b); return qEq(a.re, b.re) && qEq(a.im, b.im); };
const cxAbs2 = z => { z = _toC(z); return qAdd(qMul(z.re, z.re), qMul(z.im, z.im)); };
function cxDiv(a, b) {
  a = _toC(a); b = _toC(b);
  const d0 = cxAbs2(b);
  if (qIsZero(d0)) throw new Error('cxDiv: หารด้วย 0');
  const n = cxMul(a, cxConj(b));
  return Cx(qDiv(n.re, d0), qDiv(n.im, d0));
}
function cxPow(z, n) {
  if (!Number.isInteger(n) || n < 0) throw new Error('cxPow: n ต้องเป็นจำนวนเต็ม ≥ 0');
  let r = Cx(1, 0); z = _toC(z);
  for (let k = 0; k < n; k++) r = cxMul(r, z);
  return r;
}

// ───────── 24) เขียน a + bi ─────────
// cxHtml(z, o) → HTML ก้อน mx เดียว (ไม่ตัดบรรทัด) · i เป็นตัวเอียง · เครื่องหมาย + − เว้นวรรครอบ · ลบเป็น "−" (U+2212)
//   Cx(3, -4) → 3 − 4i · Cx(0, -1) → −i · Cx(0, 3) → 3i · Cx(5, 0) → 5 · Cx(Q(13, 34), Q(1, 34)) → 13/34 + 1/34 i (เศษส่วนบน/ล่าง) · 1i เขียน "i" ไม่ใช่ "1i"
//   o.paren: true → ใส่วงเล็บเมื่อมี 2 พจน์ (a + bi) (พจน์เดียวไม่ใส่) · o.var: 'z₁' → นำหน้า "z₁ = " (ตัวแรกที่เป็นตัวอักษรถูกทำเอียงเอง ในก้อนเดียวกัน)
//   ⚠️ ส่วนจินตภาพเป็นรากไม่ได้ (Cx เป็น Q) — "√19 i" ให้เขียนสตริงเองในไฟล์ lesson (เว้นวรรค √19 i)
// cxText(z, o) → ข้อความธรรมดาไว้ใส่ aria / <text> ใน SVG: "3 − 4i" · เศษส่วน "13/34 + (1/34)i" · o.var / o.paren เหมือนกัน
const _cxAbsQ = q => (q.n < 0 ? qNeg(q) : q);
function cxHtml(z, o) {
  o = o || {}; z = _toC(z);
  const a = z.re, b = z.im, az = qIsZero(a), bz = qIsZero(b), ib = q => (qEq(q, 1) ? '' : qHtml(q)) + cxI;
  let s;
  if (bz) s = qHtml(a);
  else if (az) s = (b.n < 0 ? '−' : '') + ib(_cxAbsQ(b));
  else s = qHtml(a) + (b.n < 0 ? ' − ' : ' + ') + ib(_cxAbsQ(b));
  if (o.paren && !az && !bz) s = '(' + s + ')';
  if (o.var) s = o.var.replace(/^([A-Za-z])/, '<i>$1</i>') + ' = ' + s;
  return mx(s);
}
function cxText(z, o) {
  o = o || {}; z = _toC(z);
  const a = z.re, b = z.im, az = qIsZero(a), bz = qIsZero(b);
  const ib = q => (qEq(q, 1) ? '' : (q.d === 1 ? String(q.n) : '(' + _qTxt(q) + ')')) + 'i';
  let s;
  if (bz) s = _qTxt(a);
  else if (az) s = (b.n < 0 ? '−' : '') + ib(_cxAbsQ(b));
  else s = _qTxt(a) + (b.n < 0 ? ' − ' : ' + ') + ib(_cxAbsQ(b));
  if (o.paren && !az && !bz) s = '(' + s + ')';
  if (o.var) s = o.var + ' = ' + s;
  return s;
}

// ───────── 25) ตัวปรับ a, b ─────────
// makeCStepper(host, z, o) → w     ⚠️ แทนที่เนื้อหาเดิมของ host ทั้งหมด · แถว [a − 3 +] [b − 5 +] ใต้บรรทัดโตตรงกลาง "z = a + bi" (เปลี่ยนสดทุกครั้งที่กด)
//   z = Cx เริ่มต้น (a, b ปัดเป็นจำนวนเต็ม — ตัวปรับเดินทีละ 1)
//   o = { name: 'z₁' (ชื่อที่ขึ้นหน้า "z₁ = " · ค่าเริ่ม 'z') · cls: 'b' (น้ำเงิน · ค่าเริ่ม) | 'o' (ส้ม) · min: −9, max: 9 (ช่วงของ a และ b)
//         onChange: z => {} (ผู้ใช้กด หรือเรียก w.set โดยไม่ quiet — ค่าที่ส่งเป็น Cx · ไม่เรียกตอนสร้าง) }
//   คืน w = { z (getter → Cx), set(z, quiet?), el: host, refresh() }
//   ลงทะเบียน LIVE เอง (และออกจาก LIVE เมื่อ host หายไปจาก DOM — สร้างใน makeScenes ได้) · ใช้ปุ่ม .mk-b ของกลางเมทริกซ์
function makeCStepper(host, z0, o) {

// ── ลองทำ: 3×3 แก้เลขได้ · แตะป้ายผลคูณปลายเส้น → เส้นนั้นเรือง ──

      e: T(`ขีดแถวที่ 2 หลักที่ 3 → ไมเนอร์ ${mij(1, 2)} = ${qHtml(mn3)} · ตำแหน่ง (2, 3) มี i + j = 5 เป็นเลขคี่ → เครื่องหมาย − → ${cij(1, 2)} = ${qHtml(c3)} · ${qHtml(o3[1])} คือลืมใส่เครื่องหมาย · อีกสองตัวขีดผิดแถว/หลัก (ตำแหน่ง (3, 2))`, `Cross out row 2 and column 3 → minor ${mij(1, 2)} = ${qHtml(mn3)} · position (2, 3) has i + j = 5, odd → sign − → ${cij(1, 2)} = ${qHtml(c3)} · ${qHtml(o3[1])} forgot the sign · the other two crossed out the wrong row and column (position (3, 2))`) },

<script id="theme-js">
// ── ปุ่มสลับโหมดสว่าง/มืด (สร้างโดย tools/build_lessons.py) — จำค่าไว้ใน localStorage 'siteTheme' ──
// สื่อที่วาดด้วย canvas หรือเก็บสีไว้ในตัวแปร ให้ฟัง window 'themechange' แล้ววาดใหม่
function currentTheme() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
function syncThemeButton() {
  const b = document.getElementById('themeToggle');
  if (!b) return;
  const dark = currentTheme() === 'dark';
  b.innerHTML = dark ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>';
  const en = document.documentElement.lang === 'en';
  b.title = dark ? (en ? 'Switch to light mode' : 'เปลี่ยนเป็นโหมดสว่าง') : (en ? 'Switch to dark mode' : 'เปลี่ยนเป็นโหมดมืด');
  b.setAttribute('aria-label', b.title);
}
function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('siteTheme', next); } catch (e) {}
  syncThemeButton();
  window.dispatchEvent(new CustomEvent('themechange', { detail: next }));
}
// ── ตัวปรับสีโหมดมืดตอนรัน: สีที่ JS เขียนตรงๆ ลงกราฟ SVG (fill/stroke) หรือ style="" ──
// โหมดมืด: สีเข้ม → สว่าง (คงเฉดเดิม), พื้นอ่อน → เข้ม, สีสดกลางๆ คงไว้ — กลับโหมดสว่างจะคืนค่าเดิม
(function () {
  function parse(c) {
    c = String(c).trim().toLowerCase();
