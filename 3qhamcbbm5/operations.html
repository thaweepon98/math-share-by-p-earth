const _MK_CLS = { blue: 'hb', orange: 'ho', green: 'hg', red: 'hr', purple: 'hp', yellow: 'hy', dim: 'dim' };

// ───────── 20) เมทริกซ์มีชีวิต ─────────
// makeMatrix(host, M, o) → w     ⚠️ แทนที่เนื้อหาเดิมของ host ทั้งหมด · ทุกช่องเป็น element จริง (กดได้ ไฮไลต์ได้ บินได้)
//   o = { edit: true (แตะช่อง → ป๊อปอัป − / + ปรับค่า · ช่วง o.min..o.max ค่าเริ่ม −9..9 · เลขจำนวนเต็ม)
//         resize: { r: [1, 4], c: [1, 4] } (ปุ่ม +/− แถว/หลัก · ช่องใหม่เป็น 0 · ไม่ใส่ = ปรับขนาดไม่ได้)
//         onChange: M => {}  (ค่าในช่องเปลี่ยนหรือขนาดเปลี่ยนจากผู้ใช้ — M เป็นสำเนา array ของ Q)
//         onTap: (i, j) => {}  (แตะช่อง — ใช้ได้โดยไม่ต้อง edit)
//         br, aug, name, eq, dim, diag, cls, key เหมือน matHtml }
//   คืน w = { M (getter สำเนา), set(M), cell(i, j) → element, hl(spec, cls), clear(), strike(i, j) → Promise, unstrike(), el, refresh() }
//     spec = { row: i } | { col: j } | { cell: [i, j] } | { diag: 'main' | 'anti' } · cls = 'blue' | 'orange' | 'green' | 'red' | 'purple' | 'yellow' | 'dim' หรือชื่อคลาสตรงๆ ('hb') — ซ้อนหลายอันได้ · clear() ล้างไฮไลต์ทั้งหมด
//     strike(i, j) = เส้นขีดฆ่าแถว i + หลัก j วิ่งพาดผ่าน (แอนิเมชันสั้น ~0.4 วินาที) ช่องที่ถูกขีดจางลง (ไว้ทำไมเนอร์/โคแฟกเตอร์) · unstrike() ล้าง
//   ลงทะเบียน LIVE เอง (และออกจาก LIVE เมื่อ host หายไป) · set/ปรับขนาดแล้ววาดใหม่ทั้งก้อน (ไฮไลต์ที่ตั้งด้วย hl ยังอยู่ · strike หาย)
function makeMatrix(host, M0, o) {
  o = o || {}; _tgPrune();
  let M = _mQ(M0);
  const lo = o.min === undefined ? -9 : o.min, hi = o.max === undefined ? 9 : o.max;
  const w = { _dead: false, el: host }, hls = []; let pop = null;
  Object.defineProperty(w, 'M', { get: () => M.map(r => r.slice()) });
  const cells = () => [...host.querySelectorAll('.mc')];
  const closePop = () => { if (pop) { pop.remove(); pop = null; } };
  const inSpec = (sp, i, j, C) => sp.row !== undefined ? i === sp.row : sp.col !== undefined ? j === sp.col : sp.cell ? (i === sp.cell[0] && j === sp.cell[1]) : sp.diag === 'main' ? i === j : sp.diag === 'anti' ? i + j === C - 1 : false;
  const applyHl = () => {
    const C = M.length ? M[0].length : 0;
    cells().forEach(el => { const i = +el.dataset.i, j = +el.dataset.j; hls.forEach(h => { if (inSpec(h.spec, i, j, C)) el.classList.add(h.cls); }); });
  };
  const fire = () => { if (o.onChange) o.onChange(w.M); };
  function openPop(i, j, el) {
    closePop();
    const inn = host.querySelector('.mk-in'); if (!inn) return;
    pop = document.createElement('div'); pop.className = 'mk-pop';
    pop.innerHTML = '<button class="mk-b" data-d="-1" aria-label="−">−</button><span class="mk-v"></span><button class="mk-b" data-d="1" aria-label="+">+</button>';
    inn.appendChild(pop);
    const val = pop.querySelector('.mk-v'), show = () => { val.textContent = mn(String(Math.round(qNum(M[i][j])))); };
    show();
    pop.addEventListener('click', e => e.stopPropagation());
    pop.addEventListener('pointerdown', e => e.stopPropagation());
    pop.querySelectorAll('.mk-b').forEach(b => b.onclick = () => {
      const nv = Math.max(lo, Math.min(hi, Math.round(qNum(M[i][j])) + (+b.dataset.d)));
      M[i][j] = Q(nv); el.innerHTML = qHtml(M[i][j]); el.classList.remove('empty'); show(); fire();
    });
    const ir = inn.getBoundingClientRect(), er = el.getBoundingClientRect(), pw = pop.offsetWidth;
    pop.style.left = Math.max(0, Math.min(ir.width - pw, er.left - ir.left + er.width / 2 - pw / 2)).toFixed(1) + 'px';

      ctl = `<div class="mk-ctl">${grp(tx(T('แถว', 'Rows')), R, 'r', rr)}${grp(tx(T('หลัก', 'Columns')), C, 'c', cc)}</div>`;
    }
    host.innerHTML = `<div class="mk-in">${matHtml(M, o)}${ctl}</div>`;
    if (o.edit || o.onTap) cells().forEach(el => {
      el.classList.add('tap');
      el.onclick = e => { e.stopPropagation(); const i = +el.dataset.i, j = +el.dataset.j; if (o.edit) openPop(i, j, el); if (o.onTap) o.onTap(i, j); };
    });
    host.querySelectorAll('.mk-ctl .mk-b').forEach(b => b.onclick = () => {
      const a = b.dataset.a, rr = o.resize.r || [1, 4], cc = o.resize.c || [1, 4];
      let nr = M.length, nc = M[0].length;
      if (a === 'r+') nr++; else if (a === 'r-') nr--; else if (a === 'c+') nc++; else nc--;
      if (nr < rr[0] || nr > rr[1] || nc < cc[0] || nc > cc[1]) return;
      M = Array.from({ length: nr }, (_, i) => Array.from({ length: nc }, (__, j) => (M[i] && M[i][j]) || Q(0)));

  }

  w.cell = (i, j) => host.querySelector(`.mc[data-i="${i}"][data-j="${j}"]`);
  w.hl = (spec, cls) => { hls.push({ spec, cls: _MK_CLS[cls] || cls || 'hb' }); applyHl(); return w; };
  w.clear = () => { hls.length = 0; cells().forEach(el => { Object.values(_MK_CLS).forEach(c => el.classList.remove(c)); }); return w; };
  w.unstrike = () => { host.querySelectorAll('.mk-strike').forEach(e => e.remove()); cells().forEach(e => e.classList.remove('struck')); return w; };
  w.strike = (i, j) => {
    w.unstrike();

    const mr = mat.getBoundingClientRect(), R = M.length, C = M[0].length;
    const a = w.cell(i, 0).getBoundingClientRect(), b = w.cell(i, C - 1).getBoundingClientRect(), c = w.cell(0, j).getBoundingClientRect(), d2 = w.cell(R - 1, j).getBoundingClientRect();
    const h = document.createElement('span'); h.className = 'mk-strike h';
    h.style.cssText = `left:${(a.left - mr.left - 6).toFixed(1)}px;top:${(a.top + a.height / 2 - mr.top - 1.5).toFixed(1)}px;width:${(b.right - a.left + 12).toFixed(1)}px`;
    const v = document.createElement('span'); v.className = 'mk-strike v';
    v.style.cssText = `left:${(c.left + c.width / 2 - mr.left - 1.5).toFixed(1)}px;top:${(c.top - mr.top - 4).toFixed(1)}px;height:${(d2.bottom - c.top + 8).toFixed(1)}px`;
    mat.appendChild(h); mat.appendChild(v);

}

// ───────── 21) ตัวเลข/ก้อนบิน ─────────
// flyTo(stage, from, to, html, anim, ms, o) → Promise      โคลนก้อน HTML ลอยใน stage จาก from ไปทับ to แล้วหายไป (ไม่ใส่ o.keep)
//   stage = element ที่จะวางโคลนข้างใน (ตั้ง position: relative ให้เองถ้ายังไม่ได้ตั้ง — ใน makeScenes ใช้ S.el ได้เลย)
//   from / to = element | array ของ element (ใช้กล่องรวม — เช่น ช่องทั้งแถวเพื่อ "แถวหมุนตั้ง") | { left, top, width, height } (พิกัดจอ)
//   html = สิ่งที่บิน (ตัวเลข / matHtml / แถวตัวเลข '<span class="fly-row"><span>2</span><span>1</span></span>' — .fly-row เรียงนอน) · ตัวอักษรสืบจาก from (ถ้าเป็น element)
//   anim = makeAnimator (S.anim ในฉาก — ถูก kill แล้วโคลนหายเอง) · ms ค่าเริ่ม 800
//   o = { arc: true | px (โค้งขึ้นระหว่างบิน · true = 40px) · rotate: 90 (องศาที่หมุนตลอดทาง — "แถวหมุนตั้ง" ใช้ 90 ตามเข็ม: ตัวซ้ายสุดไปอยู่บนสุด) · keep: true (ทิ้งโคลนไว้ที่ปลายทาง · คืน element ผ่าน Promise)
//         dx, dy (px เลื่อนจุดปลายทาง — ให้เลข 2 ตัวมาชนกันไม่ทับพอดี) · from0 (องศาเริ่มต้นของการหมุน) · ease: EASE.inOut }
//   ตัวอย่าง: await flyTo(S.el, aCell, resultCell, '7', S.anim, 700, { arc: true })
function flyTo(stage, from, to, html, anim, ms, o) {
  o = o || {}; anim = anim || makeAnimator(); ms = ms === undefined ? 800 : ms;
  if (getComputedStyle(stage).position === 'static') stage.style.position = 'relative';
  const sr = stage.getBoundingClientRect();
  const rect = e => {
    if (Array.isArray(e)) { const rs = e.map(x => x.getBoundingClientRect()); const l = Math.min(...rs.map(r => r.left)), t = Math.min(...rs.map(r => r.top)), r2 = Math.max(...rs.map(r => r.right)), b = Math.max(...rs.map(r => r.bottom)); return { left: l, top: t, width: r2 - l, height: b - t }; }
    if (e && e.getBoundingClientRect) { const r = e.getBoundingClientRect(); return { left: r.left, top: r.top, width: r.width, height: r.height }; }
    return e;
  };

  const c = document.createElement('div'); c.className = 'fly';
  if (cs) c.style.cssText = `font-size:${cs.fontSize};font-weight:${cs.fontWeight};color:${cs.color}`;
  c.innerHTML = html; stage.appendChild(c);
  const arcH = o.arc === true ? 40 : (o.arc || 0), rot = o.rotate || 0, r0 = o.from0 || 0;
  const place = p => { const x = fx + (tx_ - fx) * p, y = fy + (ty_ - fy) * p - arcH * Math.sin(Math.PI * p); c.style.left = x.toFixed(1) + 'px'; c.style.top = y.toFixed(1) + 'px'; c.style.transform = `translate(-50%,-50%) rotate(${(r0 + rot * p).toFixed(1)}deg)`; };
  place(0);
  setTimeout(() => { if (anim.dead && !o.keep && c.parentNode) c.remove(); }, ms + 80);
  return anim.run(ms, place, o.ease || EASE.inOut).then(() => { place(1); if (!o.keep) c.remove(); return c; });
}

// ───────── 22) ดีเทอร์มิแนนต์เป็นพื้นที่ ─────────
// makeDetArea(host, o) → w   กราฟ (Plot + plotPointer) · ลูกศร 2 เส้น = หลัก 2 หลักของ A = [a b; c d] → ลูกศรน้ำเงิน (a, c) · ลูกศรส้ม (b, d) · ลากหัวลูกศรได้ (ดูดจำนวนเต็ม −4..4)

//   ใต้กราฟ: A สด (matHtml) + บรรทัด det A = (a)(d) − (b)(c) = ค่า
//   o = { M: [[3, 1], [1, 2]] (เริ่มต้น · ต้อง 2×2) · k: true (ตัวเลื่อน k = 1..3 + ปุ่ม 1 2 3 → แสดงภาพ kA ซ้อน พื้นที่ k² เท่า · หัวลูกศรลากได้ ±4 เท่าเดิม แต่กราฟซูมออกตาม k: ±9 / ±15 / ±21)
//         inv: true (แสดงกล่อง A⁻¹ สด หรือ "ไม่มี A⁻¹" เมื่อ det = 0) · onChange: M => {} (ผู้ใช้ลาก) }
//   คืน w = { M (getter · array ของ Q), set(M), refresh() } · ลงทะเบียน LIVE · ⚠️ แทนที่เนื้อหาเดิมของ host
function makeDetArea(host, o) {
  o = o || {}; _tgPrune();
  const LIM = 4, RNGS = [9, 15, 21];                  // โหมด k: หัวลูกศรลากได้ ±4 · กราฟซูมออกตาม k (k = 1, 2, 3) เพื่อให้ kA ยังอยู่ในกรอบ

// ── ลองทำ: เมทริกซ์ปรับขนาด/แก้เลขได้ · แตะช่อง → aᵢⱼ ──
function makeWhatTry(host) {
  host.innerHTML = '<div class="mx-note wt-p"></div><div class="wt-m"></div><div class="mx-calc wt-i"></div>';
  let sel = null;
  const mm = makeMatrix(host.querySelector('.wt-m'), [[3, -1, 4], [0, 5, 2], [7, 1, -6]], { edit: true, resize: { r: [1, 4], c: [1, 4] }, name: 'A', dim: true, onTap: (i, j) => { sel = [i, j]; info(); }, onChange: () => info() });
  const info = () => {
    const M = mm.M, R = M.length, C = M[0].length;
    if (sel && (sel[0] >= R || sel[1] >= C)) sel = null;
    mm.clear(); if (sel) mm.hl({ cell: sel }, 'green');
    host.querySelector('.wt-p').innerHTML = tx(T('แตะช่องไหนก็ได้ — ดูชื่อตำแหน่ง · แตะแล้วกด − / + เพื่อเปลี่ยนเลข · ปุ่มด้านล่างเพิ่ม/ลดแถวและหลัก', 'Tap any entry to see its name · use − / + to change the number · the buttons below add or remove rows and columns'));
    host.querySelector('.wt-i').innerHTML = `${xtag('blue', tx(T(`${R} แถว`, `${R} rows`)))} ${xop('×')} ${xtag('orange', tx(T(`${C} หลัก`, `${C} columns`)))} ${xop('→')} ${tx(T('มิติ', 'size'))} <b>${R} × ${C}</b> · ${tx(T('มีเลข', 'with'))} ${R * C} ${tx(T('ตัว', 'entries'))}` +
      (sel ? `<br>${aij(sel[0], sel[1])} = <b>${qHtml(M[sel[0]][sel[1]])}</b> · ${tx(T(`แถวที่ ${sel[0] + 1} หลักที่ ${sel[1] + 1}`, `row ${sel[0] + 1}, column ${sel[1] + 1}`))}` : '');
  };
  const w = { refresh: info }; LIVE.push(w); info();
  return w;
}

// ── เกม: จิ้มให้ถูกช่อง (5 ข้อสุ่ม) ──
const GM_M = [[4, -2, 7, 1], [0, 5, -3, 8], [6, 9, 2, -5]];
function makeFindGame(host) {
  host.innerHTML = '<div class="gm-q"></div><div class="gm-board"></div><div class="gm-stat"></div><div class="mt-msg"></div><div class="mt-bar"><button class="btn ghost gm-reset"></button></div>';
  const q = s => host.querySelector(s);
  const g = { seed: 7, qs: [], k: 0, miss: 0, done: [], lock: false };
  const pick = () => { const r = rng(g.seed * 977), all = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 4; j++) all.push([i, j]); for (let k = all.length - 1; k > 0; k--) { const m = Math.floor(r() * (k + 1)); [all[k], all[m]] = [all[m], all[k]]; } g.qs = all.slice(0, 5); };
  let msg = null;
  const board = makeMatrix(q('.gm-board'), GM_M, { dim: true, name: 'A', onTap: (i, j) => tap(i, j) });
  const paintHl = () => { board.clear(); g.done.forEach(c => board.hl({ cell: c }, 'green')); };
  const tap = (i, j) => {
    if (g.lock || g.k >= 5) return;
    const t = g.qs[g.k];
    if (i === t[0] && j === t[1]) { g.done.push(t); g.k++; msg = { ok: true, h: () => `${aij(i, j)} = <b>${GM_M[i][j]}</b> ${tx(T('ถูกต้อง!', 'Correct!'))}` + (g.k === 5 ? ` <b>${tx(T(`ครบ 5 ข้อ พลาด ${g.miss} ครั้ง 🎉`, `All 5 done, ${g.miss} slips 🎉`))}</b>` : '') }; paintHl(); paint(); }
    else {
      g.miss++; msg = { ok: false, h: () => `${tx(T('ตำแหน่งที่แตะคือ', 'You tapped'))} ${aij(i, j)} (${tx(T(`แถวที่ ${i + 1} หลักที่ ${j + 1}`, `row ${i + 1}, column ${j + 1}`))}) — ${tx(T('ที่ต้องการคือ', 'you need'))} ${aij(t[0], t[1])} (${tx(T(`แถวที่ ${t[0] + 1} หลักที่ ${t[1] + 1}`, `row ${t[0] + 1}, column ${t[1] + 1}`))})` };
      g.lock = true; paintHl(); board.hl({ cell: [i, j] }, 'red'); const bc = board.cell(i, j); if (bc) bc.classList.add('wrong'); paint();
      setTimeout(() => { g.lock = false; paintHl(); }, 650);
    }
  };
  const paint = () => {
    q('.gm-q').innerHTML = g.k >= 5 ? '🎉' : `${tx(T('จิ้มตำแหน่ง', 'Tap position'))} ${aij(g.qs[g.k][0], g.qs[g.k][1])}`;
    q('.gm-stat').textContent = tx(T(`ถูกแล้ว ${g.k} / 5 · พลาด ${g.miss} ครั้ง`, `Correct ${g.k} / 5 · slips ${g.miss}`));
    q('.mt-msg').innerHTML = msg ? `<div class="verdict ${msg.ok ? 'ok' : 'no'}"><span class="mk">${msg.ok ? '✓' : '✗'}</span><div>${msg.h()}</div></div>` : '';
    q('.gm-reset').textContent = tx(T('↻ เล่นใหม่', '↻ Play again'));
  };
  q('.gm-reset').onclick = () => { g.seed++; g.k = 0; g.miss = 0; g.done = []; msg = null; g.lock = false; pick(); paintHl(); paint(); };
  pick(); paint();
  const w = { refresh: () => { paintHl(); paint(); } }; LIVE.push(w);
  return w;
}

// ── ทายก่อน: การเท่ากัน ──
function eqPredItems() {
  const dd = (a, b) => `<div class="mx-row">${a}${xop('=')}${b}</div>`;
  return [
    { chip: T('หา x และ y', 'Find x and y'), draw: (el, ctx) => {
      const cls = (i, j) => (ctx.done[0] && i === 0 && j === 0) || (ctx.done[1] && i === 1 && j === 1) ? 'hg' : '';
      el.innerHTML = dd(matHtml([['<i>x</i> + 1', 4], [2, '<i>y</i>']], { name: 'A', cls }), matHtml([[5, 4], [2, -3]], { name: 'B', cls })) + `<div class="mx-note">${tx(T('<i>A</i> = <i>B</i> — ช่องที่ตรงกันต้องเท่ากันทุกช่อง', '<i>A</i> = <i>B</i> — entries in the same position must be equal'))}</div>`;
    }, qs: [
      { q: T('A = B แล้ว <i>x</i> เท่ากับข้อใด', 'If <i>A</i> = <i>B</i>, what is <i>x</i>'), o: [mx('5'), mx('6'), mx('4'), mx('−4')], a: 2,
        why: T('ช่องแถว 1 หลัก 1 ต้องเท่ากัน: <i>x</i> + 1 = 5 → <i>x</i> = 4 · ค่า 5 คือค่าของ <i>x</i> + 1 ไม่ใช่ <i>x</i>', 'The entries in row 1, column 1 must match: <i>x</i> + 1 = 5 → <i>x</i> = 4 · 5 is the value of <i>x</i> + 1, not of <i>x</i>') },
      { q: T('<i>y</i> เท่ากับข้อใด', 'What is <i>y</i>'), o: [mx('3'), mx('−3'), mx('2'), mx('−2')], a: 1,
        why: T('ช่องแถว 2 หลัก 2: <i>y</i> = −3 (ตรงกับช่องของ B เลย)', 'Row 2, column 2: <i>y</i> = −3 (straight from the matching entry of B)') }
    ] },
    { chip: T('มิติต่างกัน', 'Different sizes'), draw: (el, ctx) => {
      el.innerHTML = dd(matHtml([[1, 2, 3], [4, 5, 6]], { name: 'A', dim: true }), matHtml([[1, 2], [3, 4], [5, 6]], { name: 'B', dim: true })) +
        (ctx.done[0] ? `<div class="mx-note">2 × 3 ${xop('≠')} 3 × 2 — ${tx(T('มิติไม่เท่า จึงเท่ากันไม่ได้ ไม่ว่าเลขข้างในจะเป็นอะไร', 'the sizes differ, so they can never be equal, whatever the numbers inside'))}</div>` : `<div class="mx-note">A = B ?</div>`);
    }, qs: [
      { q: T('A กับ B ใช้เลข 1–6 ชุดเดียวกัน — A = B หรือไม่', 'A and B use the same numbers 1–6 — is A = B'), o: [T('เท่ากัน เพราะเลขชุดเดียวกัน', 'Equal, the same numbers'), T('ไม่เท่ากัน เพราะมิติต่างกัน', 'Not equal, the sizes differ'), T('ไม่เท่ากัน เพราะเลขในบางช่องต่างกัน', 'Not equal, some entries differ')], a: 1,
        why: T('การเท่ากันต้องมีสองข้อ: มิติเท่ากัน <b>และ</b> ทุกช่องเท่ากัน — ข้อแรกก็ไม่ผ่านแล้ว (2 × 3 กับ 3 × 2)', 'Equality needs two things: the same size <b>and</b> equal entries — the first one already fails (2 × 3 versus 3 × 2)') }
    ] }
  ];
}

// ═══════════════════════════════════════════════════════════════
//  แท็บ 2 · บวกลบ
// ═══════════════════════════════════════════════════════════════
const AD_A = [[1, -2], [3, 0]], AD_B = [[4, 1], [-1, 5]], AD_C = [[2, 0, 1], [-1, 3, 4]];
// เรียงบรรทัด A + B = R (R: array ช่อง Q/null) · o.noteHtml ข้อความใต้ภาพ
function adBuild(el, o) {
  o = o || {};
  el.innerHTML = `<div class="mx-row">${matHtml(o.A || AD_A, { name: 'A', dim: !!o.dim })}${xop(o.op || '+')}${matHtml(o.B || AD_B, { name: 'B', dim: !!o.dim })}${xop('=')}${matHtml(o.R || nullsOf(2, 2), { key: 'R' })}</div><div class="mx-calc ad-calc">${o.calc || ''}</div>`; xgroup(el);
}
const AD_SUM = mAdd(AD_A, AD_B);
const adCalcOf = (i, j) => `${aij(i, j)}: ${qHtml(AD_A[i][j])} + ${AD_B[i][j] < 0 ? '(' + qHtml(AD_B[i][j]) + ')' : qHtml(AD_B[i][j])} = <b>${qHtml(AD_SUM[i][j])}</b>`;
const adMarks = el => { cellEl(el, 'A', 1, 1).classList.add('hb'); cellEl(el, 'B', 1, 1).classList.add('ho'); cellEl(el, 'R', 1, 1).classList.add('hg'); el.querySelector('.ad-calc').innerHTML = adCalcOf(1, 1); };
const AD_SC = [
  { cap: () => tx(T('เมทริกซ์ A และ B มิติเท่ากัน (2 × 2) — บวกกันได้ ผลรวมก็มิติ 2 × 2 · กด ▶', 'Matrices A and B have the same size (2 × 2) — so they can be added and the sum is 2 × 2 as well · press ▶')),
    end: S => adBuild(S.el, {}) },
  { cap: () => tx(T('บวกลบตามตำแหน่งเลย — เลขในช่องเดียวกันบินมาบวกกันทีละคู่ แล้วผลลงช่องเดิม', 'Add position by position — the two numbers in the same place fly together and the sum lands in that place')),
    end: S => { adBuild(S.el, { R: AD_SUM }); adMarks(S.el); },
    play: async S => {
      adBuild(S.el, {});
      const calc = S.el.querySelector('.ad-calc'); let prev = null;
      for (const [i, j] of [[0, 0], [0, 1], [1, 0], [1, 1]]) {
        if (prev) prev.forEach(e => e.classList.remove('hb', 'ho', 'hg', 'pop'));
        const a = cellEl(S.el, 'A', i, j), b = cellEl(S.el, 'B', i, j), r = cellEl(S.el, 'R', i, j);
        a.classList.add('hb'); b.classList.add('ho'); calc.innerHTML = adCalcOf(i, j);
        await Promise.all([flyNum(S, a, r, a.innerHTML, 700, { dx: -17, cls: 'fb' }), flyNum(S, b, r, b.innerHTML, 700, { dx: 17 })]);
        setCellQ(r, AD_SUM[i][j]); prev = [a, b, r];
        await S.anim.wait(200);
      }
    } },
  { cap: () => tx(T('2 × 2 กับ 2 × 3 มิติไม่เท่า — ช่องไม่ตรงกัน <b>บวกไม่ได้</b> (ลบก็ไม่ได้เหมือนกัน)', 'A 2 × 2 and a 2 × 3 have different sizes — the entries do not line up, so they <b>cannot be added</b> (or subtracted)')),
    end: S => { adBuild(S.el, { B: AD_C, dim: true, calc: `<span class="bad">${tx(T('มิติไม่เท่า บวกไม่ได้', 'different sizes — cannot add'))}</span>` }); S.el.querySelectorAll('.mat-dim').forEach(e => { e.style.color = 'var(--g-red)'; }); },
    play: async S => {
      adBuild(S.el, { B: AD_C, dim: true });
      await S.anim.wait(500);
      S.el.querySelectorAll('.mat-wrap').forEach(e => { if (e.dataset.m !== 'R') e.classList.add('shake'); });
      S.el.querySelectorAll('.mat-dim').forEach(e => { e.style.color = 'var(--g-red)'; });
      S.el.querySelector('.ad-calc').innerHTML = `<span class="bad">${tx(T('มิติไม่เท่า บวกไม่ได้', 'different sizes — cannot add'))}</span>`;
      await S.anim.wait(700);
    } }
];

// ── คูณสเกลาร์: เลข 3 บินเข้าไปเกาะทีละช่อง ช่องเปลี่ยนเป็น 3 × v → ผล (ผลอยู่ที่เดิม ไม่ใช่การย้าย) ──
const SC_K = 3, SC_R = mScale(AD_A, SC_K), SC_ORDER = [[0, 0], [0, 1], [1, 0], [1, 1]];
const scIdx = (i, j) => SC_ORDER.findIndex(c => c[0] === i && c[1] === j);
const scVs = v => v < 0 ? `(${qHtml(v)})` : qHtml(v);
const scCalcOf = n => { const [i, j] = SC_ORDER[n]; return `<span style="font-size:1.45rem"><b style="color:color-mix(in srgb, var(--g-curve) 68%, var(--text))">${SC_K}</b> × ${scVs(AD_A[i][j])} = <b>${qHtml(SC_R[i][j])}</b></span>`; };
function scBuild(el, k, final) {            // k = จำนวนช่อง (ตามลำดับอ่าน) ที่คูณแล้ว · final = A กลายเป็น 3A (ป้าย 3 หาย)
  const M = AD_A.map((r, i) => r.map((v, j) => scIdx(i, j) < k ? SC_R[i][j] : v));
  const cls = (i, j) => scIdx(i, j) < k && !final ? 'hg' : '';
  el.innerHTML = `<div class="mx-row">${final ? '' : xtag('orange', `<b class="sc-k">${SC_K}</b>`) + xop('·')}${matHtml(M, { name: final ? `${SC_K}<i>A</i>` : '<i>A</i>', key: 'A', cls })}</div><div class="mx-calc sc-calc"></div>`; xgroup(el);
}
async function scStep(S, n) {
  const [i, j] = SC_ORDER[n], cell = cellEl(S.el, 'A', i, j), calc = S.el.querySelector('.sc-calc');
  cell.classList.add('ho');
  await flyNum(S, S.el.querySelector('.sc-k'), cell, String(SC_K), 750, { arc: 36 });
  cell.innerHTML = `<span style="white-space:nowrap"><b style="color:color-mix(in srgb, var(--g-curve) 68%, var(--text))">${SC_K}</b> × ${scVs(AD_A[i][j])}</span>`; calc.innerHTML = scCalcOf(n);
  await S.anim.wait(800);
  cell.classList.remove('ho'); setCellQ(cell, SC_R[i][j]);
  await S.anim.wait(250);
}
const scEnd = (S, k, final) => { scBuild(S.el, k, final); S.el.querySelector('.sc-calc').innerHTML = final ? xtag('green', tx(T('ทุกช่องคูณ 3 → ได้ 3A', 'every entry × 3 → 3A'))) : (k ? scCalcOf(k - 1) : ''); };
const SC_SC = [
  { cap: () => tx(T('คูณสเกลาร์: เอา 3 คูณ<b>ทุกช่อง</b>ของ A — ช่องอยู่ที่เดิม แต่ค่าเปลี่ยนเป็นสามเท่า · กด ▶', 'Scalar multiple: multiply <b>every entry</b> of A by 3 — each entry stays where it is, but its value triples · press ▶')),
    end: S => scEnd(S, 0, false) },
  { cap: () => tx(T('เลข 3 บินเข้าไปเกาะช่องแรกของ A: ช่องนั้นกลายเป็น 3 × 1 แล้วได้ 3', 'The 3 flies onto the first entry of A: that entry becomes 3 × 1, which gives 3')),
    end: S => scEnd(S, 1, false),
    play: async S => { scBuild(S.el, 0, false); await scStep(S, 0); } },
  { cap: () => tx(T('ทำซ้ำกับช่องที่เหลือทีละช่อง เช่น 3 × (−2) = −6 — ช่องที่คูณเสร็จแล้วเป็นสีเขียว', 'Repeat with the remaining entries one by one, e.g. 3 × (−2) = −6 — finished entries turn green')),

// ข้อความคำนวณช่อง (i, j) ของ AB: (a)(b) + (a)(b) = p + p = ผล · parts = จำนวนส่วนที่เผยแล้ว (ไว้ให้ค่อยๆ โผล่ — คงพื้นที่ไว้)

  host.innerHTML = '<div class="mx-note mt-p"></div><div class="mx-row"><div class="mt-a"></div><span class="mx-g"><span class="mx-op">·</span><div class="mt-b"></div></span><span class="mx-g mt-rg"><span class="mx-op">=</span><div class="mt-r"></div></span></div><div class="mx-calc mt-c"></div>';

  const B = makeMatrix(q('.mt-b'), [[2, -1], [1, 4]], { edit: true, resize: rz, name: 'B', dim: true, onChange: () => upd() });

      return;
    }

}

// ── เกมมิติ: คูณได้ไหม · ผลมิติอะไร ──
function makeDimGame(host) {
  host.innerHTML = '<div class="dg-chips"></div><div class="mx-row dg-mats"></div><div class="dg-q"></div><div class="dg-msg"></div><div class="mx-row dg-res"></div>';
  const q = s => host.querySelector(s);
  const g = { m: 2, n: 3, n2: 3, p: 2, ph: 0, p1: null, p2: null, seed: 3 };
  const can = () => g.n === g.n2;
  const reset = () => { g.ph = 0; g.p1 = null; g.p2 = null; };
  const optsDims = () => {
    const c = [`${g.m}×${g.p}`, `${g.n}×${g.n}`, `${g.m}×${g.n}`, `${g.p}×${g.m}`, `${g.n}×${g.p}`, `${g.m}×${g.m}`, `${g.p}×${g.p}`], u = [c[0]];
    c.slice(1).forEach(x => { if (!u.includes(x) && u.length < 4) u.push(x); });
    for (let a = 1; u.length < 4; a++) { const x = `${a}×${a + 1}`; if (!u.includes(x)) u.push(x); }
    const k = (g.m * 7 + g.n * 3 + g.p) % 4, out = u.slice(1); out.splice(k, 0, u[0]);
    return out;
  };
  const chipRow = (lab, key) => `<span class="dg-grp"><b>${lab}</b>${[1, 2, 3, 4].map(v => `<button class="chip${g[key] === v ? ' active' : ''}" data-k="${key}" data-v="${v}">${v}</button>`).join('')}</span>`;
  const paint = () => {
    q('.dg-chips').innerHTML = chipRow(tx(T('A แถว', 'A rows')), 'm') + chipRow(tx(T('A หลัก', 'A cols')), 'n') + chipRow(tx(T('B แถว', 'B rows')), 'n2') + chipRow(tx(T('B หลัก', 'B cols')), 'p') + `<button class="btn ghost dg-rnd">${tx(T('🎲 สุ่มมิติ', '🎲 Random sizes'))}</button>`;
    q('.dg-chips').querySelectorAll('.chip').forEach(c => c.onclick = () => { g[c.dataset.k] = +c.dataset.v; reset(); paint(); });
    q('.dg-rnd').onclick = () => { const r = rng(g.seed++ * 31); g.m = rint(r, 1, 4); g.n = rint(r, 1, 4); g.p = rint(r, 1, 4); g.n2 = r() < 0.5 ? g.n : rint(r, 1, 4); reset(); paint(); };
    const inner = g.ph >= 1;
    q('.dg-mats').innerHTML = matHtml(nullsOf(g.m, g.n), { name: 'A', dim: true, cls: () => inner && can() ? '' : '' }) + xop('·') + matHtml(nullsOf(g.n2, g.p), { name: 'B', dim: true });
    const bt = (h, k) => `<button class="quiz-opt" data-k="${k}">${h}</button>`;
    let qh = '', mh = '';
    if (g.ph === 0) qh = `<div class="quiz-q">${tx(T('AB คูณกันได้หรือไม่ (ดูมิติตัวในก่อนกดเฉลย)', 'Can AB be formed (look at the inner numbers before you answer)'))}</div><div class="quiz-opts">${bt(tx(T('คูณได้', 'Yes')), 'y')}${bt(tx(T('คูณไม่ได้', 'No')), 'n')}</div>`;
    else if (g.ph === 1) { qh = `<div class="quiz-q">${tx(T('ผลคูณ AB มีมิติเท่าไร', 'What size is the product AB'))}</div><div class="quiz-opts">${optsDims().map((o, k) => bt(o, 'd' + o)).join('')}</div>`; }
    const dimline = `${g.m}×<b>${g.n}</b> · <b>${g.n2}</b>×${g.p}`;
    if (g.ph >= 1 || (g.ph === 2 && !can())) {
      const ok1 = (g.p1 === 'y') === can();
      mh += `<div class="verdict ${ok1 ? 'ok' : 'no'}"><span class="mk">${ok1 ? '✓' : '✗'}</span><div>${ok1 ? tx(T('ทายถูก! ', 'Correct! ')) : tx(T('ยังไม่ใช่ — ', 'Not quite — '))}${dimline} → ${can() ? tx(T(`ตัวใน ${g.n} = ${g.n2} เท่ากัน จึงคูณได้`, `the inner numbers ${g.n} = ${g.n2} are equal, so AB exists`)) : tx(T(`ตัวใน ${g.n} ≠ ${g.n2} ไม่เท่ากัน จึงคูณไม่ได้`, `the inner numbers ${g.n} ≠ ${g.n2} differ, so AB does not exist`))}</div></div>`;
    }
    if (g.ph === 2 && can()) {
      const ok2 = g.p2 === `${g.m}×${g.p}`;
      mh += `<div class="verdict ${ok2 ? 'ok' : 'no'}"><span class="mk">${ok2 ? '✓' : '✗'}</span><div>${ok2 ? tx(T('ทายถูก! ', 'Correct! ')) : tx(T('ยังไม่ใช่ — ', 'Not quite — '))}${tx(T('มิติผลคูณ = ตัวนอก', 'the size of the product = the outer numbers'))} ${g.m}×${g.p}</div></div>`;
      q('.dg-res').innerHTML = matHtml(nullsOf(g.m, g.p), { name: '<i>AB</i>', dim: true });

      const k = b.dataset.k;
      if (g.ph === 0) { g.p1 = k; g.ph = can() ? 1 : 2; if (can()) { g.ph = 1; } paint(); }
      else if (g.ph === 1) { g.p2 = k.slice(1); g.ph = 2; paint(); }
    });
  };
  // ph 1 = ตอบข้อ 1 แล้ว (ถ้าคูณได้ ต่อข้อ 2) · ph 2 = จบ

  M = _mQ(M); const n = M.length;

  if (!M.every((r, i) => r.every((v, j) => i === j || qIsZero(v)))) return 1;
  if (!M.every((r, i) => qEq(r[i], M[0][0]))) return 2;

}

function transChainPredItem() {

    why: T('กระจายสลับที่ทีละคู่: (ABC)<sup>t</sup> = C<sup>t</sup>(AB)<sup>t</sup> = C<sup>t</sup>B<sup>t</sup>A<sup>t</sup> → ลำดับกลับหลังไปหน้า และทุกตัวมี t · ข้อที่ไม่กลับลำดับ หรือกลับไม่หมด หรือใส่ t แค่ตัวสุดท้าย ผิดทั้งหมด', 'Distribute and swap one pair at a time: (ABC)<sup>t</sup> = C<sup>t</sup>(AB)<sup>t</sup> = C<sup>t</sup>B<sup>t</sup>A<sup>t</sup> → the order reverses and every factor carries a t · answers that keep the order, only partly reverse it, or put t on the last factor alone are all wrong')
  }] };

<script id="theme-js">
// ── ปุ่มสลับโหมดสว่าง/มืด (สร้างโดย tools/build_lessons.py) — จำค่าไว้ใน localStorage 'siteTheme' ──

// ── ตัวปรับสีโหมดมืดตอนรัน: สีที่ JS เขียนตรงๆ ลงกราฟ SVG (fill/stroke) หรือ style="" ──

    for (const el of document.querySelectorAll('[data-dk-sf]')) { el.style.fill = el.getAttribute('data-dk-sf'); el.removeAttribute('data-dk-sf'); }
