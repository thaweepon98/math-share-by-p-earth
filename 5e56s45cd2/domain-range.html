<!DOCTYPE html>
<html lang="th">
<head>
<script id="theme-boot">(function(){var t='light';try{t=localStorage.getItem('siteTheme')||'light'}catch(e){}document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สื่อการสอน : โดเมนและเรนจ์ ม.4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap');

  :root {
    --primary: #1C3B22; --secondary: #FF8A3D; --accent: #68EF3F; --accent-2: #3FA82E; --warning: #FFB347;
    --bg: #F3F7EC; --card: #FFFFFF; --text: #2D3748; --muted: #718096; --border: #E2E8F0;
    --shadow: 0 4px 24px rgba(28,59,34,0.10); --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Anuphan', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  sup { font-size: .68em; line-height: 0; vertical-align: super; font-weight: 800; }
  sub { font-size: .68em; line-height: 0; vertical-align: sub; font-weight: 800; }
  sup sup { font-size: .8em; }

  header { background: linear-gradient(135deg, #1C3B22 0%, #2E5936 100%); color: white; padding: 28px 40px 20px; text-align: center; position: relative; overflow: hidden; }
  header::before { content: ''; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; background: rgba(255,255,255,0.07); border-radius: 50%; }
  header h1 { font-size: 2rem; font-weight: 800; letter-spacing: .5px; }
  header p { font-size: 1rem; opacity: .85; margin-top: 4px; }
  .back-link { position: absolute; top: 14px; left: 20px; color: white; text-decoration: none; font-size: .85rem; font-weight: 600; opacity: .9; z-index: 2; }
  .back-link:hover { opacity: 1; text-decoration: underline; }
  .lang-toggle { position: absolute; top: 14px; right: 20px; background: rgba(255,255,255,.15); color: white; border: 1.5px solid rgba(255,255,255,.5); border-radius: 20px; padding: 5px 14px; font-family: 'Anuphan', sans-serif; font-size: .8rem; font-weight: 700; cursor: pointer; z-index: 2; }
  .lang-toggle:hover { background: rgba(255,255,255,.28); }

  nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 20px 24px 0; background: white; border-bottom: 3px solid var(--border); }
  .tab-btn { padding: 10px 18px; border: none; background: transparent; border-radius: 10px 10px 0 0; font-family: 'Anuphan', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .25s; border-bottom: 3px solid transparent; margin-bottom: -3px; }
  .tab-btn:hover { color: var(--primary); background: #E3F3D8; }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: #E3F3D8; }

  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 60px; }
  .tab-panel { display: none; animation: fadeIn .35s ease; }
  .tab-panel.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes rowIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 32px; margin-bottom: 24px; }
  .card-title { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card-title .icon { font-size: 1.5rem; }
  .intro { font-size: 1.02rem; line-height: 1.8; margin-bottom: 14px; }
  .box-info { background: #EEF7E6; border-left: 4px solid var(--primary); border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .box-warn { background: #FFF7ED; border-left: 4px solid var(--warning); border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .box-ok   { background: #ECFDF5; border-left: 4px solid var(--accent);  border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .formula { background: linear-gradient(135deg,#1C3B22,#2E5936); color: white; border-radius: 12px; padding: 14px 24px; text-align: center; font-size: 1.3rem; font-weight: 700; margin: 14px 0; letter-spacing: .5px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px 18px; }

  .btn { padding: 10px 24px; background: var(--primary); color: white; border: none; border-radius: 30px; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s, opacity .2s; }
  .btn:hover:not(:disabled) { background: #2E5936; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: white; color: var(--primary); border: 2px solid var(--primary); }
  .btn.ghost:hover:not(:disabled) { background: #E3F3D8; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; align-items: center; }
  .chips .chips-label { font-weight: 700; color: var(--muted); font-size: .95rem; margin-right: 2px; }
  .chip { padding: 7px 16px; border: 2px solid var(--border); border-radius: 30px; background: #fff; font-family: 'Anuphan', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; color: var(--text); display: inline-block; text-align: center; vertical-align: middle; line-height: 1.5; max-width: 100%; }  /* ไม่ใช้ flex: ตัวยกในชิปจะได้ไม่แยกเป็นก้อน */
  .chip:hover { border-color: var(--primary); }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .frac { display: inline-flex; flex-direction: column; align-items: center; font-weight: 700; line-height: 1.15; vertical-align: middle; margin: 0 4px; }
  .frac .num { font-size: 1em; border-bottom: 2.5px solid currentColor; padding: 0 3px 2px; min-width: 18px; text-align: center; white-space: nowrap; }
  .frac .den { font-size: 1em; padding: 3px 3px 0; min-width: 18px; text-align: center; white-space: nowrap; }
  .rt { display: inline-flex; align-items: stretch; vertical-align: middle; font-weight: 700; }
  .rt .rt-s { font-size: 1.15em; line-height: 1; padding-right: 1px; align-self: flex-end; }
  .rt .rt-in { border-top: 2px solid currentColor; padding: 0 2px 0 3px; margin-top: 2px; }

  .slider-row { display: flex; align-items: center; gap: 12px; margin: 6px 0; flex-wrap: wrap; }
  .slider-row b { min-width: 30px; font-size: 1.05rem; }
  input[type=range] { accent-color: var(--primary); flex: 1; max-width: 300px; min-width: 120px; }
  .slider-val { font-weight: 800; color: var(--primary); font-size: 1.1rem; min-width: 46px; }

  /* กล่องสมการ: เนื้อหาไหลเป็นข้อความบรรทัดปกติ (ตัวยก/ตัวเอียงต้องติดกับตัวหน้า — ห้ามใช้ flex+gap ที่นี่ จะแยกเป็นก้อน)
     .col = หลายบรรทัดซ้อนกัน ห่อแต่ละบรรทัดด้วย <div> · .row = เรียงเป็นก้อนๆ ห่างเท่ากัน (เช่น สายพานกล่อง → กล่อง) */
  .wg-eq { text-align: center; font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-top: 8px; line-height: 1.9; }
  .wg-eq.col { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
  .wg-eq.row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 14px; }
  .wg-cap { background: #EEF7E6; border-left: 4px solid var(--primary); border-radius: 10px; padding: 12px 16px; line-height: 1.75; margin-top: 8px; }
  .wg-nav { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .wg-nav .btn { padding: 9px 22px; }
  .wg-cnt { font-weight: 700; color: var(--muted); min-width: 92px; text-align: center; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
  .tile { border: 2px solid var(--border); border-radius: 12px; padding: 10px 14px; background: #fff; }
  .tile h4 { font-size: .95rem; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
  .ans { background: #ECFDF5; border: 2px solid var(--accent-2); border-radius: 8px; padding: 2px 10px; color: #047857; font-weight: 800; white-space: nowrap; }
  .bad { background: #FFF1F2; border: 2px solid #E11D48; border-radius: 8px; padding: 2px 10px; color: #9F1239; font-weight: 800; white-space: nowrap; }
  .hl { border-radius: 5px; padding: 0 3px; background: #FEF3C7; border-bottom: 2px solid #D97706; }
  .hlb { border-radius: 5px; padding: 0 3px; background: #DBEAFE; border-bottom: 2px solid #2563EB; }
  .hlg { border-radius: 5px; padding: 0 3px; background: #DCFCE7; border-bottom: 2px solid #16A34A; }
  .hlp { border-radius: 5px; padding: 0 3px; background: #FCE7F3; border-bottom: 2px solid #DB2777; }
  .ptag { display: inline-block; background: #F1F5F9; border-radius: 20px; padding: 2px 12px; font-size: .88rem; font-weight: 700; color: #475569; }
  .verdict { border-radius: 12px; padding: 12px 16px; line-height: 1.75; border: 2px solid; font-weight: 600; margin-top: 10px; display: flex; gap: 12px; align-items: flex-start; }
  .verdict.ok { background: #ECFDF5; border-color: #16A34A; }
  .verdict.no { background: #FFF1F2; border-color: #E11D48; }
  .verdict .mk { font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
  .verdict.ok .mk { color: #16A34A; }
  .verdict.no .mk { color: #E11D48; }
  .mono { font-weight: 700; font-size: 1.1rem; }
  .setrow { font-size: 1.15rem; font-weight: 700; line-height: 2; }
  .tbl { border-collapse: collapse; margin: 8px auto; font-weight: 700; }
  .tbl th, .tbl td { border: 2px solid var(--border); padding: 6px 14px; text-align: center; }
  .tbl th { background: #EEF7E6; color: var(--primary); }
  .tbl td.cur { background: #FEF3C7; }
  .tbl-scroll { overflow-x: auto; }

  .wk-cell { position: relative; background: #fff; border: 2px solid var(--border); border-radius: 14px; padding: 12px 16px 12px 56px; margin-bottom: 12px; line-height: 1.9; }
  .wk-cell.fresh { animation: rowIn .5s ease; }
  .wk-cell.final { border-color: var(--accent-2); }
  .wk-cell .stepno { position: absolute; left: 14px; top: 14px; width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; font-size: .85rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .wk-eq { font-size: 1.15rem; font-weight: 700; overflow-x: auto; padding: 2px 0; }
  .wk-note { font-size: .95rem; font-weight: 600; color: #475569; margin-top: 2px; }

  .quiz-q { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; line-height: 1.8; }
  .quiz-opts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .quiz-opt { padding: 10px 20px; border: 2px solid var(--border); border-radius: 30px; cursor: pointer; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 600; transition: all .2s; background: white; display: inline-flex; align-items: center; min-height: 48px; color: var(--text); }
  .quiz-opt:hover { border-color: var(--primary); color: var(--primary); }
  .quiz-opt.correct { border-color: var(--accent); background: #ECFDF5; color: #047857; }
  .quiz-opt.wrong { border-color: var(--secondary); background: #FFF4EC; color: #BE185D; }
  .quiz-feedback { font-weight: 600; font-size: 1rem; min-height: 24px; line-height: 1.75; }
  .quiz-feedback.ok { color: #047857; }
  .quiz-feedback.err { color: #BE185D; }
  .btn-next { margin-top: 10px; padding: 10px 28px; background: var(--primary); color: white; border: none; border-radius: 30px; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s; }
  .btn-next:hover { background: #142B1A; }
  .score-badge { display: inline-block; background: linear-gradient(135deg,#68EF3F,#1C3B22); color: white; border-radius: 30px; padding: 6px 20px; font-weight: 700; font-size: 1rem; }
  .score-card { margin-top: 20px; background: linear-gradient(135deg,#1C3B22,#2E5936); color: white; border-radius: 16px; padding: 24px; text-align: center; }

  /* ─── กราฟ SVG (สีใช้ชุด --g-* ของธีม จึงเปลี่ยนตามโหมดสว่าง/มืด) ─── */
  .plot { width: 100%; max-width: 560px; height: auto; display: block; margin: 8px auto; background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; }
  .plot text { fill: var(--text); font-family: 'Anuphan', sans-serif; font-weight: 700; }
  .pl-grid { stroke: var(--border); stroke-width: 1; }
  .pl-axis { stroke: var(--muted); stroke-width: 1.8; }
  .pl-tick { fill: var(--muted) !important; font-size: 11px; font-weight: 600; }
  .pl-c { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .s-blue { stroke: var(--g-blue); } .s-orange { stroke: var(--g-curve); } .s-green { stroke: var(--g-green); }
  .s-pink { stroke: var(--g-pink); } .s-purple { stroke: var(--g-purple); } .s-red { stroke: var(--g-red); } .s-teal { stroke: var(--g-teal); }
  .s-muted { stroke: var(--muted); }
  .f-blue { fill: var(--g-blue); } .f-orange { fill: var(--g-curve); } .f-green { fill: var(--g-green); }
  .f-pink { fill: var(--g-pink); } .f-purple { fill: var(--g-purple); } .f-red { fill: var(--g-red); } .f-teal { fill: var(--g-teal); }
  .fa-blue { fill: var(--g-blue); fill-opacity: .16; stroke: none; } .fa-orange { fill: var(--g-curve); fill-opacity: .18; stroke: none; }
  .fa-red { fill: var(--g-red); fill-opacity: .16; stroke: none; } .fa-green { fill: var(--g-green); fill-opacity: .16; stroke: none; } .fa-pink { fill: var(--g-pink); fill-opacity: .16; stroke: none; }
  .pl-dash { stroke-dasharray: 6 5; stroke-width: 2; fill: none; }
  .pl-thick { stroke-width: 7; stroke-linecap: butt; fill: none; }
  .pl-dot { stroke: var(--g-ring); stroke-width: 2; }
  .pl-open { fill: var(--card); stroke-width: 2.6; }
  .pl-lbl { font-size: 13px; }
  .pl-lbl.b { fill: color-mix(in srgb, var(--g-blue) 75%, var(--text)) !important; } .pl-lbl.o { fill: color-mix(in srgb, var(--g-curve) 68%, var(--text)) !important; } .pl-lbl.g { fill: color-mix(in srgb, var(--g-green) 72%, var(--text)) !important; }
  .pl-lbl.p { fill: color-mix(in srgb, var(--g-pink) 75%, var(--text)) !important; } .pl-lbl.r { fill: color-mix(in srgb, var(--g-red) 75%, var(--text)) !important; }

  /* ─── แผนภาพลูกศร (mapping diagram) ─── */
  .md { width: 100%; max-width: 440px; height: auto; display: block; margin: 6px auto; }
  .md text { fill: var(--text); font-family: 'Anuphan', sans-serif; font-weight: 700; font-size: 17px; }
  .md .md-set { fill: none; stroke: var(--muted); stroke-width: 2; }
  .md .md-cap { font-size: 15px; fill: var(--muted); }
  .md .md-arr { stroke: var(--g-blue); stroke-width: 2.4; fill: none; }
  .md .md-arr.bad { stroke: var(--g-red); }
  .md .md-arr.g2 { stroke: var(--g-green); }
  .md .md-arr.o { stroke: var(--g-curve); }
  .md .md-head { fill: var(--g-blue); }
  .md .md-head.bad { fill: var(--g-red); }
  .md .md-head.g2 { fill: var(--g-green); }
  .md .md-head.o { fill: var(--g-curve); }
  .md .md-pt { fill: var(--card); stroke: var(--muted); stroke-width: 2; }
  .md .md-pt.hit { stroke: var(--g-blue); fill: var(--g-blue); fill-opacity: .15; }
  .md .md-pt.miss { stroke: var(--g-red); stroke-dasharray: 3 3; }
  .md .md-pt.multi { stroke: var(--g-red); fill: var(--g-red); fill-opacity: .15; }
  .md .md-pt.ok { stroke: var(--g-green); fill: var(--g-green); fill-opacity: .15; }
  .mark-b { fill: var(--g-blue); } .mark-r { fill: var(--g-red); }

  /* ตารางคู่อันดับ A×B */
  .pg { display: inline-grid; gap: 6px; margin: 6px 0; }
  .pg .pgh { font-weight: 800; text-align: center; padding: 4px 8px; color: var(--primary); min-width: 54px; }
  .pg button { font-family: 'Anuphan', sans-serif; font-weight: 700; font-size: 1rem; padding: 7px 10px; min-width: 72px; border: 2px solid var(--border); border-radius: 30px; background: var(--card); color: var(--text); cursor: pointer; transition: border-color .15s, background .15s; }
  .pg button:hover { border-color: var(--g-blue); }
  .pg button.on { background: color-mix(in srgb, var(--g-blue) 18%, var(--card)); border-color: var(--g-blue); border-width: 2.6px; }

  .tool-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 10px 0; }
  .tool-inp { font-family: 'Anuphan', sans-serif; font-size: 1.15rem; font-weight: 700; padding: 6px 12px; border: 2px solid var(--border); border-radius: 12px; width: 120px; max-width: 100%; color: var(--text); background: #fff; }
  .tool-inp:focus { outline: none; border-color: var(--primary); }
  .nl { width: 100%; max-width: 560px; height: auto; display: block; margin: 6px auto; }
  .nl text { fill: var(--text); font-family: 'Anuphan', sans-serif; font-weight: 700; }

  /* ─── ตัวเล่นฉาก / ทายก่อนเฉลย (makeScenes, makePredict ใน base.js) ─── */
  .sc-prompt { font-weight: 700; color: var(--muted); margin: 2px 0 6px; font-size: 1rem; }
  .sc-stage, .pr-stage { min-height: 40px; }
  .sc-svg { width: 100%; max-width: 560px; height: auto; display: block; margin: 4px auto; background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; touch-action: manipulation; }
  .sc-svg text { fill: var(--text); font-family: 'Anuphan', sans-serif; font-weight: 700; font-size: 17px; }
  .sc-svg .sc-small { font-size: 13px; fill: var(--muted); }
  .sc-svg .sc-big { font-size: 20px; }
  .sc-svg .sc-set { fill: none; stroke: var(--muted); stroke-width: 2; }
  .sc-svg .sc-node circle { fill: var(--card); stroke: var(--muted); stroke-width: 2; }
  .sc-svg .sc-node.hit circle { stroke: var(--g-blue); fill: color-mix(in srgb, var(--g-blue) 14%, var(--card)); }
  .sc-svg .sc-node.bad circle { stroke: var(--g-red); fill: color-mix(in srgb, var(--g-red) 16%, var(--card)); }
  .sc-svg .sc-node.good circle { stroke: var(--g-green); fill: color-mix(in srgb, var(--g-green) 16%, var(--card)); }
  .sc-svg .sc-node circle.sc-hit { fill: transparent; stroke: none; pointer-events: all; }
  .sc-svg .sc-halo { fill: var(--g-red); stroke: none; pointer-events: none; }
  .sc-svg .sc-arr line { stroke: var(--g-blue); stroke-width: 2.6; stroke-linecap: round; }
  .sc-svg .sc-arr polygon { fill: var(--g-blue); }
  .sc-svg .sc-arr.red line { stroke: var(--g-red); } .sc-svg .sc-arr.red polygon { fill: var(--g-red); }
  .sc-svg .sc-arr.green line { stroke: var(--g-green); } .sc-svg .sc-arr.green polygon { fill: var(--g-green); }
  .sc-svg .sc-arr.muted line { stroke: var(--muted); stroke-width: 1.8; stroke-dasharray: 5 4; } .sc-svg .sc-arr.muted polygon { fill: var(--muted); }
  .sc-svg .sc-chip rect { fill: var(--card); stroke: var(--g-blue); stroke-width: 2; }
  .sc-svg .sc-chip.sel rect { fill: color-mix(in srgb, var(--g-blue) 20%, var(--card)); stroke-width: 2.8; }
  .sc-svg .sc-chip text { font-size: 16px; }
  .sc-svg .sc-badge rect { stroke-width: 2; fill: var(--card); stroke: var(--muted); }
  .sc-svg .sc-badge.bad rect { stroke: var(--g-red); fill: color-mix(in srgb, var(--g-red) 14%, var(--card)); }
  .sc-svg .sc-badge.good rect { stroke: var(--g-green); fill: color-mix(in srgb, var(--g-green) 16%, var(--card)); }
  .sc-svg .sc-badge text { font-size: 16px; }
  .sc-svg .sc-clk { cursor: pointer; }
  .sc-svg .sc-grid { stroke: var(--border); stroke-width: 1; } .sc-svg .sc-axis { stroke: var(--muted); stroke-width: 1.6; fill: none; }
  .sc-svg .sc-tick { font-size: 11px; fill: var(--muted); font-weight: 600; }
  .sc-svg .sc-dot { fill: var(--g-blue); stroke: var(--g-ring); stroke-width: 2; }
  .sc-svg .sc-guide { fill: none; stroke: var(--g-blue); stroke-width: 2; stroke-dasharray: 6 5; }
  .sc-svg .sc-lab { font-size: 13px; fill: color-mix(in srgb, var(--g-blue) 70%, var(--text)); }
  .formula .fm-n { color: var(--accent); }
  .sc-cap { min-height: 3.6em; }
  .sc-cap.fresh { animation: rowIn .45s ease; }
  .sc-nav .btn { min-width: 108px; }
  .pr-qs { margin-top: 10px; }
  .pr-q { margin-bottom: 10px; }
  .pr-q .quiz-q { margin-bottom: 8px; }
  .pr-res:empty { display: none; }
  .pr-stage .setrow { text-align: center; }
  .pr-q + .pr-q { border-top: 1.5px dashed var(--border); padding-top: 10px; }

  @media (max-width: 700px) {
    header h1 { font-size: 1.4rem; }
    header { padding: 34px 16px 16px; }

  .mx { display: inline-block; white-space: nowrap; }

  .cl-blue { --cc: var(--g-blue); } .cl-orange { --cc: var(--g-curve); } .cl-green { --cc: var(--g-green); } .cl-purple { --cc: var(--g-purple); }
  .cl-pink { --cc: var(--g-pink); } .cl-teal { --cc: var(--g-teal); } .cl-red { --cc: var(--g-red); }

  .mt-item:hover:not(.done) { border-color: var(--cc, var(--primary)); }
  .mt-item.sel { border-color: var(--cc, var(--primary)); background: color-mix(in srgb, var(--cc, var(--primary)) 16%, var(--card)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cc, var(--primary)) 30%, transparent); }
  .mt-item.done { cursor: default; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, var(--card)); }
  .mt-badge { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 1.15rem; font-weight: 800; color: var(--cc); }
  .mt-item.bad, .so-card.bad { border-color: var(--g-red) !important; background: color-mix(in srgb, var(--g-red) 16%, var(--card)) !important; color: var(--text) !important; animation: mtShake .45s ease; }
  @keyframes mtShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
  .mt-bar { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
  .mt-cnt { font-weight: 700; color: var(--muted); }

  .so-pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 52px; margin: 8px 0; padding: 10px; border: 2px dashed var(--border); border-radius: 14px; }
  .so-card { font-size: 1.1rem; }
  .so-empty { color: var(--muted); font-weight: 700; align-self: center; }
  .so-bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 10px 0; }
  .so-bin { border: 2.5px solid var(--cc); border-radius: 14px; padding: 8px 10px 10px; min-height: 120px; background: color-mix(in srgb, var(--cc) 9%, var(--card)); cursor: pointer; }
  .so-bin.ready:hover { background: color-mix(in srgb, var(--cc) 20%, var(--card)); }
  .so-bin-h { text-align: center; font-weight: 800; color: color-mix(in srgb, var(--cc) 70%, var(--text)); margin-bottom: 6px; line-height: 1.5; }
  .so-item { margin-top: 6px; line-height: 1.5; }
  .so-chip { display: inline-block; padding: 2px 12px; border: 2px solid var(--cc); border-radius: 30px; background: var(--card); font-weight: 700; }

  .tl-row { --tl: 38px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 4px 0; }

  .tl-gap { width: calc(var(--tl) * .5); }

/* ── theme:start — สร้างโดย tools/build_lessons.py ห้ามแก้มือ (แก้ที่สคริปต์แล้วรันใหม่) ── */
:root{ --page:#0F766E; }
:root[data-theme="light"]{
  --bg:#F4F4F1; --card:#FFFFFF; --text:#16181A; --muted:#5E6166; --border:#DEDED8;
  --primary:color-mix(in srgb, var(--page) 86%, #000); --primary-2:color-mix(in srgb, var(--page) 62%, #000);
  --secondary:#C2540A; --secondary-light:#F2A15F; --accent:#68EF3F; --accent-2:#2E9E3F;
  --shadow:0 2px 10px rgba(0,0,0,.07);
  --strong:color-mix(in srgb, var(--page) 76%, #000); --chip:#E8E8E3; --chip-hover:#DCDCD5;
  --hero:color-mix(in srgb, var(--page) 82%, #000);
  --g-x:#E53935; --g-y:#2E9E4F; --g-z:#3949AB; --g-curve:#F07400; --g-curve-fill:rgba(240,116,0,.12);
  --g-pink:#D81B60; --g-plane:rgba(60,190,200,.28); --g-cone:rgba(153,51,0,.20); --g-cone-line:rgba(153,51,0,.35);
  --g-blue:#1E66D0; --g-red:#D32F2F; --g-green:#2E9E4F; --g-purple:#7B3FC4; --g-orange:#E8710A; --g-teal:#0F8A80;
  --g-ring:#FFFFFF;
}
:root[data-theme="dark"]{
  --bg:#121212; --card:#1C1C1C; --text:#FFFFFF; --muted:#B3B3B3; --border:#333333;
  --primary:#79ece3; --primary-2:#9df1ea;
  --secondary:#FFB37A; --secondary-light:#FFD0A8; --accent:#8AF25E; --accent-2:#5BD27E;
  --shadow:0 8px 24px rgba(0,0,0,.5);
  --strong:color-mix(in srgb, var(--page) 48%, #1C1C1C); --chip:#2A2A2A; --chip-hover:#353535;
  --hero:color-mix(in srgb, var(--page) 62%, #000);
  --g-x:#FF6B6B; --g-y:#5BD27E; --g-z:#8C9BFF; --g-curve:#FFA040; --g-curve-fill:rgba(255,160,64,.16);
  --g-pink:#FF5C9A; --g-plane:rgba(90,220,230,.26); --g-cone:rgba(255,170,110,.18); --g-cone-line:rgba(255,170,110,.45);
  --g-blue:#6AA8FF; --g-red:#FF6B6B; --g-green:#5BD27E; --g-purple:#B48CFF; --g-orange:#FFA040; --g-teal:#4FD1C5;
  --g-ring:#1C1C1C;
}
html{ background:var(--bg); }
html[data-theme="dark"]{ color-scheme:dark; }
body{ font-family:'Anuphan',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; -webkit-font-smoothing:antialiased; }

}
header::before, header::after{ display:none !important; }

.lesson-cover{ grid-column:1; grid-row:1 / span 6; align-self:end; width:120px; aspect-ratio:1; border-radius:6px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.45); }
.lesson-cover svg{ display:block; width:100%; height:100%; }

}

.lang-toggle, .theme-toggle{
  position:absolute; top:14px; height:34px; background:transparent; color:#fff;

}
.lang-toggle{ right:20px; padding:0 16px; }
.theme-toggle{ right:86px; width:34px; padding:0; display:grid; place-items:center; }
.theme-toggle svg{ width:18px; height:18px; }
.lang-toggle:hover, .theme-toggle:hover{ background:rgba(255,255,255,.14); border-color:#fff; }

header:not(:has(.back-link)):not(:has(.lang-toggle)){ padding-top:28px; border-radius:8px; }

/* แถบแท็บ: ชิปทรงแคปซูล */

<script>
const PAGE_TITLE = { th: "สื่อการสอน : โดเมนและเรนจ์ ม.4", en: "Teaching Aid: Domain and Range" };
// ══════════════ ภาษาไทย/อังกฤษ (ค่าใน data-th/data-en ถือเป็น HTML — ดู docs/adr/0002) ══════════════
let langMemory = 'th';
function getLang() { try { return localStorage.getItem('siteLang') || 'th'; } catch (e) { return langMemory; } }
function applyLang(lang) {
  document.documentElement.lang = lang;
  document.title = PAGE_TITLE[lang];
  document.querySelectorAll('[data-th]').forEach(el => { el.innerHTML = (lang === 'en' && el.dataset.en) ? el.dataset.en : el.dataset.th; });
  const btn = document.getElementById('langToggle');
  if (btn) btn.textContent = lang === 'en' ? 'ไทย' : 'EN';
  LIVE.forEach(w => w.refresh && w.refresh());
}
function toggleLang() {
  const next = getLang() === 'en' ? 'th' : 'en';
  langMemory = next;
  try { localStorage.setItem('siteLang', next); } catch (e) {}
  applyLang(next);
}
const LIVE = [];

// ══════════════ ตัวช่วย ══════════════
const EN = () => getLang() === 'en';
const T = (th, en) => ({ th, en });
const tx = v => (v == null ? '' : typeof v === 'string' ? v : v[getLang()]);
const esc = s => s.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
const d = (th, en) => `<span data-th="${esc(th)}" data-en="${esc(en)}">${th}</span>`;
const frac = (n, dd) => `<span class="frac"><span class="num">${n}</span><span class="den">${dd}</span></span>`;
const rt = s => `<span class="rt"><span class="rt-s">√</span><span class="rt-in">${s}</span></span>`;
const P = (b, e) => `${b}<sup>${e}</sup>`;
const mn = v => String(v).replace(/-/g, '−');
const num = x => { if (!isFinite(x)) return x > 0 ? '∞' : '−∞'; let s = (Math.round(x * 100) / 100).toString(); return mn(s === '-0' ? '0' : s); };
const ans = h => `<span class="ans">${h}</span>`;
const bad = h => `<span class="bad">${h}</span>`;
const card = (icon, title, inner) => `<div class="card"><div class="card-title"><span class="icon">${icon}</span><span>${title}</span></div>${inner}</div>`;
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const fn = h => `<i>f</i>(<i>x</i>)`;
// สัมประสิทธิ์พหุนามเป็น HTML เช่น poly([2,-3,1]) = 2x² − 3x + 1 (ดีกรีสูง→ต่ำ ระบุเป็น [c0,c1,c2,...] จากต่ำไปสูง)
function polyHtml(c, v) {
  v = v || '<i>x</i>';
  let s = '';
  for (let k = c.length - 1; k >= 0; k--) {
    const a = c[k]; if (a === 0) continue;
    const abs = Math.abs(a), sign = a < 0 ? '−' : '+';
    let body = k === 0 ? String(abs) : (abs === 1 ? '' : String(abs)) + v + (k > 1 ? `<sup>${k}</sup>` : '');
    if (!s) s = (a < 0 ? '−' : '') + body; else s += ` ${sign} ${body}`;
  }
  return s || '0';
}
const pAdd = (a, b) => { const n = Math.max(a.length, b.length), r = []; for (let i = 0; i < n; i++) r.push((a[i] || 0) + (b[i] || 0)); return r; };
const pMul = (a, b) => { const r = Array(a.length + b.length - 1).fill(0); a.forEach((x, i) => b.forEach((y, j) => { r[i + j] += x * y; })); return r; };
const pComp = (f, g) => { let r = [0], pw = [1]; f.forEach(c => { r = pAdd(r, pMul([c], pw)); pw = pMul(pw, g); }); return r; };
const pEval = (c, x) => c.reduceRight((s, a) => s * x + a, 0);
const pTrim = c => { c = c.slice(); while (c.length > 1 && c[c.length - 1] === 0) c.pop(); return c; };

// ══════════════ แท็บ ══════════════
function showTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  if (!btn) btn = [...document.querySelectorAll('.tab-btn')].find(b => b.getAttribute('onclick').includes("'" + id + "'"));
  if (btn) btn.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
const goTab = (id, label) => `<button class="btn ghost" onclick="showTab('${id}')">${label}</button>`;

// ══════════════ ขั้นตอนทีละแถว (ตัวอย่างการคำนวณ: โจทย์คงที่ เผยทีละขั้น) ══════════════
// rows: () => [{ h: 'html สมการ', n: 'หมายเหตุ' }]  — สมการเขียนเต็มฝั่งซ้ายทุกขั้น
function makeSteps(host, rows) {
  const w = { k: 0 };
  host.innerHTML = '<div class="wk-list"></div><div class="wg-nav"><button class="btn ghost prev"></button><span class="wg-cnt"></span><button class="btn next"></button></div>';
  const list = host.querySelector('.wk-list'), prev = host.querySelector('.prev'), next = host.querySelector('.next'), cnt = host.querySelector('.wg-cnt');
  w.render = fresh => {
    const rs = rows(); if (w.k >= rs.length) w.k = rs.length - 1;
    list.innerHTML = rs.slice(0, w.k + 1).map((r, i) => `<div class="wk-cell${i === rs.length - 1 ? ' final' : ''}${i === w.k && fresh ? ' fresh' : ''}"><span class="stepno">${i + 1}</span><div class="wk-eq">${tx(r.h)}</div>${r.n ? `<div class="wk-note">${tx(r.n)}</div>` : ''}</div>`).join('');
    cnt.textContent = (EN() ? 'Step ' : 'ขั้นที่ ') + (w.k + 1) + ' / ' + rs.length;
    prev.disabled = w.k === 0; next.disabled = w.k >= rs.length - 1;
    prev.textContent = EN() ? '◀ Back' : '◀ ย้อน'; next.textContent = EN() ? 'Next ▶' : 'ถัดไป ▶';
  };
  w.reset = () => { w.k = 0; w.render(false); };
  w.refresh = () => w.render(false);
  prev.onclick = () => { if (w.k > 0) { w.k--; w.render(false); } };
  next.onclick = () => { w.k++; w.render(true); };
  LIVE.push(w); w.render(false);
  return w;
}
// ตัวเลือกโจทย์ (ชิป) + stepper: items = [{ id, label, rows }]
function makeProblemSteps(host, label, items) {
  host.innerHTML = '<div class="chips"></div><div class="ps-body"></div>';
  const chips = host.querySelector('.chips'), body = host.querySelector('.ps-body');
  let cur = 0, st = null;
  const paint = () => {
    chips.innerHTML = `<span class="chips-label">${tx(label)}</span>` + items.map((it, i) => `<button class="chip${i === cur ? ' active' : ''}" data-i="${i}">${tx(it.label)}</button>`).join('');
    chips.querySelectorAll('.chip').forEach(c => c.onclick = () => { cur = +c.dataset.i; st = null; start(); paint(); });
  };
  const start = () => { body.innerHTML = ''; const h = document.createElement('div'); body.appendChild(h); st = makeSteps(h, () => items[cur].rows()); LIVE.splice(LIVE.indexOf(st), 1); };
  start(); paint();
  const w = { refresh() { paint(); st.render(false); } };
  LIVE.push(w);
  return w;
}

// ══════════════ แบบฝึกหัดปรนัย ══════════════
// items: [{ q: T|html, o: [html...], a: index, e: T|html }]
function makeQuiz(host, items) {
  // สลับลำดับตัวเลือกแบบคงที่ (seed ตามข้อ) ไม่ให้คำตอบถูกกองอยู่ตำแหน่งเดิม — คำอธิบายห้ามอ้าง "ข้อ 1/2/3/4" ของตัวเลือก
  items = items.map((it, n) => {
    // ตำแหน่งที่คำตอบถูกจะไปอยู่: วนตามลำดับคงที่ให้กระจายทุกตำแหน่ง ส่วนตัวหลอกสลับด้วย seed ตามข้อ
    const target = [2, 0, 3, 1, 3, 2, 0, 1, 2, 3, 1, 0][n % 12] % it.o.length;
    let seed = (n + 1) * 0x9E3779B1 >>> 0;
    const rnd = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const others = it.o.map((_, k) => k).filter(k => k !== it.a);
    for (let k = others.length - 1; k > 0; k--) { const m = Math.floor(rnd() * (k + 1)); [others[k], others[m]] = [others[m], others[k]]; }
    const order = others.slice(); order.splice(target, 0, it.a);
    return Object.assign({}, it, { o: order.map(k => it.o[k]), a: target });
  });
  const w = { i: 0, score: 0, done: false, picked: null };
  host.innerHTML = '<div class="quiz-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px"><span class="qprog" style="color:var(--muted)"></span><span class="score-badge"></span></div><div class="qbox"></div><div class="qctl"></div>';
  const prog = host.querySelector('.qprog'), badge = host.querySelector('.score-badge'), box = host.querySelector('.qbox'), ctl = host.querySelector('.qctl');
  const bt = (th, en) => EN() ? en : th;
  w.render = () => {
    badge.innerHTML = `${bt('คะแนน', 'Score')} ${w.score} / ${items.length}`;
    if (w.i >= items.length) {
      prog.textContent = '';
      const r = w.score / items.length;
      const msg = r === 1 ? bt('ยอดเยี่ยม! ครบทุกข้อ', 'Perfect!') : r >= .7 ? bt('เก่งมาก ไปต่อได้เลย', 'Great — keep going') : bt('ลองทบทวนแท็บด้านบนแล้วเล่นใหม่อีกรอบ', 'Review the tabs above and try again');
      box.innerHTML = `<div class="score-card"><div style="font-size:2.4rem">🎉</div><div style="font-size:1.4rem;font-weight:800;margin:6px 0">${bt('จบแบบฝึกหัด', 'Quiz finished')}</div><div style="font-size:2.6rem;font-weight:800">${w.score} / ${items.length}</div><div style="margin-top:6px">${msg}</div></div>`;
      ctl.innerHTML = `<button class="btn-next retry">${bt('เล่นใหม่ 🔄', 'Play again 🔄')}</button>`;
      ctl.querySelector('.retry').onclick = () => { w.i = 0; w.score = 0; w.picked = null; w.render(); };
      return;
    }
    const it = items[w.i];
    prog.textContent = bt(`ข้อที่ ${w.i + 1} / ${items.length}`, `Question ${w.i + 1} / ${items.length}`);
    box.innerHTML = `<div class="quiz-q">${w.i + 1}. ${tx(it.q)}</div><div class="quiz-opts">${it.o.map((o, k) => `<button class="quiz-opt" data-k="${k}">${tx(o)}</button>`).join('')}</div><div class="quiz-feedback"></div>`;
    ctl.innerHTML = '';
    box.querySelectorAll('.quiz-opt').forEach(b => b.onclick = () => pick(+b.dataset.k));
    if (w.picked !== null) mark(w.picked);
  };
  function mark(k) {
    const it = items[w.i], fb = box.querySelector('.quiz-feedback');
    box.querySelectorAll('.quiz-opt').forEach((b, idx) => { if (idx === it.a) b.classList.add('correct'); else if (idx === k) b.classList.add('wrong'); b.style.pointerEvents = 'none'; });
    const ok = k === it.a;
    fb.className = 'quiz-feedback ' + (ok ? 'ok' : 'err');
    fb.innerHTML = (ok ? '✅ ' + bt('ถูกต้อง! ', 'Correct! ') : '❌ ' + bt('ยังไม่ใช่ — ', 'Not quite — ')) + tx(it.e);
    ctl.innerHTML = `<button class="btn-next nx">${w.i < items.length - 1 ? bt('ข้อถัดไป ▶', 'Next ▶') : bt('ดูคะแนน 🏁', 'See score 🏁')}</button>`;
    ctl.querySelector('.nx').onclick = () => { w.i++; w.picked = null; w.render(); };
  }
  function pick(k) { if (w.picked !== null) return; w.picked = k; if (k === items[w.i].a) w.score++; badge.innerHTML = `${bt('คะแนน', 'Score')} ${w.score} / ${items.length}`; mark(k); }
  w.refresh = () => w.render();
  LIVE.push(w); w.render();
  return w;
}

function sliderRow(label, id, min, max, step, val) {

// ══════════════ กราฟ SVG ══════════════
let PLOT_N = 0;
class Plot {
  constructor(o) {
    Object.assign(this, { w: 520, h: 400, xmin: -5, xmax: 5, ymin: -5, ymax: 5, pad: 30, gx: 1, gy: 1, lx: 1, ly: 1, grid: true }, o);
    this.id = 'pc' + (++PLOT_N); this.back = []; this.front = [];
    this.sx = (this.w - 2 * this.pad) / (this.xmax - this.xmin);
    this.sy = (this.h - 2 * this.pad) / (this.ymax - this.ymin);
  }
  X(x) { return +(this.pad + (x - this.xmin) * this.sx).toFixed(2); }
  Y(y) { return +(this.h - this.pad - (y - this.ymin) * this.sy).toFixed(2); }
  ix(px) { return this.xmin + (px - this.pad) / this.sx; }   // พิกัดจอ(SVG) → พิกัดกราฟ
  iy(py) { return this.ymin + (this.h - this.pad - py) / this.sy; }
  put(s, front) { (front ? this.front : this.back).push(s); return this; }
  path(f, cls, o) {
    o = o || {};
    const x0 = o.x0 !== undefined ? o.x0 : this.xmin, x1 = o.x1 !== undefined ? o.x1 : this.xmax, n = o.n || 400;
    let dstr = '', pen = false, py = null;
    for (let i = 0; i <= n; i++) {
      const x = x0 + (x1 - x0) * i / n; let y = f(x);
      if (y === null || y === undefined || !isFinite(y) || Math.abs(y) > 1e4) { pen = false; py = null; continue; }
      const Y = this.Y(y);
      // ตัดเส้นที่เส้นกำกับแนวตั้ง (กระโดดเกินครึ่งจอ) — เฉพาะตอนสุ่มจุดถี่ เส้นตรงที่ใช้ n น้อยจึงไม่ถูกตัดทิ้ง
      if (pen && n >= 50 && Math.abs(Y - py) > this.h * 0.55) pen = false;
      dstr += (pen ? 'L' : 'M') + this.X(x) + ' ' + Y; pen = true; py = Y;
    }
    return this.put(`<path class="pl-c ${cls}" d="${dstr}" clip-path="url(#${this.id})"${o.dash ? ' stroke-dasharray="7 6"' : ''}/>`, o.front);
  }
  // y เป็นฟังก์ชันของ t (เส้นโค้งพารามิเตอร์)
  param(fx, fy, t0, t1, cls, n) {
    n = n || 300; let dstr = '';
    for (let i = 0; i <= n; i++) { const t = t0 + (t1 - t0) * i / n; dstr += (i ? 'L' : 'M') + this.X(fx(t)) + ' ' + this.Y(fy(t)); }
    return this.put(`<path class="pl-c ${cls}" d="${dstr}" clip-path="url(#${this.id})"/>`);
  }
  line(x1, y1, x2, y2, cls, extra) { return this.put(`<line class="${cls}" x1="${this.X(x1)}" y1="${this.Y(y1)}" x2="${this.X(x2)}" y2="${this.Y(y2)}" ${extra || ''} clip-path="url(#${this.id})"/>`); }
  dash(x1, y1, x2, y2, cls) { return this.line(x1, y1, x2, y2, 'pl-dash ' + cls); }
  thick(x1, y1, x2, y2, cls) { return this.line(x1, y1, x2, y2, 'pl-thick ' + cls); }
  dot(x, y, cls, open, r) { return this.put(`<circle class="${open ? 'pl-open ' + cls.replace('f-', 's-') : 'pl-dot ' + cls}" cx="${this.X(x)}" cy="${this.Y(y)}" r="${r || 5.5}"/>`, true); }
  text(x, y, html, cls, anchor, dx, dy) { return this.put(`<text class="pl-lbl ${cls || ''}" x="${this.X(x) + (dx || 0)}" y="${this.Y(y) + (dy || 0)}" text-anchor="${anchor || 'start'}">${html}</text>`, true); }
  poly(pts, cls) { return this.put(`<polygon class="${cls}" points="${pts.map(p => this.X(p[0]) + ',' + this.Y(p[1])).join(' ')}" clip-path="url(#${this.id})"/>`); }
  raw(s, front) { return this.put(s, front); }
  svg() {
    const w = this.w, h = this.h, p = this.pad, g = [];
    if (this.grid) {
      for (let x = Math.ceil(this.xmin / this.gx) * this.gx; x <= this.xmax + 1e-9; x += this.gx) g.push(`<line class="pl-grid" x1="${this.X(x)}" y1="${p}" x2="${this.X(x)}" y2="${h - p}"/>`);
      for (let y = Math.ceil(this.ymin / this.gy) * this.gy; y <= this.ymax + 1e-9; y += this.gy) g.push(`<line class="pl-grid" x1="${p}" y1="${this.Y(y)}" x2="${w - p}" y2="${this.Y(y)}"/>`);
    }
    const ax = [];
    const x0 = Math.min(Math.max(0, this.xmin), this.xmax), y0 = Math.min(Math.max(0, this.ymin), this.ymax);
    ax.push(`<line class="pl-axis" x1="${p - 8}" y1="${this.Y(y0)}" x2="${w - p + 8}" y2="${this.Y(y0)}"/><line class="pl-axis" x1="${this.X(x0)}" y1="${h - p + 8}" x2="${this.X(x0)}" y2="${p - 8}"/>`);
    ax.push(`<path class="pl-axis" d="M${w - p + 8} ${this.Y(y0)} l-7 -4 m7 4 l-7 4 M${this.X(x0)} ${p - 8} l-4 7 m4 -7 l4 7" fill="none"/>`);
    ax.push(`<text class="pl-tick" x="${w - p + 4}" y="${this.Y(y0) + 18}" style="font-size:14px;font-style:italic">x</text><text class="pl-tick" x="${this.X(x0) + 8}" y="${p - 2}" style="font-size:14px;font-style:italic">y</text>`);
    for (let x = Math.ceil(this.xmin / this.lx) * this.lx; x <= this.xmax + 1e-9; x += this.lx) if (Math.abs(x) > 1e-9) ax.push(`<text class="pl-tick" x="${this.X(x)}" y="${this.Y(y0) + 15}" text-anchor="middle">${mn(Math.round(x * 100) / 100)}</text>`);
    for (let y = Math.ceil(this.ymin / this.ly) * this.ly; y <= this.ymax + 1e-9; y += this.ly) if (Math.abs(y) > 1e-9) ax.push(`<text class="pl-tick" x="${this.X(x0) - 6}" y="${this.Y(y) + 4}" text-anchor="end">${mn(Math.round(y * 100) / 100)}</text>`);
    return `<svg class="plot" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="${this.id}"><rect x="${p - 8}" y="${p - 8}" width="${w - 2 * p + 16}" height="${h - 2 * p + 16}"/></clipPath></defs>${g.join('')}${this.back.join('')}${ax.join('')}${this.front.join('')}</svg>`;
  }
}

// ══════════════ แผนภาพลูกศร (mapping diagram) ══════════════
// A, B = ป้ายสมาชิก; pairs = [[i, j]]; o.flag = ระบายสีสมาชิก A ที่ผิดปกติ (ลูกศรออกหลายเส้น = แดง); o.capA/capB = หัวเซต
// o.flagY: true = ระบายสีสมาชิก B ทั้ง 3 แบบ (ไม่ถูกชี้=ประ / ถูกชี้ซ้ำ=แดง) · 'one' = ไฮไลต์เรื่อง 1-1 (ถูกชี้ซ้ำ=แดง, ชี้ 1 เส้น=ฟ้า) · 'onto' = ไฮไลต์เรื่องทั่วถึง (ไม่ถูกชี้=ประ, ถูกชี้=ฟ้า) · o.okY = ถูกชี้ซ้ำ ระบายเขียว (y ซ้ำได้)
let MD_N = 0;
function mapDiagram(A, B, pairs, o) {
  o = o || {};
  const n = Math.max(A.length, B.length), H = 46 + n * 40, xa = 96, xb = 324, mid = H / 2 + 6;
  const ya = i => mid + (i - (A.length - 1) / 2) * 40, yb = j => mid + (j - (B.length - 1) / 2) * 40;
  const outc = A.map((_, i) => pairs.filter(p => p[0] === i).length), inc = B.map((_, j) => pairs.filter(p => p[1] === j).length);
  let s = `<svg class="md" viewBox="0 0 420 ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<ellipse class="md-set" cx="${xa}" cy="${mid}" rx="52" ry="${n * 20 + 14}"/><ellipse class="md-set" cx="${xb}" cy="${mid}" rx="52" ry="${n * 20 + 14}"/>`;
  s += `<text class="md-cap" x="${xa}" y="16" text-anchor="middle">${o.capA || 'A'}</text><text class="md-cap" x="${xb}" y="16" text-anchor="middle">${o.capB || 'B'}</text>`;
  pairs.forEach(p => {
    const cls = o.flag && outc[p[0]] > 1 ? 'bad' : (o.cls ? (o.cls[p[0] + ',' + p[1]] || '') : '');
    const x1 = xa + 15, y1 = ya(p[0]), x2 = xb - 17, y2 = yb(p[1]), ang = Math.atan2(y2 - y1, x2 - x1), hx = x2 - 9 * Math.cos(ang), hy = y2 - 9 * Math.sin(ang);
    s += `<line class="md-arr ${cls}" x1="${x1}" y1="${y1}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}"/>`;
    s += `<polygon class="md-head ${cls}" points="${x2},${y2} ${(x2 - 10 * Math.cos(ang - .4)).toFixed(1)},${(y2 - 10 * Math.sin(ang - .4)).toFixed(1)} ${(x2 - 10 * Math.cos(ang + .4)).toFixed(1)},${(y2 - 10 * Math.sin(ang + .4)).toFixed(1)}"/>`;
  });
  A.forEach((a, i) => { const c = o.flag ? (outc[i] === 0 ? 'miss' : outc[i] > 1 ? 'multi' : 'hit') : ''; s += `<circle class="md-pt ${c}" cx="${xa}" cy="${ya(i)}" r="15"/><text x="${xa}" y="${ya(i) + 6}" text-anchor="middle">${a}</text>`; });
  B.forEach((b, j) => { const f = o.flagY, c = f === true ? (inc[j] === 0 ? 'miss' : inc[j] > 1 ? 'multi' : 'hit') : f === 'one' ? (inc[j] > 1 ? 'multi' : inc[j] === 1 ? 'hit' : '') : f === 'onto' ? (inc[j] === 0 ? 'miss' : 'hit') : (o.okY && inc[j] > 1 ? 'ok' : ''); s += `<circle class="md-pt ${c}" cx="${xb}" cy="${yb(j)}" r="15"/><text x="${xb}" y="${yb(j) + 6}" text-anchor="middle">${b}</text>`; });
  return s + '</svg>';
}

// ══════════════ ช่วงจำนวนจริง ══════════════
// ช่วง = { lo, hi, lc, hc } (lc/hc = ปิดปลายซ้าย/ขวา) ; ชุดช่วง = array เรียงจากซ้ายไปขวา
const IV = (lo, hi, lc, hc) => ({ lo, hi, lc: lc === undefined ? isFinite(lo) : lc, hc: hc === undefined ? isFinite(hi) : hc });
const ALLR = () => [IV(-Infinity, Infinity, false, false)];
function ivIntersect(A, B) {

    if (a.hi < b.hi) { hi = a.hi; hc = a.hc; } else if (a.hi > b.hi) { hi = b.hi; hc = b.hc; } else { hi = a.hi; hc = a.hc && b.hc; }

    if (p < a.hi) out.push({ lo: p, hi: a.hi, lc: false, hc: a.hc });

}
const ivHas = (A, x) => A.some(a => (x > a.lo || (x === a.lo && a.lc)) && (x < a.hi || (x === a.hi && a.hc)));

  for (let i = 0; i + 1 < A.length && whole; i++) { if (A[i].hi === A[i + 1].lo && !A[i].hc && !A[i + 1].lc) holes.push(A[i].hi); else whole = false; }
  if (whole && holes.length && A.length === holes.length + 1) return 'ℝ − {' + holes.map(num).join(', ') + '}';
  return A.map(a => (a.lc ? '[' : '(') + num(a.lo) + ', ' + num(a.hi) + (a.hc ? ']' : ')')).join(' ∪ ');
}
// เส้นจำนวนพร้อมแถบช่วง
function numLine(A, o) {
  o = o || {};

  let s = `<svg class="nl" viewBox="0 0 ${W} 76" xmlns="http://www.w3.org/2000/svg"><line class="pl-axis" x1="8" y1="${y}" x2="${W - 8}" y2="${y}"/><path class="pl-axis" d="M${W - 8} ${y} l-7 -4 m7 4 l-7 4" fill="none"/>`;
  for (let t = Math.ceil(lo); t <= hi; t++) s += `<line class="pl-axis" x1="${sx(t)}" y1="${y - 4}" x2="${sx(t)}" y2="${y + 4}"/><text class="pl-tick" x="${sx(t)}" y="${y + 20}" text-anchor="middle">${mn(t)}</text>`;

    s += `<line class="pl-c ${col}" style="stroke-width:7" x1="${x1}" y1="${y - 14}" x2="${x2}" y2="${y - 14}"/>`;
    if (a.lo !== -Infinity) s += `<circle class="${a.lc ? 'pl-dot ' + fcol : 'pl-open ' + col}" cx="${x1}" cy="${y - 14}" r="6"/>`;
    if (a.hi !== Infinity) s += `<circle class="${a.hc ? 'pl-dot ' + fcol : 'pl-open ' + col}" cx="${x2}" cy="${y - 14}" r="6"/>`;

// ════════════════════════════════════════════════════════════════════════════
//  ชุดของกลางสำหรับสื่อ "เห็นภาพ + ได้ลองทำ" (docs/media-design-guide.md) — ใช้ร่วมทั้ง 5 ชิ้น
//  ไม่มีไลบรารีภายนอก: SVG + requestAnimationFrame + Promise (เปิดจาก file:// ได้)
//
//  1) makeAnimator()        ตัวคุมแอนิเมชัน: await A.run(ms, t => …) · await A.wait(ms) · A.kill()
//  2) sv / svArrow / svChip ตัวช่วยสร้างองค์ประกอบ SVG (ลูกศรที่ยืด/เลื่อนปลายได้, "ชิปคู่อันดับ")
//  3) makeScenes()          ตัวเล่นฉาก  ◀ ↻ ▶ + "ฉากที่ k / n"
//  4) makePredict()         ทายก่อนเฉลย (เลือกข้อ → ภาพ → ทาย → ผล + เฉลยบนภาพ)
//  5) plotPointer()         คลิก/ลากบน Plot ในพิกัดกราฟ (ดูดเข้าจุดจำนวนเต็ม)
// ════════════════════════════════════════════════════════════════════════════

// ───────── 1) แอนิเมชัน ─────────
const EASE = {
  lin: t => t,
  out: t => 1 - Math.pow(1 - t, 3),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }   // เกินนิดแล้วเด้งกลับ (ใช้ "เด้งขึ้น")
};
const lerp = (a, b, t) => a + (b - a) * t;
const reducedMotion = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
// makeAnimator() → A  (ใช้ 1 ตัวต่อ 1 การเล่น พอ A.kill() ทุกอย่างที่ค้างอยู่หยุดทันทีและ Promise ที่รอไม่คืนค่าอีก)
//   await A.run(ms, t => {…}, ease?)   เรียก fn(t) ทุกเฟรม t = 0→1 (ผ่าน ease, ค่าเริ่ม inOut) ; เฟรมสุดท้ายได้ t = 1 พอดี
//   await A.wait(ms)                   หน่วงเวลา
//   await Promise.all([A.run(…), A.run(…)])   เล่นพร้อมกัน
function makeAnimator() {
  const A = { dead: false };
  A.run = (ms, fn, ease) => new Promise(res => {
    if (A.dead) return;
    const e = ease || EASE.inOut, t0 = performance.now();
    const step = now => { if (A.dead) return; const t = Math.max(0, Math.min(1, (now - t0) / ms)); fn(Math.max(0, e(t))); if (t < 1) requestAnimationFrame(step); else res(); };   // (now ของ rAF อาจน้อยกว่า t0 นิดหน่อย → ตรึง t และค่า ease ไม่ให้ติดลบ)
    requestAnimationFrame(step);
  });
  A.wait = ms => new Promise(res => setTimeout(() => { if (!A.dead) res(); }, ms));
  A.kill = () => { A.dead = true; };
  return A;
}

// ───────── 2) ตัวช่วย SVG ─────────
const SVGNS = 'http://www.w3.org/2000/svg';
// sv('rect', {x:1, …, text:'ข้อความ'}, parent?) — attrs.text = textContent
function sv(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in (attrs || {})) { if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  if (parent) parent.appendChild(e);
  return e;
}
// ลูกศรที่ "ยืด" ได้: a = svArrow(parent, 'red'?) ; a.set(x1, y1, x2, y2, p) วาดลูกศรไปถึง p ของความยาว (p 0→1 = เส้นพุ่งออก, p<0.04 = ซ่อน)
//   เปลี่ยนสี: a.cls('red' | 'green' | 'muted' | '') · เลื่อนปลายลูกศร = เรียก set ซ้ำด้วย y2 ที่ค่อยๆ เปลี่ยน
function svArrow(parent, cls) {
  const g = sv('g', { class: 'sc-arr ' + (cls || '') }, parent), line = sv('line', {}, g), head = sv('polygon', {}, g);
  const a = { g, line, head };
  a.cls = c => { g.setAttribute('class', 'sc-arr ' + (c || '')); return a; };
  a.set = (x1, y1, x2, y2, p) => {
    p = p === undefined ? 1 : p;
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, tx = x1 + dx * p, ty = y1 + dy * p, hl = Math.min(11, L * p);
    g.style.display = p < 0.04 ? 'none' : '';
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', (tx - ux * hl * .8).toFixed(2)); line.setAttribute('y2', (ty - uy * hl * .8).toFixed(2));
    const bx = tx - ux * hl, by = ty - uy * hl, nx = -uy * hl * .42, ny = ux * hl * .42;
    head.setAttribute('points', `${tx.toFixed(2)},${ty.toFixed(2)} ${(bx + nx).toFixed(2)},${(by + ny).toFixed(2)} ${(bx - nx).toFixed(2)},${(by - ny).toFixed(2)}`);
    return a;
  };

}
// "ชิปคู่อันดับ" ใน SVG: c = svChip(parent, '(1, a)', 'sel'?) ; c.at(x, y, scale, opacity) วางที่จุดกึ่งกลาง ; c.cls('sel' | 'dim' | '')
function svChip(parent, text, cls, w, h) {

  sv('text', { x: 0, y: 6, 'text-anchor': 'middle', text }, g);
  const c = { g, w, h };
  c.at = (x, y, s, o) => { g.setAttribute('transform', `translate(${(+x).toFixed(2)} ${(+y).toFixed(2)}) scale(${s === undefined ? 1 : s})`); g.style.opacity = o === undefined ? 1 : o; g.style.display = o === 0 ? 'none' : ''; return c; };
  c.cls = k => { g.setAttribute('class', 'sc-chip ' + (k || '')); return c; };
  return c;
}

// ───────── 3) ตัวเล่นฉาก ─────────
// makeScenes(host, scenes, o) → w            o = { prompt: T|html  (คำโปรย ≤ 1 บรรทัด เหนือภาพ) }
//   scene = {
//     cap:  T(th, en) | html | () => html     คำบรรยาย/เหตุผล — ขึ้นใต้ปุ่มทันทีที่กด ▶ ของฉากนี้ (เหตุผลยาวอยู่ที่นี่เท่านั้น)
//     end:  S => {}                           วาด "สภาพจบฉาก" ลง S.el (ที่ว่างเปล่า) ทันที ไม่มีแอนิเมชัน — ใช้ตอนย้อน/ข้าม/เปลี่ยนภาษา/ลดการเคลื่อนไหว
//     play: async S => {}   (ไม่บังคับ)       เล่นแอนิเมชัน: ตอนเรียก S.el มีภาพ "จบฉากก่อนหน้า" วาดไว้แล้ว (ฉากแรก = ว่าง; อยากเริ่มจากภาพอื่นก็ล้าง S.el แล้ววาดเอง)
//                                            ใช้ await S.anim.run(ms, t => …) / await S.anim.wait(ms) · จบแล้วผู้เล่นวาด end(S) ซ้ำให้อัตโนมัติ (ต้องหน้าตาเหมือนจุดจบของ play)
//   }
//   S = { el, k, anim (makeAnimator), reduced }   แอนิเมชันถูกตัดด้วย anim.kill() เสมอเมื่อ ▶ / ◀ / ↻ / เปลี่ยนภาษา — end() ต้องวาดจากศูนย์ได้เองโดยไม่พึ่งผลของ play
//   พฤติกรรม: เปิดมาที่ฉาก 1 ในสภาพจบ (ภาพมาก่อน) · ↻ เล่นฉากนี้ซ้ำ · ◀ วาดจบฉากก่อนหน้าทันที ·
//             ▶ ระหว่างแอนิเมชัน = กระโดดไปจบฉากนั้นก่อน (กดอีกครั้งถึงไปฉากถัดไป) · prefers-reduced-motion = ไม่เล่น แสดงภาพจบทันที
//   w.k = ฉากปัจจุบัน (0-based) · w.go(k, play) · w.refresh() (ลงทะเบียนใน LIVE แล้ว — เปลี่ยนภาษากลางฉากไม่รีเซ็ต)
function makeScenes(host, scenes, o) {
  o = o || {};
  const w = { k: 0, playing: false, anim: null };
  host.innerHTML = '<div class="sc-prompt"></div><div class="sc-stage"></div><div class="wg-nav sc-nav"><button class="btn ghost sc-prev"></button><button class="btn ghost sc-rep"></button><span class="wg-cnt"></span><button class="btn sc-next"></button></div><div class="wg-cap sc-cap"></div>';
  const q = s => host.querySelector(s), stage = q('.sc-stage'), cap = q('.sc-cap'), prev = q('.sc-prev'), rep = q('.sc-rep'), next = q('.sc-next'), cnt = q('.wg-cnt'), pr = q('.sc-prompt');
  const mkS = (k, anim) => ({ el: stage, k, anim, reduced: reducedMotion() });
  const drawEnd = k => { stage.innerHTML = ''; scenes[k].end(mkS(k, null)); };
  const capOf = sc => typeof sc.cap === 'function' ? sc.cap() : tx(sc.cap);
  const paint = fresh => {
    pr.innerHTML = o.prompt ? tx(o.prompt) : ''; pr.style.display = o.prompt ? '' : 'none';
    cap.innerHTML = capOf(scenes[w.k]);
    if (fresh) { cap.classList.remove('fresh'); void cap.offsetWidth; cap.classList.add('fresh'); }
    cnt.textContent = (EN() ? 'Scene ' : 'ฉากที่ ') + (w.k + 1) + ' / ' + scenes.length;
    prev.textContent = '◀ ' + (EN() ? 'Back' : 'ย้อน'); rep.textContent = '↻ ' + (EN() ? 'Replay' : 'เล่นซ้ำ'); next.textContent = (EN() ? 'Next' : 'ถัดไป') + ' ▶';
    prev.disabled = w.k === 0; next.disabled = w.k >= scenes.length - 1 && !w.playing;
  };
  const stop = () => { if (w.anim) w.anim.kill(); w.anim = null; w.playing = false; };
  w.go = (k, play) => {
    stop(); w.k = Math.max(0, Math.min(scenes.length - 1, k));
    const sc = scenes[w.k];
    if (play && sc.play && !reducedMotion()) {
      const anim = makeAnimator(), kk = w.k; w.anim = anim; w.playing = true;
      stage.innerHTML = ''; if (kk > 0) scenes[kk - 1].end(mkS(kk, anim));
      paint(true);
      // ถูกตัดก่อน play ได้เริ่ม (กด ▶ สองครั้งในเฟรมเดียว) = ห้ามวาดภาพต้นแอนิเมชันทับภาพจบที่ finish() วาดไว้แล้ว
      Promise.resolve().then(() => { if (!anim.dead) return sc.play(mkS(kk, anim)); }).catch(e => console.error(e)).then(() => { if (w.anim === anim && !anim.dead) { stop(); drawEnd(kk); paint(false); } });
    } else { drawEnd(w.k); paint(!!play); }
  };
