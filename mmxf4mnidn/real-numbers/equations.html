<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สื่อการสอน : การแก้สมการ ม.4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');

  :root {
    --primary: #1C3B22; --secondary: #FF8A3D; --accent: #68EF3F; --accent-2: #3FA82E; --warning: #FFB347;
    --bg: #F3F7EC; --card: #FFFFFF; --text: #2D3748; --muted: #718096; --border: #E2E8F0;
    --shadow: 0 4px 24px rgba(28,59,34,0.10); --radius: 16px;
    --pos: #047857; --pos-bg: #ECFDF5; --neg: #BE185D; --neg-bg: #FFF4EC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: linear-gradient(135deg, #1C3B22 0%, #2E5936 100%); color: white; padding: 28px 40px 20px; text-align: center; position: relative; overflow: hidden; }
  header::before { content: ''; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; background: rgba(255,255,255,0.07); border-radius: 50%; }
  header h1 { font-size: 2rem; font-weight: 800; letter-spacing: .5px; }
  header p { font-size: 1rem; opacity: .85; margin-top: 4px; }
  .back-link { position: absolute; top: 14px; left: 20px; color: white; text-decoration: none; font-size: .85rem; font-weight: 600; opacity: .9; z-index: 2; }
  .back-link:hover { opacity: 1; text-decoration: underline; }
  .lang-toggle { position: absolute; top: 14px; right: 20px; background: rgba(255,255,255,.15); color: white; border: 1.5px solid rgba(255,255,255,.5); border-radius: 20px; padding: 5px 14px; font-family: 'Sarabun', sans-serif; font-size: .8rem; font-weight: 700; cursor: pointer; z-index: 2; }
  .lang-toggle:hover { background: rgba(255,255,255,.28); }

  nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 20px 24px 0; background: white; border-bottom: 3px solid var(--border); }
  .tab-btn { padding: 10px 18px; border: none; background: transparent; border-radius: 10px 10px 0 0; font-family: 'Sarabun', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .25s; border-bottom: 3px solid transparent; margin-bottom: -3px; }
  .tab-btn:hover { color: var(--primary); background: #E3F3D8; }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: #E3F3D8; }

  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 60px; }
  .tab-panel { display: none; animation: fadeIn .35s ease; }
  .tab-panel.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 32px; margin-bottom: 24px; }
  .card-title { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .card-title .icon { font-size: 1.5rem; }
  .intro { font-size: 1.02rem; line-height: 1.8; margin-bottom: 14px; }
  .box-info { background: #EEF7E6; border-left: 4px solid var(--primary); border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .box-warn { background: #FFF7ED; border-left: 4px solid var(--warning); border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .box-ok   { background: #ECFDF5; border-left: 4px solid var(--accent);  border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .formula { background: linear-gradient(135deg,#1C3B22,#2E5936); color: white; border-radius: 12px; padding: 14px 24px; text-align: center; font-size: 1.3rem; font-weight: 700; margin: 14px 0; letter-spacing: .5px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px; }

  .btn { padding: 10px 24px; background: var(--primary); color: white; border: none; border-radius: 30px; font-family: 'Sarabun', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s, opacity .2s; }
  .btn:hover:not(:disabled) { background: #2E5936; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: white; color: var(--primary); border: 2px solid var(--primary); }
  .btn.ghost:hover:not(:disabled) { background: #E3F3D8; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chip { padding: 8px 16px; border: 2px solid var(--border); border-radius: 30px; background: #fff; font-family: 'Sarabun', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; color: var(--text); display: inline-flex; align-items: center; gap: 4px; }
  .chip:hover { border-color: var(--primary); }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .frac { display: inline-flex; flex-direction: column; align-items: center; font-weight: 700; line-height: 1; vertical-align: middle; margin: 0 4px; }
  .frac .num { font-size: 1em; border-bottom: 2.5px solid currentColor; padding-bottom: 2px; min-width: 18px; text-align: center; white-space: nowrap; }
  .frac .den { font-size: 1em; padding-top: 3px; min-width: 18px; text-align: center; white-space: nowrap; }

  .align { display: grid; grid-template-columns: auto auto auto; justify-content: start; column-gap: .55em; row-gap: 3px; align-items: center; margin: 4px 0; }
  .align .l { justify-self: end; text-align: right; }
  .align .m { justify-self: center; font-weight: 700; }
  .align .r { justify-self: start; }
  .align .full { grid-column: 1 / -1; }

  /* พจน์ที่ "ถูกย้าย" — กระโดดเข้ามาเน้นสี */
  .mv { display: inline-block; background: #FFE8CC; color: #C2570C; border-radius: 6px; padding: 0 6px; font-weight: 800; animation: hop .9s ease; }
  @keyframes hop { 0% { transform: translate(-46px,-16px); opacity: 0; } 55% { transform: translate(0,-10px); opacity: 1; } 100% { transform: none; } }

  .tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 14px 0; }
  .tool { border: 2px solid var(--border); border-radius: 14px; padding: 12px 14px; text-align: center; background: #fff; line-height: 1.7; }
  .tool .big { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
  .tool .swap { display: inline-block; animation: swap 2.2s ease-in-out infinite; }
  @keyframes swap { 0%,100% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }

  .ck-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 12px 0; }
  .ck { border: 2px solid var(--border); border-radius: 12px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; background: #fff; transition: all .4s; }
  .ck .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; color: transparent; font-weight: 800; flex-shrink: 0; transition: all .4s; }
  .ck.done { border-color: var(--accent-2); background: #F6FFF3; }
  .ck.done .box { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }

  svg.nl { display: block; width: 100%; max-width: 700px; height: auto; margin: 0 auto; }
  .readout { background: #EEF7E6; border-left: 4px solid var(--primary); border-radius: 10px; padding: 14px 18px; margin-top: 12px; line-height: 1.9; font-size: 1.05rem; }
  .tag { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 28px; border-radius: 8px; font-weight: 800; padding: 0 8px; }
  .tag.pos { background: var(--pos-bg); color: var(--pos); }
  .tag.neg { background: var(--neg-bg); color: var(--neg); }
  .slider-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
  .slider-row b { min-width: 34px; }
  input[type=range] { accent-color: var(--primary); width: min(320px, 100%); }
  .slider-val { font-weight: 800; color: var(--primary); font-size: 1.1rem; min-width: 44px; }

  .case-tbl { width: 100%; border-collapse: collapse; margin: 12px 0; text-align: center; }
  .case-tbl th, .case-tbl td { border: 2px solid var(--border); padding: 10px 8px; }
  .case-tbl th { background: #EEF7E6; color: var(--primary); }
  .case-tbl tr.live td { background: #FFF9F2; border-color: var(--secondary); font-weight: 800; box-shadow: inset 0 0 0 2px rgba(255,138,61,.25); }

  .wk-cell { position: relative; background: #fff; border: 2px solid var(--border); border-radius: 14px; padding: 12px 16px 12px 52px; margin-bottom: 12px; line-height: 1.8; }
  .wk-cell.fresh { animation: rowIn .5s ease; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .wk-cell .stepno { position: absolute; left: 14px; top: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff; font-size: .85rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .wk-cell small, .note { color: var(--muted); }
  .badge { display: inline-block; background: var(--accent-2); color: #fff; border-radius: 20px; padding: 1px 10px; font-size: .8rem; font-weight: 800; margin-left: 6px; }

  .quiz-q { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }
  .quiz-opts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .quiz-opt { padding: 10px 20px; border: 2px solid var(--border); border-radius: 30px; cursor: pointer; font-family: 'Sarabun', sans-serif; font-size: 1rem; font-weight: 600; transition: all .2s; background: white; display: inline-flex; align-items: center; min-height: 48px; }
  .quiz-opt:hover { border-color: var(--primary); color: var(--primary); }
  .quiz-opt.correct { border-color: var(--accent); background: #ECFDF5; color: #047857; }
  .quiz-opt.wrong { border-color: var(--secondary); background: #FFF4EC; color: #BE185D; }
  .quiz-feedback { font-weight: 700; font-size: 1rem; min-height: 24px; }
  .quiz-feedback.ok { color: #047857; }
  .quiz-feedback.err { color: #BE185D; }
  .btn-next { margin-top: 10px; padding: 10px 28px; background: var(--primary); color: white; border: none; border-radius: 30px; font-family: 'Sarabun', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s; }
  .btn-next:hover { background: #142B1A; }
  .score-badge { display: inline-block; background: linear-gradient(135deg,#68EF3F,#1C3B22); color: white; border-radius: 30px; padding: 6px 20px; font-weight: 700; font-size: 1rem; }

  @media (max-width: 700px) {
    header h1 { font-size: 1.4rem; }
    .card { padding: 20px 14px; }
    .tab-btn { font-size: .85rem; padding: 8px 10px; }
    .wk-cell { padding-left: 46px; }
  }
</style>
</head>
<body>

<header>
  <a href="./index.html" class="back-link" data-th="← กลับหน้าจำนวนจริง" data-en="← Back to Real Numbers">← กลับหน้าจำนวนจริง</a>
  <button id="langToggle" class="lang-toggle" onclick="toggleLang()">EN</button>
  <h1 data-th="🧩 การแก้สมการ" data-en="🧩 Solving Equations">🧩 การแก้สมการ</h1>
  <p data-th="ย้ายข้าง • ภาพในฝัน 3 ข้อ • สูตรกำลังสอง • สมการเศษส่วน • ทริกรากซ้อนราก • ม.4" data-en="Moving terms • the 3 dream-image rules • quadratic formula • rational equations • nested radicals">ย้ายข้าง • ภาพในฝัน 3 ข้อ • สูตรกำลังสอง • สมการเศษส่วน • ทริกรากซ้อนราก • ม.4</p>
</header>

<nav>
  <button class="tab-btn active" onclick="showTab('mv')" data-th="↔️ ย้ายข้าง" data-en="↔️ Moving Terms">↔️ ย้ายข้าง</button>
  <button class="tab-btn" onclick="showTab('dr')" data-th="💭 ภาพในฝัน" data-en="💭 Dream Image">💭 ภาพในฝัน</button>
  <button class="tab-btn" onclick="showTab('qd')" data-th="📈 สูตรกำลังสอง" data-en="📈 Quadratic Formula">📈 สูตรกำลังสอง</button>
  <button class="tab-btn" onclick="showTab('fr')" data-th="➗ สมการเศษส่วน" data-en="➗ Rational Equations">➗ สมการเศษส่วน</button>
  <button class="tab-btn" onclick="showTab('tr')" data-th="✨ ทริก" data-en="✨ Tricks">✨ ทริก</button>
  <button class="tab-btn" onclick="showTab('quiz')" data-th="🎯 แบบฝึกหัด" data-en="🎯 Quiz">🎯 แบบฝึกหัด</button>
</nav>

<main>
  <section id="tab-mv" class="tab-panel active"></section>
  <section id="tab-dr" class="tab-panel"></section>
  <section id="tab-qd" class="tab-panel"></section>
  <section id="tab-fr" class="tab-panel"></section>
  <section id="tab-tr" class="tab-panel"></section>
  <section id="tab-quiz" class="tab-panel">
    <div class="card">
      <div class="card-title"><span class="icon">🎯</span><span data-th="แบบฝึกหัด — ทดสอบความเข้าใจ" data-en="Quiz — Test Your Understanding">แบบฝึกหัด — ทดสอบความเข้าใจ</span></div>
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:20px;">
        <span id="quizProgress" style="color:var(--muted); font-size:1rem;"></span>
        <span class="score-badge"><span data-th="คะแนน:" data-en="Score:">คะแนน:</span> <span id="quizScore">0</span> / <span id="quizTotal">10</span></span>
      </div>
      <div id="quizBox"></div>
      <div style="margin-top:16px; display:flex; gap:12px; flex-wrap:wrap;">
        <button class="btn-next" id="btnNext" onclick="nextQuestion()" style="display:none;" data-th="ข้อต่อไป ▶" data-en="Next ▶">ข้อต่อไป ▶</button>
        <button class="btn-next" id="btnRetry" onclick="initQuiz()" style="display:none; background:var(--accent);" data-th="เล่นใหม่ 🔄" data-en="Play Again 🔄">เล่นใหม่ 🔄</button>
      </div>
    </div>
  </section>
</main>

<script>
// ══════════════ ภาษาไทย/อังกฤษ (ค่าใน data-th/data-en ถือเป็น HTML — ดู docs/adr/0002) ══════════════
const PAGE_TITLE = { th: "สื่อการสอน : การแก้สมการ ม.4", en: "Teaching Aid: Solving Equations" };
let langMemory = 'th';
function getLang() { try { return localStorage.getItem('siteLang') || 'th'; } catch (e) { return langMemory; } }
function applyLang(lang) {
  document.documentElement.lang = lang;
  document.title = PAGE_TITLE[lang];
  document.querySelectorAll('[data-th]').forEach(el => { el.innerHTML = (lang === 'en' && el.dataset.en) ? el.dataset.en : el.dataset.th; });
  const btn = document.getElementById('langToggle');
  if (btn) btn.textContent = lang === 'en' ? 'ไทย' : 'EN';
  if (typeof onLangChange === 'function') onLangChange(lang);
}
function toggleLang() {
  const next = getLang() === 'en' ? 'th' : 'en';
  langMemory = next;
  try { localStorage.setItem('siteLang', next); } catch (e) {}
  applyLang(next);
}
// เนื้อหาแท็บสร้างจาก JS ทั้งหมด จึงวาดใหม่ตอนสลับภาษา (ค่าที่ตั้งไว้เก็บในตัวแปร ขั้นที่เปิดไว้คงเดิม)
function onLangChange() { renderAll(); refreshQuizLang(); }
function renderAll() { renderMove(); renderDream(); renderQuad(); renderFrac(); renderTrick(); }

// เข้าแท็บที่มีตัวแสดงขั้นตอนทีไร เริ่มที่ 0 ขั้นเสมอ (ยังไม่เฉลย)
function showTab(id) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  event.target.classList.add('active');
  if (['mv', 'dr', 'fr', 'tr'].includes(id)) { resetWkAll(); renderAll(); }
}

// ══════════════ ตัวช่วย ══════════════
const EN = () => getLang() === 'en';
const frac = (n, d) => `<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;
const T = (th, en) => ({ th, en });
const tx = v => typeof v === 'string' ? v : v[getLang()];
const al = rows => `<div class="align">${rows.map(r => Array.isArray(r)
  ? `<span class="l">${r[0]}</span><span class="m">${r[1]}</span><span class="r">${r[2]}</span>` : `<span class="full">${r}</span>`).join('')}</div>`;
const P = s => `<div>${s}</div>`;
const mv = s => `<span class="mv">${s}</span>`;
const sgn = v => v.toString().replace('-', '−');
const fmt = v => (Math.round(v * 1000) / 1000).toString().replace('-', '−');
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); return b === 0 ? a : gcd(b, a % b); };
// เศษส่วนอย่างต่ำ (ใส่เครื่องหมายไว้ที่ตัวเศษ) — ส่วนเป็น 1 ให้แสดงเป็นจำนวนเต็ม
function rf(n, d) {
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d) || 1; n /= g; d /= g;
  return d === 1 ? sgn(n) : (n < 0 ? '−' : '') + frac(Math.abs(n), d);
}
const markChips = btn => btn.parentNode.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b === btn));

// เส้นจำนวน SVG: points, labels เศษส่วนบน/ล่าง (neg = มีเครื่องหมายลบนำ)
function numberLine(spec) {
  const W = 560, pad = 20, ay = 50, H = 110;
  const { min, max } = spec;
  const X = v => pad + (v - min) * (W - 2 * pad) / (max - min);
  let s = `<svg class="nl" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<line x1="${pad - 10}" y1="${ay}" x2="${W - pad + 10}" y2="${ay}" stroke="#94A3B8" stroke-width="2"/>`;
  s += `<polygon points="${W - pad + 10},${ay} ${W - pad},${ay - 5} ${W - pad},${ay + 5}" fill="#94A3B8"/><polygon points="${pad - 10},${ay} ${pad},${ay - 5} ${pad},${ay + 5}" fill="#94A3B8"/>`;
  for (let v = Math.ceil(min); v <= Math.floor(max); v++) {
    s += `<line x1="${X(v)}" y1="${ay - 5}" x2="${X(v)}" y2="${ay + 5}" stroke="#CBD5E0"/><text x="${X(v)}" y="${ay + 21}" text-anchor="middle" font-size="12" fill="#4A5568">${sgn(v)}</text>`;
  }
  (spec.labels || []).forEach(l => {
    const x = X(l.v), c = '#1C3B22', y0 = ay + 36;
    s += `<text x="${x - 12}" y="${y0 + 6}" text-anchor="middle" font-size="12" font-weight="700" fill="${c}">${l.neg ? '−' : ''}</text>`;
    s += `<text x="${x}" y="${y0}" text-anchor="middle" font-size="12" font-weight="700" fill="${c}">${l.n}</text>`;
    s += `<line x1="${x - 9}" y1="${y0 + 3}" x2="${x + 9}" y2="${y0 + 3}" stroke="${c}" stroke-width="1.4"/>`;
    s += `<text x="${x}" y="${y0 + 15}" text-anchor="middle" font-size="12" font-weight="700" fill="${c}">${l.d}</text>`;
  });
  (spec.points || []).forEach(p => { s += `<circle cx="${X(p.v)}" cy="${ay}" r="6.5" fill="#3FA82E" stroke="#1C3B22" stroke-width="2.2"/>`; });
  return s + '</svg>';
}

// ═══════════════════════ ตัวแสดงขั้นตอนทีละขั้น (ทุกแท็บใช้ร่วมกัน) ═══════════════════════
// WK[key] = { title, prob, intro?, head?(n), steps:[{h, vis?, tick?}] } — เริ่มที่ 0 ขั้นเสมอ
const WK = {};
const wkShown = {};
function addWk(key, w) { WK[key] = w; wkShown[key] = 0; }
function resetWkAll() { Object.keys(WK).forEach(k => wkShown[k] = 0); }
function wkHtml(key, prev) {
  const w = WK[key], en = EN(), n = w.steps.length;
  let h = `<div class="card" id="wk-${key}">
    <div class="card-title"><span class="icon">✏️</span><span>${tx(w.title)}</span></div>
    ${w.intro ? `<p class="intro">${tx(w.intro)}</p>` : ''}
    <div class="formula">${w.prob}</div>
    ${w.head ? w.head(wkShown[key]) : ''}`;
  w.steps.forEach((s, i) => {
    if (i >= wkShown[key]) return;
    h += `<div class="wk-cell${i >= prev ? ' fresh' : ''}"><span class="stepno">${i + 1}</span>${tx(s.h)}${s.vis ? `<div>${s.vis()}</div>` : ''}</div>`;
  });
  h += `<div class="btn-row">
      <button class="btn" onclick="wkNext('${key}')" ${wkShown[key] >= n ? 'disabled' : ''}>${en ? 'Next step ▶' : 'ขั้นถัดไป ▶'} (${wkShown[key]}/${n})</button>
      <button class="btn ghost" onclick="wkAll('${key}')" ${wkShown[key] >= n ? 'disabled' : ''}>${en ? 'Show all' : 'เผยทั้งหมด'}</button>

const AVALS = [-3, -2, -1, 1, 2, 3];

      <div class="slider-row"><b>b =</b><input type="range" id="qB" min="-8" max="8" step="1" value="${Q.b}" oninput="Q.b=parseFloat(this.value);updateQuad()"><span class="slider-val" id="qBv"></span></div>

function setQ(a, b, c) { Q.ai = AVALS.indexOf(a); Q.b = b; Q.c = c; renderQuad(); }
function quadSvg(a, b, c, D) {

  for (let x = X0; x <= X1; x += 2) s += `<line x1="${sx(x)}" y1="0" x2="${sx(x)}" y2="${H}" stroke="#EDF2F7"/>` + (x !== 0 ? `<text x="${sx(x)}" y="${sy(0) + 16}" text-anchor="middle" font-size="12" fill="#4A5568">${sgn(x)}</text>` : '');
  for (let y = -12; y <= 12; y += 4) s += `<line x1="0" y1="${sy(y)}" x2="${W}" y2="${sy(y)}" stroke="#EDF2F7"/>` + (y !== 0 ? `<text x="${sx(0) + 6}" y="${sy(y) - 3}" font-size="11" fill="#4A5568">${sgn(y)}</text>` : '');
  s += `<line x1="0" y1="${sy(0)}" x2="${W}" y2="${sy(0)}" stroke="#94A3B8" stroke-width="2.2"/><line x1="${sx(0)}" y1="0" x2="${sx(0)}" y2="${H}" stroke="#94A3B8" stroke-width="2.2"/>`;
  let d = ''; for (let i = 0; i <= 320; i++) { const x = X0 + (X1 - X0) * i / 320, y = a * x * x + b * x + c; d += (i ? 'L' : 'M') + sx(x).toFixed(1) + ',' + sy(y).toFixed(1); }
  s += `<path d="${d}" fill="none" stroke="#3FA82E" stroke-width="4" clip-path="url(#qclip)"/>`;

}

  } else {
    const chips = [2, 3].map(n => `<button class="chip ${RS.n === n ? 'active' : ''}" onclick="RS.n=${n};renderTrick()">${en ? (n === 2 ? 'Quadratic (2 roots)' : 'Cubic (3 roots)') : (n === 2 ? 'กำลังสอง (2 คำตอบ)' : 'กำลังสาม (3 คำตอบ)')}</button>`).join('');
    const sl = [0, 1, 2].slice(0, RS.n).map(i => `<div class="slider-row"><b>x${['₁', '₂', '₃'][i]} =</b><input type="range" id="sR${i}" min="-5" max="5" step="1" value="${RS.r[i]}" oninput="RS.r[${i}]=parseFloat(this.value);updateRs()"><span class="slider-val" id="sR${i}v"></span></div>`).join('');
    body = `<div class="card">
        <div class="card-title"><span class="icon">➕✖️</span><span>${en ? 'Sum and product of the roots' : 'ผลบวก และ ผลคูณ ของคำตอบ'}</span></div>
        <div class="intro">
          <div>${en ? '<b>Sum</b> = −(second coefficient) ÷ (leading coefficient)' : '<b>ผลบวก</b> = − (สปส. ตัวรอง) ÷ (สปส. ตัวใหญ่)'}</div>
          <div>${en ? '<b>Product</b> = (−1)ⁿ × (constant) ÷ (leading coefficient)' : '<b>ผลคูณ</b> = (−1)ⁿ × (ตัวเล็กสุด) ÷ (สปส. ตัวใหญ่)'}</div>
        </div>
        <p class="intro">${en ? 'Choose the roots yourself and see the polynomial they build.' : 'เลือกคำตอบเองแล้วดูว่าสมการที่ได้หน้าตาเป็นอย่างไร'}</p>
        <div class="chips">${chips}</div>${sl}
        <div class="slider-row"><b>a =</b><input type="range" id="sK" min="1" max="3" step="1" value="${RS.k}" oninput="RS.k=parseFloat(this.value);updateRs()"><span class="slider-val" id="sKv"></span></div>
        <div id="rsOut"></div>
      </div>`;
  }
  document.getElementById('tab-tr').innerHTML = `
    <div class="card">
      <div class="card-title"><span class="icon">✨</span><span>${en ? 'Handy tricks' : 'ทริกที่ใช้บ่อย'}</span></div>
      ${chipRow('tr', labels)}
    </div>` + body;
  if (SEL.tr === 1) updateRt(); else updateRs();
}
function updateRt() {
  const out = document.getElementById('rtOut'); if (!out) return;
  const en = EN(), { p, q } = RT, s = p + q, n = p * q;
  document.getElementById('rPv').textContent = p; document.getElementById('rQv').textContent = q;
  const plus = Math.sqrt(s + 2 * Math.sqrt(n)), plusAns = Math.sqrt(p) + Math.sqrt(q);
  const minus = Math.sqrt(s - 2 * Math.sqrt(n)), minusAns = Math.abs(Math.sqrt(q) - Math.sqrt(p));
  out.innerHTML = `
    <div class="formula">√(${s} + 2√${n}) &nbsp;=&nbsp; ?</div>
    ${al([[`${p} + ${q}`, '=', s], [`${p} × ${q}`, '=', n]])}
    <div class="readout">
      √(${s} + 2√${n}) = √(${p} + ${q} + 2√(${p} · ${q})) = <b>√${p} + √${q}</b><br>
      <small>${en ? 'check' : 'ตรวจ'}: ${fmt(plus)} = ${fmt(plusAns)} ✓</small><br><br>
      ${en ? 'With a minus sign:' : 'ถ้าเป็นเครื่องหมายลบ:'} √(${s} − 2√${n}) = <b>|√${p} − √${q}|</b> ${en ? '(always the bigger root minus the smaller)' : '(เอาตัวใหญ่ลบตัวเล็ก ให้ได้ค่าบวก)'}<br>
      <small>${en ? 'check' : 'ตรวจ'}: ${fmt(minus)} = ${fmt(minusAns)} ✓</small>
    </div>`;
}
function updateRs() {
  const out = document.getElementById('rsOut'); if (!out) return;
  const en = EN(), n = RS.n, r = RS.r.slice(0, n), k = RS.k;
  r.forEach((v, i) => { document.getElementById('sR' + i + 'v').textContent = sgn(v); });
  document.getElementById('sKv').textContent = k;
  let co, S, Pd;
  if (n === 2) { co = [k, -k * (r[0] + r[1]), k * r[0] * r[1]]; S = r[0] + r[1]; Pd = r[0] * r[1]; }
  else { co = [k, -k * (r[0] + r[1] + r[2]), k * (r[0] * r[1] + r[0] * r[2] + r[1] * r[2]), -k * r[0] * r[1] * r[2]]; S = r[0] + r[1] + r[2]; Pd = r[0] * r[1] * r[2]; }
  const br = r.map(v => v === 0 ? 'x' : v > 0 ? `(x − ${v})` : `(x + ${-v})`).join('');
  const sumCo = -co[1] / co[0], prodCo = (n % 2 === 0 ? 1 : -1) * co[n] / co[0];
  out.innerHTML = `
    <div class="formula">${k === 1 ? '' : k}${br} = 0</div>
    ${al([[k === 1 ? br : k + br, '=', '0'], [polyStr(co), '=', '0']])}
    <div class="readout">
      ${en ? 'Sum of the roots' : 'ผลบวกของคำตอบ'}: ${r.map(sgn).join(' + ')} = <b>${sgn(S)}</b><br>
      ${en ? 'Formula' : 'จากสูตร'}: − ${frac('(' + sgn(co[1]) + ')', sgn(co[0]))} = <b>${rf(-co[1], co[0])}</b> ${Math.abs(sumCo - S) < 1e-9 ? '✅' : '❌'}<br>
      ${en ? 'Product of the roots' : 'ผลคูณของคำตอบ'}: ${r.map(sgn).join(' × ')} = <b>${sgn(Pd)}</b><br>
      ${en ? 'Formula' : 'จากสูตร'}: (−1)<sup>${n}</sup> · ${frac(sgn(co[n]), sgn(co[0]))} = <b>${rf((n % 2 === 0 ? 1 : -1) * co[n], co[0])}</b> ${Math.abs(prodCo - Pd) < 1e-9 ? '✅' : '❌'}
    </div>`;
}

// ═══════════════════════ แบบฝึกหัด ═══════════════════════
const quizData = [
  { q_th: '4x + 8 = 0 ได้ x เท่ากับข้อใด?', q_en: 'What is x in 4x + 8 = 0?', opts: ['−2', '2', '−8', '8'], ans: 0,
    exp_th: 'ย้าย +8 เป็น −8 ได้ 4x = −8 แล้วย้าย ×4 เป็น ÷4 ได้ x = −2', exp_en: 'Move +8 to get 4x = −8, then move ×4 to get x = −2' },
  { q_th: 'เมื่อย้าย "÷3" ไปอีกข้างของเครื่องหมาย = จะกลายเป็นอะไร?', q_en: 'When you move "÷3" across the = sign, what does it become?', opts: ['× 3', '÷ 3', '+ 3', '− 3'], ans: 0,
    exp_th: 'คูณกับหารเป็นคู่ตรงข้ามกัน ย้ายข้างแล้วสลับกัน', exp_en: 'Multiply and divide are opposites, so they swap when moved' },
  { q_th: frac('5x + 1', '2') + ' = 3 ได้ x เท่ากับข้อใด?', q_en: 'What is x in ' + frac('5x + 1', '2') + ' = 3?', opts: ['1', '2', frac('5', '2'), frac('7', '5')], ans: 0,
    exp_th: 'ย้าย ÷2 เป็น ×2 ได้ 5x + 1 = 6 แล้ว 5x = 5 จึง x = 1', exp_en: 'Move ÷2 to get 5x + 1 = 6, then 5x = 5 so x = 1' },
  { q_th: 'ภาพในฝันข้อแรกบอกให้ทำขวามือของสมการให้เป็นอะไรก่อนแยกตัวประกอบ?', q_en: 'The first dream-image rule says to make the right side equal what before factoring?', opts: ['0', '1', 'x', 'ไม่ต้องทำอะไร'], opts_en: ['0', '1', 'x', 'Nothing'], ans: 0,
    exp_th: 'ต้องให้ขวามือเป็น 0 เพื่อใช้หลัก "คูณกันได้ 0 ตัวใดตัวหนึ่งเป็น 0"', exp_en: 'It must be 0 so we can use "a product is 0 only if one factor is 0"' },
  { q_th: '−x² + x + 6 = 0 ควรทำอย่างไรก่อนแยกตัวประกอบ?', q_en: 'What should you do to −x² + x + 6 = 0 before factoring?', opts: ['คูณ −1 ทั้งสมการ ให้หน้า x² เป็นบวก', 'ยกกำลังสองทั้งสองข้าง', 'หารด้วย x', 'ไม่ต้องทำอะไร'], opts_en: ['Multiply everything by −1 so the x² coefficient is positive', 'Square both sides', 'Divide by x', 'Nothing'], ans: 0,
    exp_th: 'ภาพในฝันข้อ ③ หน้า x ต้องเป็นบวก จึงได้ x² − x − 6 = 0 และ (x − 3)(x + 2) = 0', exp_en: 'Rule ③: the x coefficient must be positive, giving x² − x − 6 = 0 and (x − 3)(x + 2) = 0' },
  { q_th: '(x + 1)(x − 2)(2x + 1) = 0 มีคำตอบคือข้อใด?', q_en: 'What are the solutions of (x + 1)(x − 2)(2x + 1) = 0?', opts: ['{−1, 2, −' + frac('1', '2') + '}', '{1, −2, ' + frac('1', '2') + '}', '{−1, 2}', '{−1, 2, 1}'], ans: 0,
    exp_th: 'ให้แต่ละวงเล็บ = 0: x = −1, x = 2, และ 2x + 1 = 0 ได้ x = −' + frac('1', '2'), exp_en: 'Set each bracket to 0: x = −1, x = 2, and 2x + 1 = 0 gives x = −' + frac('1', '2') },
  { q_th: 'x² + x + 1 = 0 มีคำตอบเป็นจำนวนจริงกี่ตัว?', q_en: 'How many real solutions does x² + x + 1 = 0 have?', opts: ['0 ตัว', '1 ตัว', '2 ตัว', 'ไม่สามารถบอกได้'], opts_en: ['0', '1', '2', 'Cannot tell'], ans: 0,
    exp_th: 'b² − 4ac = 1 − 4 = −3 &lt; 0 จึงไม่มีคำตอบในจำนวนจริง', exp_en: 'b² − 4ac = 1 − 4 = −3 &lt; 0, so there is no real solution' },
  { q_th: frac('x² − 4', 'x − 2') + ' = 0 มีคำตอบคือข้อใด?', q_en: 'What is the solution of ' + frac('x² − 4', 'x − 2') + ' = 0?', opts: ['{2}', '{−2}', '{−2, 2}', 'ไม่มีคำตอบ'], opts_en: ['{2}', '{−2}', '{−2, 2}', 'No solution'], ans: 1,
    exp_th: 'เศษ = 0 ได้ x = ±2 แต่ x = 2 ทำให้ส่วนเป็น 0 ต้องตัดทิ้ง เหลือ {−2}', exp_en: 'Numerator = 0 gives x = ±2, but x = 2 zeroes the denominator, leaving {−2}' },
  { q_th: '√(5 + √24) เท่ากับข้อใด?', q_en: 'What does √(5 + √24) equal?', opts: ['√2 + √3', '√5 + √24', '√3 − √2', '5'], ans: 0,
    exp_th: '√24 = 2√6 และ 2 + 3 = 5, 2 × 3 = 6 จึงได้ √2 + √3', exp_en: '√24 = 2√6 and 2 + 3 = 5, 2 × 3 = 6, so the answer is √2 + √3' },
  { q_th: 'ผลบวกของคำตอบของ 2x² − 6x + 1 = 0 เท่ากับเท่าใด?', q_en: 'What is the sum of the roots of 2x² − 6x + 1 = 0?', opts: ['3', '−3', frac('1', '2'), '6'], ans: 0,
    exp_th: 'ผลบวก = −b/a = −(−6)/2 = 3', exp_en: 'Sum = −b/a = −(−6)/2 = 3' },
];
let qIdx = 0, score = 0, answered = false;
function qt(key) {
  const en = EN();
  return { prog: en ? `Question ${qIdx + 1} / ${quizData.length}` : `ข้อที่ ${qIdx + 1} / ${quizData.length}`,
    ok: en ? '✅ Correct! ' : '✅ ถูกต้อง! ', bad: en ? '❌ Not quite — ' : '❌ ไม่ถูกต้อง — ', title: en ? 'Your Score' : 'ผลคะแนนของคุณ' }[key];
}
function grade(s) {
  const r = s / quizData.length;
  if (EN()) return r >= .9 ? '🌟 Excellent!' : r >= .7 ? '👍 Great job!' : r >= .5 ? '💪 Not bad, review a bit' : '📚 Go back and review';
  return r >= .9 ? '🌟 ยอดเยี่ยมมาก!' : r >= .7 ? '👍 ดีมาก!' : r >= .5 ? '💪 พอใช้ได้ ลองทบทวนดูนะ' : '📚 ลองกลับไปทบทวนอีกรอบ';
}
function initQuiz() {
  qIdx = 0; score = 0; answered = false;
  document.getElementById('quizScore').textContent = 0;
  document.getElementById('quizTotal').textContent = quizData.length;
  document.getElementById('btnRetry').style.display = 'none';
  renderQuestion();
}
function renderQuestion() {
  const q = quizData[qIdx], en = EN();
  answered = false;
  document.getElementById('quizProgress').textContent = qt('prog');
  document.getElementById('btnNext').style.display = 'none';
  const opts = (en && q.opts_en) ? q.opts_en : q.opts;
  document.getElementById('quizBox').innerHTML = `
    <div class="quiz-q">${qIdx + 1}. ${en ? q.q_en : q.q_th}</div>
    <div class="quiz-opts">${opts.map((o, i) => `<button class="quiz-opt" onclick="answer(${i})">${o}</button>`).join('')}</div>
    <div class="quiz-feedback" id="qfb"></div>`;
}
function refreshQuizLang() {
  const box = document.getElementById('quizBox');
  if (!box || !box.querySelector('.quiz-q')) return;
  const q = quizData[qIdx], en = EN();
  document.getElementById('quizProgress').textContent = qt('prog');
  box.querySelector('.quiz-q').innerHTML = `${qIdx + 1}. ${en ? q.q_en : q.q_th}`;
  const opts = (en && q.opts_en) ? q.opts_en : q.opts;
  box.querySelectorAll('.quiz-opt').forEach((b, i) => b.innerHTML = opts[i]);
  if (answered) {
    const fb = document.getElementById('qfb');
    if (fb) fb.innerHTML = (fb.classList.contains('ok') ? qt('ok') : qt('bad')) + (en ? q.exp_en : q.exp_th);
  }
  const card = document.getElementById('scoreCard');
  if (card) card.outerHTML = scoreCardHtml();
}
function scoreCardHtml() {
  return `<div id="scoreCard" style="margin-top:20px; background:linear-gradient(135deg,#1C3B22,#2E5936); color:white; border-radius:16px; padding:24px; text-align:center;">
    <div style="font-size:2.5rem;">🎉</div><div style="font-size:1.5rem; font-weight:800; margin:8px 0;">${qt('title')}</div>
    <div style="font-size:3rem; font-weight:800;">${score} / ${quizData.length}</div>
    <div style="font-size:1.1rem; opacity:.9; margin-top:8px;">${grade(score)}</div></div>`;
}
function answer(i) {
  if (answered) return;
  answered = true;
  const q = quizData[qIdx], exp = EN() ? q.exp_en : q.exp_th, fb = document.getElementById('qfb');
  document.querySelectorAll('.quiz-opt').forEach((b, idx) => {
    if (idx === q.ans) b.classList.add('correct'); else if (idx === i) b.classList.add('wrong');
    b.style.pointerEvents = 'none';
  });
  if (i === q.ans) { score++; document.getElementById('quizScore').textContent = score; fb.className = 'quiz-feedback ok'; fb.innerHTML = qt('ok') + exp; }
  else { fb.className = 'quiz-feedback err'; fb.innerHTML = qt('bad') + exp; }
  if (qIdx < quizData.length - 1) document.getElementById('btnNext').style.display = 'inline-block';
  else {
    document.getElementById('btnRetry').style.display = 'inline-block';
    setTimeout(() => { document.getElementById('quizBox').insertAdjacentHTML('beforeend', scoreCardHtml()); }, 300);
  }
}
function nextQuestion() { qIdx++; renderQuestion(); }

window.addEventListener('load', () => { initQuiz(); applyLang(getLang()); });
</script>
